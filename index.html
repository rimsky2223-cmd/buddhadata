<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>佛法知識庫</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #fcfbf9; color: #2c2c2c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; line-height: 1.6; }
    .header { position: sticky; top: 0; z-index: 30; background: rgba(252, 251, 249, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid #e7e3dc; padding: 12px 16px; }
    .header-container { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; color: #1c1c1c; }
    .brand-title { font-size: 1.25rem; font-weight: 700; }
    .search-box { position: relative; flex: 1; max-width: 320px; min-width: 220px; }
    .search-input { width: 100%; padding: 8px 32px 8px 36px; background: #ffffff; border: 1px solid #e0dad1; border-radius: 999px; font-size: 0.875rem; outline: none; }
    .search-input:focus { border-color: #b7794c; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: #999; }
    .clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer; color: #999; display: none; }
    .layout { max-width: 900px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; }
    @media (min-width: 640px) { .layout { flex-direction: row; } }
    .sidebar { width: 100%; }
    @media (min-width: 640px) { .sidebar { width: 190px; flex-shrink: 0; } }
    .sidebar-inner { position: sticky; top: 80px; background: #ffffff; border: 1px solid #e7e3dc; border-radius: 16px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .sidebar-title { font-size: 0.75rem; font-weight: 700; color: #8a8075; margin-bottom: 10px; padding: 0 4px; letter-spacing: 0.05em; }
    .master-btn { width: 100%; text-align: left; padding: 9px 12px; border: none; background: transparent; border-radius: 10px; font-size: 0.875rem; cursor: pointer; color: #4a4a4a; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; transition: all 0.2s ease; }
    .master-btn:hover { background: #f4f0e8; color: #1a1a1a; }
    .master-btn.active { background: #2d4a3e; color: #ffffff; font-weight: 600; box-shadow: 0 2px 6px rgba(45,74,62,0.25); }
    .master-count { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: #e7e3dc; color: #5a554c; font-weight: 500; }
    .master-btn.active .master-count { background: rgba(255, 255, 255, 0.22); color: #ffffff; }
    .main-content { flex: 1; min-width: 0; }
    .master-card { background: #ffffff; border: 1px solid #e7e3dc; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .master-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid #f0ece5; }
    .master-title { font-size: 1.15rem; font-weight: 700; color: #2d4a3e; display: flex; align-items: center; gap: 6px; }
    .article-count-badge { font-size: 0.75rem; background: #f4f0e8; color: #8a8075; padding: 2px 8px; border-radius: 999px; }
    .article-item { position: relative; z-index: 10; padding: 12px; border-radius: 12px; transition: background 0.15s; cursor: pointer; margin-bottom: 4px; display: block; }
    .article-item:hover { background: #fbf9f5; }
    .article-title { font-size: 1rem; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
    .article-item:hover .article-title { color: #b7794c; }
    .article-snippet { font-size: 0.8125rem; color: #555; margin-bottom: 8px; line-height: 1.6; }
    .tag-container { display: flex; flex-wrap: wrap; gap: 6px; position: relative; z-index: 15; }
    .tag-btn { font-size: 0.75rem; background: #f4f0e8; color: #6b635b; border: 1px solid #e0dad1; padding: 2px 10px; border-radius: 999px; cursor: pointer; }
    .tag-btn:hover { background: #b7794c; color: #ffffff; border-color: #b7794c; }
    mark { background-color: #fef08a; color: #854d0e; padding: 0 3px; border-radius: 3px; font-weight: 700; }
    .detail-view { background: #ffffff; border: 1px solid #e7e3dc; border-radius: 16px; padding: 24px; }
    .back-btn { background: none; border: none; color: #b7794c; font-size: 0.875rem; font-weight: 600; cursor: pointer; padding: 4px 0; }
    .detail-title { font-size: 1.5rem; font-weight: 700; color: #1a1a1a; margin-bottom: 12px; }
    .detail-content { font-size: 0.95rem; color: #3a3a3a; white-space: pre-wrap; line-height: 1.9; border-top: 1px solid #f0ece5; padding-top: 16px; margin-top: 16px; }
    .empty-msg { text-align: center; padding: 48px; color: #999; background: #ffffff; border-radius: 16px; border: 1px solid #e7e3dc; }
    .detail-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px dashed #e7e3dc; padding-bottom: 12px; }
    .share-btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .share-btn { font-size: 0.75rem; padding: 5px 12px; border-radius: 999px; border: 1px solid #e0dad1; background: #fdfbf9; color: #555; cursor: pointer; font-weight: 600; }
    .share-btn:hover { background: #2d4a3e; color: #fff; border-color: #2d4a3e; }
    .yt-card { margin: 16px 0; padding: 14px; border-radius: 12px; background: #fdfbf9; border: 1px solid #e0dad1; text-align: center; }
    .yt-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 10px; background: #000; margin-bottom: 8px; }
    .yt-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .image-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 16px 0; }
    .img-wrapper { border-radius: 10px; border: 1px solid #e0dad1; overflow: hidden; height: 120px; background: #fdfbf9; }
    .gallery-img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: transform 0.2s; }
    .gallery-img:hover { transform: scale(1.03); }
    .img-modal { display: none; position: fixed; z-index: 999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; cursor: pointer; }
    .img-modal img { max-width: 90%; max-height: 90%; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="brand" id="brandBtn"><span>📖</span><h1 class="brand-title">佛法知識庫</h1></div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋文章、法師、關鍵字...">
        <button id="clearBtn" class="clear-btn">✕</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebarArea"><div class="sidebar-inner"><div class="sidebar-title">分類</div><div id="masterNav"></div></div></aside>
    <main class="main-content"><div id="listArea"></div><div id="detailArea" class="detail-view" style="display: none;"></div></main>
  </div>
  <div id="imgModal" class="img-modal" onclick="this.style.display='none'"><img id="modalImg" src=""></div>
  <script>
    // 這裡放入你本機所有的文章資料
    const articlesData = JSON.parse(localStorage.getItem('dharma_articles') || '[]');
    const mastersList = JSON.parse(localStorage.getItem('dharma_masters') || '["經典", "聖嚴法師", "淨界法師", "宣化上人", "印光大師", "其他"]');

    let currentQuery = ""; let selectedMaster = "全部";
    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const masterNav = document.getElementById("masterNav");
    const listArea = document.getElementById("listArea");
    const detailArea = document.getElementById("detailArea");
    const brandBtn = document.getElementById("brandBtn");
    const sidebarArea = document.getElementById("sidebarArea");

    function escapeHtml(s) { return String(s || "").replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
    function linkify(text) { return escapeHtml(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer" style="color:#b7794c;font-weight:600;text-decoration:underline;">$1</a>'); }
    function getYoutubeId(url) { if (!url) return null; const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/); return m ? m[1] : null; }
    function highlight(text, q) { if (!q) return escapeHtml(text); const esc = q.replace(/[.*+?^$\{}()|[\]\\]/g, '\\$&'); return escapeHtml(text).replace(new RegExp('(' + esc + ')', 'gi'), '<mark>$1</mark>'); }
    function getSmartSnippet(c, q) { if (!q) return c.length > 90 ? c.slice(0, 90) + '...' : c; const i = c.toLowerCase().indexOf(q.toLowerCase()); if (i === -1) return c.length > 90 ? c.slice(0, 90) + '...' : c; return (i > 20 ? '...' : '') + c.slice(Math.max(0, i - 20), i + 70) + '...'; }

    function renderSidebar() {
      const masters = ["全部", ...mastersList];
      masterNav.innerHTML = masters.map(m => {
        const count = m === "全部" ? articlesData.length : articlesData.filter(a => a.master === m).length;
        const active = selectedMaster === m ? "active" : "";
        return '<button class="master-btn ' + active + '" onclick="selectMaster(\'' + m.replace(/'/g, "\\'") + '\')"><span>' + escapeHtml(m) + '</span><span class="master-count">' + count + '</span></button>';
      }).join("");
    }

    function renderList(shouldScroll) {
      detailArea.style.display = "none"; listArea.style.display = "block"; sidebarArea.style.display = "block";
      const q = currentQuery.toLowerCase().trim();
      let filtered = articlesData.filter(a => {
        const matchMaster = selectedMaster === "全部" || a.master === selectedMaster;
        const matchQuery = !q || a.title.toLowerCase().includes(q) || a.master.toLowerCase().includes(q) || a.content.toLowerCase().includes(q) || (a.tags && a.tags.some(t => t.toLowerCase().includes(q)));
        return matchMaster && matchQuery;
      });
      if (filtered.length === 0) { listArea.innerHTML = '<div class="empty-msg">目前尚無文章，請透過後台發布資料。</div>'; return; }
      const groups = {}; filtered.forEach(a => { if (!groups[a.master]) groups[a.master] = []; groups[a.master].push(a); });
      let html = "";
      Object.entries(groups).forEach(([master, articles]) => {
        html += '<div class="master-card"><div class="master-header"><div class="master-title">👤 ' + highlight(master, currentQuery) + '</div><span class="article-count-badge">' + articles.length + ' 篇</span></div><div>' + articles.map(a => {
          const snippet = getSmartSnippet(a.content, currentQuery);
          const tags = Array.isArray(a.tags) ? a.tags : [];
          return '<div class="article-item" onclick="showDetail(event,\'' + a.id + '\')"><div class="article-title">' + highlight(a.title, currentQuery) + '</div><div class="article-snippet">' + highlight(snippet, currentQuery) + '</div><div class="tag-container">' + tags.map(t => '<button class="tag-btn" onclick="handleTagClick(event,\'' + t.replace(/'/g, "\\'") + '\')">#' + highlight(t, currentQuery) + '</button>').join('') + '</div></div>';
        }).join('') + '</div></div>';
      });
      listArea.innerHTML = html;
      if (shouldScroll) window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showDetail(e, id) {
      if (e) e.stopPropagation();
      const article = articlesData.find(a => String(a.id) === String(id));
      if (!article) return;
      listArea.style.display = "none"; detailArea.style.display = "block";
      if (window.innerWidth < 640) sidebarArea.style.display = "none";
      const shareUrl = window.location.origin + window.location.pathname + '?id=' + id;
      const tags = Array.isArray(article.tags) ? article.tags : [];
      const images = Array.isArray(article.images) ? article.images : [];
      let ytHTML = ""; const ytId = getYoutubeId(article.youtube);
      if (ytId) ytHTML = '<div class="yt-card"><div class="yt-container"><iframe src="https://www.youtube.com/embed/' + ytId + '" allowfullscreen></iframe></div></div>';
      let imgHTML = "";
      if (images.length > 0) imgHTML = '<div class="image-gallery">' + images.map(img => '<div class="img-wrapper"><img src="' + img + '" class="gallery-img" onclick="openImgModal(\'' + img.replace(/'/g, "\\'") + '\')"></div>').join('') + '</div>';
      detailArea.innerHTML = '<div class="detail-top-bar"><button class="back-btn" onclick="renderList(true)">← 返回文章列表</button><div class="share-btn-group"><button class="share-btn" onclick="navigator.clipboard.writeText(\'' + shareUrl + '\').then(()=>alert(\'已複製文章連結！\'))">🔗 複製連結</button></div></div><div style="font-size:0.8rem;font-weight:700;color:#2d4a3e;margin-bottom:4px;">👤 ' + escapeHtml(article.master) + '</div><h2 class="detail-title">' + escapeHtml(article.title) + '</h2><div class="tag-container" style="margin-bottom:12px;">' + tags.map(t => '<button class="tag-btn" onclick="handleTagClick(event,\'' + t.replace(/'/g, "\\'") + '\')">#' + escapeHtml(t) + '</button>').join('') + '</div>' + ytHTML + imgHTML + '<div class="detail-content">' + linkify(article.content) + '</div>';
      window.scrollTo({ top: 0, behavior: "smooth" });
      history.pushState(null, null, '?id=' + id);
    }

    function openImgModal(src) { document.getElementById('modalImg').src = src; document.getElementById('imgModal').style.display = 'flex'; }
    function handleTagClick(e, t) { if (e) e.stopPropagation(); selectedMaster = "全部"; renderSidebar(); setQuery(t); }
    function selectMaster(m) { selectedMaster = m; renderSidebar(); renderList(true); }
    function setQuery(q) { searchInput.value = q; currentQuery = q; clearBtn.style.display = q ? "block" : "none"; renderList(true); }
    searchInput.addEventListener('input', e => { currentQuery = e.target.value; clearBtn.style.display = currentQuery ? "block" : "none"; renderList(); });
    clearBtn.addEventListener('click', () => setQuery(''));
    brandBtn.addEventListener('click', () => { selectedMaster = "全部"; setQuery(""); });

    function init() {
      renderSidebar();
      const id = new URLSearchParams(location.search).get('id');
      if (id && articlesData.some(a => String(a.id) === String(id))) showDetail(null, id); else renderList();
    }
    init();
  </script>
</body>
</html>
