拼個今生，永做閒漢。」\n\n我們到極樂世界以後，有二個選擇：\n1.\t你成就「無生法忍」以後，馬上離開極樂世界。\n2.\t你覺得極樂世界不錯，我就長久待下去了，一直等到你修到「等覺 菩薩」為止。\n\nP195\n\n補充\n\n淨界法師｜借來的東西是要還的\n我們不要把十法界的因緣果報當作本來面目來主宰，這不能主宰的。\n我們一個人會主宰因果，只有一種情況，就是你福報很大。這個觀法無我，\n你要沒有福報的人，不可能主宰，你會認命。\n\n福報大為什麼會主宰呢？\n比方說他有福報，我想要買一套房子，欸，他念頭一動就買一套房子。我要買一台車，他念頭一動就買一台車。然後他在有限的範圍裡面得到自在力以後，他會產生錯覺，就是這個人間我說了算。\n其實你忽略了一點，不是你可以主宰，是因為你有善業力，你的背後有一個老闆，善業一直在幫助你滿足你的心願。諸位，你福報享盡了試試看，你再主宰試試看？你連一杯水都喝不下去。\n\n諸法無我，《楞嚴經》講的非常詳細，大家有空去讀一讀。一切法為什麼不能主宰？它說因緣和合，虛妄有生；因緣別離，虛妄名滅。\n這句話意思簡單講就是說，我們今生所接觸的一切的人事地物，都是借來的！它用借來的這句話。跟誰借呢？跟因緣借。\n你跟地水火風先借來你的色身。\n你有色身以後，再去借你的六親眷屬。\n你借到了身體，你借到了事業，你借到了六親眷屬。\n然後呢？然後就要慢慢還了。\n諸位，楞嚴經強調很清楚，借來的東西是要還的。佛陀講一個譬喻說，虛空中本來沒有光明，怎麼就有光明呢？跟太陽借來的。所以太陽走了以後就把光明帶走了。為什麼？因為你借來的嘛！說一棵樹為什麼樹葉會搖動呢，它跟風借來的。所以風走了以後，這個樹就不能搖動了。\n\n諸位，我們今生你所接觸的身體、六親眷屬、事業，各種各種的一切法都是借來的。跟誰借呢，用你的業力跟因緣借來的。那麼你把這些所有的因緣法都還掉以後，就是真實了。\n阿難尊者問什麼是真實心，什麼是虛妄相？佛陀說，你把借來的東西全部還掉，你還剩下什麼？剩下一念心性，跟一念心性所攝受的善根力、福德力，這是你真實的東西。\n\n你所挾帶的善根力跟福德力，那是你真實的東西。\n這個諸法無我，對淨土宗很重要。\n\n哦，這個借來的要還。我借來我的子女，因緣和合，虛妄有生，我到時候要把他還回去的。\n我借來我的身體，我要還回去的。這是第二種，你主動歸還，心甘情願。就是我慢慢還，我今天放下一點，明天放下一點，叫作分期付款。因為你一次付清你受不了。\n\n\n蕅益大師說他開悟以後，他求一個「執事僧」而不可得，他要做一個執事， 人家都不讓他做，他沒有機會修福報，所以他晚年恨自己福輪太薄，所以「利他 」的事業不廣。他勉勵後人多多積集福報，因為福報你要把握機會。當然在所有 的因緣當中，「供養佛陀」的因緣是最殊勝的，因為我們離不開三界，所以我們沒有供養佛陀的因緣。\n\n我們很習慣的把「我」跟「這一期的身心世界」劃等號， 這是一個嚴重的問題，所以，我們會被現前的身心世界，障礙你廣大的菩提道，就像《楞嚴經》說的：我們歡喜這個水泡，而失掉了整個大海，因小失大。\n\n\n學佛的時候是先有「比量」才有「現量」，先有正確的想像，才有真實的 東西出現，其實你修淨土宗的人，也要有想像力，你要經常把極樂世界作想像，然後產生歸依，你相信它是真實的、你相信你一定可以成就。\n\n\n我們身為一個有情眾生，我們來到人世間，我們的目的只有一個，那就是我們希望生命能夠「離苦得樂」\n有了「生命目標」有什麼好處呢？ \n一、\t能夠確認你整個修學的方向：我們以四十八願為住的時候，我們就不再去 做一些沒有必要的時間的浪費、修學的摸索，\n我們能夠集中心力「一門深入」， 這樣子能夠在短暫的生命當中，成就廣大的功德，因為你生命當中有一個方向。 \n\n二、\t能夠產生一種修學的動力：我們過去心中沒有四十八願，所以我們拜佛、 念佛的時候沒有力量，沒有那種「心靈的意樂」放進去，所以效果大打折扣。但是當我們心中，有了四十八願的目標、有願景的時候，我們在拜佛、念佛的時候 ，我們就能夠產生一個強大的意樂，這個就是有目標的好處。\n\n\n印光大師說，他為什麼臨終的時候這麼苦惱？\n他自己造成的：第一個福報薄，第二個他為什麼沒有人幫他助念，因為他平常沒有幫助別人，這個都是有因果的。\n所以第一個，以印光大師的說法，你看他臨終關懷裡面，他說第一個淨土宗人：\n第一個，福報省省花，這是第一個。第二個，平常有人要起顛倒的時候，你多給他開示，有人臨終的時候要助念，你多幫他助念，以後你自然就會有人幫你助念。\n\n我個人的感覺，對治鬼神障，持咒跟念佛同樣有效，但是持 咒跟念佛的效果是不一樣的：持咒是比較剛性的，「誒，你要不要走，你不走， 我就把你趕走」，用這種態度，持咒是剛性的；念佛它是柔性的，他是用光明、 比較徹底的來解決這種彼此的障礙。\n\n\n佛菩薩只要產生這樣的『咒願』，這個 力量就存在這個佛號裡面。我們咒願不一定有效果，佛菩薩的咒願那是不得了。 所以佛菩薩所證得的我空、法空的真理，這一部分不能跟我們分享；但是他成就 的這個廣大的福德力、加持力，是可以跟我們分享的，但是有一個條件：你的心要跟佛號相應，那個功德才能夠啟動起來！\n\n天台智者大師云：念佛三昧，三昧中王\n\n首先身為一個大乘的佛弟子，你相信佛菩薩的功德是無所不在的，深信諸佛皆充滿；但是你要啟動每一尊佛的功德，有一個條件：「你要跟祂有緣」。你說我們現在這個法界當中，有阿彌陀佛的四十八願、有本師釋迦牟尼佛很多的願、有藥師佛很多的願，在法界當中，但是諸位要記住一個觀念，佛陀不能主動的加被我們，他不能採取主動。這就是為什麼佛菩薩要產生加持效果前面，都要加四個字「聞我名字」─你要先產生主動，佛陀才能夠產生感應 。\n\n\n印光大師在《文鈔》中就訶責禪宗的人說：所有修行人的比例當中，退轉比例最 高的就是禪宗。為什麼？禪宗當中，第一個、他不做早晚課，他的禪堂也沒有安 佛像，就寫一個「捨」字，慈悲喜捨的捨，上面寫一個捨字，大家在那邊打坐。 你到了大殿也沒有拜三拜佛陀、眼睛也沒有看到佛陀、嘴巴唸一句佛號就要去刷 牙。那你跟三寶都沒有結緣嘛，難怪你看五祖戒禪師，一死掉以後變成蘇東坡， 你看迷糊到這樣子，看到三寶都沒感覺了。\n\n第十八願：「十念必生」，它的重點在於「十方眾生，至心信樂，欲生我國， 乃至十念」，它的特點在「至心信樂，欲生我國」。說這個人對於阿彌陀佛的功德 有強烈的歸依心，一心歸命、順從本願，這種人是下根人。下根人，他也沒有發 菩提心、他也沒有修諸功德，但是他對阿彌陀佛本尊的信心，非常的堅定。善導 大師說這個願的重點在「至心信樂」這四個字，它的成敗在這四個字。\n\n\n所有的本尊相應法，你以文殊菩提為本尊也好、以觀世音 菩提也好，你要相信一個問題，你要相信「你跟本尊的心是同體的」。你要是不相 信，你就很難修了，所以這個「生佛平等」是很重要的。這是一個總標。也就是 說無量光、無量壽是「約著利益眾生而安立」這個名號的。\n\n\n心、佛之間的互動：\n 一、你的「心」，你看我們的心剛開始是黑點很多、雜染的心，但是沒關係 「心持法」，你的「心」來受持阿彌陀佛聖號的「法」。\n「法」也能夠持 「心」，它對你產生了加持，然後你的黑點就減少了\n\n三、\t減少了以後再怎麼樣？再「心持法、法持心」，又減少，然後「心持法 、法持心」，到最後「能所雙亡、心佛不二」。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188112","master":"淨界法師","title":"佛說觀無量壽佛經-淨界法師","youtube":"","images":[],"tags":["觀經"],"content":"佛說觀無量壽佛經\n\n補充\n每個人都背負著各式各樣的業力，沒有誰對誰錯！\n天台宗它這個觀心法門，當然有些人觀不起來，那就沒有辦法，那沒辦法。\n這個一念三千的操作，你要能夠知道怎麼操作。\n就是你遇到事情，遇到事情先不要管誰對錯，你管誰對錯，就墮入了因緣所生法，你就被業力牽著走。\n你這樣子去分別對錯，你就被阿賴耶識牢牢的掌控了，你永遠離不開阿賴耶識。\n天台宗的意思就是說，不要管對錯，觀心——觀照我這一念心清淨本然，唯心所現；然後即空即假即中，這個事就過去了，就走過去了。\n所以這個一念心性即空即假即中，是整個《法華經》修學的核心思想。\n那有什麼好處呢？\n讓你變成圓頓種性，就是本來很多不好改變的習性，對你來說你容易去轉變它，就是你這個人變成利根人。\n\n\n歷史沿革\n1.\t早期的念佛並沒有明確地 想要求生淨土。只是當我在修止觀的時候身心出現了種種障礙, 我祈 求阿彌陀佛的加持幫助我破除所有的障礙，然後繼續修止觀。所以早期的人念佛偏重在“佛力的加被”──用佛號來幫助止觀\n2.\t曇鸞大師提出了“五濁惡世”的概念，呼籲念佛人必須如 實地面對所處的環境。\n3.\t念佛法門從為了消業障而念佛提昇到“為往生淨土而念佛”，這時 候對於淨土的瞭解就變得非常重要了。如果念佛只是為消業障，那只 需要對阿彌陀佛有信心就夠了。但念佛的目的是要求生淨土的話，我 們就必須對極樂世界的依正莊嚴有很深刻的瞭解\n\n我們一次৾一次回來娑婆世界投胎？理由很簡單，就是因 為我們對於娑婆世界太熟悉了，每一生不斷地重複造作同樣的事情！ 為什麼我們在三界之中生死的業力會這麼強？因為我們從來就沒有改變過我們的思想，我們心中一直重複地造作過去生習慣的三界的念想， 再由這樣的念想牽動身口去造業，所以才生生世世的輪迴於生死。\n \n\n本經正確的觀法是向心內去觀佛。本經 是以契入“中道實相”為修學目標，依止一念心性起觀為方法，這樣才能開顯中道實相的深廣本體。(向外只有偏空，巷內含有空假中)\n\n“約心觀佛”這四個字是我們所要討論的中心思想，就是說： 在我們觀佛之前要先“把心帶回家”，在心中生起佛的影像、思惟佛 的功德，而不能向外攀緣、向外尋找有外在的佛的相狀。這叫約心觀佛。\n\n大乘佛法的修學一定是先空觀 ──離相、再假觀──建立相狀。所以剛開始先觀“心”。觀想我們 這一念心因緣所生，當體即空，我們心中本來沒有相狀──清淨本然， 周徧法界\n\n因為“自心取自心”──事情發生之後我們 抓住這個影像不放，所以它才會不斷地出現。我們心中本來沒有相狀， 因為“本來沒有”所以才可能成佛；我們的心沒有所謂的“好”、也沒有所謂的“壞”，所以它可以重新塑造。\n\n修行的第一件事 情就是正念真如──先把心歸零\n\n當我們把心歸零之後，再重新出發。必須知道 我們念頭一動──一個思想的活動，就創造“十法界”的“十如是”。 “十如是”簡單地說就是因緣果報，有它的“如是相、如是性、如是 體、如是力……”， 而且在心中的相狀歷歷分明。生命就是因為思想 的活動而顯現的相狀、是我們念念之間把它創造出來的\n\n\n大乘的中道實相──一念心性即空、即假、即中，是說 我們修行成就的所有的功德都不是外來的，都是自己一念心本自具足 的。\n\n極樂世界的功德也是我們一念心本具的，往生只是藉由憶 佛念佛的造作去開顯心性本具的極樂。這樣的思想放在修觀上來說就 是“一心三觀”。所謂的中觀是遠離了空、有二邊，用天台的專有名 詞來說就是“雙遮雙照”。“能念所念性空寂”──心外無佛、佛外 無心，這二空是雙遮方便。怎麼解釋這句話呢？“心外無佛”是破除 有人念佛希望眼睛看見佛來，佛應該是在心中顯現而不是用眼睛去看 見的。\n\n\n佛在哪裡？在“心中”── 佛在我們的心中！如果我們心中不培養一個佛的影像，佛是不會出現 的。同樣的道理，如果我們心中沒有觀想佛的影像而出現“佛”就要 小心了，這就有問題了！淨土宗有很多人喜歡向外攀緣：“拜佛的時 候看到佛像在對我微笑、佛在……”這是非常危險的事情。\n\n\n淨土宗的思想是：只要我們的心準備 好了，阿彌陀佛就會顯現！是我們的心去感應佛！所以，我們要具足跟阿彌陀佛感應的“因”──信心、願力，並且對於極樂世界的環境 非常的熟悉。這就是“是心作佛”！\n\n\n整部《觀經》的修學特點歸納起來就在這四個字 ──“託境修 觀”！\n\n\n第十八願:“設我得佛，十方眾生，至心信樂，欲生我國，乃至 十念。”根據這一願而往生的念佛人，善導大師解釋說偏重在“至心 信樂”──對阿彌陀佛有強烈的信仰：“一者決定深信自身現是罪惡 生死凡夫, 曠劫以來常沒常流轉，無有出離的因緣；二者決定深信彼 阿彌陀佛四十八願攝受眾生，無疑無慮，乘彼願力定得往生。\n\n淨土宗的修學是一種本尊相應的法門，所開演出來的就是“他力 門、果地教”。換句話說, 我們所有的一切修行功德、包括今生的安 樂、來世的解脫完全是來自阿彌陀佛本願的攝受。我們要做的是什麼 呢？我們只需要去做一件事情──想辦法跟阿彌陀佛感應道交！\n以《大乘起信論》上說：修行要了生脫死，就是要斷相續心──斷 除對娑婆世界的相續地取著。比方說：一個人從小就沒有錢，這是因 為他過去生慳貪而招感的今生貧窮的果報。貧窮本身沒有對錯，果報 不論善惡只講苦樂，所以說貧窮只是一種痛苦的果報，但它不是罪惡。 問題是：我們對貧窮產生了顛倒想！我們因貧窮而產生苦受、苦受之 後就生起錯誤的想像──“憑什麼我這麼貧窮、他那麼富貴？\n\n修行人訓練心的第一步就是定課──拜八十八佛時間到了，雖然我的心情是很不想 拜, 我會怎麼做呢？跟著感覺走嗎？我們只要隨順它一次，下次這種 感覺肯定還會再來，所以我們不能老是跟著感覺走！袈裟一披、香一 點，開始“不能拜、要他拜”，只要堅持拜下去，你就會發現感覺開 始變化：“欸！剛剛不想拜的感受消失了”！因為感受它根本就是生 滅的！所以在生命當中，我們必須不斷地抗拒自己的感受，才有可能 正念分明。\n\n十三觀的次第是：第一觀是觀落日，把落日的“光明 相”作為極樂世界的總相；第二至第十一觀是極樂世界的依正二報莊 嚴；第十二“普往生觀” 是作自己往生的“成就想”。觀想蓮花的開 合、自己坐蓮花中往生到極樂世界的七寶池中；第十三觀的“雜明佛 菩薩觀”是同時觀西方三聖。\n\n\n比較重要的是有關蓮花的觀想和“佛 菩薩像觀”。所有佛菩薩的台座都是蓮花台，所以蓮花通於依正二報。 32 “華座觀”觀花葉、寶珠、光明、花台、台上寶幢等，“普往生觀” 先作蓮花合想、再作蓮花開想──華開見佛悟無生。蓮池大師說：極 樂世界最重要的觀想就是蓮花觀！蓮花與我們有非常密切的關係。往 生到極樂世界第一個去的地方是哪裡？就是蓮花中受生。\n\n\n修這十三觀的時候要有四種對比：第一，苦、樂的對比。 要經常告訴自己“極樂世界是無有眾苦、但受諸樂，娑婆世界是多諸 苦惱”。必須把這兩種不同的情景想像、對比出來；第二，貴、賤的 對比。極樂世界一切萬物都是黃金、眾寶所成，特別的高貴。娑婆世 界都是泥沙、磚塊…… 完全是汙穢的泥土所構成的，是卑賤的；第三， 垢、淨的對比。這裡的“垢、淨”主要是指受生。娑婆世界是在污穢 的胞胎中受生，極樂世界是在清淨、微妙香潔的蓮花中受生；第四， 粗、妙的對比。\n\n一心三觀。“因緣所生法，我說即是空；亦名為假名，亦名中道義。”\n\n\n“攀緣心重，生死業力則強！”所以在平常的生活中，如 果我們看到一個人的情緒很容易被外境牽動、快樂和痛苦的感受都很 強烈，說明他的攀緣心太重、生死的業力也就強；如果一個人遇到不好的因緣，雖然有一點痛苦但看得比較開、對世事相對淡⌀，他生死 的業力也就比較弱，往生的力量相對就比較強、容易往生。\n\n很多人以為“念佛就是往生”，這種觀念是不對的！重點在於我 們的思想準備得如何──信願是根本，佛號是枝末！為什麼我們要修觀？就是要調整心態，將極樂世界依正莊嚴在心中變現出來，對於娑 婆世界的顛倒想法就會慢慢改變。\n\n\n很多人修行時心中沒有發願，沒有願力作為強大的引導就很難抗拒阿賴耶識的生死業力！我們要知道：“隨業往生”跟“隨念往生” 最大差別在哪裡？這個“念”到底是指什麼呢？當然是指信仰和願力， 但主要是在願力──往生的願力。如果一個人臨命終時往生的願力沒有現前，那他就作不了主、就會被生死業力牽著走。\n\n如果一個人對娑婆世界的 事情越來越淡薄，證明他的修行是有效的。總之，無論哪一種念佛法 門都是要成就對於娑婆的厭離和極樂的欣求。\n\n極樂世界的每一個 相狀都是彌陀的功德、都代表著彌陀。當我開始憶念極樂世界的光明 時，心中就不能再打其他的妄想了，如此才能與彌陀感應道交。\n\n往生品位的判定的時候，因為修學的法門以਀福業無法 作為往生品位的判定標準，“品位高下，全憑持名之淺深”──往生 品位的判定，根本是在於憶佛念佛以਀修行所成就的智慧的淺深。\n\n淨土宗不是像有些 人說的“只要一句佛號念到底！”如果聖道門的基礎通通不要──沒 有心態的準備、也不需要善業的支持，只是一句佛號念下去，那這句 佛號怎麼生起的？我看這句佛號恐怕也很難念下去。沒有聖道門的基 礎，臨命終的時候心是散亂顛倒、躁動不安的。\n\n淨土宗絕對不可以與聖道門切割，而應該是以聖道門做基礎、然後提起佛號，這叫臨終的正念！更明白地說，淨土宗的修學是以淨土門含攝聖道門，只是我們的目標不在於今生的斷惑証真、而是透過 往生到極樂世界去成就自己的聖道功德。\n\n\n佛法裡面智慧的觀照的最高境界就是“正念真如”，這也是 《楞嚴經》的核心思想：我們的本性──真如清淨本然、周遍法界。 正念真如具體如何操作呢？我們有必要在此解釋一下：所謂的正念真如的修學，《楞嚴經》是以空、假、中三觀的思想來面對人生，透過 這三觀的修學讓我們的生命最終契入中道。\n\n\n我們經常走的道路就會比較熟悉。同樣地，平常 在我們心中經常出現的事情臨命終的時候就比較會容易出現！因為心 中經常憶念的事情會形成一種強大的生命的等流，等到臨命終時我們 依然會習慣性地朝同樣的方向去想！\n\n\n唯識學認為生命是我們“想像力”創造出來的， 我們的想像力創作了今生、也同樣會創造了來生！\n\n《大勢至念佛圓通章》中所說“若眾生心，憶佛、念佛，現前當來， 必定見佛，去佛不遠；不假方便，自得心開”。\n\n\n\n佛法界，它具足“常、樂、我、淨”的功德！ 特別是這個“我”──自在義，往生到極樂世界後的受用是一種隨心 自在的境界。譬如我們去八功德水池中沐浴，池水會隨我們的身體狀 態、心情而調整它的溫度、顏色、光明等等！所以我們研究極樂世界 的莊嚴時要知道它的莊嚴是全面的、隨心自在的。\n\n\n我們按照本經佛陀的開示去觀想，就是與阿彌陀佛的本願 以਀十方諸佛的功德相應！蕅益大師說：跟佛的功德接觸叫做“不思 議熏習”。在修行當中必須經常跟本尊功德接觸的宗派有兩個：第一 個是密宗。修密的人通常要觀唐卡、觀上師的莊嚴相、觀“紇哩”等 種子字；第二個是淨土宗。淨土宗的修學是透過持名、觀想把佛的功 德引到我們的心中──“如染香人，身有香氣，是則名曰香光莊嚴。” 所以淨土宗跟密宗都很重視這種淨法的熏習。\n\n一個帶業往生的凡夫到了極樂世界能 夠受用到實報莊嚴土的功德，阿彌陀佛的淨土是最為殊勝的！因為極 樂淨土是四土互含互攝──“橫具四土”！\n\n我們憶佛念佛時必須是安住清淨心！我們若是攀緣、 自己的心不清淨，而彌陀的心是安住清淨的，兩顆不同的心৾如何能 產生感應呢！\n\n如果我們不發菩提心來憶佛念佛，沒有廣大的上求佛道， 下化眾生的弘願；沒有願做佛心、願度眾生之心，只是因為看到極樂 世界很漂亮、可以享樂──為“樂”故而欲求往生，這樣是不能往生 的！如果為了追求快樂，剛好跟諸天相應，召感的就是諸天的果報─ ─諸天正好是提供享樂的。\n\n這種透過“心力和佛力的結合”得到的佛陀的加持就 是蕅益大師說的“轉他成自”。\n\n“法界圓融體，作 我一念心。故我念佛心，全體是法界。”智者大師是以“一心三觀” 來統攝本經的觀想念佛的。\n\n把十法界的因緣 假相會歸起來，都是我們一念心造作的結果。但是這當中無論是一念 心、還是萬法都找不到有一個真實存在的體性可得──即空，也就是 祖師常說的“萬法的本體都是空寂的、一念心的本體也是空寂的。\n心的本體是空寂的；那 麼法呢？如果不是因為有心的造作，一切的萬法也都無法顯現──每 一個法都是一念心造作才有的，它隨心的相續造作而出現、隨心的斷 相續而消失。\n\n\n這些罪業都無法染汙我一念的心，因為罪業沒有真 實的體性可得、它也不可能真實存在於我的心中。故我的一念心自始 至終都是清淨本然的。所以才有蕅益大師說的：“我雖昏迷倒惑，苟 一念回心，決定得生自心本具極樂，更無疑慮。是名信自。\n\n借娑婆的相未來我們的生命就會在娑婆得果報、\n借極樂的相未來生命就會顯現極樂的果報。\n\n我們的一念心只可能住在兩個地方──不是住在娑婆的相上就是住 極樂的相上，除此之外別無選擇。所以平常我們就要注意了：我們這 念心如果是繼續住在娑婆就不可能憶念極樂，如果是憶念極樂自然就 會遠離娑婆。這就是說我們今生的生命要麼走在繼續流轉娑婆的路上、 要麼走在通往極樂的方向。到臨命終就是因緣成熟顯現相應的“法\n\n“故我念佛心，全體即法界”就是即空即假的中道──即中，我 們只要憶佛念佛，就能在心中顯現佛陀的功德莊嚴。本經憶佛念佛主 要是以觀想極樂世界依正莊嚴的相狀──觀相為主。\n\n佛法跟世間法最大的差別就是佛法有“解脫分”──它有解脫的 功德、能夠讓我們了生脫死! 外道的教義只能夠讓人生天，但不能了 生死，只有佛法才能叫做智慧。\n\n“諸法無自性，一切從緣起”。人生對我 們到底是一種負擔還是一種功德就看我們怎麼去經營。如果明白道理、 能夠假借這個臭皮囊來積功累德，這樣的人生對我們是有益的──我 們因為今生的痛苦而發願求生極樂、從現在就開始積功累德而成就來 世的功德莊嚴，靠的就是這一生。\n\n阿彌陀佛雖萬德莊嚴， 也是眾生心內之佛。既然心性不二，自然感應道交。”非空非不空成 就的是淨土宗的感應道交，這才是大乘真實的空義。非不空是“即空” ──把“自”跟“他”之間的障礙拿掉。非空是“即假”──保留對 彌陀的相狀、功德的歸依。心、佛之間沒有了障礙，以歸依心念念的持名、觀相自然成就與彌陀的感應道交。這樣的空才是淨土宗的空義 ──即空即假，也就是《金剛經》說的“應無所住，而生其心。”\n\n如果在打坐時看 到極樂世界的蓮花令我們產生貪愛、然後感到躁動不安那就不對了這朵蓮花可能有問題，應該不是極樂世界的功德相！所以，當極樂 世界的相狀在我們心中出現時應該有一種清淨的力量，這種力量會讓 我們感到寂靜。因為“清淨”是極樂世界一切功德的根本。\n\n\n普賢菩提坐六牙白象表菩提的六種無漏的神通…… 菩 薩因為各自某些特殊的功德可能會有不同的座騎，但佛陀無一例外皆 是坐蓮花。這是因為佛陀是無上尊貴的、無上莊嚴的，並且一切佛陀 的功德都是圓滿的、無差別的，所以一定都是同樣坐蓮花座。\n\n我們可以用想像的方式來跟阿彌陀佛感應\n道交、也可以用音聲的方式跟阿彌陀佛感應道交。佛陀有廣大的自在\n力能夠進入到我們的心中變現我們所相應的相狀。所謂“阿彌陀佛與\n我同在”這個觀念很重要：我在佛堂念佛時彌陀和我同在、我平常散\n散亂亂的時候祂也與我相伴──彌陀是無所不在的！\n\n修行也好、憶佛念佛也罷，依止的必須是清淨心、我們 的心絕對不能向外攀緣。並且所有的下手方便都必須是依止佛陀的教 導次第去修習、所有的因果都必須與經典相合。如同本經佛陀在每一 觀結束的時候都會反覆強調的“作是觀者，名為正觀；若他觀者，名 為邪觀。”\n\n\n觀想極樂世界的蓮花，以智者大師來說他有二個心態：第一， 專注心。從專注地觀想蓮花當中去啟發內心清淨的功德──三昧能成 己之果佛”。用專注的心態看清淨的蓮花久了，內心自性清淨的功德 自然會被開啟。從自力的角度這叫借相修心；第二是歸依的心。用歸 依、欣求好樂的心來看蓮花能夠感應彌陀的功德加被。\n\n\n如果一個人的種性沒有改變， 是葡萄的種性終究結出的最後還是葡萄的果實。無論怎麼精心施肥、 灌溉，最多就是長出的葡萄比較大一點、漂亮一些而已。修行亦復如 是。如果我們心中的“想”──心態一直沒有轉變，依然自私自利、 貪戀娑婆，就算做了再多的善心加行，生命還是不會有本質的改變─ ─依然還是在三界中打轉。\n\n\n把十方 諸佛的國土分為四土──凡聖同居土、方便有餘土、實報莊嚴土、常 寂光淨土。常寂光土是一個理體，是佛陀和初地以上菩提所證。此土 佛陀所證已經圓滿、法身菩提是分證。所謂的理體就沒有見到佛陀的 色相之說。其他三土的眾生則因各自根機不同而見到的佛的色相不一 ──有“劣應身”和“勝應身”的不同。按照字面的理解就知道相比 勝應身來說，劣應身的精妙、莊嚴程度略為遜色一些，故用了勝、劣 來表示二者的差別。佛陀的勝應身只有居實報土的初地以上菩提方能 見到，同居土的凡夫和方便土的二乘聖人見到的都是佛陀的劣應身─ ─丈六相。\n\n\n“有些人修行向外攀緣、心外求法，結果功課做得越多 個性越剛強──他以功課來自我驕慢。”那樣就不是借相修心了！我們常常說一個修行上路的人就像一部車子──只要上了高速公路、方向正確，他每天都在進步。今天比起昨天進步了、明天৾會比今天更 好，一天一天地會更接近於佛道！\n\n觀想念佛、持名念佛都是 如此！同樣一句佛號為什麼進入不同人的心中會產生不同的功德？因 為他心態準備好了！就像蓮池大師沒有出聲、只是默念就能夠念到頭 上放光、出現佛像，這是因為大師的心理準備足夠──具足歸依的心、 清淨的心！所以我們所要強調的是：在作觀的時候重點不是佛觀得多 麼地清楚分明，關鍵是心態──心態比心相更重要！\n\n海公師父講《楞嚴經》的時候說：楞嚴咒的本尊也是千手觀音。所以 在放蒙山之前先觀想自己是千手觀音，那是一種慈悲攝受──用千手 施出無量的上妙飲食、無量的甘露法味讓眾生離苦得樂。故在觀世音 菩薩身相當中，顯教、密教都非常重視千手千眼。因為圓滿具足菩薩 的折服、攝受二門──既象徵菩薩折服邪魔的威嚴，৾代表菩薩對一 切眾生的大悲攝受。楞嚴咒的功課， 所以我們需要對觀世音菩薩的不同身相多做一些了解。千手千眼的相 狀很重要，一般來說持咒都要觀想千手觀音，像大悲咒、楞嚴咒、楞 嚴咒心……乃至於密宗很多的咒都是如此──只要修持跟觀世音菩薩 有關的法門大都觀想的是千手觀音。\n\n\n我們自己產生慚愧心、發願永不再造作，內因外緣──自己覺悟 的心跟本尊功德的相應，那才是真實地可以消業障！所以，我們希望能夠淨除業障，在稱念觀世音菩薩名號、觀想觀世音菩薩的身相時本 身就要具足懺悔的心，並且要達到一定程度的專注力，才可以成就淨 除業障的功德。\n\n\n應當觀想自己一念心往生到西方極樂世界了，在蓮花中， 結跏趺坐；先觀想蓮花合攏，接著觀想蓮花打開。當蓮花打開後，作有五百色光明來照自己的身體想，心眼打開之想，（心眼打開後）看 見佛菩薩遍滿虛空中，水鳥樹林以਀諸佛菩薩發出的聲音，都是在演 說妙法，與佛陀所說的十二部經吻合。\n\n經常做這兩個觀想：首先，觀想我們這一念心往生到極樂世界 七寶池、八功德水的蓮花中去了；其次，自己在極樂世界的蓮花當中 兩腿雙盤而坐，作蓮花合起來再打開的觀想。修淨土的人，即便白天 再忙，至少每晚入睡前要做一到兩次這樣的觀想。總之，要經常觀想 自己的心投生於極樂世界蓮花當中而不是生處胞胎。這樣做的目的就 是要讓自己的心經常與極樂世界感應、與娑婆世界遠離！\n\n\n佛法的修學基本上都是借假修真！我們沒有佛的功德、只有凡夫 的煩惱跟罪業，接觸佛法之後慢慢的學習、慢慢去改造自己，依靠布 施、持戒……種種的相狀的引導，最後我們也可以現出佛的功德。這 就叫借假修真\n\n\n“發三種心，即便往生”。“發三種心”是說想要求生淨 土的人，必須同時具足後文說的這三種心──至誠心、深心、迴向發 願心。“即便往生”。即是往生的方便\n\n淨土宗的行者，除了念佛是直 接與佛感應道交，其他所修的功德都必須要透過“迴向淨土”才能成 就往生之因。前面的“發菩提心、一向專念”不用迴向，因為“具三 心者，必生彼國”──菩提心和專念阿彌陀佛二者本來就是跟阿彌陀 佛感應道交的正因。但是修諸功德必須要透過迴向發願。\n臨命終時就只有兩種情況──生命不是由“念力”來引導 就是被“業力”所主宰！我們念力強──正念分明，就以心力來轉業 力。心力薄弱那就只好被業力所掌控──隨業流轉、造什麼業就投生 到相應的那一道去。\n\n\n上品上生的人因地菩提心強、修行的資糧也非常殊勝，所以往生 並不需要經歷蓮花的合、開，到了極樂世界就直接見到佛聞法、證得 無生法忍。一般情況下，阿彌陀佛、觀世音菩薩、大勢至菩薩手持蓮 花來接引往生時，蓮花是先合起來、等到了極樂世界再打開。這中間 需要一定的時間，有的時間很短──“蓮花尋開”，有的時間較長─ ─“經宿才開”、還有需要七天甚至幾劫才能花開見佛。總之，蓮花 都有合、開的過程。而上品上生的人沒有所謂的花開見佛，他的蓮花 根本就沒有合攏，他是直接乘著金剛台的蓮花到了極樂世界，見到佛 陀以਀菩薩的色相圓滿莊嚴、當下聞法證得無生法忍──初地，可見 這個人在因地的時候就不是一般的階位。\n\n上品上生的人到了極樂世界的修行有兩個內涵：首先， 見到阿彌陀佛、阿彌陀佛為他說法成就無生法忍；其次，成就無生法 忍之後可能是他自己的志願、也可能是得到阿彌陀佛的鼓勵開始親近 十方諸佛──到藥師佛的國土，普光佛、普明佛的國土……跟十方諸 佛廣學無量法門，成就無量百千陀羅尼門──正式開始成佛之道上的 成熟眾生、莊嚴國土\n\n\n淨土宗的思想是先成就聖道再成就福報。理由在哪裡？ 因為現在是末法時代，環境惡劣、外界的刺激太厲害了，有很多退轉 的危機存在。\n\n\n\n上品中生的菩薩不好樂廣泛修學大 乘經典中的不同法門，只是於經典中取一句偈深窮旨趣──深入研究 這一句偈所代表的全部的義理。“深信因果，不謗大乘”。了達因果皆是實相名為“深信”，什 麼叫了達因果皆是實相呢？就是知道一切的萬法或因或果都沒有離開 一念心的造作，有這樣的信解方能叫做深信因果。\n\n\n\n《無量壽經》中講到的往生在“邊地、疑城”的人，這些人生到極樂世界後要 在蓮花中待滿五百歲，並且這五百歲間不能見到佛、也見不到任何一 位菩薩、更嚴重的是聽聞不到任何的佛法。\n這些人生邊地、 疑城的原因，一方面是疑佛——對佛陀的十力功德有所疑惑，另一方 面是疑自——懷疑自己的能力不能去。疑自表面上是懷疑自己沒有能 力往生，某種程度上來說其實是對彌陀的本願功德力不能生起信心─ ─疑法。\n\n《楞嚴經》說得很清 楚：不要太相信自己的六根、六塵、六識！我們用眼睛去解讀色蘊、 用耳根去解讀聲塵……這些都是有障礙的，不要以為人有多厲害── 一張紙就能把我們的眼睛障礙住了\n\n\n上品下生者：\n亦信因果，不謗大乘，但發無上道心。以此功德，迴向願 求生極樂國。\n\n\n極樂世界同居土的凡夫能夠“位不退”──不退於生死輪迴，那是因為 他受用的是極樂世界的果報，一旦他放棄極樂世界的果報、以凡夫的 身份回入娑婆，受用的就是娑婆凡夫的果報體，他最多只能如彌陀的 本願中所說“永不墮三惡道”，但即便不墮三惡道，這個人還是一個 凡夫，是凡夫在娑婆的三界得果報就不能避免生死輪迴。\n\n大乘佛法所講的菩提心包括兩種心──上求佛道之心、下化眾生之心。\n─追求智慧的部分叫做“勝義菩提心”，把下化眾生的相狀──成就大悲的部分叫做“世俗菩提心”。所以，所謂的菩提心就是看我們平常是不是有在經常憶念佛道和眾生、具體的修學都是約著這兩種菩提心的栽培和成就而展開的。從下手方便來說，無非就是兩個方面─ ─智慧的修學和大悲心的成就，這就是我們常常聽到的“一個大乘菩薩要有菩提心、空正見”\n\n他們已經是“發心位” ──已經不可能再退轉於凡夫的階位了。《妙宗鈔》的判教是說這些 都是圓教的“相似即”──圓教十信，也就是別教的十住、十行、十 迴向的階位，這些人接著修學就會進入“分證即”──分證佛果的階 位，那就是聖道的階位──初地以上了。\n\n佛陀在講述上品三生的菩薩的修學時，全部都是在 講菩薩如何地自利──“一者、慈心不殺，具諸戒行；二者、讀誦大 乘方等經典；三者、修行六念，迴向發願，願生彼國。”這三種的修 學都是在講菩薩如何進行自增上\n\n以淨土宗的臨終正念對我們這 樣的生死凡夫來說，嚴格意義上就是“第二念的正念”。就是說：我 們很難做到連煩惱的念頭都不生起，但是至少我可以很快做到生起後 不要再相續、我的心不被煩惱所轉，這就是所謂的不隨妄轉。\n\n“下品上生”時就會發覺：一個人造了如此重的五逆、 十惡，為什麼在臨終的關鍵時刻他的生命還能產生反轉？因為這個人 大乘善根強、尤其是理觀強──他過去有修過有關正念真如的智慧！ 所以，善知識一開導就能迴光返照、當下懺悔。\n\n往生並不是強調我們念佛時間、數量的多少，當然佛號念到一心不亂、 能夠斷見思品位肯定會更高。但約著凡夫想要成就基本的往生來說， 平常的調伏煩惱和對淨土信願的栽培則更為急迫。這當中非常重要的就是要加強理觀的學習，修學的下手就是要從“正念真如”和“順從 本願”這兩種善根的栽培下手。\n\n\n本經的下品三生都是 造惡之人，大本的下輩是造善之人。《妙宗鈔》說：判品位只能論“功” ──斷惑，就是煩惱的調伏程度。只要是未能“伏惑”──未入別教 初信階位的全部是下品下生，無論是造善還是造惡。經文的中品下生 所說的修世善之人需要證入初信的階位方能登中品之位。鈔中說：判 九品人其意深細，不可粗心。因為一切善若能回向皆是淨土因、一切 惡若能懺悔發願求生同樣也是淨土因，故種種善修之淺深無非九品、 一一惡約懺功力也是九品。故修上上品的善行也可能往生下下品、下 下品的罪懺悔了也可能生上上品。\n\n\n中品上生的人因地是一個修小乘行的出家人\n蓮花的開合的時間除了善根之外，跟持戒的清淨程度也有 關係，持戒越是清淨的人蓮花打開的時間相對就快一點。中品上生的人“修行諸戒，不造五逆，無眾過患”──持戒清淨，故一到極樂世 界後蓮花馬上打開！\n\n\n中品中生的人是一個短時出家之人，曾經受持過出家的沙 彌十戒或者具足戒，後來因為種種的原因未能繼續現出家相、只能在 家修學，但是這個人身雖在家、心在出世，仍然會持守在家的五戒、 八關齋戒，以短時持守出家戒以਀長時持在家戒並多少修善的功德， 迴向願求生極樂國。\n\n中品下生的往 生資糧起碼是具備善人的標準──在家的時候孝養父母，對父母親有 感恩心、孝養心；“行世仁慈”。這個人歡喜做一些慈善事業，比如 幫助一些弱勢群體、或是做義工等等。中品下生的人比較偏重在行世間的善業，但是他們在行世 善時還是不同於人天種性的人。\n\n\n下品上生\n或者有一類眾生他平常造了很多的惡業，但不曾誹謗大乘 方等經典，這樣的愚癡之人，造罪眾多，沒有懺悔之心。臨命終時， 遇到了善知識，為其講說大乘十二部經的“經題”；因聽聞諸經名字 經題的緣故，除卻千劫極重惡業。\n下品上生的行者，因為他的功德不具足，花開之後沒有看到佛陀， 只看到菩薩來為他講說甚深的大乘教義。從果地的“為說甚深十二部 經”來看，這是因地修學大乘之人。\n\n\n\n下品中生的人造惡比上 生的人৾進一步嚴重了，這個人犯了五戒、八戒以਀出家的具足戒。 就是說這個人曾經受過以上戒律，但是他可能受了戒之後就懈怠了， 沒有好好的學習戒法、行持戒律，所以不但犯戒，最後連五戒都毀破 了──犯到根本重戒。臨終得到善知識的開示而開始正確的 憶念佛法以਀善根的真實功德。智者大師對於下品中生的人總結是四個字── 善惡交雜。是說這個人有善根，要不然也不可能遇到三寶、發心去受 戒，所以我們不能否定他有善根。同時這個人৾煩惱粗重，經不起誘 惑做了破戒之事。\n\n下品下生的人除了造五逆、十惡的重罪外，還有 毀謗大乘經典的過失。\n反轉是來自於臨終善知識的開導\n\n\n下品三生全部都是造惡之人、 越往下造罪越重──上生是泛爾造罪，不知慚愧；中品是五逆、十惡 的生死重罪；下品不但是五逆、十惡，還造了重罪之首的謗法。\n\n善導大師才說：九品往生都不是一般的人，他們都是大乘善根具 足、淨土善根也具足\n\n修學淨土的求往生之人，一定不能忽略 理觀的學習，要栽培往生需要的大乘善根、淨土善根，唯有透過學習， 僅僅只有行門的念佛、修福是不夠的。\n\n\n內心就像一個工畫師，可以畫出種種五蘊現象。生命是我 們自己畫出來的，當然也可以把它擦掉重畫。為什麼可以擦掉？因為 本來清淨所以可以擦掉。我們一定要有理觀的智慧，才有辦法“會事 入理”而證得無生法忍。\n\n\n大乘佛法所有的修學都是“透過假相的造作”而成就“真實的善根” ──借假修真。什麼是大乘佛法所謂的“真實的善根”？無非就是兩 個──菩提心、空正見。“菩提心、空正見”具體到淨土法門來說就是有關“願往生之心” 和“調伏煩惱的智慧善根”的修學。\n\n一般人你要他修止觀他也修不來。不對 治吧，臨終很難做到正念分明。怎麼辦呢？佛陀的異方便──觀佛。本經的最大的不同在於透過觀想觀相達到思想的改變。當我們去 憶念極樂依正相狀的時候，我們就在與娑婆漸漸地遠離。\n  \n問：請問法師：在家居士認真念佛、修諸功德迴向西方，可以證 得上品上生嗎？之前聽說上品上生要出家才可以。 \n\n答：當然這有兩種說法：有一種人說出家才可以上品上生，還有 一種人是覺得不一定需要出家。其實從緣起來看“現什麼相”不是重 點！臨命終的時候，依止的是一念的心──一念的心現出來什麼樣的 善根？人天的善根、二乘的善根、還是大乘的善根、淨土的善根。臨終的一念心現前之時，叫做臘月三十算總帳──一輩子的修行，功力 全看這個時候了！臨終的正念是平常累積而成的，這個跟是否有現出家相沒有直接關係。當然出家的環境會比在家要清淨一些、受持的戒 律也不一樣，所以相對在家人來說更容易成就調伏煩惱的智慧善根。\n\n\n內心安住的人有兩種：第一種人理觀強，以真如為住、以一念清 淨心為住。他知道人生本來沒有、最後也沒有，只有歷練的過程，生 命總是會過去的。這是利根的人──以真如為住；第二種是把心安住 在極樂的人──以來生為住。如果你覺得修學理觀很難、以真如為住 標準太高，那也沒關係，就以來生為住──“我今暫作娑婆客，不久 蓮池會上人”。無論如何，我們都不能讓自己的生命只是住在今生， 把今生當真那就一定無法避免痛苦！娑婆世界不可能圓滿、這世間沒 有十全十美，一個人活得太認真就很難遠離痛苦。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188111","master":"淨界法師","title":"佛法修學概要-淨界法師","youtube":"","images":[],"tags":[],"content":"佛法修學概要-淨界法師\n你攀緣人生，對你一點好處都沒有，它不會因為你的攀緣而變得更好。你只要做你該做的事就好，不要打太多的妄想，這都沒有用的。 \n修行是要作改變的，不是順其自然，你沒有資格講順其自然，你現在還沒有資格，你現在是要作出改變，因為你的 問題太多了。你要改造你內心的問題——顛倒妄想 \n佛陀心中有三道光明是我們該學習的 \n第一個，空觀的智慧。沒有自我意識，沒有說我怎麼樣怎麼樣，沒有這種概念，他沒有對立心 \n第二個，假觀的智慧，教化每一個人。從往生淨土的角度，假觀的智慧是不著急的。我們要做的第一件事情，先求往生。 \n第三個，中觀 破妄顯真，怎麼樣消除顛倒，就是以空觀為根本。當你空觀的智慧跟假觀的智慧達到 \n平衡的時候，就是順入中觀了。所以我們的成佛之道，從長遠的布局來說， 應該具足空假中三觀。 \n心地法門成熟以後，就有資格從空出假來修六波羅蜜，一方面懺悔業障，一方面積集資糧。 在歷事鍊心當中，一方面消除我們無始的罪障， 一方面積集廣大的福德資糧，這個叫做「修」。所以，它這個次第，是先有 理觀再有事修，先學習，做好內心的調伏，引導，然後再有所謂的付諸行動 \n學佛，你要進步，真的你反應要慢一點，因為你的直覺都是習氣，你的直覺都是錯的，而且大部分都會讓你後悔。 \n我們一個眾生，對生命最重要的訴求就是穩定。我們為什麼要買一個房子？其實我們可以租房子，拿這個利息去付租金都綽綽有餘。因為租房子讓我們沒有安全感，今天住這兒，明天住那兒。所以我們對快樂的訴求是一定要穩定。 \n但是不幸的是，娑婆世界沒有穩定的快樂。就是你福報越大，你操的心越多，因為你知道快樂是脆弱的，隨時會破壞。 \n佛法是先否定再肯定。諸位要知道，否定門入，肯定門出。 \n《金剛經》、《般若心經》乃至於《楞嚴經》，對相狀都是訶責的，都是否定的。 但是，你看佛陀到了《法華經》跟《華嚴經》就不一樣了。佛陀開始讚歎相狀，他說相狀是不會障礙你的，你要把前面丟掉的相狀再借回來。所以《法華經》就把相狀借回來，叫借相修心。你要借眾生的相來布施， 你要借眾生的相來修持戒，借眾生的相來修忍辱，這個叫真空妙有，借相修法。 \n我們眾生在接受佛法這一塊的內容，也有四個次第 \n第一個，扣法鼓，對我們來說是一個很大的矛盾，因為跟我們的習氣是違背的，所以產生很大的警覺 \n第二個，吹法螺，佛法聽聞以後，我們不斷地去思惟 \n第三個，執法劍，這個思慧的勝解，到禪定的加持叫斷煩惱，這個劍就是斷煩惱 \n第四個，建法幢。建立道心 \n你肯不斷地思惟，你就會有深刻的體驗。這時候佛法的道理，在你的心中就更有力量了！那個調伏力更大， \n安住力更大！剛開始時我們知道了真理，但是我們有煩惱習氣，這叫真妄交攻，我們控制不了煩惱。但是我們要知道這樣不對，慢慢慢慢地只要你肯用功，你心中的光明會慢慢地擴大。 \n楞嚴經說，不要相信自己的六根，我們的眼睛只要一張紙就障住你了，我們看不到隔壁的東西，但是不代表隔壁的東西不存在。所以我們對佛陀的第一個認識，佛陀是有一個根本佛陀的，他是無所不在的。 \n\n我們每一個人都活在自己的妄想，這個妄想是你捏造出來的，這就是人生為什麼會變得無解。如果人生只有單純地還債，只有業力，那很單純。但是你的業力跟妄想結合在一起，因為業力刺激你時，只有當下，後面就全是你的妄想。但是真正的道人是完全不安立名言，離一切相。\n\n什麼叫臨終正念？就是走出心中的妄想，簡單一句話就是這樣。我們可以有妄想，但是你不能隨它而轉。我要求你沒有妄想，這叫強人所難，因為也沒有人做得到。\n\n我們要站在本來沒有煩惱的角度來面對煩惱；要站在本來沒有罪業的角度來懺悔業障；要站在本來沒有生死的角度來了生死。也就是說你要站在一個本來沒有妄想的角度來處理事情，就是把生命回到原點。這個你平常就要訓練了。\n\n你本來就沒有，你最後也沒有，你死亡時你能把兒子帶走嗎？也沒有！所以這個兒子是個過程。本來無一物，你何必惹塵埃！這個本來無一物太重要了！你本來就沒有這個兒子，那只是個因緣業力的顯現。\n\n我們還是會打妄想，但是你不能住在妄想上面，你要住在你的本來清淨的角度。\n\n見山不是山，見水不是水。\n你開始要見相離相，雖然有妄想，你慢慢慢慢告訴自己安住，不隨妄轉，因為\n這個本來就不是你的東西，沒有必要去招惹它。一定要經過一個沒有快樂沒有痛苦的階段，你的修行才正常。如果你學佛以後一直很快樂，不正常喔，因為你沒辦法進步，因為你活在有相。你不斷用妄想、用善業來刺激你的感受，你永遠很快樂。學佛要先求快樂，然後沒有快樂，然後再有快樂，那就對了，第三階段再出現那是法喜。\n\n你本來什麼都沒有，你要經常去想這個道理。\n我們不要太注重人生的相狀，這些都是業力，你碰不得。每一個都是地雷，弄\n得你滿身是傷痕。所以我們要從相裡面去思惟道，其實因緣的假相都是暫時的，它背後有一個真實的本性，就是「清淨本然周徧法界」。\n空觀其實是什麼？是空掉你的妄想，不是空掉外境。這個業力不用去空它，\n你心只要不動，它對你沒有傷害的\n\n\n他的心會慢慢淡薄下來。一定要經過一個過程，就是覺得人生沒有好壞，那顆心很淡薄。快樂時，你也不覺得很快樂；痛苦時你也不覺得很痛苦，那個「受」被調伏了，人生沒有太大的差別。這時你就有點功夫了，可以慢慢開始歷練，從空出假了。\n\n你快樂時還是很快樂，痛苦時還是很痛苦，那你沒有修空觀，你的心中一定有\n一個相狀在引導你。「仁者心中，必有一物」，如果你的情緒變化還很大，那你\n心中一定有一個東西在裡面。這個你不拿掉，臨終時會破壞你正念的，就是它\n了。\n\n\n淨土宗是今生就要離開三界，它重理觀而事修，完全拼感應道交。我必須要保證臨終的念頭跟彌陀的大悲心能夠心心相應，佛陀走在前面，我們走在後面，但起碼是同一條高速公路。淨土宗整個修行就做這件事情而已。\n\n\n我們從空性而來，人生是無中生有，本來沒有，然後因緣和合，啪！出現了。這跟做夢一樣。你看你做夢時，你夢到的夢境本來沒有嘛，是夢心的和合，然後出現了，最後還是沒有。所以你能夠從畢竟空當中建立你的人生觀，直接成佛，速度最快了。\n\n你必須要引導你的情執慢慢地減少，你智慧的觀照慢慢地增加，這個叫做臨終的正念。所以改造思想在淨土宗是很重要。\n\n佛法認為沒有一個東西是有自性的。\n佛法的結果答案都是只有一個，那就是不一定！通通不一定！看你的內心世界，看你的心理素質，這是很重要的觀念。你的內心素質引導你所有的修學，所以你的心理素質提升了，你的生命就全部提升了。\n\n\n你不能過度地要求他一開始的發心又純又正，是吧？我認為他最後沒有學教理是可惜了！我個人的判斷，他都在事修上用功。你想想看，我們是個有煩惱的眾生，誰禁得起福報的誘惑呢？他沒有好好地學習教理，就不知道怎麼調伏自己，引導自己往好的方向走。\n\n\n痛苦怕啥？我可以歷練。但是你不見得有辦法歷練。如果你的痛苦，\n你人生所受的遭遇太過不堪，會有後遺症，就是這個問題——「觀三界如牢獄，視生死如冤家。」\n\n你認為有自我意識，就糟糕了！就是煩惱是真的，業力也是真的，生死也是真的了。你站在煩惱的角度來對治煩惱，站在罪業的角度來懺悔業障，站在本來有生死的角度來了生死，你花的時間就要很多很多，而且效果非常差。\n\n人生只是自我要求，外境只是給我一個歷練的對象。所以以虛空之心，發虛空之願，行虛空之行，最後證虛空之果，「如是發心，名之為「圓」。\n\n我們一般人大概是七八分的向內安住，多少有兩三分的攀緣，那這兩三分對你就會產生影響，完全看你的心理素質，看你的功力了。外境對你的影\n響到什麼程度，答案是不一定，看你的心理素質。我們每一個人都有一個果報，這是前生造的，每一個人都要承受過去的果報，不管你滿不滿意，我們都要繼承前生的業力。但是面對這個果報時，你也可以不受影響。\n\n\n誰能夠掌握一個正確的道路，誰就超越得快，就是這麼回事。佛陀的出世，就告訴你一個佛的知見，如何去思考。你只要養成佛的思考模式，自然會\n出現佛的結果，這叫做一切唯心造。這就是為什麼我們要來學習？就是要了解\n佛陀出世，他老人家遇到事情是怎麼思考的。\n\n佛陀說，我們生命水流的背後，有兩種力量在支持：一個是業力，一個是思想，兩種力量而已，這個就是因緣。我們過去起了某一個思想，可能是一個\n清淨的思想，帶動了一種身口的業力，創造一個善業；我們過去也可能依止一\n個染污的思想，帶動身業、口業去造一個罪業。\n\n我們每一個人都從空性而來。生命是無中生有的，生命沒有開始，這個很重要！如果生命是有本質的，如果輪迴是真實的，那你就沒辦法讓它消失了。水流的思想是說：現在離不開過去，也離不開未來。你不瞭解過去，就沒辦法面對現前的妄想。人生沒有結果\n\n三界沒有安全感的。你說我來生要去哪裡，除非你是乘願再來的大菩提，否則來生你沒辦法規劃的，因為你無量劫造的業。你有那麼多的抽屜，你知道會打開哪一個抽屜嗎？你不知道。\n\n印光大師說我們過去生的人身，大部分是在三惡道，得到人身的機率是少的。這就是我們為什麼煩惱那麼重，因為你大部分都在三惡道，弄得滿身的煩惱才爬出來。\n\n我們走出妄想的時候，還要多兩個引導：第一個要把眾生放進來，第二個把佛\n道放進來。一個人要成佛，要心存佛道，心存眾生。\n\n淨土宗沒有叫你斷煩惱，已經算很不錯了。它只叫你走出妄想，你要是走聖\n道門，那就不是走出妄想而已。不隨妄轉只是第一步，你要把煩惱給斷了，就必須要禪定。所以阿彌陀佛慈悲，他的標準就是臨終的正念。這個正念，套一句印光大師說的就是：心常覺照，不隨妄轉。\n\n如果你只是走出妄想，到最後變成阿羅漢，阿羅漢就是沒有發願，他走出妄想，啥事也不想幹就入偏空涅槃。雖然沒有生死，但是也沒有萬德莊嚴，壞的沒有，好的也沒有。\n佛號只是個橋梁。是心心相應，感應道交，叫順從本願。雖然我做不到佛陀所有的功德，但是我的心是隨順。講一個現在很容易了解的話，我走上了菩提道道路上，走上了成佛之道，雖然走得很慢，三不五時還要去休息站休息一下，但是不能否定，我已走上了一條正確的道路，每天在進步，關鍵是這個目標是成佛。\n\n你要成就大功德，對逆境的包容心要夠。你不要說，老娘不幹了！那你就完了。所以說，我們人生會有很多考驗，你要像大海一樣，大海不擇細流，故成其深，你要能夠包容一切。\n\n佛法是由理觀帶動事修，是你心態準備好了去念佛，這個叫做淨土法門，是\n你的心在引導佛號，不是佛號在引導你。\n所以很多人念佛，平常念得很好，到臨命終生死關頭現前時，他這個佛號衝不上去，因為他因地在念佛時，他的佛號、他念佛的心就帶有條件。外在的環境不是你說了算，你帶了太多的條件，臨終時條件不會具足的。\n\n\n發了菩提心，才有可能創造一顆真實的內心，一個不帶條件的內心。\n第一個條件，「心真則事實」。\n第二個，「願廣則行深。」，我一再地警告所有淨土宗的修學者：你\n念佛時除了往生的願力以外，你最好把眾生的相狀放進去。菩提道剛開始\n了生死時，是自己的事情，到了後半段時，你完全要利用眾生來歷事鍊心。\n\n\n你如果沒有依止佛陀的智慧來引導你的煩惱，老是用咒語跟佛號壓它，壓久以後到來生反彈時，你的煩惱比別人重，它會反彈。楞嚴經上說的，我們內心打了很多的結。外道解開結的方法，就是把這個繩子往兩邊拉扯，結果這個結越打越深。不修行還好，一修行在妄想中又增加了一個妄想，妄中加妄就是外道。\n\n\n你在生滅的心中，其實有一塊不生滅的田地，你把它找出來。我們的內心世界不全部是生滅，也不是如此地不堪，我們的內心世界有一個光明的地帶，只是沒找到而已。你找到那個地方安住，就可以站在不生滅的角度，去調伏生滅的這一塊。\n\n\n三法印，它是從無常無我的道法中，去調伏我們的自我意識，這個就更深入了。因為你有自我意識，就會對人生產生一種對立，有我就有我所。有這個對立，就會對自己的果報產生愛憎取捨，就會創造生死輪迴的力量。所以第二個就是從無常無我的道法中去調伏自我意識。\n當然這兩個都偏一邊。業果偏重在有相；無常無我偏重在無相，偏重在無為\n的這一塊。那麼到了大乘的實相，它是安住現前一念心性，它把前面兩個思想貫穿了。從一念心性的角度來發明因果，發明我空法空的真理。就是天台宗的觀照現前一念心性——即空、即假、即中的道理，這個是最圓滿。\n\n\n業力的激發有兩種：\n第一種，我們叫做隨業往生。這個部分唯識學講得很多。一般來說，你今生\n有某些重大的業力，不管是善業惡業，臨終時容易隨業往生。就是你有一個強大的業力，這個業力要表現時，會先有花報。就如水果要長出來，它會先開花。\n在唯識學上說，如果你臨命終時經常做夢，夢到黑暗，夢到恐怖，經常有東\n西來恐怖你、遇到種種的痛苦，那就表示你的罪業要被激發了，因為業要出現之前是有徵兆的。山雨欲來風滿樓，你看到那個風一直吹，就是暴風雨要來了，它有徵兆的。\n\n第二種情況就是隨念往生，這是我們淨土宗最期待的。就是說，我們今生造\n了善業，也造了罪業，但是業都不重，平常也在懺悔，也不斷地對治，這時就有充分的時間培養你的念頭，用念力來引導業力，就是隨念往生。由你往生的一種信願的念力，來主導你的生命，由念力來主導你平常念佛的業力，把那個念佛業力調動出來，但是關鍵是正念要先現前。\n\n\n淨土宗，要少造罪業，因為你拼的是隨念往生。唯識學上說，\n一個人業力太重，臨命終時，幾乎是馬上投胎的，連中陰身都沒有，連助念、提起正念的時間都來不及，那個業太強了。所以我們一定要爭取時間，讓自己培養正念。不能造太大的業，因為造太大的業力，牽引的力量太強，連提起正念的時間都沒有，就去投胎了，怎麼隨念往生？\n\n淨土宗按照正常情況，我們不可能隨業往生，除非證得念佛三昧，是淨業成就，完全靠淨業去主導，那是祖師的修行\n\n阿賴耶識是我們生命的一個大倉庫，它保存了過去的業力，也變現了今生的\n果報，所以它等於是整個六道輪迴的一個非常重要的根本。阿賴耶識就是我們內\n心深處一個非常重要的潛意識。大智慧的佛陀就說，我們的生命一方面是恆常相續，它不是斷滅的，不是一種停止的狀態，但是也不是一個固定的狀態，它不斷地變化。佛陀最喜歡用水流作比喻。諸位！可能很多人對水流不是很了解。我們看那個水好像是連續的，但是你要是從科學的角度來看，這個水分子就像念珠一樣，是一顆一顆獨立的，後面的水流接著前面，中間是有隙縫的。\n\n天台宗安立一個觀心法門。就是說，想要瞭解自己，就看念頭的流動。\n其實心的流動就像水流。只要向內看，就一定知道你的過去，知道你的現在，也一定可以規劃你的未來。過去、現在、未來都在你一念的心中。這個就是我們後面會講到的現前一念心性的思想，我們預先把它做一個結合。就是說，什麼事情都會歸到心性，人生就是整體的，不是片段的。\n\n\n吃素是基於慈悲心，這是一種長壽的業。但是這個業不能馬上受用，要先保存起來。業必須經過一個保存的階段，到來生才用的。現在的痛苦，\n是過去殺業的餘報，要先受前生的餘報。因果是這樣解釋的。諸位！要永遠相信一件事情：修習善業，不可能讓你痛苦，絕對不可能！因為因果釋放不可能錯亂。\n\n如果你也做義工，也做善事，但是你做的時候心不甘情不願，那麼對你善業的種子並不能產生一種增長的功能。也就是說，對你的來生，沒什麼太大幫助，你做了也是白做，因為你沒有創造一個增長的勢力。\n\n\n你每次念佛的時候，嘴巴念佛，心中打妄想，你就住在妄想，就把妄想養得又肥又重，這個佛號變成不增長業。就是你要取捨，所以智慧的判斷很重要。\n\n\n一個有智慧的修行者，會慢慢地把心收回來。他知道這個水果已經成熟了，不能改變了。他開始創造來生，開始在心地上下功夫，培養自己心靈的力量。當開始發心修行時，他必須在心中建立三種功德力來面對來生。\n1.\t引導力。修行是先有目標的，叫以願導行。\n2.\t隨順我們的本願，安住。安住的道法就是深信業果\n3.\t站在因果的道理來面對人生，就容易做到調伏。身口意的過失。所以佛教是以安住來產生調伏的\n\n要形成增長業，一定要出自你主動的意志力，而且次數要一而再再而三地去做，不管善業惡業，這樣對我們來生有強大的引導。懺悔時，要斷你的相續心，必須把業力的根給斬斷。就是你開始發自內心地懺悔，下定決心不再造作，這時業的體性就被你破壞了，它變成沒有體性了，因為它本來就沒有體性。\n\n\n修淨土宗，你要做兩件事情。你要做的第一件事，就是想辦法不能讓你的業\n太重。我們講過，臨終的感應是需要一段時間的。第二件事把平常的正念提起來，然後跟阿彌陀佛感應道交。而臨命終安穩的快樂之地，是要準備的。\n\n一個是懺悔業障；一個積集資糧。第一個，懺除過去所造的罪業，在死亡之前，趕緊懺悔；第二個，就是在生命當中，盡可能地積集善業。\n懺悔業障、積集資糧，在聖道門跟淨土門的目標不一樣。聖道門的目的是為\n了追求來生安樂的果報，比方說善得人身、六根具足等等。但是淨土宗的目的，在斷惡修善，偏重在臨命終時沒有障礙這部分。\n\n\n你不管造什麼善業，次數要多，最好每天都能做一點功課，念念佛，這樣子也就會把佛號力量加強，加行故重。\n\n唯識學上說，怎麼知道你的內心世界善業比較強，還是罪業比較強？有兩\n個判斷方法：\n第一個，你靜坐觀心。你工作的時候不算，你要靜下來，把所有的事情都停\n下來，連喝水都不可以，先靜下來。如果你發覺靜下來都不做事時，你的心還是躁動不安，那你就要小心！因為這個罪業的功能已經在醞釀，它已經形成一個很強大的勢力了，因為罪業的能量就是一種躁動。\n第二個，唯識學說，從夢境。不是你偶爾做一次夢，你是經常做某一種夢。\n比方說，你經常夢到你在黑暗當中，遇到恐怖的事情，有人要追打你，追殺你；\n或者你從高空掉下來，這個最糟糕了，因為你的身心沉重；如果你夢到你從下面往上跳，就非常好，輕飄；當然最好是見到佛菩薩的光明，見佛、見三寶。因果同時？這個是天台宗的概念。天台宗認為你造業的當下，那個種子就成就了，那就是果報。\n\n如果你的情執很重，你把世間的每一件事情都看得很重要，那你要離開三界就很困難，因為你造的業幾乎都是有漏種子。你要站在本來無一物的角度來面對人生，這是很重要的概念。我們要從娑婆世界走出來，阿彌陀佛的光明才能夠照到你。就像你要走出房間，才能夠得到陽光的普照一樣。所以有漏種子不能種太多，可以有，但是它必須在調伏狀態。\n三法印，第一種，一切法是無常的；第二種，一切法是無我的；第三種，生命的終極目標是涅槃寂靜的，那麼表示你已經趨向解脫的功德了。三界當中，對於這個果報體，我們是追求安穩的，但是事實上三界沒有安穩的東西。\n\n能攀緣的心是什麼？就是自我意識。我們凡夫的心有兩種攀緣：第一，攀緣外境；第二，向內攀緣內心的自我。內心的自我，這個「我」的概念，它是遍布於五蘊：色、受、想、行、識。.\n色，色身。我們可以主導色身嗎？不可能\n受，你能夠主導你的感受嗎？也不可能。\n想，你的思考模式能夠掌控嗎？也不可以。\n佛陀說，因果的思想，不一定要自我，不需要自我。你用你的心去造業，\n得果報時也是用心來得果報。你的心不斷變化，所以你的果報也不斷變化。每\n一個東西都在變化，沒有一個不變化的東西。那麼諸法無我，就使令一個人的\n自我意識調伏以後，攀緣心就停下來了，變成寂靜了。\n\n生滅滅已，寂滅為樂，可以把整個生死業力的開關關掉。你對外境的追求。求得越多，人生就越被動，越不自在。佛陀的心在跟外境接觸時，他選擇不迷、不取、不動，他安住在寂靜。\n\n業力與妄想、執著混在一起時，就很難改變自己的思考模式。佛法給它一個專有名詞，叫做無明\n\n我們的地雷太多了，沒辦法解決，到淨土再解決是可以的。但是我們要做的第一件事情就是不要去碰觸地雷，這就是為什麼我們要先懺悔業障，積集資糧，就是要閃過心中的地雷，不要讓它在臨命終時爆炸。\n\n真如。這是我們一般常說的，就是我空法空的真如。在唯識學把它稱為「法性」；在《華嚴經》把它稱為「一真法界」；在《楞嚴經》把它叫做「如來藏妙真如性」；在《維摩詰經》叫做「第一義諦」。簡單地說，就是一切法真實的本體、真實的相狀。\n\n如果你要很快成佛，就要思惟，當你講真空時，就要想到妙有；當你講妙有時，就要想到真空。凡是大乘的實相，一定是雙向思考的，這個就是平等。\n生命不是由業力創造的，是你的妄念創造的。生命不是由業力創造的，到這裡已經不講業力了，是你的妄念創造的。我們平均一期的生命，會創造兩個到三個很嚴重的妄念，這就是我們的生死輪迴永遠不可能停下來的原因。因為你過去的妄念把今生創造出來，然後你今生也沒有閒著，又打了很多的妄念，所以你一期的生命平均能夠創造二至三個妄念，你一期的生命又創造來生三個果報，所以生死輪迴不可能停止！全真成妄；一念悟，全妄即真。就像水一樣，波濤洶湧時，它變成波浪；靜下來時，它變成平靜的水。同樣是水。\n\n你的心跟外境接觸時，試著心中不要講話，你會發覺你的心馬上沉澱下來，這叫「言語道斷，心行處滅」。生命是這麼回事，我們加了太多的調味料，把菜炒到已經失去原來的味道了。輪迴其實是不存在的，是因為你心中有輪迴，所以才看到了輪迴。當你的妄念結束時，就沒有了，本來就沒有輪迴。\n\n真正的大乘思想是「一切唯心造」，一念心性本來清淨。理觀就是怎麼看待人生，就決定你的種性：是二乘種性，是人天種性，還是大乘種性。如果你的人生觀老是活在業力，那你的檔次就不高了，就是你沒有大乘的種子。到了極樂世界，佛陀要教化你就比較麻煩。\n\n信仰式的修學，我們對自己的內心世界是完全沒有把握的。我們只有希望佛菩薩加持——不要有逆境來刺激我，因為我們沒辦法去調伏我們心裡的波動。觀察宇宙間這個緣起緣滅的現象界的背後，到底有什麼樣的道法，是值得我們去參透的。這就是我們開始要深層地、全面性地修學佛法了，而不是表面式的修學。學佛就是突破你自己的妄想，從妄想裡面走出來，面對彌陀的光明。\n\n\n你本來沒有業障，這業障是後來因緣形成的。所以你用如夢如幻的懺悔，來對治如夢如幻的業障，這個最好。如果你有這個概念最好，站在「清淨本然，周徧法界」的一念心性來懺悔，就是站在本來沒有業障的角度來懺悔。你有這種安住空性的概念，「滅業障如翻大地」。從大地上翻轉，不是從根拔起而已，就像那個推土機整個大地挖起來，這棵樹一點都沒有作用了。罪從心起將心懺，心若滅時罪亦亡。心亡罪滅兩俱空，是則名為真懺悔。眾生心垢淨，菩薩影現中。我們不可能跟阿彌陀佛一樣，但起碼你要讓你的方向跟阿彌陀佛是順從\n的，至少是同在一個道上，這是最基本要求。\n\n\n小乘的空是怎麼安立的呢？它是從「諸行無常，諸法無我，涅槃寂靜」，它是從生命的無常來安立空的。佛陀對三界快樂的果報是持否定的態度\n所以小乘的空觀，是從人生的過程來安立無常無我；大乘的空觀是建立\n在人生本來清淨，這個很重要。所有的空觀，大乘空觀最殊勝，因為它追溯\n到你的生命的原點。小乘空觀它不管你本來怎麼樣，它只告訴你現在怎麼樣，反正人天的果報你碰不得。所以小乘的空觀是用來調伏用的，調伏愛取；\n大乘的空觀是告訴你，「何期自性，本來清淨」，它把你生命的原點，這本來\n面目的面貌解開了，原來我們本來清淨，本來具足。所以大乘的空性，就是只有一個概念——把心帶回家。其實我們一念心本來清淨，本來具足功德莊嚴，是我們操作錯誤，是我們離家出走，把自己搞成這副德性。\n\n你只要做兩件事：第一個，安住清淨心；第二個，修一切法。就是離一切相，修一切法。在心中你做兩件事就夠了，其他的外境都不要管，你自然有好因緣。你的往生不是因為你求來的。我們現在觀念就被這個生死輪迴的錯誤搞亂了，你往生是因為你心中具足資糧力，你有法，你有信願行三個法現前，所以你感應彌陀，不是你求來的。你念佛念到阿彌陀佛來的時候，你看到，你也不要求，你該怎麼做就怎麼做。\n\n你要向內去修——離一切相，修一切法。修布施的法、持戒的法、憶佛念佛的法，你心中的法具足了，外面的功德自然顯現。我們現在的心性搞得很複雜，就是很多言說相。安住現前一念心性，有兩個次第：第一個叫從假入空，從因緣的假相裡面，回歸到你的清淨心，這個時候要離言說相，沒有錯，否則你進不去空性。你只要講話，你就進不去空性。但是你從空出假，大悲心善巧方便的時候，你知道怎麼跟眾生互動的時候，你又要安立言說相了。但是那個言說\n相的本質是與菩提心、空正見、大悲心相應的，那是利他了。\n\n體是清淨的，這個是通十法界的，不管你過去生打了多少妄想，不管你過去生造了多少業，這個體是通十法界，清淨本然，不可以改變的。作用就不同。如果它是依空體而起的，叫稱性起修，它顯出的作用是萬德莊嚴；如果它迷失了空體，用貪愛的執著生起的作用，那是六道輪迴。我們一念心本來清淨，本來具足。就像一個倉庫，它本來就有十個房間，有的房間裡裝的是佛菩薩的功德莊嚴，有的房間是裝二乘的涅槃，有的房間是裝六道輪迴。如果你造五戒十善的業去熏你的心，你就打開了人道的那個窗戶，就把人的果報現出來，讓你受用，讓你自己循業發現。如果我們憶佛念佛，我們就打開了淨土的功德讓我們來受用，就是是心作佛，是心是佛。\n\n世間的學問，天台宗叫做無差成差，本來沒有差別去創造差別，所以生命弄得很複雜。佛法是差即無差，它是把你從複雜中抓回來，把心帶回家。如果你的心越來越單純，你的修行就對了。佛法從淡中求，世間從濃中求，世間是不斷\n地刺激你的感受，刺激你的妄想。修行是先找到生命的立足點，安住在清淨的本體，才能夠依體起用。所以安住空性，不隨妄轉很重要\n\n慈悲心長得怎麼樣？瞋恨心長得怎麼樣？慈悲心在哪裡？瞋恨心在哪裡？找不到！但是你感受到那種磁場。「不離當處常湛然」，這就是即空、即假、即中，它沒有相貌，但是它有法，它會釋放一種磁場出來，它有因緣的作用，這是即空、即假、即中。\n大乘的實相的操作，它只需做一件事情——就是把心帶回家，把生命歸零。\n但是你做了這件事情，你所有的修行變成日劫相倍，這是《楞嚴經》的話，你\n修一天超過別人修一劫。你不要站在妄想的角度來對治妄想，你要站在清淨心\n的角度來對治妄想。\n\n理觀是一種內心智慧的觀照，我們一般叫做內善根；事修是一種外在的法門的修學，是一種外在的助緣。菩薩要把心放在未來，而不是放在現在。你只要是成就廣大的功德，特別是出世的解脫，你一定要放棄今生所有的快樂，你別無\n選擇！\n\n修行中，我們要建立三種心態：第一種，對過去的觀察。找到我們生命的原點，讓我們的心安住下來；第二種，對於今生眼前的觀察。知道人生是無常的，總有一天會失去所有的東西，人生只有過程沒有結果，這樣我們會慢慢淡化對今生快樂果報的追求，而把重點放在積集資糧，而不是享受人生，這是出離心。第三種，是對未來的觀察，你將往哪裡而去。\n\n我們所歸依的境是佛法僧三寶。我們是用什麼心態呢？是求救護，我們希望三寶來救護我們，這個觀念很重要。如果我們一天過一天，不學習佛法，也就不知道我們到底有什麼障礙、什麼問題。\n第一個，是人的攝受。佛陀的神通感應，我們不斷地禮敬諸佛、稱讚如來。\n第二個，是智慧的救拔。對法要歸依，對經典要學習。\n第一種，人的攝受；第二種，法的攝受。兩種缺一不可。\n\n我們剛開始要從形像的三寶，慢慢地悟入到理體三寶，我們不可能直接進入理體三寶。我們所有的善根都要從事相來修學。\n\n理體三寶就是說，我們相信阿彌陀佛存在我們心中，但是我們假\n借佛號來開顯，這個很重要，假借！我們在沒有修理觀之前，這句佛號是\n用一種攀緣執取的心來念。你知道阿彌陀佛存在你心中時，你同樣念佛，\n但是你是「託彼名號，顯我自性」，你是借這句佛號。雖然念，但是你不\n會執著，你不要管阿彌陀佛來了沒有，你心中憶佛念佛，有這個因地，它\n自然會創造這個結果。(本無輪迴，管他誰沒來。借假修真)\n\n我們的內心，除了喜怒哀樂的感受所創作的心以外，我們還有一塊很清涼的寶地，我們都沒有去過的。在那個寶地當中，是沒有風浪、沒有暴風雨的。它是無眼耳鼻舌身意，無色聲香味觸法，是離一切相的。你開始要內觀，開始去尋找內心深處的安住，不再向外攀緣感官的刺激，這就是為什麼你能夠不墮惡\n道。我們透過佛法的修學，開始內觀，開始把心帶回家，慢慢就遠離惡道了。向外就是輪迴，向內就是涅槃。因為業力是虛妄的，那就是一念攀緣的心，去攀緣一個虛妄的境，妄心攀緣妄境，所以它只是清淨心的表層的一個影像，它本來就沒有，達妄本空。\n\n六道輪迴裡面，唯一的希望是得到人身，其他都是在酬償業力，都在還債而已。你只有做人，生命才能產生大方向的改變。天人是傻傻的，第一個，他的明了性弱；第二個，他沒有記憶力。你看釋迦牟尼佛說法時，天人來聽，聽完了以後到上面全部忘光了。\n\n比方說你開車或者走路，壓死了螞蟻，但是你的目的只是想要到某一個地方去辦事，你沒有一種想要殺害足下眾生的心情，所以這樣子不能構成罪業，但是還是有因果。\n\n沒有經過佛法訓練的人，是從外境解決起，我們把生命用來經營我們的外境。我們從小很努力地讀書，為了追求一份好的工作，長大以後我們\n努力地工作，我們追求一種今生的快樂。\n但是一到人生的五十歲後，你再回首，會發覺這個人生，傷痕累累，人生不堪回首。我相信你上了年紀，就會發覺人生充滿了無奈。我們到了晚年，這個生命中是你小時候規劃的很少很少，人生有太多的突然狀況。因為外境本來就是「萬般皆是業，半點不由人」，它是過去所造的一個業已經成熟了，它已經從種子位變成一種現行位，已經變成一個水果，不是以前的種子了。它經過長時間\n的醞釀，輾轉地增盛，已經從種子位變成一個可以食用的成熟的水果了，你\n怎麼去改變它呢？你要認命，才可以放棄你的外境，從內心中好好地去耕耘，那是一個廣大的田地。當你開始放棄外境，開始在經營你內心時，你的修行上路了，至少你方向正確了。所以我們在學習佛法時，先從道理的安住，然後從道理中再設定目標，所謂的安住力，引導力。理觀是屬於安住跟引導，事修偏重在調伏跟轉化。理觀帶動事修，事修又加強理觀，在心中產生一種善的循環，慢慢地我們的生命就能夠從痛苦的三惡道，提昇到人天的安樂。\n\n所以臨終往生的人，他帶業往生，不能破壞善根。他造了殺盜婬妄的罪業，一定要懺悔。你不能放縱這個業力。已經侵蝕到你的根，到骨頭去了，那就糟糕了。\n\n佛陀告訴我們，一開始學佛要先聽經聞法。在內心當中，聽聞佛法要成就兩種善根：一個是智慧的善根，第一道善根就是觀照業果。我們心中要經常存有業果的思想。第二個，我們一定要有一個願景。人生沒有目標，你就很難有修行的動力，因為我們的修行來自於一種思想的改造。\n\n我們為什麼要懺悔？罪業最怕你數數現行、深生好樂。我們講過很多次了，最怕你無慚無愧。懺悔有兩個意思：第一個，恢復你的善根；第二個，消除外在\n的業力。唯識學說明這個道理：因為心力創造業力，業力它也含藏在心力裡面。業跑哪裡去了？諸位！你在造業的時侯，是心去攀緣外境造業，造完以後，身體的動作是無常的，諸行無常，造完以後業跑哪裡去了？當然跑到你的內心去了。跑到內心去的時侯，你有兩種情況：第一個，你同意它；第二個，你不同意它。同意就是隨喜，不同意就是訶責。\n\n當你出現這些徵兆，你必須趕快懺悔了！\n1.心神昏塞，轉頭即忘。你經常覺得心老是昏昏鈍鈍\n的，就表示你明了性的外面有一層罪業在遮住你了，因為這不正常。\n2. 「無事而常起煩惱」。這更嚴重了。不但是昏鈍，你經常莫名其妙躁動不安，這個業力就比之前那個更嚴重了。它不但是遮蔽你，已經有一種活動力開始活動了，因為罪業是躁動性的，善業是寂靜性的。\n3. 第三個，你見到有德行的君子，應該要隨喜讚歎，結果你反而心虛，這個就是你罪業的第三種狀態。\n4. 第四個，「或聞正法而不歡喜」。聽到正法，你應該要歡喜讚歎，結果你反而排斥，表示你已經是無慚無愧了，你的善根已經失掉了。\n5. 「或施惠而人反怨」。你幫助別人應該得到讚美，結果人家反而傷害你。你在弘法或者在做義工，本來是在造善事，結果反而產生很多的問題，表示你過去一定有罪業。\n6. 第六個，是最嚴重的，「夜夢顛倒，妄言失志」。這個人已經顛三倒四了，根本談不上善根了，已經沒辦法判定什麼是對，什麼是錯，什麼是功德相，什麼是過失相了，內心的觀照善根完全喪失了。\n\n\n唯識學上說，一個修行的內心有三種功德。修行人，有修戒定慧。第一個，明了性很強。你的心平常是明了的；第二個，它是寂靜的。明了，就是不暗鈍，是寂靜，它絕對不能躁動。你平常沒有事在那個地方，你的心是寂靜的，安穩的；第三個是法喜，帶有一種淡淡的歡喜。但那個法喜不是外境的刺激，是你內心有一個法，念佛持咒，自然會產生一種法的力量的歡喜，由內心生出來，它不是靠外境的刺激。\n\n懺法的儀軌\n一、請聖明證。二、說己罪名。三、立定誓願。四、讀誦禮拜。五、\n如教明證。\n\n1.\t要請懺悔主。請一個聖人當懺悔主。(找神明也可以)\n2.\t在懺悔主面前，發露自己的罪業。\n有兩種情況：第一個你自己知道你造了什麼罪業，在修懺之前，至\n少第一次，就要告白：我要做三個月的加行，我每天拜一部八十八佛。為\n什麼呢？因為我在某一個時間、某一個空間做了什麼事，我向懺悔主普賢\n菩薩發露，我從今以後寧捨身命絕不再做，要發露罪業。這是你已經知道\n的罪相。我不知道我今生有沒有做，但是我過去做了，就是「往昔所造諸惡\n業，皆由無始貪瞋癡；從身語意之所生，一切我今皆懺悔。」就總相懺悔\n也可以，總相的發露。\n\n3. 第三個，懺悔。不但要發露，還要立定誓願：從今以後，寧捨身命絕\n不再犯。懺悔是針對過去做的，發願是針對未來的時間，我不再造作了。\n4.第四個，要有方便，要讀誦、禮拜。這在懺法裡都有規定，照著做就好。\n5. 第五個，如教明證。就是要見好相。\n\n\n你有前面的六種情況，身心暗鈍，躁動不安或者是顛顛倒倒的，經常自己會莫名其妙起煩惱，合理地推論，你有罪業，我們的\n建議是這樣子：\n古人是以一百天為一個加行，而且只能夠選擇一個固定的法門，你修一百天，每天拜一部八十八佛，或者拜一部大悲懺，你衡量你的時間，那麼你衝一百天，見到好相，那就 OK 了。我們的標準當然是取法乎上，最好是以見好相為標準。但是見不到好相，你拜三個加行，起碼讓罪業的勢力變成不增長業，也可以，不障礙你臨終，這也可以。\n\n怎麼知道我的罪業已經如法地懺悔乾淨了？\n怎麼知道我已經如法地懺悔乾淨了？這有判斷方法。\n\n或覺心神恬曠；或覺智慧頓開；或處冗沓而觸念皆通；或遇怨仇而回\n瞋作喜；或夢吐黑物；或夢往聖先賢，提攜接引；或夢飛步太虛；或夢幢\n幡寶蓋，種種勝事，皆過消罪滅之象也。\n\n1. 第一個，「或覺心神恬曠」。心神恬曠表示說，這個罪業不再障礙\n你了，你覺得很愉快、很開闊，這個是第一個判斷。\n2.你覺得「智慧頓開」。表示你的心識比較靈巧了，不像之前那麼暗鈍。\n3. 遇到很繁瑣的事情，你也不起煩惱，你的心非常寂靜、安穩，不會因為外在的因緣經常干擾你，而動不動發脾氣了，你心的寂靜力增長。\n4. 第四個，「或遇怨仇而回瞋作喜」。這個人本來對你不歡喜，你懺悔以後這個業消了，他對你沒有對立心了。\n5.第五個，「夢吐黑物」。在夢中，夢到你吐出髒東西，夢到你洗澡，夢\n到你排出大小便等等，這都是業障消除，罪業從你的內心裡已經脫落了，\n見好相就是業已經消了。\n六七八就不容易了，是善根的問題。\n6.第六個，「或夢往聖先賢，提攜接引」。你夢到祖師大德來跟你開示，\n這是感應道交的問題。\n7. 第七個，「或夢飛步太虛」。你覺得你的身心世界，很輕飄，不粗重。\n在《楞嚴經》上說，你的心經常很輕鬆愉快，夢中看到你在飛，這個人一\n定有菩提心，有願力。\n8. 第八個是最好的，「夢到幢幡寶蓋」。這是佛的智慧光明，幢幡寶蓋表\n示佛的智慧，表示你的心——心與佛合，心與道合。\n\n你想臨終時沒有障礙，我們的建議是：你最好一生當中至少要修一次懺，一百天的懺，先把心中比較重大的垃圾除掉。差不多八十八佛一天四十五分鐘，大悲懺我是沒拜過，我們的傳承都拜八十八佛，放蒙山的。你修過一次懺以後，諸位，你再來念佛，你的心跟佛號，你會覺得中間那個隔層的障礙消失了，你佛號念得很清楚，除非你後面再造作。如果你剛懺完，心中提佛號時，會發覺你的心跟佛號幾乎沒有距離，會覺得你跟阿彌陀佛距離非常接近。\n\n理觀跟事修的關係，古人有一句話講得很貼切，說是理觀宜廣，事修宜專，這是一個操作原則。理觀一定要圓滿，你不能有任何瑕疵，因為那是來自於你心靈的力量，你心靈的力量不啟動，佛陀很難跟你感應的。\n\n\n我實在不想吃你，但是我又控制不了我的食欲，我先向你懺悔。」然後吃完以後，念往生咒迴向給牠。這個是一個很重要的事前的懺悔、事後的彌補，至少保護你的善根，而且你最好發願，我什麼時候一定要斷肉，你發個願，就把那種反轉的力量先種下去。\n\n罪性是空，但是罪相它是有緣起的。我們一件事情有體跟相，對不對？它有緣起，所以性空有緣起。就是說，當我們把業力本身回到原點的時候，我們本來是沒有罪業，這個很重要，那是因為一念的妄動。理觀不能障礙事修。不是說你觀察業性本空，就不懺悔了。你照樣懺悔，該起慚愧心照樣起慚愧心，因為你有如夢如幻的罪業，你有如夢如幻的生死輪迴，有如夢如幻的三惡道在等你，它有它的假名、假相、假用，三惡道的確是有痛苦的作用，這不能否定。所以性空不障礙緣起，緣起也不要障礙性空，這樣子最好。\n\n\n這個禪定人，在止觀的書上說，他散亂的心慢慢地收回來。比方說，他注意呼吸或注意佛號——心於佛號專一安住，心於佛號相續安住。我們一般是心光外洩，心的能量是散亂的，今天攀緣這兒，明天攀緣那兒。他把那個心的能量，慢慢集中起來以後，變成一個強烈的水柱的時候，身體產生變化。禪定的人有三種功德：第一個寂靜，第二個安樂，第三個自在。在欲界，寂靜跟安樂是永遠不共存的，有它就不能有另外一個，有另外一個就不能有它，所以在禪定當中他很難得，他身心世界是非常的快樂，但是他的心還是如如不動，還是寂靜安穩，這個是非常難。\n\n在止觀的書上說，初禪轉到二禪，就像一個人從一個小房子，從一個\n三十平米的房子轉成一百平米的房子，這房子更大，他的內心更開闊，裡\n面的設備更好。那關鍵是什麼呢？他把心中這種覺觀的活動停掉了，他訶\n責它，停掉了。所以二禪禪定的定境更加寂靜，更加的法喜快樂。\n\n聞乘這個「聲聞」，什麼叫聲聞呢？其實就是聞聲。聲聞眾主要是出\n家的比丘、比丘尼，因為他們都是常隨眾，經常跟隨佛陀到處遊化，聽聞佛\n陀的教法而成就聖道，所以叫聲聞乘。也就是說，他是經常親近在佛陀旁邊\n聽佛開示的。在果地上，證得四果阿羅漢，名聲聞乘。這個聲聞乘它的當法是趨向於阿羅漢的。它的當法，這部車子本來是設計趨向阿羅漢，但是在淨土宗\n是引用它的因地，不走向它的果地。\n\n佛陀對於痛苦的定義，不是逆境，而是你只要有逼迫的感覺，這個就是\n痛苦；你只要有一種不安全感，這就是痛苦。這個地方我們要知道，這個痛\n苦的定義是逼迫。你看有些人佛號念了很久，他那佛號沒有力量，那個佛號沒有 power，他沒有力量，因為他根本沒有出離心。不是說你佛號念得多，佛號就有力量，不是這個意思。這是一種出世的道心，就是說，當你不想要急迫地離開娑婆世界的時候，你的佛號自然就沒有力量，這個不能勉強。\n\n佛陀在講到生命的緣起，在四聖諦，它的重點在於妄想。你前生的妄想，創造了今生的你；你今生的妄想，創造了來生的你，就是妄想的相續也使令集者「招感」所以「此是集，招感性」，就是我們心中愛取的妄想、愛取的煩惱而招感了三界果報，這是第一個。你每一次開始面對你的習氣，開始抗拒它的時候，就是開始把娑婆世界的力量慢慢降低了。\n\n四聖諦，從淨土宗正念的角度來說，我們選擇兩個法是必修的：\n1.\t思惟苦諦。我們要把娑婆世界的痛苦這一塊參透，臨終時的力量是不能勉強的，你沒有力量就沒有力量。就是佛號的那種衝力、那種決斷的力量，來自於你對娑婆世界痛苦的體驗有多深。你對娑婆世界的痛苦多一刻的體驗，你佛號的力量就加強一分的力道。我們必須要在身體健康、頭腦清楚的時候，就要跟自己溝通，到底來生要去哪裡，你要想好，你必須要產生一個明確的方向出來。明確的方向，來自於智慧觀照，絕對不可以來自於你的生活體驗，不可以！事相的體驗力量通通是分散的，一定要來自於道理的參透。\n2.\t調伏愛取。前面的苦諦會幫助我們提昇佛號的力道；這個調伏愛取是破障，不要把佛號產生錯誤的引導，這是調伏我們對身心世界的愛取。\n\n蕅益大師把大乘的正念真如的思想放進來。就是我們對色身貪愛，其實是貪愛一個虛妄的假相，是滿足你的妄想，就是你貪愛的是你心中的影像而已，因為根本就沒有色身。我們只是在滿足我們的妄想，我們其實不是真正的貪愛那個色身，是講這個意思。完全法法消歸心性，完全是你去攀緣你心中所出現的影像，如此而已。業力真的很難改變，互相吸引這一塊是無解的。你說：「欸，你為什麼欣賞他？」沒有道理，真的沒有道理，就是過去的業力，你要嘛欠他；要嘛就他欠你，就這樣。所以你看業力還完的時候，兩個人就不互相吸引了。\n我們懺悔只能夠改變自己的這一塊；跟眾生的互動這一塊，無解！因為他不改變，你一點辦法都沒有。這個地方就是說，我們只能夠改變自己的心態。\n\n你內心有法喜。你拜一部八十八佛，你很快樂；你打坐念佛念個十五分\n鐘，心裡專心聽你的佛號，你很快樂。整個過程你根本都沒有動，都攝六根嘛。你那念佛當中六根都收攝，哪有利用感受呢？所以你要慢慢了解，快樂不一定要透過感受，而透過感受是不好的。透過感受給你的快樂，都要付出代價的，你一定會起煩惱，它不是一個很好的管道。最低級的快樂才是透過感官的功能，這最低級而且最有過失的，問題最嚴重的就是透過感受。因為感受帶動了攀緣心，帶動了煩惱，帶動了罪業，無量無邊的過失都從感受開始活動。所以你看所有的修行人，只要是要了生死的、出世間的，一定要先都攝六根，先把感受收起來。你跟著感覺走，你就一定會跟著你的業力跑。你該遇到誰，該跟誰結婚，會有什麼事，你就一定跑不掉，因為感受它是跟著業力走的。\n\n妄想一定要透過感受，感受是所有罪業的根源，一定要外境刺激感受，然後\n再啟發妄想。所以你把外境拿掉，你這個妄想就沒有了。你看我們今天對某個人起瞋心，你心中把那個影像拿掉，你的瞋心就不活動了；你的心對某一個人起貪愛，你把那個所緣境拿掉，貪愛心就沒有了。它離開了前塵，離開了所緣境，它就沒有自體。\n\n自我意識，它是非和合、非不和合。你的明了的心跟你的性格思考模式，\n它沒有真正和合，但是它也不是完全分開。就像鏡子跟影像一樣，它非和合、非不和合。種和合，真實的和合，凡夫是認為和合，所以就說：這是我的個性，我沒辦法改。說你這個人脾氣怎麼這樣大？我沒辦法改，我從小就這子。其實這個是可以改的，因為你那個是非和合嘛。\n\n調伏色身，因為我們所有的貪愛以正報最嚴重，所有的財富這些依報都是其次。你色身這一關通過去以後，你要調伏感受，你能夠把感受慢慢內收，你往生就沒有東西可以障礙你了。你只要把色身的愛取調伏，把對感受、感官取調伏，臨終你內部的障礙一定沒有了，你的佛號可以發揮百分之百的效果。那個車子在開，前面的石頭都被你掃乾淨了。我們前面的懺悔業障，嚴持四重，是調伏外在的業力，不要有太多業力的障礙；這個調伏愛取，是掃除內心的礙，四念處是正修。\n\n\n這個六根(包括眼、耳、鼻、舌、身、意六個識根（感官器官）)的門，你其實可以把它關起來，你打開往生的門就好，六根的門對你沒有好處。諸位！我們要知道一個觀念，佛教的因緣觀就是說，你有多大福報，你就有多大福報。你說：「欸，我福報這麼大，我把六根關起來不是很可惜嗎？」有人這樣想：「欸，我福報這麼大，我這可以享受吧，到臨終再來求往生就好了唄。」到臨命終你走不掉啦！因為你在享受福報的時候，你把這個感受養得又肥又壯，糟糕了！盡量用你的心來看這個世界，不要再用眼睛、鼻子、嘴巴去看世界，不要這樣。用你那個明了的菩提心、空正見，還有智慧去看清世界。少管閒事，真的是這樣，事情管不了。你看印光大師講，好事不如沒事，真的！因為你管閒事都是用六根，你臨終的時候突然間要收，收不起來。五十歲以上少管閒事，開始要收攝六根。\n\n你一生必須要把握的三個修行重點\n\n第一件，就是處理業力的問題。\n很多淨土宗的學者，會有一個嚴重的盲點——他完全不管業力。他說：\n怕啥！帶業往生唄。這句話會害死你！古人對帶業往生是有明確定義的，帶\n業是帶業種，你不能帶現行！什麼叫業種呢？就是這個業力畢竟是經過你\n懺悔對治以後，它是《楞嚴經》所說的一種沉澱下來的業力，它不能是一種\n活動很熾盛的現行，不可以！\n在你生命還在的時候，你一定至少要有一次、兩次、三次加行，好好地處理你業力的問題，因為你現在還來得及，你身體還健康，精神還在。\n\n第二個，它會增長廣大。\n淨土宗，我們必須要爭取在阿彌陀佛現前之前，讓自己的身心保持風平浪靜。我們臨命終的時候已經是負擔夠重，內憂外患，即便沒有業力的干擾，已經夠你受了。你不一定要把它完全懺乾淨，但起碼必須把它懺成不增長業，這是往生的最低標準。\n\n第三個，處理你的顛倒妄想的問題\n你記住一句話：什麼叫道人？就是你盡量沒有對錯的概念。如果你現在的日常生活，還活在一種對立的思考：喔，這個是你對，這是他錯，你就很難調伏妄想。在《楞嚴經》把妄想分成表層妄想跟堅固妄想。日常生活的妄想問題不大。但是有些妄想已經形成一種強烈的習氣，這個你就要注意了。就是你經常打某一個妄想，而這個妄想活動的時候是非常堅固的，它要你做什麼，你一定要做什麼。有些妄想是你只管念佛就可以衝破，比方說表層妄想。你已經把它當主人翁了，它要你幹什麼，你就得聽它的話。這已經是一種愛取形成的堅固妄想。妄想的活動它最喜歡你感情用事。所以妄想的活動，它的生存是有空間的，你越是感情化的人，妄想它就生長得越熾盛。你一旦理智地去觀它，它就沒辦法生存。智慧的光明跟妄想的黑暗，是不能同時存在的，有光明就不可能有黑暗。所以我們從業力的修學而提昇到一種妄想的修學，這一塊也很重要。思惟苦諦、調伏愛取，這兩個都偏重在破障。\n\n安住真如，不隨妄轉，原來你的本性是清淨的，你只是一時的糊塗。外而學到內，先學業力這一塊，再學妄想這一塊，再學真如這一塊，是這樣學習。我們在學習的時候，是從外面表層的部分一直研究到內部的深層，業力、妄想、真如；但是你實際修的時候，是先安住真如，然後再調伏愛取，如法懺悔，最後導歸淨土。你今生的苦樂跟你前生臨命終時那個業力的碰撞有關，到底誰跑出來，哪一個業出頭了，就變成現在的你了。你可能身體健康，那表示你前生的這種慈悲的業力、放生的業力表現出來了；你可能今生福報很大，表示你過去生布施的業起現行。\n\n佛陀的神通力都沒辦法創造一個生命體出來，何況是科學呢？科學家只\n是創造一個環境，引誘這個神識來投胎，如此而已。神識不能創造，這是靠\n無始的熏習，所構成的一種強大業力的神識來投胎的。\n\n你要站在認命的角度來改造來生，因為它已經是一個成熟的業力了。從善業而來，不表示你就往善處而去，不一定。你前生表現好，不見得你今生就表現好。來生很多的變數，因為你今生有很多的選擇，所以比今生是沒有意義的。我們的生命已經形成一個識，從無明緣行、行緣識，當這個識開始投胎的時候，你一生大方向的格局已經定案了，你很難改造了。其實六道當中，只有人的業是最強，因為他的思考能力最強。一個眾生會到地獄去，只有一種可能——就是他在人的時候造的罪業，只有在人的時候會創造重大的罪業。我們承受的業力，只是一個東西現出來，但是真正的好壞是你自己的名言思考，這個世界是你自己把它畫出來的。我們修行一定要不斷地憶念真如？一定要安住空性，思惟我們本來清淨？要經常把生命歸零？就是要把這種你形成的定型的性格把它洗掉。你本來是沒有性格的，只是你忘掉而已。\n\n從淨土宗的角度，先把前面的東西放下，專心處理三件事情\n第一個，你的感受。我告訴大家：日常生活給你的訊息，對往生都沒有幫助，人我是非而已。\n第二個，調伏你的執著。我們是把執著疏導成一種往生的願力。這個水你弄得不好，叫做黃河氾濫成災；你加以疏導，它是灌溉良田。\n第三個，思想。思想是關鍵了！你透過思想向外調伏感受，透過你如理思惟的思想，去改變你的執著——從對娑婆世界的執著，改成對淨土的執著。\n\n我們的心接觸相狀的時候，會產生兩種力量\n第一個是感受。這個感受它沒什麼道理的，它完全是業力。我們剛開始修學\n佛法所積集的資糧是少得可憐，不管你花多少時間，因為你的心不廣大，因\n為你深受感受的影響。\n第二個，不得清淨。你得果報的時候快樂，但是這個果報帶業，你在享受人世間快樂的同時，必須要付出三種代價:「以有煩惱故，有諸罪業故，有老病死故，非實安樂住。」\n\n大乘佛法的矛盾在於:你既要離相，但是你又要面對相狀。因為你沒有眾生，你就沒辦法行菩薩道。你布施、持戒、忍辱，一定要面對眾生。\n所以大乘佛法它難就難在:你要面對相狀，但是你又不能執取相狀，而關鍵\n就在這個空觀——空觀的智慧。菩薩道，你一定要先找一個安住的點，就是\n我們經常說的，你要安住在「何期自性，本來清淨」那個心性的本體，這個\n很重要。\n\n我們大部分人死掉之前都留下很多東西，沒有把它處理掉，非常可惜。你本來有機會可以把它轉換成功德的，但是你死亡以後你就失去這個機會了。所以我們一個人死掉的時候，一般人大部分的資財都沒有處理掉，最後被無常給破壞掉。你布施，能夠引生他世的安樂。你如果不布施，不要說他世，你今生就會產生大量的痛苦。如果你的水平是在修人天的善法，你要布施就布施，就不要什麼心理建設了。因為你追求的是一種不得圓滿、不得清淨、不得莊嚴的善業。但如果你要成就波羅蜜，你的心理建設很重要。\n諸位!當你進入大乘菩薩道的時候，有一句話很重要，叫做「以願導行」，所\n有的善法一定有菩提的願力引導，沒有例外。用平等心去佈施。你布施後千萬不要後悔，否則你的果報不堅固。\n\n菩薩不能夠去改變外境，不能改變別人，那憑什麼菩薩能夠安忍呢?\n因為菩薩做了一件事情，他調伏自己的瞋恚心，就等於調伏所有的外境。\n\n遇到了惡因緣的時候\n第一個，我們要知道這些逆緣都是過去的罪業之所招感，我們自己要勤修懺悔。只要你有感受，就一定有業力，這是基本常識。我們只有多多懺悔自己，去改變我們的罪業。罪業改變了，你的感受就改變。我本來就沒有這些東西，那是緣生緣滅的假相。先求放下它，再來面對它，再來處理它，這樣的人生\n才有解。就是說，我不能控制外在的業力什麼時候起現行，但是我能夠控\n制自己，安住空性、如如不動，這是很重要的概念。心力來引導業力。我再講一次，業力是不能消除的，我們懺悔只能夠把它降到最低。因為我們無始劫造了很多業力，所以人跟人之間是非常複雜。\n\n\n如果你想要從你的業力裡面跳脫出來，第一個你要思考:人生沒有對錯，還債而已，沒有對錯，你不要墮入對立。「萬般皆是業，半點不由人」，先求認命，然後你才能夠去改造未來。如果你不能走出過去，你一定會失掉未來。\n\n妄想它受兩個因素的牽動:第一個，外有業力;第二個，內有執著。所以這個妄想就變得不單純。我們要從一個好人變成一個菩薩道人的時候，你要做的第一\n件事情，不是趕快去做善事，不是這樣子，你必須先調整你的心態。調整心\n態當然就是理觀的智慧了。\n\n真實的智慧有三道光明，你一定要去觀照:\n第一個，觀照真如。憶念我們的真如本性，會讓我們的心安定下來。從一種躁動不安的心——把心帶回家。\n\n第二個是觀照佛陀的法界，所謂的調伏力跟引導力。思惟娑婆世界的痛苦，慢慢慢慢地調伏我們對娑婆世界。那種貪著的愛取的心，這是第一個，一種調伏的力量。\n\n第三個我們要觀照佛陀的功德——極樂世界成就如是功德莊嚴。觀照佛道\n\n你千萬不要把修行修到自己內心產生嚴重的反彈，有時候該踩剎車的時候，適當地踩剎車。一個人不能只是一路地衝，衝到最後在這個跑道上就看不到你了。所以修學就跟開車一樣，你要前進，偶爾地後退一下。修行難就難在這裡。\n\n打坐的人，你的身體會覺得非常輕鬆，因為你那個氣脈跑得非常順暢，這叫身輕安。所以它是先有心輕安，才產生身輕安，是名奢摩他。。你的佛號不能都是在散亂心中念。你儲存的佛號，每一句都是散亂心的、利用空檔的時候念的，到臨終的時候，你每一句佛號力量都很薄弱。你必須一天至少半個小時、一個小時的時間靜下心來，專心地聽你佛號的聲音，跑掉再拉回來，跑掉再拉回來。你一天要儲存一些高品質的佛號在裡面，或多或少。在我們的倉庫當中，你一天至少要有半個小時儲存那些高品質的佛號。祖師勸我們把握平常的時間，那是比沒有念佛還好而已，反正你不念佛也打妄想，但是你不能夠以這個佛號當做你的正餐，不可以!因為你這些存進去的佛號都是低品質。你因地儲存進去是低品質的佛號，臨終表現出來就是低品質的佛號，不可以這樣子。\n從一種散亂心的動態修學，慢慢你就要有一點時間，走入你的佛堂，修學止觀，儲存一些正念的能量，是這個意思。我們平常適當地都攝六根，專一安住在一個所緣境，會把我們那種心光外洩的力量稍微調整一下，稍微往內收一點。如果你能夠每天專注半個小時、一個小時，你念一句佛號抵得過人家平常念一百句佛號，因為你的心強，造業力強。\n\n修行到最後，完全是拼你的心理素質。你拜一百拜佛號，那個佛號完全跟這個道相應。所以初學者重數量，老參重品質，重你的檔次了，看你的心理素質，就這麼回事而已。我們應該以佛陀的智慧來善調內心，來增長自己修行的水平\n\n\n修習理觀，你一定要先把生命切成有相跟無相兩個狀態\n我們在修習理觀的時候，很重要的一件事，你一定要把生命切成兩塊，\n這個很重要!不切成兩塊，你就沒辦法觀。如果你是外觀，向外觀察生命，\n你要切成兩塊;你內觀內心的世界，也是切成兩塊。你要把生命歸兩類:有相狀的，還是沒有相狀的。沒有相狀的那個清淨的明了性歸為一類。非相狀的本性，是「妙覺明體」——就是常住妙明的不生不滅的心性。不管你造了罪業，不管你造了善業;不管你是快樂，不管你是痛苦，它永遠是不變的，它沒有意見的，完全保持一種「如」的狀態。\n\n空觀——站在本來無一物的角度，面對人生，面對因緣\n從假入空，這個很重要!你不能直接修空觀，不可以。你要先有相狀，透過相狀的觀察你才可以悟入空觀。「何期自性，本自清淨」。所以佛陀要我們\n從假入空，就是你看到生命的變化，你更要看到那個背後不變化的本性，而\n憶念那個不變化的本性，叫做「離相清淨」。\n\n假觀——從空出假，以大乘理觀的智慧來帶動佛號!\n淨土宗，它不但要你放下過去，還要你開創未來。你要設定未來的目標，這個時候就是假觀的智慧。這個假觀不是你去胡思亂想，而是你要怎麼去調伏自己、引導自己。前面把相狀放下以後，現在把某些少部分的相狀再借回來。但\n這個時候的心情是暫借，不執著。空性的智慧當中你放進了兩個相狀:一個是生命中的狼放進來怖畏你，激勵你精進;一個是生命中的美食、功德相狀引導你、鼓勵你。這兩個相狀在我們生命當中缺一不可。先把生命歸零，把心帶回家。先從假入空，然後從空出假，調伏力、引導力，你的心就能夠慢慢地達到順從本願。\n\n當我們理觀、事修兩個一起用的時候，有四種殊勝的威德:\n第一個，他能夠在理觀事修的相互運作當中調伏煩惱。\n第二個，在六波羅蜜多正修的時候，「能為無上正等菩提成就真實資糧」，\n它有引導力。每一個布施，每一個持戒，乃至於每一個智慧，會增長你的菩\n提心。\n第三個，在這個修行當中，於現法中就能夠成就自調跟調他的功德，成\n就自利利他，兩種的功德都具足\n四個，在來世成就「廣大無盡的可愛諸果異熟」，成就廣大的福報力，\n成就大國王跟大富長者。因為你在理觀當中不礙事修，「一一理性具足莊嚴，\n一一莊嚴全體理性」。\n\n你的心是趨向於佛道，你修一切法都是趨向佛道!你是聽佛陀說法，那個法進去以後，它第一步會先把你帶到阿羅漢，但是這個法力量還在，它會在心中一直醞釀，阿羅漢會覺得好像自己還有事情沒有做完，那個法會引導他繼續從空出假，然後會繼續地親近諸佛，回小向大而成就佛道。安住空性，走出妄想，才能面對彌陀的光明。佛法避談結果，你具足這個條件，你就有這個結果出來。至於什麼時候出來跟你過去的善根有關係，因為果證全部是個人化的，沒有一個人相同。\n\n我們的心住在外境的時候，我們的生命就產生了三種障礙\n煩惱障帶動業障，業障帶動報障。煩惱相續的活動，就會推動你的身口意去造業，就變成業障了;然後這個業力成熟以後，就在三界得果報，就變成報障。\n\n菩提智慧不能分享。佛陀的空假中三觀不能把它\n的智慧送給我們，佛陀只能夠用語言文字來引導我們。但是佛陀的涅槃我們是\n可以分享的，尤其是大乘的涅槃。佛陀的涅槃都會發一些跟眾生互動的願，你只要遵守這個願力，就可以跟他產生感應。那當然這種感應頂多就是消業障，它不能承受一種菩提的教化。這是第一個現世的攝受。第二個，來生的救拔——淨土法門。我們來生到淨土去，得到佛陀的教化，從這個當中得到了菩提。\n\n你遇到逆境、痛苦的感受衝擊你的時候，那種力量你沒辦法把它轉成菩提道。這樣子的話，你修行只有在佛堂，所以你一天裡面修行的時間只有一個小時、兩個小時，其他時間都是跟妄想打成一片，都浪費掉了。你這個人就是把本來是逆境的，結果轉變成菩提。這個水本來是氾濫的，但是你善加疏導，變成一個發電機用於水力發電；明明對你是逆境，但是變成加持。\n\n理觀跟淨土宗念佛的事修，一個強調心力不可思議，一個強調佛力不可思議。就是蕅益大師說的：能念的心不可思議，所念的佛不可思議。所以一念相應一念佛，念念相應念念佛。這就是為什麼要修理觀？因為加強你心靈的力量。\n\n歷緣對境的時候，你先訓練你第二念的反擊力量，訓練看\n看有沒有辦法。就是你第一念控制不了自己，該發脾氣還發脾氣，該貪戀還\n貪戀，但是你事後，在當天當中能調伏——叫第二念，過了一個禮拜就不叫\n第二念了——當天能夠馬上啟動反省調伏，你臨終就有把握。你臨終的時候，即便一時的失常墮入了妄想，你只要訓練第二念的反擊力量，只要有人開示你，就會觸動你覺悟的力量，產生反轉，你就有救了。\n\n我們內心有兩種力量:一個是無明的力量。你前生、過去生留下來的，不能怪現在的你。第二個就是一種真如的力量，你開始啟動你的真如的自性功德。\n\n\n心力帶動佛力，我們可以知道，你內心的力量是主動，佛陀是被動。\n也就是說，你準備了三分，佛陀給你三分的功德；你準備了五分，佛陀給你\n五分的功德；你準備了十分，阿彌陀佛把所有無量光無量壽全部送給你。同樣一句佛號，誰能夠把佛陀的功德全部釋放出來，就各憑本事了。消業障式的念佛，提升到往生式的念佛。\n\n帶有煩惱執取的妄想來衝擊你的時候，你自己會提出理觀來告訴你：這都是虛妄，你不要管它，你要先放下它，它只是影像而已；然後你再來對治它，你要思惟它是一個過失相，阿彌陀佛的功德是無量光，你會慢慢地從空假中裡面產生安住力、調伏力、引導力，你自己會啟動一種去衝破難關的力量出來。\n\n\n你持咒就是自我保護。因為鬼神是這樣，只要有過人高的樹，它就有鬼神，因為鬼神有時候很麻煩。有時候鬼神祂就向你挑戰，你要住山上更明顯。所以住山上的人，一定要持咒。因為你好好跟祂講不見得有用。這個鬼神跟人一樣，有些講道理的，有些不講道理。\n\n返妄歸真的時候你身業沒有禮拜，缺乏一個業，只有口業跟意業，你的效果就不好。你修行只靠兩業來修行，你造業靠三個業來造業，是吧？最好要有身口意三業具足。你看幾乎所有的修行的事修——華嚴宗的事修，天台的方便法門，一定都有身口意的。\n\n其實我們有時候是可以圓修的。你真實的心、皈依的心建立的時候，很多事修，它不會影響你，那法法消歸彌陀。不是說你念其他法門就障礙你往生，沒有那麼嚴重，只是看你的心態怎麼把它會歸起來，因為一佛乘嘛\n\n佛教的因緣觀跟外道的因緣觀最大的差別，就是因為一切法畢竟空，所以才能夠緣起。一念心動，你念頭一動，就是一個緣起；你念頭不動，就沒有緣起了。\n心力帶動佛力，不是佛力帶動心力。如果你認為佛力可以帶動你，那你這個是外道思想、他力的思想。\n\n淨土宗的人，我提出三點跟大家互勉：\n第一個，你最好發心受戒。\n第二個，就是理觀跟事修的操作了。\n第三個最重要，相續不斷。功課不要多，但是你要有恆心。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188110","master":"淨界法師","title":"大勢至菩薩念佛圓通章 淨界法師筆記","youtube":"","images":[],"tags":["念佛"],"content":"《楞嚴經》把眾生的心態分成二種：一種是攀緣心，一種是常住真心\n1.\t常住真心的特質，它是我空、法空相應的一念心性\n2.\t攀緣心的胸量是狹小的，不像常住真心這麼廣大；所以這個大就代表平等的意思，所以廣大。\n\n凡夫攀緣心基本上的特色，都是屬於情緒化的、盲目的；這個常住真心是跟智慧的理性觀照相應的，所以他是佛，了了常知，無有昏昧，他經常保持在一種清醒的理智狀態。\n\n\n\n佛陀為了引導眾生出去時，設立了一個偏空的涅槃。因為聲聞人一聽到萬德莊嚴他不生好樂，他喜歡那種寂滅的偏空涅槃，佛陀就先用這樣的假名字來引導他，所以「先以欲鉤牽，再令入佛智」了。你的自私自利是清淨的，你變成二乘人；如果你的自私自利當中，又貪著五欲的快樂，那就變成天魔外道了。\n\n\n忏公師父一段非常重要的開示，他說：一個修行人有三件事情非常重要：\n第一個解門，你對法義的了解；\n第二個行門，你一天拜多少拜佛、持多少咒、誦多少經；\n第三個性格。忏公師父講完這三個以後，他說【性格是最重要】，他說：你這個人的性格不好，天大的解門、天大的行門都沒有用。\n\n你拿綠豆去煮，最後一定變成綠豆：你不能說拿綠豆去煮，最後變成飯，不可能。也就是說你心念根本的本質，是影響你最後果報的結果。\n佛法認為生命當中有二種相貌：一種是雜染的緣起，一種是清淨的緣起，但這二種緣起事實上是有根本的。為什麼一個人會觸動雜染的因果呢？是因為有攀緣心；為什麼有些人能夠很快的進去清淨安樂莊嚴的果報呢？因為他找到了真實的清淨心：這個就是說你必須在修行當中，先找到你清淨的根本。\n念佛當中有四種\n1. 觀相念佛，我們擺一尊佛在前面，眼睛打開來，去取佛像的相狀，然後把它銘記在心；眼睛閉住以後，你在心中把這尊佛像的影像現出來：就一次一次的打開眼睛、閉上眼睛，直到你心中能夠很清楚的如鏡現像，像鏡子現出影像一樣的清楚，這個就是觀相念佛。\n2. 觀想念佛，它是沒有影像，完全靠文字──極樂世界有七寶池、八功德水、種種的蓮華、宮殿，他從文字起觀，隨文入觀的。\n3. 持名念佛，以這尊佛的名號，一句彌陀念誦聽，創造出聲音以後，聽那個聲音，來跟佛陀感應。這三種都是念他佛，這是屬於事修的部分。\n信佛是心，信心作佛。當他生起理觀的時候，他相信他跟佛的體性是沒有差別的，達妄本空，知真本有，知道他這一念心是如，佛的心也是如，所以能念所念是性空寂，感應道交難思議，他相信感應道交是完全可能做到的\n\n念佛三昧\n他的心跟佛的心是平等不二。他能念的心跟所念的心，真實達到性空寂。所以他每一次的觀佛，每一次都成就佛的功德，都真實的出現，地如佛地，他每一次的觀佛，都能夠轉佛的功德為自己的功德，真正做到即眾生心，投大覺海。\n我們不觀雜染法，我們直接觀清淨法，看佛陀是怎麼樣。你的心經常憶佛、念佛，你自然遠離雜染法、自然生起清淨法，這是比較用鼓勵的方式。\n憶佛是一種觀想，重點在信願的培養；念佛在持名，成就一種三昧、專注。\n\n一心不亂\n百不管婦人，什麼事都不管了，真心的放下。這個時候，她看到事情，以【百不管、隨它去】來自我勉勵，果然沒有多久就成就一心不亂。她大概念了半年以後，成就一心不亂，她要臨終之前，還跑去跟道源老和尚告假，說：感謝您對我的開示。我當初在修行的時候障礙沒有辦法突破，您幫我解開了。她跟老和尚告假回去以後，沒有多久就安然往生了。\n圓瑛大師說：憶佛是暫念，念佛是常念。\n憨山大師說：如果從成佛的角度，憶佛、念佛是最直捷了當。我們凡夫不可能無念，你說我現在開始都不要憶念，做不到，因為你念頭一定要動的，有動一定要憶念。所以這個地方憶佛\n\n阿彌陀佛是一個果地功德，我把這個果地功德跟眾生的因心合在一起，我經常觀想以佛志為己志、以佛心為己心，我經常以佛的功德來要求自己、熏習自己，這樣子就像【染香人，身有香氣】。你以這樣一種本尊相應的心情，很快的就能夠【念極情亡，證入無生；帶業往生，圓證不退】。\n\n宋朝的了然法師說：一個人能夠經常憶佛、念佛，能夠得到四種功德的攝受。\n第一個法身的攝受，念佛之人能夠得到佛陀法身本願功德的加持，這個我們前面講過，法身當中有很多的本願。\n第二個光明的攝受，阿彌陀佛有八萬四千相，一一相有八萬四千好，一一好放八萬四千光明，能夠使令我們現生消除災障。\n第三個神力的攝受，經常念佛的人能夠得到大力鬼神、龍天護法的護持，這些都是阿彌陀佛的眷屬，你憶念阿彌陀佛本尊，這些眷屬、大力鬼神就保護你了，遠離這種鬼神、冤親債主的障礙。\n第四個色身的攝受，臨命終的時候阿彌陀佛現前，開示慰導，接引往生。所以你以念佛心，除了你自己的止觀、戒定慧以外，你多了四種的恃力──法身的攝受、光明的攝受、神力的攝受、臨終的時\n候色身的攝受，四種力量。\n\n怎麼從一個生滅的攀緣心，悟入到常住真心？\n1.\t印光大師說：這個都攝六根，其實用一句佛號就可以了。說你這個妄念很多，你不管妄念怎麼來，以一念抵萬念\n打坐幫助\n安置地輪，令心下沉。\n(你心的\t要放在地上，使令內心下沉。)\n二、所緣行相，清楚分明。\n三、寧可少念，不可草率。\n(修行不是在於佛號念得多少，而是在那種念力，那個憶念的力量，所以絕對不要貪多而念得含胡籠統。)\n打坐補充資料(不是法師所說)\n禪宗的所緣境是在鼻息，行者全心全意於鼻端之處，入息時，「正知」入息；出息時，「正知」出息。注意力自始至終維持在鼻端，不要隨著呼吸向內跑或向外馳散，《清淨道論》指出，唯有注意力安止於鼻端，才有入定之可能，如果注意力總是內外飄忽不定，將難以入定。注意力安止於「鼻端」，是初修習者所應重視的關鍵點。\n打坐時生起的所有妄念，皆應「除遣不忍」。意思是，不要對打坐中生起的\n任何思想有所忍耐，忍耐意味著你默許自己的思想持續不斷的進行。「除遣不忍」之功夫即是指：每當你一警覺到思想之生起，不要忍耐它逗留在你的內在，馬上把它除遣出去，好讓你的心不斷維持在一種\n純淨無染的狀態。除遣完後，回復到原來所專注的所緣境。「除遣不忍」的程序應該一再的使用，直到成佛前，它會被使用無限多次。但如果完全不使用它，成佛將變成遙不可及的目標。\n\n有人拜《地藏經》，怎麼阿彌陀佛會現前？\n祖師說因果不符，所以這個你就要小心了。你念阿彌陀佛，看到阿彌陀佛，這正常，你因地栽培跟結果是一樣的。你因地的本尊是念這個，你見到的是另外一個，那這個你就要小心了，從教理來說因果不符，不正常。不正常的時候，你就要攝心，繼續念你的本尊功德，它自然消失掉。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188109","master":"黃念祖居士","title":"圓人修一日，等於一般人修一劫","youtube":"","images":[],"tags":[],"content":"(附上珍貴圖片：1991年黃老居士為從香港來訪的淨慧等居士講授佛法)\n莖草集（一） 黃念祖居士答問篇｜連載006\n貳、答問\n一、圓人修一日，等於一般人修一劫 \n5、HC居士問：念佛迴向給眾生，跟迴向給單一個人，功德是否一樣？\n 這個事打個比方，你現在只有一塊錢，你要是只給一個人呢，那麼他得一塊錢；你要給一百個人呢，一人只得一分錢，是不是？那麼就不如都給一個人，你這就是這麼算出一個帳，不知道還有一本帳啊。你肯這麼迴向的話，你的功德就不是一塊錢。\n 你念佛的功德本來是一塊錢，大家一分，一百人一分就一人一分錢了；你肯為大家迴向，這麼發心去念，因此你這功德是一萬塊錢哪。一萬塊錢，那每個人得百分之一，還等於全部的一百塊錢，或許一萬錢的比例還不夠，十萬塊，那這時候就是他只得百分之一，他也得了一千塊，比那個不迴向給旁人的還是得的多。\n 實際上，你迴向給旁人的時候，你那個功德就接近無限大，大的不可思議啊，你怎麼分都比原來功德本身的那一份要多，這一點是很難想得通的。為什麼這功德就幾萬倍，幾十萬倍，幾萬萬倍的翻上去？因為你這樣的心是佛菩薩的心哪。我只為我一個親屬，替他求，替他做功德，這還是普通人的心，而人的心用人的心去念，功德一定有，但是用佛的心去念的話，當然比人的心去念要大幾萬倍，幾萬萬倍，幾億倍，帳實際就是這麼一個帳。\n（1990年於北京蓮舍答弟子問）","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188108","master":"宣化上人","title":"投生去做畜生","youtube":"","images":[],"tags":[],"content":"所以一個人投生去做畜生，不是一個人做一種畜生。他會分開：一個人做馬、牛、羊、雞、犬、豕，這是身體比較大的，有靈性聰明一點的畜生。這一個人又可以變成七種的畜生，因為經過分開了，這叫「分靈」，便性化靈殘。\n\n他的靈性既然分開了，又往更小的再分。譬如馬變雞鴨，又變成很多了。一隻馬，又可以變成七隻鴨、七隻雞等等。\n既然又分開了，那點靈性又少一點，又愚癡一點。\n\n因為這種關係，所以佛說：「一失人身，萬劫不復。」若把人身失掉了，百千萬劫再也不能恢復。為什麼呢？因為他已被分開了，經過化學工廠的化驗，分開一部份一部份的。假如人會變成蚊蟲這就是因為人的心很毒，專門貪而無厭，總想吸食人的血。這種思想長久了，就會變成蚊蟲，而遂心滿願的到處去吸人的血。牠雖然是性化了，可是牠還是有個靈性，還有點知覺性，於是牠也只知道吸人的血，旁的什麼也不知道了。牠之有生命，也就是以貪心來為牠的工作，這是蚊蟲的因緣。\n\n\n\nhttps://www.drbachinese.org/online_reading/dharma_talks/volume2/volume2_41.htm","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188107","master":"金山活佛","title":"金山活佛的念佛方法","youtube":"","images":[],"tags":["念佛"],"content":"金山活佛神與錄，密宗的神咒持諍得好’釭果是戒律精嚴,原本有很多靈\n驗的,活佛之所以能夠替人醫治宿疾怪症’解除病人的苦痛,料想他必是\n得力於持咒的功用。記得清朝時候’吾鄉湖北武昌洪山霄通寺’出了一位\n名叫﹁摸腦和尚﹂’不計大病小病’只經他的手一摸,便霍然痊癒,湖北制臺端方的小姐瘋魔了,也是經他的手摸好的。活佛的秘行是禪淨雙修，也是從他日常行動言談中得到的認識，他從不談說經論上的話語，也不講說公案典章，他行，住，坐，臥只有一句佛號，不唸佛時，就合眼靜坐，他唸的佛號，與人不同，古今來專修「淨土」的人，多是稱唸「南無阿彌陀佛」，「阿彌陀佛」，活佛他卻別緻，他唸佛是唸「誰唸南無阿彌陀佛」八個字，而且他唸這句佛號，還用一種腔調，有節拍，有音韻，並不是普通人唸佛口中喃喃，說明白一點，他是唱佛，他唱的那個調門，既不像梵唄，又不像叢林裏初一、十五在佛前拜願的腔調，他是獨創一格，他的唱法是這樣：「誰......唸......南......無......阿......彌......陀......佛。」若用木魚、引磬合起來，是一捶木魚，兩捶引磬，恰恰是兩眼一板，這是他領著大眾拜佛的名堂，拜一拜，就這樣唱一句，若是同著大家唸佛，他就不用這個調門，只唸「南無阿彌陀佛」六個字，不過唸的句子，還是有抑揚高低的聲音，假設他一個人唱佛，那就嚕囌了，還要帶上一大節尾巴：「誰.......唸......南......無......阿......彌......陀......佛......如......來......世......尊......是活佛。」他這樣的唱佛，可以說是前無古人後無來者，這算得是活佛的「不二法門」，他唱的佛號，好聽極了！活佛的嗓子像洪鐘一樣響亮，每一個字唱出，都有旋律，其音幽雅，有如溪聲流水一般，餘韻不盡，使人聽了塵念頓消，身心輕快，我與活佛同住了兩個月，也學會了他唱的調門，過去在行腳當年，有時背著人哼唱一兩聲，覺得很有滋味。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188106","master":"金山活佛","title":"金山活佛念佛","youtube":"","images":[],"tags":["念佛"],"content":"「佛教的法門很多，為甚麼只老實教人唸『阿彌陀佛』，何以不開示別的法門？」他答的話真有趣：「現在世界上的人，他們的心眼多，說多了它會漏掉，只教這句『阿彌陀佛』他才容易記得。」接著又說：「莫輕看這句『阿彌陀佛』，會唸這句佛號的倒不容易呢！他能唸，就可以得度。」我說：「這是說笑話了，『阿彌陀佛』四個字，誰不會唸？三歲兒童也能唸出啊！」他用鼻子哼了一聲說：「許許多多孳障深重的人，他知道『阿彌陀佛』而不願意唸，且有心裏想唸口裏唸不出來的人，遍地皆是。」過了幾天，門前來了一群叫化子，我想起了活佛的說話，倒要試一試，我向叫化子們說，每人唸一句「阿彌陀佛」，我給五分錢，其中只有一個女叫化子同兩個小孩歡歡喜喜唸了，其餘的，都是悶聲不響，我問他們：「你們不要錢嗎？」他們異口同音答道：「當討飯的，自然是要錢嚕。」我又問：「既然要錢，就可以唸這句佛號啊？」他們有的說：「我們只會唸太太，小姐，老爺，發個善心，做個好事，給我幾個錢，救我一條命，別的不會唸。」有的說：「我不願意唸這個。」我以為他們嫌錢太少，於是我又加上五分錢，他們照樣不唸，我又再加兩角、三角乃至半塊，看唸不唸，他們依然不唸這句「阿彌陀佛」，最奇怪的，其中有兩個老叫化子只把口張得大大的，舌頭在口裏打圈圈卻唸不出聲來，我這才相信活佛說的那話確有其事，足見活佛教人唸「阿彌陀佛」是他的悲願。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188105","master":"金山活佛","title":"盂蘭盆節眾生來住--金山活佛神異錄樂觀法師著","youtube":"","images":[],"tags":[],"content":"記得那年七月十五盂蘭盆節,汪嘉棠老居士特地請了一位棲霞山的老\n和尚來家施放﹁焰口﹂,我也隨喜去觀看’那一座焰口’整整唱唸了四個\n鐘頭,看活佛在焰口臺下也整整禮拜了四個鐘點。事後,我問..﹁活佛’\n你今天在焰口臺下磕頭那麼久’是拜佛?遠是拜人?﹂他說:﹁不是拜\n佛’也不是拜人,是領著他們拜地藏菩薩。﹂我又問‧.﹁我只見你一個人\n拜,並不見有別人,你領著誰拜呀?﹂他說:﹁多的很呢!老的、小的、\n男的、女的﹑披髮的、斷腿的、瞎眼的、跛腳的﹑長舌的﹑斷頭的’何止\n幾百個,你看不見就是。﹂我聽了很是驚奇!如呆沒有信心的話’一定當\n作是說鬼話了\n\n金山活佛神異錄樂觀法師著","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188104","master":"金山活佛","title":"活佛使啞叭說話_金山活佛神異錄樂觀法師著","youtube":"","images":[],"tags":[],"content":"無疑地，活佛治啞叭會說話，是個大奇跡！足見佛門中真有修行的高僧，他的作為，是有許多不可思議之處，至於活佛畫的那杯水，在筆者猜想，或者是「大悲咒」水，因為佛門同道中有許多人說活佛是持誦「觀音菩薩大悲神咒」得到靈感的。\n\n\n照佛教密宗道理來說，凡是密咒持誦靈了，均有不可思議的力量，然而這卻不是普通一般佛弟子隨便依樣畫葫蘆唸幾句密咒就成功的，第一要戒律精嚴，不好女色，不貪財，其次要有大悲心，再其次要有救度眾生的宏願。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188103","master":"宣化上人","title":"宣化上人- 上人與台灣大仙寺開參老和尚打機鋒的珍貴錄音","youtube":"https://www.youtube.com/watch?v=BuNav5mDy1E","images":[],"tags":[],"content":"鬼有鬼王在管 開參老和尚說","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188102","master":"宣化上人","title":"宣化上人：脾氣、病毒與體內眾生的直接連結","youtube":"","images":[],"tags":[],"content":"宣化上人：脾氣、病毒與體內眾生的直接連結\n\n美國萬佛聖城的宣化上人，是近代極少數花極大篇幅、非常直白地探討體內「八萬四千蟲」與「心性」關係的法師。他有過幾段非常著名的開示：\n\n    體內蟲子就是你的怨親債主：上人指出，人為什麼會生病？因為人一發脾氣、一吃肉、一動壞念頭，體內的惡蟲（細菌、病毒）就得到了燃料，開始造反、咬你。\n\n    以慈悲心、念佛度體內眾生：上人曾說，修行人天天說要度眾生，你不要跑去外面度，你先度你肚子裡的眾生。你在念佛、持咒（如大悲咒）的時候，你的心包太虛，這個光芒照向體內，就是在超度你身上這八萬四千戶蟲。牠們聽法開悟了，不咬你了，你的病就好了，這就是最直接的「同體大悲」與「無我觀」。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188101","master":"淨界法師","title":"淨界法師講念佛","youtube":"","images":[],"tags":[],"content":"蕅益大師在《靈峰宗論》裡講了一個故事：\n在明朝有一個居士，做生意、貿易，跟一個地方官關係非常好，官處處挺護他，他就廣做非法，這個官後來被調職了，換了個新官，他就靠山沒了，他很害怕，有人去檢舉他過去非法的事情，他想怎麼辦呢？我應該創造一個新的形象，讓人家以為我改過自新了，放我一馬。\n他看到很多在家居士共修念佛，他也去參加念佛共修，手拿念珠，穿上居士服，撥動念珠，裝出一個修行人的樣子，他假裝修行，別人就說某某人開始在修行了，別人家裡有兒子發高燒就去找他，請他持大悲咒水，持一下喝下去就好，什麼事情讓他加持馬上就靈驗。\n這個居士就想，我這只是為了逃避別人檢舉，假裝修行就有這個效果，那如果我真修行，那是什麼意境？那不得了。好，我就真實修行！就真實的發心到寺廟出家了。\n真實修行以後呢，他過去的信徒還是來找他，師父啊，我們過去都是請你幫忙，現在還是請您幫忙，這個時候他再為人加持以後沒有效果了，他就覺得很奇怪，我以前假裝修行的時候這麼有感應，現在怎麼真修行了沒感應了呢？\n他在睡覺的時候，他的護法神跟他說，你以前假裝修行，內心邪曲，招感的是邪惡的護法神，邪惡的護法神會對你做出些非法的事情，你現在真修行，你正直，招感我們這些正直的護法神，我們正直的護法神不跟你做這種事情，這種感應的事情，讓大家產生錯覺。\n當然有些感應的事情是好的，你內心的感應，我們在念佛的時候感到歡喜、滿足，這種感應會增長信心。\n如果說你去扭轉那些錯亂因果，這個人做錯事了，他祈求你給他加持，他馬上感應了，我告訴你，你害了他，他從今以後對惡業更加不怕，你讓他產生一個沒有因果的觀念，等到一次算總賬的時候，他會恨你。當初如果說他因為種種的痛苦，他知道警惕。\n所以感應神通為什麼有它的問題點，為什麼菩提不強調，它很容易讓人產生錯亂因果，不懼因果，業障現前的時候不得了，\n層次越低的越容易感應，低級的鬼神最容易感應，基督教與天人感應就不太容易了，到佛菩提就更難感應了，不是說沒有感應，那種感應你感覺不出來的，那是心靈的感應。人越容易感應，表示你感應的鬼神是檔次很低的。\n（按：念佛是與阿彌陀佛的願力感應，是用至心信樂，願生西方極樂世界的深信切願的心去感應阿彌陀佛的願力，只有真念佛的人，時時都有佛力的加持。所以念佛人不求感應，自與阿彌陀佛感應道交，因為佛號本身有這種功德力。）","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188100","master":"淨界法師","title":"楞嚴經修學法要 淨界法師心得","youtube":"","images":[],"tags":["楞嚴咒","楞嚴經"],"content":"為什麼要研究《楞嚴經》？\n一言以蔽之就是： 我們必須把過去「凡夫的世界」，提升到「聖人的世界」─「轉凡成聖」。\n\n\n我相\n人相：人相是指我們看別人，都會把別人安立一個相狀\n眾生相：當自我跟別人接觸的時候，就會創造很多很多人事的因緣\n我相、人相、眾生相，這三個是指空間\n\n壽者相：壽者相是講時間，有一個相續 的時間相，今生是這樣子，來生還是同樣的：創造了一個五陰身心、又執著一個自我→然後 跟人家對立、又造了很多的業力→然後業力又得果報、又變成一個身心世界…如是的輾轉相續下去。\n\n不迷：是一種智慧的觀照； \n不取：是一種禪定的安住； \n不動：是持戒，身、口、意不亂動。\n\n為什麼會有生死輪迴？是我們「自己」創造出來的！\n妄想只是一個生滅的假相，能夠不隨妄轉，它自然就消失掉 了，結果是沒有輪迴。\n\n到底有沒有生死輪迴？\n答案只有一個：你說呢？你要跟著妄想走， 你就有；\n你「迴光返照」它就沒有。\n「諸法因緣生」的道理就是這樣，你隨順染污的因緣， 它就出現如夢如幻染污的果報；你隨順清淨的因緣，它就出現如夢如幻功德莊嚴的果報；而 這二個果報，都是依止這一念心性而生起的，一個是「迷」，一個是「悟」，差別在這個地 方。\n\n\n\n\n一個安住在真如的人，「你的人生不是來受用的，人生是來歷練的。」\n你一 念的心性，假借所有順逆的因緣，而成就開顯你自性的福德、智慧二種功德。所以當你安住 真如的時候，你會發覺：\n\n人生每一件事情都有意義；好的、壞的都有意義，酸甜苦辣統統有意義；相反地，你如果活在妄想當中，心住在外境，那人生只有某一部分對你有意義，其它 的就沒有意義了，你的人生就非常有侷限性。\n\n\n我們的生命只有一件事情─「開顯你自性的 功德」─借假修真，假借外在的因緣來開顯你自性的功德，那麼人生的每一件遭遇，都是有意義的\n\n佛教徒對於今生的果 報消極、認命；但是佛教徒對於未來，比誰都主動，我們要設定目標、發願，然後去實踐我 們的理想，我們對於來生是非常主動積極的。\n\n\n佛陀說：假若你內心當中的功德，是跟外境「借來的」─這是虛妄的。\n\n\n佛陀說：你的善根是透過佛法道理的思惟，經過「聞、思」而產生的─這是真實的。\n\n印光大師說：「就算全世界的人，沒有人往生，我還是照樣求往生！」。\n 你看他那個信願是真實的，不是借來的。說：因為有人往生，所以我才念佛，那要是沒有人 往生，你就不念佛？\n\n你為什麼發心修學？只有一個理由：\n為了開顯我自性的功德，這才是真實的善根！\n\n\n你看任何人、任何事情，你都要告訴你自己：「你本來沒有這個東西！」\n\n這時候，你對 它的執取就淡薄了；但是在淡薄當中，你不能斷滅。「空觀」是破除我們的執取，「假觀」 又從空出假，所以不要否定你的因緣，要找到你的定位，扮演好自己的角色。\n\n印光大師常說一句話：「一個人福報越大，生死業力越大。」為什麼這樣講呢？因為你 福報大，你接觸的外境就比較廣，你的攀緣心相對就比較重。所以同樣念佛的人，你看福報 越大的人，他往生越困難，因為他所緣境太廣。\n\n\n\n空觀：也就是「達妄本空」。\n假觀：雖然觀一切法空，我們不要去破壞每一個法--它的假名、假相、假用\n\n「徧計本空，依他如幻」\n即空、即假、即中當中，我們就可以把心中的妄想，轉成 『佛性』的顯現。依止「空假中三觀」來破妄顯真，這是佛陀所要表達的意思\n\n三摩：指的是假觀，以假觀來執持一切法，假觀主要就是找到你的定位。\n我在家庭是 什麼定位、你到了公司是什麼定位，從這個定位當中，安立你的假名、假相、假 用。\n\n 三、禪那：是「中觀」，空、假的一種平衡叫中觀。\n\n佛教的『咒語』跟『聖號』，是諸佛菩薩那「一念心性」所發出的真實功德，「真實」是可 以破除「虛妄」的！\n\n「妄想」本來是不存在的，它要存在，有一個條件：必須依附一個「影像」！\n古德有一句話叫「離塵無體」，離開了塵境就 沒有自體，所以它一定要「有所住」。當然我們一般人對外境的境緣，執著是比較輕，但是 我們對於色身的執著就特別重。你看我雖然很喜歡這個鬧鐘，鬧鐘摔壞了我會心痛，但是我 要手摔壞了，我更心痛，是不是？\n\n「煩惱」最怕你「迴光返照」；因為它沒有實體，它會變現很多假相來欺騙我們，讓你心有 所住、然後分別…\n\n。你的心跟咖啡接觸的時候，嗯！不錯哦，這個咖啡不錯，口味不錯哦， 你買的好咖啡，只有第一口受用到；第二口開始攀緣…你的心住在妄想，你沒有喝到咖啡， 你是被妄想帶著走--這咖啡是從哪裡買的？它跟哪一個廠牌比較怎麼樣？第二口的時候，你 再也喝不到咖啡了，你活在你的「名言分別」當中，就是這樣子！我們活在自己的妄想中， 由此給自己帶來憂愁苦腦，引生生死業力的力量就在這個地方。\n\n只要：「如如不動、保持正念」，\n你的心就…啪！「清淨本然，周徧法界」。但是你不 能用攀緣心，\n用那個動的心、有所住的心，那就糟糕了，臨命終的時候，你很難解脫生死業 力；一個人經常不知不覺「心動」，你要跳脫生死就很困難，\n即便你想把佛號念好都很難！\n「諸法實相」主要是二個主題\n1.一個是「無相」：這是講到心性不變之體，我們的心，本質是無相的\n2.「無不相」：你念頭一動，它就能夠隨順你心中的想像，出現各種相狀。你 可以把你的心塑造成三惡道的相狀，你起貪瞋癡，它就塑造成三惡道的相狀；你起布施持戒， 就三善道的相狀；所以它是「無不相」，隨順你的想像，顯現十法界的染淨的相狀。這叫做「無相、無不相」。\n\n\n「心」為什麼不在「內」呢？因為它見不到我們身體裡面的五臟六腑啊\n心」為什麼不在「外」呢？因為『外不相知』，如果心在外的話，那身心就不能互 相了知了，這跟事實不符。\n\n佛陀為了破除阿難尊者心中這種「我愛執」那個「我」的相狀，所以就告訴他 說：「你所謂的中間是不能成立的。」\n\n\n\n你要很認真的去看你的念頭，這個念頭就像一個萬花筒，看\n得到「過去的你」，也看得到「未來的你」。\n怎樣看呢？ 我們這一念心，本來就具足「過去、現在、未來」─看你的「感受」，就知道你「過去」做 了什麼事；\n看你用什麼「想像力」，你生起什麼「想法」，也會知道你「未來」要去哪裡。\n\n\n佛陀的意思是：當「根、塵」碰撞產生「識」，佛陀本來是要破「識」的，這個「識」 是沒有自體的，因為「根、塵」碰撞才有的，假借因緣而生；當你把根、塵除掉了，「識」 就沒有了。所以佛陀這句話，主要是在發明「我空」的真理，實際上是「無我」嘛！你的感 受、你的想法，就只是根、塵碰撞創造出來的、一個暫時的假名、假相、假用，它是在反應 過去，它是在反應未來，如此而已，哪有真實不變的自體呢？但是阿難尊者，他錯解佛陀的 意思，他就把它當作：哦！我的心就在那裡。說：「什麼叫做我的心呢？」「我的眼睛看到 花，我的心就住在這個花當中；我的心看到佛像，我就住在佛像裡。那麼根、塵接觸所產生的「識」，眼根是能分別，色塵是所分別，它是無知的，『識生其中，則為心在。』我的心 就住在我當時的感受跟當時的想法…一口道出了「攀緣心」的相貌！\n我們一般人都是「跟著感覺走」，這是我們一個很嚴重的盲點！\n\n\n\n宗喀巴大師說：釋迦牟尼佛多生多劫布施…祂蓋了這麼多的七寶塔，現在有哪一個存在？ 全部不存在了嘛！但是為什麼釋迦牟尼佛「布施度」是圓滿呢？因為祂的布施是「安住在內 心─一念心性」--借假修真。\n\n先求「安住」─你要把心帶回家，所有的功德都是從你內心生起的。 你的內心本來具足無量的功德，但是你要假借布施的因緣，來開顯你布施的功德，是「借事 修心」！\n\n\n「三世因果」是互動的，所以你要注意你的來生，你就先要注意「你現在起什麼念頭」\n\n\n以《楞嚴經》它的重點有兩個：\n第一個是「安住當下」，第二個「開創 未來」。你只有安住當下，那你就偏空，就跟阿羅漢一樣，阿羅漢他也不管未來的，他來生 就到無生的涅槃去了，他是厭惡生命的。大乘佛法認為生命沒有錯，生命哪有錯呢！五陰身 心沒有錯，錯在你的妄想，你把妄想拿掉就好了。\n極樂世界也是有生命現象，它也是有一個 感受、有一個想法，只是這個想法是清淨的想法如此而已\n\n你依止「生滅」的因地，怎麼可能創造出「不生滅」的果呢？\n\n \n\n\n\n每一生都攀緣，你看你現在得到什麼？什麼都沒得到，除了生老病死，得 到什麼？對不對！我們是不是應該換一個新的生命？『迴光返照」』，聽佛陀的開示改變自 己。修行不能強迫自己：「欸，你不可以怎麼樣…」反彈得更厲害；不能用壓抑式的修行， 要用道理來說服自己。所以為什麼要讀經典？就是：「你用佛陀的教理跟自己溝通，跟過去的你溝通。」\n\n\n\n佛陀說：「怎麼不算『見』呢？」佛陀說：『諸盲無眼，唯觀黑暗』\n阿難尊者回答說：「暗室中的人看到黑暗，跟眼根敗壞的人看到的黑暗，是完全沒有差 別的。\n\n古人常說：「真妄不隔一條線。」\n\n「生滅心」有二個很大的過失\n1.\t你不得自在\n2.\t不得圓滿\n\n三界無安，猶如火宅，眾苦充滿，甚可怖畏。\n\n\n「生死的業力」，從什麼地方來？就是從我們的「攀緣心」\n\n蕅益大師註解說：\n「灰塵」我們一般看不到，你看我們現在也是看不到灰塵，但 是你要有陽光照進來，你才看得到灰塵。也就是說，你一個人不肯迴光返照，\n「欸，我也沒 妄想啊！」「你不是沒有妄想，你是跟妄想打成一片，當然就感覺不出有妄想。」\n《楞嚴經》的意思是說：我們的心像一面鏡子「本來無一物」，但是你有所住，你就產生灰塵；住久了，你整個心就被灰塵蓋住了\n\n\n大乘佛法認為煩惱本來就是「真如」的一部份，它迷了，才變成煩惱，悟了就 是真如，你不能斷它的。大乘佛法是「無住」，小乘佛法叫「斷滅」\n\n第一個、你選擇住在感受跟想法--生死凡夫，那未來有無量無邊的生死等著你。 \n第二個、你把灰塵全部弄乾淨--小乘的行者。 \n第三個、你不要去管灰塵，你只要不隨妄轉，安住在虛空—這是大乘行者。\n「灰塵」在那個地方，我們選擇「虛空」，我們不一定要選擇灰塵；灰塵要不要出現， 我們沒有決定權，但是我們選擇安住在灰塵或安住在虛空，這一部分是我們做主的。\n\n\n\n依止「生滅心」的修學，永遠是跟著感覺走，就是你的心是「借」來的，沒有一個真正你自 己的東西，你都是借來的，臨命終的時候都要歸還啊！\n\n「破妄」，不是要你不打妄想，而是要你不住在妄想，破除對妄想的執著！\n\n\n「五陰」的重點有兩部分：第一個是你的感受，另一個是你的想像。\n\n\n\n我往生了，那我這個色身跑哪裡 去了呢？就跑到「本來無一物」的地方去了。它從本來無一物而來，也回到本來無一物，等待下一個業力成熟，又創造一個因緣的假相，這就是我們對色身的觀察，所謂的：即空、即 假、即中。\n\n我個人體驗很深的一件事情：我出家二十二年，我除了在外面講經，大部分時間都留在 僧團，我就看…一個人發心出家了、又走了，來來去去看了幾百個。你看一個僧團，大家住 同樣的房子、穿同樣的僧服、吃同樣的飯菜，有些人整天是愁眉苦臉，有些人內心充滿了快樂，\n\n一個人不能自我反省「迴光返照」，那你就沒有一個美好的來生，你今生就空過了！\n\n感受是沒有相狀的，快樂或痛苦是一種直覺的感受；但是當想陰 開始去攀緣一個相狀時，他心中肯定有一個相狀，可能是我相、人相、眾生相、壽者相等等， 有各式各樣的相狀。在這個相狀裡面，開始「施設名言」：這個名言就是「分別」，產生善良 的分別、邪惡的分別。 總之，所謂的「想像」，首先它會捏造一個相狀出來，其次它會這個相上不斷的分別， 然後開始準備造業\n\n你要永遠記住：我們是生長在一個有漏的、有殘缺的世界。這世界充滿了安樂，但是也充 滿了痛苦，這一部份你改變不了，但是你可以選擇用什麼樣的想像來面對。\n「業」的成就，要有三個條件：\n1.\t意樂\n2.\t加行\n3.\t究竟\n\n \n「空觀」：是照了心性「不變之體」(清淨的本體)\n「假觀」：是照了心性「隨緣之用」(它是循業發現：你造了五戒十善的業，去熏習你的一念心性，它就表現人天的果報)\n\n「中觀」：是「空有同時、空有無礙」；我們的心性，不但是清淨本然，同時也 是循業發現；你要把「清淨本然」跟「循業發現」這兩句話變成一句話，合在一起觀察，就 是所謂的「即空、即假、即中」。\n(它是清淨本然、本來無一物，但同時又有很多的假名、假 相、假用；雖然有很多的假名、假相、假用，又同時是清淨本然，彼此不障礙，這就是我們 對五陰身心的一個了解。)\n\n\n《楞嚴經》只告訴你：不要「住」在妄想，沒有要你去「斷」妄想！\n\n\n以一個學佛的人，內心有兩個你，個是「過去」的想法，一個是「現在」的想法，有時候兩個觀點，經常是互相矛盾的，「真 妄交攻」。\n\n當你的「心態」改變時，你的「果報」就改變了\n\n\n他是在人群塵勞的世界，去 跟人家助念、參加義工，他大部分的時間是跟眾生打成一片。\n當然這個也沒什麼好、壞，人 生就是你的抉擇。\n這種菩薩在成佛過程當中，是先成就「福報」再成就「聖道」。\n 智增上菩薩，他的生命時間，大部分是在佛堂用功，或者是去打佛七、去聽經。因為他 偏重在「上求佛道」。\n\n我們經常講：「上求下化」，其實在修學過程當中，都是有所偏重的， 能夠兩方面都兼顧到，而且具足，不太可能。智增上的菩薩，是先成就「聖道」，再成就「福 報」。 \n\n總之，緣眾生相也好，緣佛道也好，只要發起了菩提心，你就是一個菩薩，就有菩薩的 『戒體』了。\n\n雖作惡業，速疾能悔。「雖墮惡趣，終不久留。」發了菩提心的人，即便這個菩薩由於過去的罪 業，墮落到畜生道、餓鬼道、地獄道，他很快就會跳脫出來。懺公師父常講一句話：「發菩 提心，逍遙自在。」當一個人發了心之後，你的「業」就改變了，你那個重大的業力，就被 破壞了；真正發心的人，即便墮三惡道，也是很快就出來。\n\n\n你所有的動力，都要依止「無相的清淨心」才能夠堅固！\n\n修「首楞嚴王三昧」(楞嚴經)最大的特點，就是你可以成就平時的自在與正念；你也可以得到臨終的 自在與正念。因為很多外在的環境，是你沒辦法決定的，但是你可以決定：你「不住」在這上面。\n\n\n『調伏』，是講『旋轉』；『旋轉』就是「轉識成智」─把「妄想」轉成「真 如」，使令這個生滅虛妄的心，不再生起，恢復我們本有的清淨覺性，才能夠成就本來光明、本 來覺悟的不生滅心；然後依此來當作我們「因地的發心」，圓成不生滅的果地功德！\n\n\n個「自受用」跟「他受用」的關鍵，就是在於：安住現前一念心性，成就自利利 他的功德。從這裡我們可以知道：就以我們的程度來說，現在還談不上斷煩惱；你現在去斷 煩惱，會傷害到你的「覺性」，弄到最後你自己發不起菩提心。\n\n\n自知我是未成之佛，諸佛是已成之佛，其體無別。」原來我本來具有無 量無邊的功德，那種覺性、功能德用的體性，並沒有喪失。直下承當，而且沒有任何的疑惑。 好比：『知冰即水』，雖然它現在是冰，但是知道總有一天可以變成水。\n\n\n\n耳根圓通─對愛取是全盤的消滅。 \n念佛圓通─是有所消滅、有所保留；它消滅的是對三界的愛取，但是它保留對淨土的愛取 -- 「厭離娑婆，欣求極樂。」\n\n\n蕅益大師說：我們六根果然是有『賊』\n「六塵」這種五欲塵境，叫做「外賊」，但是「外賊」它不能進入到「六根」，一 定要有「內賊」；內賊把門打開，外賊才能進來，「色不迷人，人自迷」；所以你要不是「內 賊」通「外賊」的話，你的珍寶不會失掉，關鍵在「內賊」。我們今天產生過失，不要去怪 外境，如果內賊不把門打開，外賊是進不來的。\n\n\n修行，完全是自我反省、自我調伏的問題，外境只是一個歷緣對境的「所緣境」。\n\n「眼根」，特別是密宗，很重視眼根圓通，你看密宗它的唐卡、壇城，所以密宗道 場特別莊嚴；他的眼根接觸壇城的時候，能夠幫他迴光返照，它是一種表法。 \n\n第二、念佛法門重視「耳根」，聽聲音，本經也重視耳根。 \n\n第三、如果你是天台宗，觀照現前一念心性─即空、即假、即中，是重視「意根」，在一 念心性當中起觀。\n\n\n它有一時的「假名、假相、假用」這也不能否定， 佛法是不壞假名、不壞假相，只要求你不要去執著。\n\n當你入「假觀」的時候，就有凡 夫、跟聖人的路，入「空觀」是離一切相的，那麼「假觀」當然就有因緣果報的差別\n\n\n讚歎「耳根」--「耳根圓通」。\n耳根在我們六根當中，印光大師講到它有兩個特色：\n第一、\t耳根容易攝心\n第二、\t耳根最能夠養神。\n\n\n\n自心取自心，非幻成幻法。 不取無非幻，非幻尚不生，幻法云何立？\n\n祖師常說：「念佛是誰？拜佛是誰？」所有的佛號，都是你那一念心 去推動的，所以「心是業主」，你那個明了的心是造業的根本，那個造業的根本是顛倒的， 一切法就是顛倒的。\n所以在整個修行當中，了解我們內心的世界，非常的重要\n\n\n只要是「妄想」在活動，它一定是帶有「相狀」，而且也一定是「住」在這個相狀。\n\n當妄想生起的時候，不是「馬上對治」，是先「脫離妄想」\n1.\t達妄本空\n2.\t緣生緣滅\n\n\n\n莊子在他的書中，講到一個類似的公案，這跟「無住」有一點類似：他說有一個人，他特別討厭他身上的影子跟腳步，他看到他的影子、看到他的腳步，就很生氣、就很痛苦。\n\n那怎麼辦呢？他採取的方法就是一直跑，結果越跑、腳步越多，影子跟著越緊，最後力竭身亡， 身體沒有力量就死掉了。莊子說：你不要這要做，你可以跑到一棵大樹下，就在樹蔭底下一個石頭上，安安靜靜的坐著、舒舒服服的躺著…腳步自然消失了，影子也沒有了。\n\n不為物轉，則能轉物，即同如來。\n一個人「不動念頭」是最大的力量，「無念」是全世界最大的力量！\n\n外在的世界就構成對立了。 要消滅「對立」，不是從外面去消滅，是從內心！\n\n\n『動』是一個假相，你要住在這個「動」，你就心隨境轉！\n1.\t這樣的一個身心「動相」，它根本沒有源頭；我們本來就沒有這個「動相」，所以來 無所從，去無所至，只就是一個因緣和合暫時的假相，如此而已。\n2.\t為什麼有眾生？為什麼有世界呢？因為我們心中不斷在『動』，更麻煩的是，我們住在 這個動當中，所以造成了生命的相續。\n3.\t前生「動」就創造一個假相，我們又住在這個假相，然後又開始「動」，往好的地方動，來生就安樂一點；往不好的地方動，來生就痛苦。\n4.\t我們都是住在自己心中的那一念妄想中！\n5.\t「生命」就是「我們心在動」；「動」沒有錯，問題是你要把這「動」引導到極樂世界、引 導到萬德莊嚴，往這個方向動才對。\n\n\n你住在一種「道理」的思惟，這個相狀就變成一種增上的力量； 你住在「事相」，就變成一種障礙。\n\n\n我們生命的每一個事情，都不是你生命的全體，只是生命的一部分，乃至於你今生，也只是你無量心性當中的一小部分而已。\n你為什麼一定要把它看那麼重呢？你今生只是 一個心性當中的一個小水泡，一個大海中的小水泡，如此而已。\n當然你好好利用這個水泡， 會給你帶來很大的功德；但是你要住在上面，那你就是一個小水泡。你要無所住，這個水泡才有很大的作用，它可以把你帶到極樂世界去。\n\n以淨土宗來說，帶業往生，你把「想陰」消滅了，你就可以達到臨終的正念，不一定要破壞「行陰」。\n\n當然聖道門這五關都得要破，但 是以淨土宗的角度，你只要把貪戀娑婆的想法放下，就可以了。所以淨土宗它是帶業往生， 它是不斷惑的。淨土宗要你把外境放下、把感受放下、把心中對娑婆世界的貪戀放下，然後 再提起佛號，基本上你臨終正念分明是可以做到的。\n\n我們不是「斷」煩惱，我們是在「轉」煩惱。\n\n蕅益大師說：沒有一個人可以進入到「你心中的妄想」，把你帶出來！誰有那個力量？\n\n若眾生心，憶佛念佛，現前當來，必定見佛，去佛不遠，不假方便，自得心開。 如染香人，身有香氣，此則名曰香光莊嚴。\n\n\n你不創造聲音，你的所緣境變成第六意識的「法塵」。\n 念「法塵」跟念「音聲」有什麼差別？\n\n你用心去憶念法塵， 你所耗損的精神體力，是聽音聲的好幾倍，這是非常辛苦，入道多辛苦！\n\n所以念佛人，你最 基本的條件，你嘴巴一定要振動，即便輕微的振動都可以，『金剛持』，聲音在唇齒之間， 你嘴巴只要有微微的振動，它就是一個「聲相」；\n\n你嘴巴完全不動，那就變成法塵，那就很 難抓住佛號。淨土法門是你要跟著你的音聲走，創造一個音聲→然後再聽回去→然後再創造 一個音聲→再聽回去\n\n淨土宗的修學次第要注意：是以「觀照力」來引導「專注力」！\n\n那個無量的生死輪迴，所造的罪業是無量無邊的。以相上世界來說\n\n \n\n我告訴大家一個事實：你在娑婆世界很用功的修行，頂多保持原狀。因為這個大環境是 眾人皆醉，你不可能一個人獨醒的！我們的心有所住，你住在環境，它對你就產生干擾，除 非你是完全無住。\n求生淨土的人就是：不要高估你自己，不要被你一時的善業、 表面的太平盛世假相，產生迷惑顛倒！\n\n\n什麼是『道場』呢？就是「持戒」跟「誦咒」。持戒，是破除我們內在的障礙，破除我們 無始的煩惱障；誦咒，是破除外障，就是鬼神障；也就是透過持戒跟誦咒，來遠諸魔事，成 就菩提心的不退轉。\n\n\n「種子不淨」，我們的色身怎麼洗，都洗不乾淨呢？因為他一開始就不 乾淨，他整個色身的生起，就是一念染污的心，『恩愛迷情』跟染污的色法『父精母血』的 結合，本質就是不淨。\n\n一、\t外表相狀的不淨：『膿血交相潤，臭穢常無盡。\n二、\t內相的不淨：『饒你會莊矜，畫囊盛糞』\n三、\t、死後的不淨：『一旦神離，不復堪親近』。\n\n一個修行人，不要把一個將爛而暫時還沒有爛的骷髏，當真啊！這個色身只是「借假修 真」，你不要花太多精神、體力去經營這個色身，因為它總有一天會腐爛的…不管你怎麼弄， 它只會往「老、病、死」這個白骨的方向走，這是不可能改變的！\n\n\n其心不婬』，不是說你不起婬欲，而是你已經安住在真實的心性，但是煩惱不斷的活 動，你也不斷的抗拒，有時候成功，有時候失敗，不斷的懺悔，你還是走在佛道當中，因為 你的根本是菩提。\n\n\n『上品之人，為大力鬼王』：有福德的叫『神』，沒有福德叫『鬼』，其實都是鬼類， 只是福德不同。這個人有福德力，又有少分的智慧，因為瞋心重，就變成大力鬼王，變某某 大帝、某某國王等等；『中品的是飛行羅剎』：他能夠飛行，比方說城隍、土地尊神、山神 等等，他們在地上是可以飛行的，還有諸鬼帥、某某大將軍等等；下品的就是不能飛行的、 在地上跑的，羅剎當然是吃眾生肉的，這些鬼神也都有他相應的徒子徒孫，而且都是邪知邪見，認為自己成就無上道。 前面的貪愛心，是落入『魔道』；這個瞋心重的，是落入『神道』。比方說我們過去很 多的戰場上的英雄，很容易墮入神道，神道的根本就是「瞋」。\n\n\n\n一旦犯到這兩個重點，這個人就不是善知識了\n第一、「自我膨脹」─妄談自己個人的修證\n第二、「顛倒說法」─法說非法、非法說法\n\n「法師」的責任就是：弘護正法，開人智慧，開啟他人心中的光明。\n\n菩薩來到人世間，假借暫時的生命，來「積功累德」做最後的衝刺，從今以後要解脫生死─ 「示一往還，去已無返。\n\n你無法不發脾氣，因為修養不好，但是你不能讓「瞋心」在你心中不斷的停留！\n\n旦他現出善知識的相貌，這個菩薩的作風就要很謹慎--持戒、修定、修 慧、宣揚佛法。\n比方說：濟顛和尚，事後證明他 是菩薩示現，他示現喝酒、吃肉。但只要是逆向操作的菩薩，示現之後，他最後的果報，就 不太好。因為菩薩示現是為什麼？「教化眾生」！我們不能夠讓眾生說：我喝酒吃肉，最後 還是沒事，那這樣他來人世間是為什麼呢？他的目的就是：稱讚佛乘。所以菩薩可以廣開方但是他的目的只有一個：「開方便門，示真實相」，讓大家了解因緣果報的道理。 換句話說：這個菩薩來到人世間，他表演了一手，不管是現出好的相狀，或是壞的相狀， 他的目的只有一個：就是讓你看到他的相狀之後，讓你產生「滅惡生善」的效果，甚至於能 夠入理，明白道理，這樣他的示現就成功了。 所以說：『稱讚佛乘』，為什麼要現出「婬男婬女」的相狀呢？不是現「善知識」就好 了嗎？因為你要讓眾生歡喜心，是為了恆順眾生。\n\n對一個初學者，你隨便的妄談果證，這就 有問題了，什麼問題呢？其實每一個眾生，會跟哪一個菩薩結緣，這個因緣都注定好了，就 像釋迦牟尼佛的弟子，舍利弗尊者、目犍連尊者…跟祂好幾生、好幾世了\n\n\n你的師父是某某示現，大家就不再重視佛法的修學，開始擾亂眾生的心思了，對佛教 的修學次第，整個打亂，擾亂佛法沒有好處！所以絕對不要談個人的果證，一定要記住！\n\n\n菩薩道要進步，你在大眾當中，不要站「太高的位子」，對你不好！一個人的進步來自 於增上慚愧，如果你的生命真的想要積功累德、成就聖道、成就往生的善根，不要居在高位， 那是很不得已的事！因為高位沒辦法積聚能量；你看：所有的能量是往「低處」！所以站在高 位，那是真的不得已的事，這個人是犧牲；沒辦法，沒人要站，那你就自己要修觀了。\n\n持咒，為什麼叫『心咒』呢？它有秘密的「開顯真如本性」的功德，叫做 『心咒』。\n\n研究《楞嚴經》的人，雖然你還有很多煩惱沒有對治，還有很多的罪業沒有懺，但他不 會緊張，安住在「不生滅心」。觀察生滅心中，有很多如夢如幻的影像，我只要不隨妄轉， 最起碼我可以做到帶業往生，我能夠正念分明，我能夠不隨妄轉。\n\n楞嚴咒\n\n『楞嚴咒』它的破障功德，來自於「一一光明」缺一不可。你看『楞嚴咒』，你把它放 在錄音機播放，對錄音機沒什麼效果，錄音機它沒有明了性嘛！為什麼『楞嚴咒』一定要用 我們的「心」去持它呢？因為我們的「心」才有這個修德；你發了「菩提心」，用菩提心去受持『楞嚴咒』，你才能夠從修德的光明，去啟動『楞嚴咒』裡面性德的光明；你用錄音機 播放的話，對錄音機有什麼功德呢？少了光明，錄音機沒有明了性；除非你播放錄音機，聽 到的人，他能夠產生憶念，那這個就有效果了。意思是說：你那個修德的心念，跟咒語接觸 的時候，我們內心當中，本身要放出一道光明，《楞嚴咒》本身也是一道光明，兩個光明一 接觸，「心力」跟「咒力」結合，就『皆徧示現十恆河沙金剛密迹，擎山持杵，徧虛空界』， 產生一種滅惡生善的效果。\n\n\n什麼是「咒語」？它就是一個「密詮心性」。 古德說：一般持咒會產生一種不思議的熏習，它有三種的功德力；也就是說，當咒語在 我們身口意運轉的時候，會產生三種不可思議的熏習力量： \n第一個、「理法力」：因為每一個咒語，都含攝無量的妙理，所以它能夠念念之間，開顯 我們眾生本具的一念心性；當你在持咒的時候，你的妄想很自然就會淡薄，你的善根很自然 就會慢慢的增長，因為在它的音聲當中，它含攝了無量的妙理。 \n第二個、「威法力」：在咒語當中，有很多很多佛菩薩跟金剛藏王的聖號，諸佛菩薩的名 號都在裡面，所以你在誦持的時候，能夠感通十方諸佛的加持。前面的「理法力」是偏重在 開顯你內心的善根，這個「威法力」就是向外感通十方諸佛菩薩的加持，產生本尊相應，有滅惡生善的效果。 \n\n第三個、「實語力」：真實的語言。古德說：什麼叫「實語力」呢？一切咒語都是如來秘 密的語言。我們凡夫的語言，是自己打妄想講出來的；諸佛菩薩的語言叫做「咒願力」。諸 佛菩薩在因地的時候，祂的咒願─把祂自己的善根跟福德，完全迴向給眾生；但是眾生要得 到佛菩薩的加持，他必須要有一個東西來含攝，所以佛菩薩就把祂的咒願力，放在「咒語」 當中。 整個「咒語」就代表諸佛菩薩的「咒願」，當你的心跟咒語接觸的時候，你能夠得到諸佛 菩薩的祝福跟咒願。 一個人，一旦有了禪定，他的咒願力就不可思議了，不要說是佛陀，在經論上說：一個 初禪以上的人，他如果咒願某一個人要死掉，這個人一定會死掉，初禪以上就可以了；你要 刺激到他的話，他起惡念咒願你，他可以把你的生命消滅掉。當然諸佛菩薩更不可思議了， 法身的三昧，祂不斷的咒願一切的眾生離苦得樂，\n所以我們在受持『楞嚴神咒』的時候，能 夠去感通十方諸菩薩的咒願，這個叫做「實語力」。有這三種力量：開顯善根，滅惡生善， 離苦得樂。\n\n\n楞嚴咒，總共有四百二十七句，北宋的長水大師，我們尊稱他為『楞嚴大師』。他 的說法是：前面的偈頌主要是對「三寶的皈依」，他認為最末從『唵』開始這八句，才是諸 佛菩薩真正的秘密的語言，這個說法圓瑛老法師是認同的。我們過去在佛學院的時候，我的 恩師上慧下天長老，他的說法也是這樣，從「唵」開始才是『咒心』；我們一般說『摩訶悉怛 多般怛囉』，這個是咒的名稱，「大白傘蓋」是它的名稱，它的咒心是從『唵』開始，共有 八句； \n\n\n十方諸佛要仰仗『楞嚴咒』之門，而得以拔濟 群苦；諸佛菩薩內心當中無量的咒願，祂希望一切眾生能夠離苦得樂，但是祂怎麼辦呢？祂 把這樣的咒願力，就放在咒語當中，讓眾生持誦『楞嚴咒』的時候，能夠跟十方諸佛的咒願 力感應道交。\n \n蕅益大師對於「消除業障」有他的看法，他說：受持『楞嚴神咒』的人，主要有兩種情況：\n\n第一種人，他能夠佛前發露「永斷相續」：這個人他在受持之前，他生起了慚愧心，把 他過去的罪業，完全發露出來，而且發願永不再造作；這個人以永斷相續的慚愧心，來受持 『楞嚴神咒』，是「滅除罪障、善根增長」，他肯定可以滅罪，就像前面說的：『無問輕重， 一時銷滅』。 \n\n第二種人，是雖知持咒，仍犯前愆」：他受持神咒，但是他的過失，還是不斷的出現， 這時候「厥罪不滅，但有遠益」，這個人罪沒辦法消除，但是對未來種下一個深厚的善根。 『遠益』就是對長遠來說，他來生是有好處，但是今生得不到滅罪的效果，因為沒有起慚愧 心。 我們要知道：所有的「咒語」也好、「名號」也好，你要用「覺悟的心」來受持，才有效果！ 我們看：「佛者，覺也！」諸佛菩薩的功德，一定要以覺悟的心來做基礎，如果以顛倒 的心去受持神咒，今生很難有效果，只是對來生產生效果，所以蕅益大師說：「雖知持咒， 仍犯前愆，厥罪不滅，但有遠益。\n\n\n\n我們一生有兩個沒辦法作假，第一個「夢中」， \n第二個「臨命終」；你平常可以作假，夢中你是什麼樣就呈現怎麼樣，完全是內心的顯現， 所以這個夢中的好相一出現，就是罪滅了。\n\n在整個破妄顯真的過程，有兩種方法：第一個是用「止觀」的方式，就是我們遇境逢緣 「迴光返照，正念真如」，透過一種思唯、觀照的方式，慢慢的消滅我們的顛倒想，慢慢的 把我們真如的功德開顯出來。第二個方法是「持咒」，這就完全不能思唯，你就是完全聆聽 你的音聲，音聲在你的身口意當中運轉，也可以達到異曲同工的效果，也能夠破妄顯真。\n\n\n一個人經常持『楞嚴咒心』，你發覺你的心態會變化，會比較淡薄，這就是「隨順真如」！\n\n假設持咒之人，又能夠具足「理觀」，則「堪與阿難並驅」。阿難尊者他現生成就 圓教初信位，所以他的發願文：『妙湛總持不動尊，首楞嚴王世稀有，銷我億劫顛倒想，不 歷僧祇獲法身。』他證到的法身是什麼階位？「圓教初信」的法身。所以，如果一個人能夠 具足理觀，一方面了解：「達妄本空，知真本有」，然後又持『楞嚴咒』，那除了消業障以 外，還有轉凡成聖之功，有這種功德\n\n\n\n是故眾生，心憶珍羞，口中水出；心憶前人，或憐或恨，目中淚盈；貪求財 寶，心發愛涎，舉體光潤；心著行婬，男女二根自然流液。\n\n有的貪財、貪色、貪飲食…但是能 貪的水是相同的，而『水』是下墜不昇的，所以叫做「內分」。『水』所表達的就是往低處 流。\n\n\n\n如果你一天當中， 總覺得內心很沉重，這是一種罪業之相；但是經過你不斷的拜懺，欸…身心就覺得很輕鬆飛舉，這個就是罪滅之相。\n\n求生淨土的人，雖然你不能把「業」懺得完全清淨，但是你一定要懺到變成「不增長業」！\n\n你的「業力」是從什麼地方來呢？還是你「心」創造的；心生則種種法生，心滅則種種法滅。\n\n在我們的菩薩道，你的根本是菩提心；對菩提心最大傷害的，就是「瞋心」！\n\n\n圓瑛老法師說：什麼叫「帶業往生」呢？「有因無緣，苦果不生」這八個字。\n\n六道輪迴是你一念的妄想心創造出來的，既然是妄想創造出來的\n流轉三界中，是誰在流轉？「一念妄想」在流轉。\n\n第一、「境由心生」：\n外在的世界，是你內心創造的，當你內心開始變化，你來生的果報 也在你的止觀當中，開始起了變化。這些變化，十方諸佛菩薩是隨喜讚歎，但是你過去的冤 親債主跟魔王，就非常不高興了。 \n\n第二、「邪正不兩立」：\n魔王的心是貪愛三界，是一種邪惡的念頭；修學三昧的心是一種 正念、菩提性的。一個是輪迴性，一個是菩提性，這兩個是互相干擾、互相衝突的。\n\n只要你自己不要亂，這個世界就亂不了\n佛教的功德─沒有一個是「求來的」，都是「修來的」！\n你去修，\n你不要，它也會給你\n；你去求，你什麼都沒有。\n\n我們凡夫這一念心跟外境接觸的時候，\n只相信我們心中的「影像」，卻不相信我們內心清淨 的本質。\n\n\n法性等虛空，眾生發心小。我們一定要有來生的想像，跟眾生的想像，你來生才會有大 功德出現。\n\n怎樣修「止觀」呢？跟過去的你溝通！\n《楞嚴經》的重點，只有一句話，就是：讓你把心帶回家。\n\n\n\n阿難！若有眾生，能誦此經，能持此咒，如我廣說，窮劫不盡，依我教言， 如教行道，直至菩提，無復魔業。」\n\n「殊不能知生滅去來，本如來藏，常住妙明，不動周圓，妙真如性；性真常中， 求於去來、迷悟、生死，了無所得！」\n\n從本來無一物的角度，來建立你的斷惡、修善、度眾生。\n\n佛陀遠離了向外攀緣，祂選擇了向內安住，所以把真如的功德 表現出來。真如有無量的功德；所以智者大師說：「性具」，我們這一念心本具善惡的潛能， 你用迷惑顛倒的心來面對你的本來面目，你啟動的是「流轉門」；你用覺悟的心來面對你的心性，你啟動的是「還滅門」。這是很公平的─ --","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188099","master":"印光大師","title":"印光大師文抄菁華錄","youtube":"","images":[],"tags":[],"content":"持咒\n持咒一法，只可作助行。\n不可將念佛為兼帶，而以持咒作為正行。\n（但須主助分明，則助亦歸主。則文鈔正編復永嘉某居士書一。）\n持咒法門，雖然也是不可思議，但是凡夫往生，全在信願真切，\n與彌陀宏誓大願，感應道交，而蒙佛接引。若不知此意，雖則法法頭頭，\n都不可思議，隨修何法，都無不可，只怕到最後，\n便成了「無禪無淨土，鐵床並銅柱，萬劫與千生，沒個人依怙」。\n\n謗佛\n那些謗佛的人，並非謗佛，都是自己在誹謗自己。因為他的一念心性，全體是佛，佛之所以有種種的說法教化，只是希望他們能夠捨迷歸悟，親證自己本具的佛性罷了。\n\n論中陰\n須知眾生業力不可思議，如淨業已成者，身未亡，神卻早現於淨土。惡業深重的，人還臥病於床，神嬰已到幽冥受罰。命雖未盡，神識卻已經投生去了，等到將要生時，識才將全分的心附在胎體中。\n\n論外道\n最初先修「四念處觀」。一、觀身不淨；二、觀受是苦；三、觀心無常；四、觀法無我。既然知道身，受，心，法，全屬幻妄，覺悟此身苦空無常，無我不淨，則真如妙性，自然可以顯現了。\n\n\n\n以識神分別用事\n若大通家，則禪淨雙修，而必以淨土為主。若普通人，則也不必讓他普遍研究深經奧論，只要讓他諸惡莫作，眾善奉行，一心念佛，求生西方就可以了。不廢居家事業，兼修出世間法，雖似平常無奇，而其利益不可思議。愚夫愚婦，雖然愚昧，不明理，但能老實念佛，也能潛通佛智，暗合道妙。與總是私自推測思量佛智，整天都在以識神分別用事的所謂大通家相比，那麼愚夫愚婦所獲利益更多。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188098","master":"生如法師","title":"楞嚴經奧義摘要 生如法師","youtube":"","images":[],"tags":["楞嚴經"],"content":"後腦處二次成的像叫作影子，我們看見和了別的都是影子，覺得這個影子就是外邊的實物，因為和外邊\n實物一模一樣，看不出是虛幻出來的，於是我們所有人就把影子當作真實的，認為自己看見的是真實東西，從來不懷疑自己所見是否是真實的，因此而生起貪執，就被拘束在六道輪回裡受苦無量。其實每個眾生看見的都是真實物的那個影子，因為是通過眼根的二次成像形成的，這些在初中物理學上都講了。\n\n識心不在根裡，同理可證，耳識不在耳根裡，鼻識不在鼻根裡，舌識不在舌根裡，身識不在身根裡，意識不在意根裡。這幾個識怎麼破呢？來個反證吧，如果耳識在耳根裡，肯定能聽見耳根裡的聲音，耳根裡有什麼聲音呢？耳根聽聲音時鼓膜要震動才有聲音，如果耳識潛藏在耳根裡，聽見聲音的同時我們應該也能聽見鼓膜震動的聲音，可是我們卻聽不見耳根鼓膜振動的聲音，只能聽到外界的聲音，那就說明耳識不在耳根內。\n\n佛說如果眼根能看見的話，你在房間裡，門能看見嗎？如果門能看見，那些已經死了還有眼睛存在的人，應該都能看見物。如果死人眼睛能看見物，那什麼叫作死亡？\n\n阿難比喻為意根第七識，把佛比喻為如來藏根本心、大智慧之心，第七識隨著如來藏才能有自己的見，如來藏能見什麼，第七識意根隨著如來藏也能見什麼，但是見的法實質和程度不同，結果就截然不同。因為如來藏是大智慧之心，沒有無明，祂不僅能見一切法，而且能徹法底源；而第七識意根因為有無明，就有顛倒見，不能見諸法實相。佛與阿難也是如此，佛是三界之尊，有究竟無上的大智慧，阿難無明俱在，只是聲聞初果人，他以初果人的身份，作為佛的侍者，乘佛威力，隨佛到世界各處，天上地下無有阻礙，到佛所到，見佛所見，就是不能到佛的大智慧境界。\n\n第七處征心—一切無著名之為心\n說明六識沒有處所，來無所來，去無所去，幻化虛妄不實，依他起，無自性。現在雖然有這樣正確的認識，可是還不是實際證得。要想實際證得，就要在甚深的禪定當中，動用意根仔細的深思參究，理路思路清晰了，證據確鑿了，所有的疑都斷除了，意識與意根都沒有任何疑惑，就是實證。\n第一種顛倒，眾生把無我當作我\n第二種顛倒，把無常當作常\n第三種顛倒，是把不淨當作淨\n第四種顛倒，是把苦當作樂\n\n從無始劫以來眾生都有一個真實的菩提心，也叫涅槃心\n落入六道生死輪回的原因是什麼，佛已經講了，是由不知兩種根本造成的。第一種根本就是把妄心當成真心；第二種根本就是本來自己都有一個真實的心，能明瞭一切法的本明心，可眾生不知道，遺失了，沒有證得祂，沒有找到祂，於是仍然在生死輪回當中不能出離。\n而六識的見性不能與如來藏的見性相提並論，也不能像見六塵境那樣見如來藏的見性。但六識的見性是假見，真見和實質的見還是如來藏的見性，就像皮影戲，你所見的都是假相，實質都是幕後人所為。所以不要再把六識的見當真見，真見不見六塵境界。\n\n眾生不見自己佛性的妙用，只是妄見山河大地、國土世間真實的存在，只看見這些境界，因此叫作妄見。其實真正的見是如來藏的見，不見境界的這個見才是真實的見。\n用眼睛觀看到的山河國土，以及眾生，都是無始劫以來的見病所形成的。\n\n因為眾生心有無明，所以皆即見眚，所見就有過患。有見病，就會看見世間一切的妄相，所見得的一切相全部是虛妄的，眾生之見都是妄見。即使看見了佛，也是妄見，因為佛的五蘊身也屬於六塵境界當中的一個相，所以看佛的時候，見到佛的五蘊相也是妄見。不妄見的時候，就會見自己的佛性，不是只看到佛的五蘊身。\n\n一切法除了如來藏，其他都是虛妄的，所以佛說叫作妄見，不管是別業妄見還是同分妄見，都是妄見，我們所見的都是大腦勝義根裡的假相。比如說在某一個城鎮裡發生了地震，發生了火災，這個算別業，也算共業。不管是別業還是共業，外相分是有的。外界的火著起來，外界的地發生震裂，地震和火災都是眾生外界的現象，也就是外身，但是眾生六識所見的都是依外界而有的內界內身。眾生感到地震，看見火災，甚至殃及到自己，這些能夠覺知到的都是內相分，是依著外相分而顯現出來的。外相分、內相分、共業、別業，全在如來藏裡，都是如來藏所幻化的。\n\n意根如果能忍可就是實證，完全徹底的實證就成佛了。想一想很容易，做起來需要三大阿僧祇劫，非常不容易。長伸兩腳臥，事事不關心。為什麼這麼悠閒？一切法與我無關，也沒有什麼我，萬法安閒，我也安閒。世間有什麼可鬧騰的？\n\n意根是六根中的一根，與法塵的勞觸相是行蘊，都是菩提所顯發出來的虛妄相。身體疲倦了，意根就會安排睡覺，意識滅去；休息好就醒過來，意識出現起覺知性。意根攀緣塵境，意識就會憶念，憶念不出來就是忘記了，叫作失憶。這種意識的覺知性是由於睡覺睡醒和生滅這兩種塵相出現的，睡著後意根不攬塵相時，意識滅去，意根攬塵相時，意識出現醒過來。其中意根是顛倒的，不斷的攀緣於塵相，當作真實，讓意識生生滅滅向外覺知一切法相，從不覺知這些法相的根源處，如果沒有睡著清醒與生滅這兩種虛妄的塵境，也就沒有意識的覺知性。向心外覓法是逆法流，心內尋覓順法流才能知道法源，從而悟道。\n\n無形無相的四大種子，組成了最最微小的微粒，微粒再聚集，組成了稍微大一點點的微粒，然後四大種子不斷組成微粒，微粒不斷的聚集在一起，最終形成了肉眼能看得見的物質色法。從無到有，從空的無形的種子，到有形的最最微小的微粒，這本身就是非常神奇的，就像魔幻一樣，所以才說如來藏就是魔幻師。 原來都是如來藏自己在玩，自己在搞遊戲，自己魔幻給自己看的，自娛自樂。\n一切法都沒有出如來藏之外，所以無生，也不會回到如來藏中，所以無滅。世間什麼現象也沒有，也沒有世間，什麼也沒有，什麼也不存在，那麼就成天睡大覺吧。\n\n看二十五聖所修的結果，就知道意根完全可以代替前六識，這是聖人修行的事實，他們不一定是菩薩，羅漢就可以做得到。前提條件是要具足禪定，具足三昧力。\n世尊一再在楞嚴經中強調，六根本一根，因無明妄想，分為六。得道以後六消一也亡，都是本覺的功能作用。佛經當中，還是楞嚴經講得最深最透，世尊處處引導我們明心見性，認識一切法的本質，找到歸家之路。\n背佛經總比背菩提的論要好很多很多，畢竟佛經比論更可靠，不會誤導人，除非翻譯者的證量和水準所限，和輾轉流通時誤傳。而菩提的智慧遠遠不如佛的智慧，所說都有差池，沒有完全正確的，有百分之八九十正確，知識難能可貴的。\n\n觀行只靠意識的情思意解，認為自己懂得多就有道了，知道一個相似的答案就是證得了，全然不知知解宗徒和說食不飽的後果是什麼。然後著書立說，廣收徒眾，絲毫不考慮會不會誤人子弟，把眾生引向歧途。這是末世眾生思想浮躁，思惟淺薄的結果，放眼望去，都是說理的說客，幾乎見不到證理的道者。眾生越不具福德，這些現象越嚴重。這些事說多了惹人恨遭人罵，想要復古遵從古人修行足跡太難太難，沒有幾個人能意識到佛教存在著很大的危機，不良現象有多嚴重。\n\n我們每一個人學佛法都要踏踏實實，老老實實，認認真真。從前到後，前後聯繫起來來貫通佛法真實義，不要拿一句話一個段落自己強行來解。錯解了還認為自己解的是對的，然後就相信自己的知見和看法；相信了以後，就到處宣揚自己的知見和看法。如果自己的知見是錯誤的，就將誤導很多人，誤導人就有罪，這個罪業會遮障我們，後世不得解脫，就會在生死輪回當中不得出離。所以我們解釋佛法，一定要謹慎又謹慎，慎重又慎重，不要太自信了，以免造成謗佛謗法的罪業。\n很多人都把修定的境界當作開悟，還有的人認為開悟必須是把所有的識心都滅掉，連意根也滅掉不起作用，才是真正的開悟境界。我們想想這有什麼過失？這樣的開悟，是誰開悟？悟了什麼？在這個境界裡沒有人，沒有五陰七識，只剩下如來藏，顯然是阿羅漢的涅槃境界，與開悟沒有關係。況且一個凡夫不可能通過修定直接就能把意根滅掉，證得俱解脫大阿羅漢，馬上就入到無餘涅槃裡，即使滅掉五識也是極其困難的，意識更難滅掉了，更何況要滅掉意根。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188097","master":"元音老人","title":"修行的六個要點_打坐方法元音老人講述","youtube":"","images":[],"tags":[],"content":"修行的六個要點_打坐方法元音老人講述\n\t\t\n \t上座時用金剛持的方法，即嘴唇微動持咒，不出聲。因為出聲念咒傷氣，默念傷血。我們修法首先要注意身體，不能把身體弄壞，所以打坐、修行要把身體保護好。但是坐到種子翻騰、心裏煩亂、坐也坐不住的時侯，或是坐到昏然入睡、亂夢當前時，就要出聲念咒，把那些 混亂的妄念和睡魔除掉才能入定。沒有遇到這種情況的時候，還是用金剛持的方法持咒。\t\n \t\t\n \t\t\n \t持咒的快慢是每分鐘10至12次。念的時侯，要心念耳聞，就是一個字一個字的從心裏過，不是有口無心地去念，要用耳朵聆聽這從心裏發出來的咒音，聽得清清楚楚，這樣才能將妄念攝住不動而漸漸入定。\t\n \t\t\n \t\t\n \t我們的六根——眼耳鼻舌身意——其中的意根好比猴子一樣亂動慣了，你要它安靜不動不起妄念很難，但不把它攝住不動就不能入定、開智慧成道。因此大勢至菩薩教導我們念佛須「都攝六根，淨念相繼」。\n就是念佛時要至誠懇切地以「阿彌陀佛」這句聖號把眼耳鼻舌身意 都抓住，叫它不要動，才能安然入定。\n這六根當中，以意、耳二根為難攝。\n眼睛閉上不看東西就能攝住眼根；\n嘴持咒就能攝住舌根（舌頭）；\n鼻子不聞異味就能攝住鼻根；\n身體不接觸外境就能攝住身根。\n但是人的耳朵最靈敏，很遠很遠的聲音都能聽見，隔著一座大山的聲音 也聽得見，外面噪音會吵得你心煩。至於意根，更難攝住，不要它動，意念會不由自主地從心裏跳出來。為什麼呢？\n這是多生歷劫的習氣，它動慣了，不動不行。\n這在佛經中叫做「作意」。也是法相宗所說的五個遍行心所，意、觸、受、想、思的第一個心所，它存在於八識 當中，時時刻刻在蠢動，像流水一樣不停地流，所以叫「流注生滅」，微細得很，只是我們平時看不見。\t\n \t\t\n \t有人說：「我們不修法不打坐沒有念頭，一修法打坐倒有念頭了。是不是修法修壞了，有念頭了？」\t\n \t\t\n \t\t\n \t不是。這是因為平時心亂，看不見念頭在亂動，等到你心裏稍微靜下來後，就看見念頭在動了。這怎麼辦呢？怎麼將妄念息下來呢？唯一的辦法就是用耳根來攝意根。持咒需要一字一字從心裏過，耳朵聽得清清楚楚，才能如法。所以打坐的要旨就是「心念耳聞」，攝住妄念 不動而入定。不然你坐在這裏，嘴裏念咒或佛號，腦子裏面卻七想八想，那就不能入定。一定要心念耳聞，死心塌地地打坐。\t\n \t\t\n \t但是，最重要的還是在心空。修行為的是跳出三界外、不在五行中，所以一切都要放下，才能入道。在家人比出家人多一重障礙，有家庭，煩惱多，驢事未去，馬事又來，事情多得不得了。\t\n \t\t\n \t\t\n \t所以，我們時時要警惕，看破這些事相，都是假的，不可得，心裏不戀著它，粗妄才可不起。接下來精勤用功打坐持咒，細妄又不免來侵襲，這是多生歷劫的串習，動慣了，一下子停不下來，但不要怕它。念頭跳出來你能看見，不理睬它，妄念自然化去。念頭來了你看不見 ，那你就跟著念頭跑了，這就不能入定了。打坐的時候最要緊的就是一切放下，心裏要清清楚楚，念頭一來就看到它，不睬它，也不要討厭它、壓制它。討厭的本身就是一種妄心。壓制也不行，壓是壓不死的，比如搬石頭壓草，石頭拿掉之後，草又生起來了，這是不行的。 縱或壓死了，倒變成土木金石，不能起用了。所以要用活潑潑的轉化法，不能用壓制法。念頭來了，只不睬它，把咒提起來，妄念自然轉化掉。\t\n \t\t\n \t\t\n \t如此精進修法打坐，修到一心不亂的時侯，咒也就自然化脫提不起來了。這是什麼緣故呢？\n因為我們持咒的心還是妄心，有能有所，即有能念之心與所念之咒\n（念佛也是如此，有能念之心與所念之佛），能所相對，都是妄心。\n相對的都是虛假的，不是真實的；真實之心是絕 對待而無相的，凡是有相的東西都是虛幻的。假如我們真的持到一心不亂的時侯，一切相對的虛幻的東西就都脫落化為烏有了。這時身、心和世界就統統空掉了，虛空也粉碎了，而真實不虛的天真本性才會全體顯露出來。\t\n \t\t\n \t\t \t\t\n \t修法一段時間後，看禪宗的東西，有點理解了，那是理上的悟道。文字理解沒有多大用處。因為沒有親證，定力不夠，道理雖然明白一些，但是事情來了就擋不住了。\n所以解悟不能了生死，一定要證悟，親自見到本性才有力量。\n「見到」當然不是眼睛見到，而是心地法眼親證本性，本性是沒有相的，眼睛只能見有相的東西，那時候你人也沒有了，還有什麼眼睛？還有什麼看見？\n法身雖無相可見，但不是斷滅空，它是真實的大功能，大能量，世界上舉凡一切事相、境界都是它顯現、變幻的。比如電，眼不能見，但離開它，世界就不能運轉。又 如「海水中鹽味」，人能看見海水，海水裏的鹽味卻看不見，但它確實存在！\t\n \t\t\n\n \t我們用功到緣心息下，世界都化空，便時到神知，心領神會而見道了。所以叫做心地法眼可以見道。見道了是不是就成功了呢？很多人以為這樣就成功了，不是的，沒有成功，還差得遠哩。剛打開寶藏見到一點影子，僅是法身邊事，不相干，生死猶不能了，還須努力向前， 除盡惡習才是了手時。\n \t\t\n \t剛剛明心見性的時候只是初悟，破本參，才跨過第一道門檻，\n妄習猶在，生死不能了。須勤於保護，歷境練心，把多生歷劫執著的妄習消滅光，真正做到與《金剛經》所說「凡所有相，皆是虛妄」相應，處順境而不喜，遇逆境而不惱，絲毫無動於衷，才能了思惑而了分段生 死。\n\n《金剛經》說：過去、現在、未來心皆不可得。心既不可得，還動什麼？真見性的人只有這個覺性，其他一切都不可得，還須更向上，覺性與不可得也不住才為真了。若見境生心，隨念而轉，就不是見性開悟的人。羅漢之所以有四果之分，也是在是否生心動念上劃分的 。初果羅漢在山林裏，清淨無染，但是，到城市裏就不免眼花繚亂思念紛起了，這就是思惑未了之故。思惑者，對境生心，迷於事相之思想也，就是對幻境惑當真實，產生佔有之妄想也。\t\n \t\t\n \t在打坐的過程當中，有很多現象出現，如美好的佛、菩薩光明等善像，或醜惡的魔相，都不要理睬它。\n有相的東西都是假的，一著相，就容易著魔。\n還有，當你從有相過渡到無相的時侯要起一些變化：如身體沒有了，或手腳和頭沒有了等等，都不可管他。更或氣要斷了、頭 要爆炸了，也毋須驚怖，這是身心將脫落的前奏。\n一害怕，一驚覺，即前功盡棄而出定了。等到火候到時一下子大爆炸，內而身、心，外而世界一齊銷殞，虛空也粉碎，本性即現前。\n不過你不能著相求這個爆炸，一著相即被妄念所遮，非但不能爆炸，連空也入不了。密宗就 有這個好處，常常得佛菩薩的加被，以外界的爆炸聲引起內心的爆炸，但是千萬不能求，想它什麼時間來，更不能將心等它或迎它來。打坐定境中的一切形象都不能理睬，須置之不理。《金剛經》的警句須牢牢記住：「凡所有相，皆是虛妄。」一切色相都是假的，不睬它就 沒事。一理睬執著它，就有著魔之虞。\t\n\n \t二果羅漢，前念才動，後念就覺。雖然能不住相而於覺後歸家穩坐，但是念有起滅，還是有生有滅。所以還要有一番生天落地的生死，然後才能了分段生死。因此，打開本來之人並不是大事完結，還要好好地勤除習氣，進入三果羅漢達遇事不動心的階段，更向上進入無為之 境，達到阿毗跋致的地步，方為初步了手。有思想、有妄情、有造作都是有為。修行從初地、二地、三地……到七地都是有為，入八地才是無為。七地雖然已證到無為了，但是還有個無為在，還有個無為的影子，還是不乾淨。到八地，無為的影子才取消。所以，我們每個人 要衡量一下自己，看看是否對境心一點都不動，平時如還有妄心起伏，那就不行，在境界當中，若著境，更不行。一切時、一切處心空如洗，能夠隨緣起用，不執著，真空妙有、妙有真空，那才是真開悟。\t\n \t\t\n \t\t\n \t除打坐之外，最重要的是平時用功。時時看著自己，念頭一起就看見，不跟著跑。\n念頭起了看不見，跑了一大段才覺得，才知道，那就不行。\n禪宗說：不怕念起，只怕覺遲。念頭起了不怕，只怕你不知道，跟著念頭跑，就是生死；跟著念頭跑了一大段才知道，就是已死去多 時了，也就證明你將來生死不能了。假如我們能做到前念起，後念覺，不跟念頭跑，就能受生自在了。受生自在不是已了生死，還有生死在，不過在生死當頭能夠自己作主，要到哪裏就到哪裏，不受業障牽連，隨業受報了。\t\n \t\t\n \t功夫程度\t\n \t做功夫的第一步：念起不隨。能做到念起不隨就能於生死當中做得主，不為業牽得大自在。\t\n \t\t\n \t第二步：親證無為。一切事情儘管來，我心不動。這是真正隨順，而不是壓住它不動。壓住它不動是不行的。要儘管應酬各種事情，隨順一切事緣，沒有什麼好的，沒有什麼壞的差別感，好的不喜，壞的不厭，這樣我們的心才能平靜，而到達平等無為之境。做到這個地步就 能變化自在了，分段生死也就了了。第一步是在生死當中得自在，第二步是變化自在，能變粗為細，變短為長，到達第八地菩薩的位次，至少能顯現三十多個意生身。\t\n \t\t\n \t\t\n \t第三步：微細流注消滅。微細流注就是上面講的作意。作意在八識田裏流動，你平時看也看不見，深入金剛薩埵大定，才能見到而消滅它。到這一步，微細流注都消滅光後，能顯現百千萬億化身，度百千萬億眾生。這時侯才真到家，不是一開悟就好了，差得遠，所以，還要 好好的用功。\t\nt沒有菩提心是不能成道的。什麼是菩提心呢？簡單講解就是「上求下化」：上求佛道，下度眾生。我們修法是為了下化眾生，而不是為了自了。\t\n \t\t\n \t\t\n \t大家務必好好用功，堅持打坐、觀照，切勿等閒視之，更重要的還是在座下用功，不是坐兩個小時就可以放野馬，亂來了。還須於行、住、坐、臥處時時不忘觀照，才能與大道相應。\t\n \t修行的六個要點\t\n \n \t第一：一切放下，死心塌地。\n戀著世間事物放不下，有什麼用呢？這世界上的事事物物都是因緣合成，無有實體，猶如過眼雲煙，虛而不實，求不得，拿不走。即連各位自己的身體也是假有，留不住，不可得，身外的東西就可想而知了。所以認事物為真，抓牢不放，是不值 達者一笑的愚癡之事，學佛修道是大智大慧的大丈夫事業，不是小根小慧的人所能勝任的。要成道，第一要看破一切。死心塌地地打坐，才能入定開悟，假如在座上想這樣、想那樣，妄念紛飛地亂想，那就完了。一定要一切放下，像個死人一樣才行。\t\n\n \t第二：打坐持咒，心念耳聞。\n這是修心密的要訣，對入定開悟，關係非常重大，所以再三提示大家，要毫無折扣地照之實行。人的妄念動慣了，不專心致志地傾聽持咒的心聲，把意根攝住，妄念息不下來，妄念不息何能入定、開悟？所以必須心念耳聞，一個字一個字從心裏 念出來，耳朵聽得清清楚楚，才能攝住意根不起妄念，而漸漸入定。\t\n \t第三：念起即覺，不壓不隨。\n念頭來時，要能看見，如果看不見就跟著它跑了，一跟念跑，就妄念紛飛不能入定了。所以要念起即覺，既不隨之流浪，也不壓制不起，只不理睬它，提起正念，一心持咒，妄念自然化去而安然入定。\t\n \n \t第四：按時上座，不急不緩。\n每天按時上座，養成習慣就容易入定，最好早上打坐，凌晨更好。坐時不要急於入定，心情平和地以一種平常心安然入座，不急不緩地從容持咒，既不要求入定開悟，更不妄求神通。以要求入定、開悟、發神通等的一念即是妄心，此心一起，即 障自悟門，非但不得開悟，而且不能入定。\t\n \t第五：下座觀照，綿綿密密。\n把打坐中的靜定功夫推廣到日常動用中去，在行、住、坐、臥當中冷冷自用；綿綿密密地觀照，一切無住，既不讓境界拉著跑，也不隨妄念流浪。\t\n \t第六：心量廣大，容納一切。\n修道人心量不能小，要寬宏大量地容納一切，縱然別人對我不好，我對他還要更好，沒有絲毫愛、惡、喜、厭的觀念。隨緣隨份地做一切善事，時時處處瀟灑自在，沒有患得患失之心，亦無毀譽成敗之念。這就是最大的神通。\t\n \t\t\n \t記住這六點，照之修行，決定能打開本來，親證佛性。做好這六點，絲毫不懈，保證能圓證菩提，得大成就！","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1786347112686","master":"實用工具","title":"登記念佛迴向","youtube":"","images":[],"tags":[],"content":"https://buddha-community.netlify.app/?openExternalBrowser=1\n裡面有3項可以登記\n1.亡者超度\n2.病重求往生\n3.蓮友除障癒病","updatedAt":"2026-08-10T07:31:52.686Z"},{"id":"1786347060054","master":"陳有宏專區","title":"陳有宏助念 線上版","youtube":"https://youtu.be/fqrizVcpBQc?si=bTOh-dzh9yhRHjVo","images":[],"tags":["陳有宏","助念"],"content":"陳有宏助念 線上版","updatedAt":"2026-08-10T07:31:00.054Z"},{"id":"1786342616357","master":"經典","title":"佛說阿彌陀經摘要","youtube":"","images":[],"tags":["阿彌陀經"],"content":"1.\t從西方過十萬億佛土，有世界名曰即樂，其土有佛。又阿彌陀佛\n\n2.\t極樂國土，七重欄循。七重羅網，七重行樹，皆是四寶\n\n3.\t極樂國土有七寶池、八功德水充滿中，以金沙布地\n\n4.\t極樂國土，成就如是功德莊嚴\n\n5.\t彼佛光明無量，照十方國無所障礙，是故號阿彌陀\n\n6.\t極樂國土眾生生者，皆是阿稗拔致，其生多有一生補處\n\n7.\t眾生聞者應當發願，願生彼國。諸上善人俱念一處\n\n8.\t不可以少善根福德因緣，得生彼國\n\n9.\t若有善男好，執持名號，若一日、二日、一心不亂，其人命終，\n阿彌陀佛與諸聖眾現在其前，是人終時。心不顛倒，即得往生，阿彌陀佛極樂國土。\n\n10.\t我見是利，故說此言。若有眾生聞是說者應當發願，生彼國土\n\n11.\t汝等眾生，當信是稱讚不可思議功德，一切諸佛所護念經(護-不可思議)\n\n12.\t廣長舌相，語必真實、辯說無窮\n\n13.\t如是等恆河沙數諸佛，各於其國。出廣長舌相，遍履三千大千世界，說誠實言。\n\n14.\t若有善男子、善女子，聞是經受持者。及聞諸佛名者，是諸善男子、善女人。\n皆唯一切諸佛之所護念，皆得不退轉於阿秒多羅三秒菩提\n\n15.\t汝等皆當信受我語及諸佛所說。舍利佛若有已發願，今發願，當發願。欲生阿彌陀佛國者，是諸人等，皆得不退轉是皆得不退轉阿秒多羅三藐三菩提\n\n16.\t善男子、善女人，若有信者，應當發願生彼國土","updatedAt":"2026-08-13T00:21:27.777Z"},{"id":"1786079825865","master":"經典","title":"妄盡還原觀摘要","youtube":"","images":[],"tags":["妄盡還原觀","賢首","體佛法師"],"content":"顯一體，自性清淨圓明體(能現能生)\n\n起二用\nA.\t海印森羅長住用(依報)，依(生命所依附、生存的環境)\nB.\t法界圓明自在用(正報)，「正報」是生命本體\n\n\n示三遍\n1.\t一塵普周法界遍\n2.\t一塵出生無盡遍\n3.\t一塵含容空有遍(都是所現所生)\n\n\n行四德\n1.\t隨緣妙用無方德\n2.\t威儀住持有則德\n3.\t柔和質直攝生德\n4.\t普代眾生受苦德\n\n入五止\n1.\t照法清虛離緣止(因緣俱離)\n2.\t觀人寂泊絕欲止(五蘊無主)\n3.\t性起繁興法爾止(隨緣)\n4.\t定光顯現無念止(無念)\n5.\t事理玄通非相止(大悲救物 萬行紛然)\n\n起六觀\n1.\t攝境歸心真空觀(一心)\n2.\t從心觀境妙有關(鏡體)\n3.\t心境秘密圓融觀(圓)\n4.\t智身影現眾緣觀(一眾)\n5.\t多身入一鏡像觀(一)\n6.\t主伴互現帝網觀(一)\n\n\n內容佳句\n1.\t妄盡心澄，萬象齊現\n猶如大海，因風起浪\n若風止息，海水澄清\n無象不限\n\n2.\t又理即事，故名隨緣實無度，各為妙用\n\n3.\t定光顯現無念止，白淨寶網，萬字輪寶珠\n4.\t一毛孔無量剎，一塵中佛皆入\n5.\t六重觀門，舉一為主，於五皆非\n6.\t攝法界而一塵故，舉一身而一身觀","updatedAt":"2026-08-10T07:26:21.501Z"},{"id":"1785973393158","master":"懺雲法師","title":"打佛七的宗旨與方法","youtube":"","images":[],"tags":[],"content":"我們打佛七，宗旨在了生脫死，了生脫死的方法在一心不亂。\n我才出家，受三壇大戒的時候，那個小戒兄，跳跳躂躂的，他看見我來了，他說：「戒兄！戒兄！二師父要問你囉！」我說：「問什麼？」「他問你為什麼出家，你怎麼說呢？」我說：「那麼你怎麼說呢？二師父問你，你為什麼出家？」他說：「我為生死出家呀！」二師父就問：「生死在哪兒？」「那麼你怎麼說？」他說：「我說不出來了，所以戒兄你來了，我告訴你，二師父要問你，為什麼出家，要了生死脫死，那麼生死在哪裡？你可要答出來喔！」生死在哪兒？我們的生滅心就是有為法；不生不滅的心是無為法。「一切有為法，如夢幻泡影，如露亦如電，應作如是觀。」生生滅滅的心，一天到晚，從月竟年，生到死，以致於生生世世，就這樣生滅，滅了再生、生了再滅，生生滅滅，由這個心造種種的業，受輪迴生死的苦，所以生死在哪兒？就在心裡頭。在心什麼地方？就是生滅心、生生滅滅的心，這是生死的因、生死的本源。了生脫死呢？就是不生不滅的心，不生不滅的心是了生脫死的因。我們念佛，就是要由生滅心，念到不生不滅的心。生滅的心，是一切有為法，如夢幻泡影；不生不滅的心，是了生脫死的心。不生不滅的心，那是真常，就歸作一心了。所以要緊哪，我們佛門弟子信佛，以了生脫死為最高、最上的目標，就是自覺。\n\n再勸別人也求了生脫死，修一心不亂的功夫，這是覺他。自己求了生脫死、自覺；又勸他人也了生脫死、覺他；都由生滅心，漸漸修、漸漸念，達到不生不滅，就是覺行圓滿。自覺、覺他、覺行圓滿，就是阿耨多羅三藐三菩提~~無上正等正覺的心，這是我們佛門弟子信佛究竟目標。\n至於現生求吉祥、求順利、求消災、求延壽，以至於求福報，這總是生滅法，再吉祥、再順利、再延壽、又增福，又增壽，究竟有一天得撒手他去。今生這一場戲唱過了，還有來生的，這一生一死，感覺很痛苦，生死的苦；這中間免不了再老病，生老病死苦。臨別，家親眷屬愛別離苦。不想死。非死不可，人人本具、個個不無，是真如自性，而人人必得經過生死，還是了生脫死才好。那麼生死到來，這就是怨憎會苦，求不別離不行，這一期果報盡，還得受生死苦，求長壽、再長壽，人不能長生不死，這樣子我們就得想個了生脫死的方法。\n\n\n在這種社會，人事紛紜，千奇百怪，就像颱風一樣，就像溪水湧流，要它能靜、能定，像秋水止靜一樣，靜靜靜靜的，又安靜、又清淨、很難很難！從早到晚，人事紛紜，種種錯亂的因緣，撥不開、推不脫，這樣子就必須要大眾聚會七天，念七天的佛。怕的是有應酬，不談兩句，覺得不好意思，我們就遵從佛祖的話，止語；又怕進來出來，各處奔波勞碌，就遵從佛祖的方法，要禁足。我們這七天，大眾同修，立下規矩，不以規矩不能成方圓，又止足、又禁語，我們這七天的功夫，就要打佛七。以這個佛七的功夫，我們要學會了，修練的長久了，成其自然，也就是閉關囉，你願意三年就閉關三年，一年也可以閉關，以至於自己將來用起功夫也可以閉關，一個人也可以，多人也可以。那麼止語、禁足、打佛七、閉關，要緊叫這個生滅心，漸漸念佛，念到不生不滅，這就生死可了 。總是同修蓮友、同學大眾，在打佛七的時候 ，我們要痛念生死，印光大師說：寫個「死」字，貼在前額頭、頭頂上，修道之人，常常提思這個字，到道業自然能圓成、成功。\n\n\n\n所以，我們用功，要緊是痛念生死，求證一心。那麼用功的時候，妄想雜念，覺得更多，不用功便罷，一用功都是牽纏掛礙，這是免不了的，就像那個灰塵，沒有太陽照，我們看不出來，有太陽光一照，才知道好多些灰塵，就在屋裡頭的空間，上下地浮動，飄來飄去。我們不用功，整天就在生死心中、有為法中，一用功才知道，哦！這些心理，都是妄想雜念。有妄想雜念，我們就念佛呀！一句佛號，萬德洪名，無量光明、無量壽命，佛陀的覺心如此，我們就念佛陀，念得生滅心漸漸地滅、生滅的心漸漸地滅，生滅既滅， 寂滅才能現前 。還有，用功就像一人與萬人戰，這一念佛號，我念念念去，東南西北的，過去、現在、未來的念頭可多了，只要我作主人翁的，心裡不昧、不糊塗、不跟它轉，我漸漸念去，就能念到一心。\n\n\n還有，這裡頭要勇猛精進，專注這一念，就像勇將上陣，戴上盔 、披上甲 ，策著馬呀，一跳上去了，副將兵員在後面就跟著，這時候勇猛精進，一定說是旗開得勝、馬到成功，這要勇猛。這一念心，是將軍的心，是了生脫死的主人翁，須要精進、勇猛，一直念去才好。說是生死心在哪兒？生死心，就是我們心中的生滅心；了生脫死的心，就是不生不滅的心。我們一心念佛，念到生滅心沒有，不生不滅的心了，就一心念，就能了生脫死。這其中，我們勇猛精進念，十二祖徹悟大師，他老人家說：以攝心專注而念，為下手的方便。心不叫它跑、攝住，專注在佛號上，我們念念念去，念到一心不亂，這是念佛的方便、最便利的方法，就在眼前，這一念心。\n\n\n說是禪很妙；密呢？很深；教觀呢？大都有學理的；持戒呢？我們在打七期中，要持心地的戒，我們眼耳鼻舌身，不大很能犯戒，就在佛前嘛！基本的戒，是殺盜淫妄，也可以加上酒戒，佛七期中，要緊持的心地戒，心裡頭，不讓它起殺盜淫妄的念頭，那麼不由人起了，那就是酒，喝無明酒，醉了，不由人的起這些念頭，這時候要抖擻，要清醒。說是要立地成佛：一念彌陀一念佛、念念彌陀念念佛，這是頓超直入。\n\n\n可是這是理，人人本具、個個不無，要是一心不亂的念，都能念到一心，這是理；事呢？事修，說是一念念佛，念念念佛、念念是佛，得要漸漸往前念，打成一串兒、打成一片，這才能成佛。\n至於持名念佛，雲棲蓮池大師，教我們老實念佛，念佛方法中，就是執持名號。說是「三千大千世界，滿中怨賊」都是生死的怨家。「有一商主，將諸商人，齎持眾寶」，有這麼一位作生意的主人，領著多少小生意人，「齎持眾寶」，兩手捧著這麼一個寶貝，金剛鑽石也罷、白金也罷，說是價值連城。什麼是寶？就是我們這一念真如自性是寶，世間的寶貝，都有成住壞空，我們人生，都有生老病死，所有的寶貝，有一天要走的時候，離開這個世界，我們兩手都是握空拳，唯獨真如自性，說是自性彌陀，不生不滅的心，光明磊落，那是真實寶，依這個能成佛，這是寶中的寶啊！\n\n\n三千大千世界，滿中怨賊，都是生死、妄想、雜念，就是滿中怨賊。\n\n我們這麼捧著這一念心~~~~自性彌陀，念念念西方彌陀，念到自他不二，一心再念去，這就了生脫死，也就是將軍旗開得勝，越過生死海，達到不生不滅的彼岸。這裡頭不需要別個，觀想也不用，觀像也不用，觀像 ，我們抬頭看看佛像就可以了，不要另外再觀，說老實念佛，就是執持名號。\n\n實相也不用，實相：「本來無一物，何處惹塵埃」，我們但知道那個理就可以，要緊是老實執持名號，攝心專注而要緊。所以，念佛的方便，「都攝六根、淨念相繼」這是大勢至菩薩說的；徹悟祖師說呢：「攝心專注而念為下手的方便」。印光大師說：攝心專注而念，還要再聽，全付的精神就聽，全付的精神來念、全付的精神再攝耳聽，這一念彌陀呀，就是我們的自性。這個自性的範圍，在空間是無量光明，在時間是無量壽命。\n\n無量光明，沒有絲毫的妄想雜念；無量壽命，一直念念念去，念到不念而念、念而不念，這才是無量的壽命。這一句阿彌陀佛萬德洪名，和阿彌陀佛無量光明、無量壽命，理體相應，這是一個。我們不必再去觀想、觀像、或是實相；種種念法、三止三觀念法，就是老老實實念，執持名號。三千大千國土，我雙手捧著這個重寶，是我的真如自性，依著能成佛，這是重寶，我們就這麼一直念、一直聽，一直念去，達到一心不亂。\n\n這一句阿彌陀佛萬德洪名就是自性，我們念念念去、念念再聽，就是反聞聞自性，不用別個。這就是觀世音菩薩耳根圓通的方法。\n諸上善人！痛念生死，萬德洪名提起，念！～ 聽 ～！\n西方極樂世界大慈大悲阿彌陀佛！南無阿彌陀佛 ～ 阿彌陀佛，阿彌陀佛 ～","updatedAt":"2026-08-10T07:26:21.501Z"},{"id":"1785910718871","master":"經典","title":"維摩詰經 摘選","youtube":"","images":[],"tags":["維摩詰經","經典"],"content":"維摩詰經 摘選\n不壞於身而隨一相\n不滅癡愛起於明脫\n一切諸法為幻相\n智者不著文字故無所懼\n諸法不生不滅\n心垢故眾生垢\n心淨故眾生淨\n如夢如炎如水中月如鏡中像以妄想生然汝等便發\n阿邈多羅三菩提心 即是出家\n過去耶、未來耶、現在耶\n若過去生過去生已逝\n若現在生現在生無住\n無生即是正位\n正位亦無受記\n亦無得阿邈多羅三邈三菩提\n\n無處是菩提無形色故\n假名是菩提名字空故\n如化是菩提無取捨故\n無亂是菩提常自靜故\n直心是道場無虛假故\n發行是道場能辦事故\n深心是道場增益功德故\n菩提心是道場無錯繆故\n\n護持正法起方便刀\n以度眾生 起四攝力\n知一切法不取不捨\n入一相門起於慧業\n\n從癡有愛 則我病生\n以一切眾生病是故我病\n若一切眾生病滅則我病滅\n今我此病 皆從前世妄想顛倒煩惱生\n無有實法誰受病\n又復觀身無常苦空非我\n是名為慧\n若求者於一切法應無求\n\n我今略說菩薩不可思議解脫之力\n若廣說者窮劫不盡\n是時大迦葉雯說菩薩不可思議解脫法歎 未曾有\n謂舍利佛\n譬如有人於盲前現眾色像非彼所見\n一切聲聞聞是不可思議解脫法門\n\n維摩喆言，譬如幻師見所幻人\n菩薩觀眾生為若此，如智者見水中月\n菩薩欲依如來功德力者\n當住度脫一切眾生\n無住為本\n無明實性即是明\n明亦不可取\n是殺生是殺生報\n是不與取是不與取報\n以無量大悲生是佛土\n然其一世饒益眾生\n多於彼國百千去力行\n以布施攝貧窮\n以淨戒攝毀禁\n百千天人皆發阿藐多羅三藐三菩提心\n十千菩薩得無生法忍\n謂不離大慈 不捨大悲\n深發一切智心而不忽忘\n教化眾生終不厭倦\n以眾妙華若干種色 若干種香\n散遍三千大千世界\n非四大起 同於虛空\n六入無積 眼耳鼻舌身心已過\n隨順法相 無所入無所歸\n有事經卷讀誦解說者\n我當率諸官屬 為聽法故\n往指其所 擁護其人\n不可思議解脫法問\n聞佛所說 皆大歡喜","updatedAt":"2026-08-13T00:18:50.729Z"},{"id":"1785909790107","master":"生如法師","title":"生如法師開示","youtube":"","images":[],"tags":["意根","念佛","極樂"],"content":"生如法師開示\n1.\t有定力，念佛字字有力，意根強\n2.\t沒定力，意識感強\n3.\t意根就是看鏡子的人，如來藏是鏡子\n\n4.\t念佛是一種定\nA.\t盯著耳根，牽引意根\nB.\t讓境隨心轉\nC.\t不做他想\nD.\t訓練方法，沒有語言文字，只有觀察力與專注力\n\n\n5.\t改變意根，靠意識薰染(互為表裡)\n6.\t意識晚上死，換意根活動。\n\n7.\t睡覺無夢的分析\nA.\t知道要休息，不作意\nB.\t胎兒或昏迷的人\n\n8.\t意根的作動\nA.\t少分析思維\nB.\t平等心變強\nC.\t往生西方，深信切願\n\n\n9.\t極樂世界與意根\n意根指揮所有身體中樞系統\n10.\t意根念佛，身心清安。意根與直覺和深細念頭\n\n11.\t訓練意根的方法\nA.\t離文字\nB.\t人有定，神集中\nC.\t意根安住在極樂世界\nD.\t怎麼練習，禪定。\nE.\t止，心攝持在一個境界\nF.
