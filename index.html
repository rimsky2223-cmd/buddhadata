\t不斷觀、慧，思維反薰意根\n\n\n12.\t念佛三昧\nA.\t初禪，還有時間空間\nB.\t二禪，沒念頭、微微的意識\nC.\t定中所見相都假的\nD.\t懺悔讓障礙變少\nE.\t功力如果好的話，聽得到天人唱歌","updatedAt":"2026-08-10T07:26:21.501Z"},{"id":"1785901059907","master":"淨界法師","title":"五點念佛法","youtube":"","images":["https://cdn.jsdelivr.net/gh/rimsky2223-cmd/buddhadata@main/images/1785903748505_LINE_NOTE_260805_1.jpg"],"tags":[],"content":"每一個點都念十聲佛號，三三四，念完第一點移到第二個點，再念十句，再移到第三個點，乃至第四個點，到最後第五個點，這樣五個點成一片，剛好五十句佛號為一片。\n\n第一「安置地輪，令心下沉」，這五個點一定要把它安置在大地上，這點很重要！在我們中國的調身方法有很多的宗派，但是共同的原則「使令身體下實上虛」，一定是下半身要用力，上半身要放鬆的。\n\n\n\n二、「所緣行相，清楚分明」\n三、「寧可少念，不可草率」\n四、「先依記數，再求圓融」","updatedAt":"2026-08-10T07:26:21.501Z"},{"id":"1785900959321","master":"南懷瑾","title":"南懷瑾的摘要","youtube":"","images":[],"tags":[],"content":"南懷瑾的摘要\n\n1.每个字音稍稍拉长。南——，念南时声音开始感觉下沉，身体放松；无——，更下沉，更放松；如此，阿——弥——陀——，接连下来，到了陀声音差不多降至腹部。然后，佛——（以两唇轻而松作呼音），有如放长气一样，由腹部放下去。这一放，放到地下，放到十八层地狱，放到地藏王菩萨那里，一路直透下方世界，无比虚空之处。\n\n\n2.念佛者誰，不是誰在念佛(釋自然)","updatedAt":"2026-08-10T07:26:21.501Z"},{"id":"1785900933807","master":"網友","title":"金滿慈夫人日記 打坐","youtube":"","images":[],"tags":[],"content":"1.打坐\n很清净。坐中无境界。（怀师批示：清净即境界，是境即无常。那个能清净能不清净的，才是你的。思之，参之，自然明白。）\n\n2.晨六时整打坐。忽觉眼前一闪一闪的，似乎将有一片光明的趋势。我急忙睁开眼睛，又觉得不对，又立刻闭上，那一点灵光早过去了。我总是拿不准火候，每每错过机会。（怀师批示：用心太过，不取不着即可。）\n\n3.坐中似乎偌大天地什么都没有，不是空空洞洞，但觉广大无边。无人，无我，可是我又什么都知道。（怀师批示：性觉真空，性空真觉。当可于此境上翻然领悟。）\n\n3.意境上的那片大海，离我很远了。似乎有招之即来、挥之即去的意思，我不理它，几天把它忘了，它也就不惹我。（怀师批示：应该如此，不必着相。）","updatedAt":"2026-08-10T07:26:21.501Z"},{"id":"1785900913683","master":"正覺精舍","title":"受戒後以往的罪業是否可滅？","youtube":"","images":[],"tags":[],"content":"受戒後以往的罪業是否可滅？\n\n八關齋戒裡面有講，可以；發菩提心，真正的發菩提心，也可以滅罪。沒有到達那個程度，罪還不能滅，少許的折損，你只要發心受戒都有功德，它折損業力。我們平常經常的拜佛懺悔也是一樣，折損業力。慧思禪師在《大乘止觀》裡面講，我們修習空假中三觀，天台就是用空假中三觀，你在思惟諸法實相的時候，雖然你還沒有證聖果，但是那個罪業，有漏的生死的業力，它就是分分的滅除、分分的滅除。為什麼？因為我們在思惟諸法實相的當下，法界就是一個而己，基本上沒有其他的；但是第二念，我們又現出了凡夫的境界。所以那個罪業就是分分的滅、分分的滅，相應的當下就滅一點，相應的當下就滅一點。佛法是殊勝的，我們當佛弟子多有福報，三藏十二部經太殊勝了！念佛是殊勝，所有沒有哪一個不殊勝，不殊勝佛不會講的。","updatedAt":"2026-08-10T07:26:21.501Z"},{"id":"1785900848933","master":"元音老人","title":"元音老人法語","youtube":"","images":[],"tags":[],"content":"第一：一切放下，死心塌地。活死人\n第二：打坐持咒，心念耳聞。(心念耳聽)\n第三：念起即覺，不壓不隨。\n第四：按時上座，不急不緩。\n第五：下座觀照，綿綿密密。\n第六：心量廣大，容納一切。\n\n元音老人\n照之修行，決定能打開本來，親證佛性。做好這六點，絲毫不懈，保證能圓證菩提，得大成就！","updatedAt":"2026-08-10T07:26:21.501Z"},{"id":"1785900771154","master":"網友","title":"念佛震動","youtube":"","images":[],"tags":["佛號","念佛","震動"],"content":"持誦佛號佛咒的念波，聲波會改善身體生理指標。顯然念佛持咒可以理解為利用念波，聲波的穿透性、折射性，帶動內氣行走，達到意到聲到氣到。以意領氣，以意催聲，聲氣結合，形成一股強大的渾沌氣流，達到特種的療效。\n\n　　尤其是次聲波頻率在0.0001-20Hz之間的字音，就能夠在人體內傳播，穿透體內病態組織（細胞）內使病灶組織內閉塞的血管重新開放，並推動其血液流動，從而改善病態組織內的血液循環。\n\n　　在長期的修持下，唸誦佛號，佛咒就會形成一股強大的氣流，這種音頻氣流會使身體氣脈產生震動。除了血流速度加大以外，血液粘稠度會下降，血球懸浮。這就給血液及血液中的氧氣、負離子、吞噬細胞、免疫球蛋白等物質，向肌體病變組織內輸送創造了有利抵禦的條件。從而使病變組織（細胞）恢復為正常細胞。\n\n默想佛號佛咒時大腦會出現腦磁圖\n\n　　美國密蘇里大學的科學家們，主要是從佛號佛咒和腦電波、腦磁場的關係角度，研究佛號佛咒的作用機理與效果。他們的研究取得了重要成果，其中最驚人的發現是「佛號佛咒會產生腦磁圖」。\n\n　　研究人員讓測試者默想一些咒語，同時用不與測試者身體接觸的「超導磁強計」來觀察測試者大腦電波磁場。結果令他們十分震驚：因為當…被測試者默想佛咒時「超導磁強計」測到一個相對應的腦磁圖。他們分別測試了27個不同的佛咒，得到了27個不同的腦磁圖。\n\n　　這個實驗證明，佛號佛咒的力量不只是來自於唸誦時產生的聲波而已。當我們默想時，依舊會產生念波的磁場力量。可見意念也是物質能量的一種表現形式。\n\n　　我們常念的「阿彌陀佛」聖號，其實也是個佛咒，阿彌陀佛的「阿」字，就是毘盧遮那佛的梵文種子字。它代表著大日如來清淨法身的光明性體，阿彌陀佛本身也是代表無量清淨光明。所以密宗祖師說，毘盧遮那佛與阿彌陀佛是「同體異名」，當我們持念阿彌陀佛的佛號時，就是同時在念毘盧遮那佛，清淨體性的光明佛咒。因此當我們持念阿彌陀佛時，也就是在念我們本體的清淨光明自性光。","updatedAt":"2026-08-10T07:26:21.501Z"},{"id":"1785824846279","master":"體佛法師","title":"體佛法師講經筆記","youtube":"","images":[],"tags":[],"content":"體佛法師講經筆記\n\n1.\t凡所有相皆是虛妄、若見諸像非相，即見如來\n2.\t三昧  正覺、正受、心不染諸相、不著相、心無分別\n3.\t無眾生可度: 身不是我、有變化生滅，自性眾生才是我、所見的眾生皆是緣影\n4.\t佛法的關鍵在於薰習，因為他稱合本性，要自己栽培自己\n5.\t一合相，不可說，心理能想出來的，皆是一合相的幻影\n6.\t見分，見體悟的感動  相描述世界的物質，不著相入見地\n7.\t觀四念處(很重要)，觀身不淨、觀法無我，觀心無常，觀受是苦\n8.\t三界此三界共28天\n9.\t花開見佛悟無生，心花見佛性\n10.\t三性，遍計執性(執著)，依他起性(隨緣生法起性)，圓誠實性(圓滿本來俱足)\n11.\t三無性，相無性(不執著)，生無性(不執著)、勝義無性(第一義諦)\n12.\t業力:自性本無業，妄見時間長變成業，改掉習性就是業無業。即見如來也稱見性。\n13.\t爐香讚 心香一束，遍法界眾生心者。阿秒多羅三秒三菩提心，於佛無異，性相一如\n14.\t開悟: 悟一切體會諸相都假的。心不疑惑則喜悅\n15.\t迴向的力量，心不住法而行佈施。\n        A.如人有日光明。照見種種顏色。即眾生無邊誓願度\n\n16.\t功德\nA.\t彌勒菩薩，手把青秧插滿田，低頭便見水中天，六根清淨方是道，退步原來是向前\nB.\t信為功德之母，是性是功，平等是德\n\n\n17.\t八正道，正見、正思維、正業、正命、正語、正念、正精進、正定、正者\n18.\t受諸受無所受，緣來則應緣影，了則業障本是空，當下就是放下\n19.\t攀緣心，心執著，生滅心態\n20.\t性與心的關係。性王=心地(本顯影像)----------\n21.\t心的變化\nA.\t本自俱足的自性\nB.\t本性顯出的影像\nC.\t一般人認為的獨頭意識\n\n\n22.\t佛有三不能\nA.\t不能替眾生消業障\nB.\t不能替眾生改變因果\nC.\t不能幫眾生成佛\n\n23.\t性與心\nA.\t心是性的變現\nB.\t心性不一\nC.\t心是用、性是體(性是自性)\nD.\t如海水與波浪\nE.\t佛在心中求、佛在性中、身外無佛\n\n24.\t簡述心經\nA.\t念妳本來的心\nB.\t影像是空相，雖有而不真實\nC.\t沒有無明，只有影像\nD.\t無相為體，無念為宗\n\n25.\t法報化三身\nA.\t法身，自性本體，比盧遮那佛\nB.\t報身，只有佛菩薩才能看見，盧舍那佛\nC.\t化身，示現生老病死，釋迦摩尼佛\n\n\n26.\t什麼是止觀\nA.\t止，放得下\nB.\t觀，看得破\n\n\n27.\t正法眼藏(第一義諦、實相無相)\n28.\t阿裨拔致不退轉\n29.\t戒，尸羅四義，清涼、安靜、安穩、寂滅\n30.\t八難。地獄、惡鬼、畜牲、長壽天、北俱蘆洲、世智辯聰、生於佛前、佛後\n31.\t念佛與止觀，念佛攝住你的呼吸猶如止觀\n32.\t六度波羅蜜，持戒、忍辱、般若、禪定、佈施、精進\n33.\t不入法界叫業障、入法界就變成”了知業障本是空”","updatedAt":"2026-08-10T07:26:21.501Z"}];const allMasters=["陳有宏專區","顯明法師","成觀法師","經典","法藏法師","海雲和上","淨界法師","實用工具","廣欽和尚","定弘法師","正覺精舍","隆禪法師","佛號","淨台法師","慧律法師","宣化上人","我的心得","道證法師","惠空法师","楞嚴咒","淨空法師","果濱居士","網友","懺雲法師","印光大師","真言宗","聖嚴法師","黃念祖居士","金山活佛","生如法師","元音老人","南懷瑾","體佛法師"];let selectedMaster="全部";let currentQuery="";function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}function linkify(t){return escapeHtml(t).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" style="color:#b7794c;text-decoration:underline;">$1</a>');}function renderMasters(){const counts={};articlesData.forEach(a=>counts[a.master]=(counts[a.master]||0)+1);const all=["全部",...allMasters];document.getElementById('masterList').innerHTML=all.map(m=>{const cnt=m==="全部"?articlesData.length:(counts[m]||0);const active=selectedMaster===m?"active":"";const safeM=m.replace(/'/g,"\\'");return `<div class="master-item ${active}" onclick="clickTagOrMaster('master', '${safeM}')"><span>${escapeHtml(m)}</span><span class="count">${cnt}</span></div>`;}).join('');}function renderList(scroll){try{const q=(currentQuery||'').toLowerCase().trim();let filtered=articlesData;if(selectedMaster!=="全部") filtered=filtered.filter(a=>a.master===selectedMaster);if(q) filtered=filtered.filter(a=> (a.title||'').toLowerCase().includes(q) || (a.content||'').toLowerCase().includes(q) || (a.master||'').toLowerCase().includes(q) || (a.tags||[]).join(',').toLowerCase().includes(q));if(filtered.length===0){document.getElementById('listArea').innerHTML='<div class="card" style="text-align:center;color:#8a8075;padding:40px 20px">查無相符資料</div>';return;}const groups={};filtered.forEach(a=>{if(!groups[a.master]) groups[a.master]=[];groups[a.master].push(a);});let html="";Object.entries(groups).forEach(([master,arts])=>{html+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #f0ece5"><span style="color:#2d4a3e;font-size:16px;font-weight:500;cursor:pointer" onclick="clickTagOrMaster('master', '${master.replace(/'/g,"\\'")}')">👤 ${escapeHtml(master)}</span><span style="font-size:12px;color:#8a8075;background:#f4f0e8;padding:3px 10px;border-radius:6px;font-weight:500">${arts.length} 篇</span></div>`;arts.forEach(a=>{html+=`<div class="article-item" onclick="showDetail('${a.id}')"><div class="article-title">${escapeHtml(a.title)}</div><div class="article-snippet">${escapeHtml((a.content||'').slice(0,90))}...</div><div>${(a.tags||[]).map(t=>`<span class="tag" onclick="clickTagOrMaster('tag', '${t.replace(/'/g,"\\'")}', event)">#${escapeHtml(t)}</span>`).join('')}</div></div>`;});html+=`</div>`;});document.getElementById('listArea').innerHTML=html;document.getElementById('detailArea').style.display='none';document.getElementById('listArea').style.display='block';
  if(scroll){
    setTimeout(()=>{
      const el=document.getElementById('listArea');
      if(el) window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth'});
    }, 50);
  }
}catch(e){console.error(e);}}
function showDetail(id, push=true){const a=articlesData.find(x=>String(x.id)===String(id));if(!a) return;document.getElementById('listArea').style.display='none';const detail=document.getElementById('detailArea');detail.style.display='block';const ytMatch=(a.youtube||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([^&?\s]+)/);const yt=ytMatch?`<div class="yt-wrapper"><iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe></div>`:"";const imgs=(a.images&&a.images.length)?`<div class="img-gallery">${a.images.map(s=>`<img src="${escapeHtml(s)}" onclick="openImg('${escapeHtml(s).replace(/'/g,"\\'")}')">`).join('')}</div>`:"";detail.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><button onclick="goBack()" style="padding:8px 16px;border-radius:8px;border:1px solid #e0dad1;background:#fff;cursor:pointer;font-weight:500;color:#5a554c;transition:0.2s" onmouseover="this.style.background='#f0ece5'" onmouseout="this.style.background='#fff'">← 返回列表</button><button onclick="shareArticle('${a.id}')" style="padding:8px 16px;border-radius:8px;border:none;background:#b7794c;color:#fff;cursor:pointer;font-weight:500;transition:0.2s" onmouseover="this.style.background='#92400e'" onmouseout="this.style.background='#b7794c'">🔗 複製分享連結</button></div><div style="font-size:12px;color:#2d4a3e;background:#eef3ef;display:inline-block;padding:4px 10px;border-radius:6px;margin-bottom:10px;font-weight:500;cursor:pointer" onclick="clickTagOrMaster('master', '${a.master.replace(/'/g,"\\'")}')">${escapeHtml(a.master)}</div><div class="detail-title">${escapeHtml(a.title)}</div><div style="margin-bottom:6px">${(a.tags||[]).map(t=>`<span class="tag" onclick="clickTagOrMaster('tag', '${t.replace(/'/g,"\\'")}')">#${escapeHtml(t)}</span>`).join('')}</div>${yt}${imgs}<div style="white-space:pre-wrap;line-height:1.9;margin-top:20px;font-size:16px;color:#2c2c2c;font-weight:400">${linkify(a.content||'')}</div></div>`;
  setTimeout(()=>{
    const el=document.getElementById('detailArea');
    if(el) window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth'});
  }, 50);
  if(push){history.pushState({id:id},null,'?id='+id);}
}
function shareArticle(id){const url=window.location.origin+window.location.pathname+'?id='+id;if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>alert('✅ 分享連結已複製！')).catch(()=>prompt('請複製以下連結：',url));}else{prompt('請複製以下連結：',url);}}function goBack(){history.pushState(null,null,window.location.pathname);document.getElementById('detailArea').style.display='none';document.getElementById('listArea').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}function openImg(s){document.getElementById('modalImg').src=s;document.getElementById('imgModal').style.display='flex';}function doSearch(){currentQuery=document.getElementById('searchInput').value;renderList(true);}function clickTagOrMaster(type, val, e){if(e) e.stopPropagation();if(type==='master'){selectedMaster=val;document.getElementById('searchInput').value='';currentQuery='';}else{selectedMaster='全部';document.getElementById('searchInput').value=val;currentQuery=val;}history.pushState(null,null,window.location.pathname);renderMasters();renderList(true);}function goHome(push=true){selectedMaster="全部";document.getElementById('searchInput').value='';currentQuery='';if(push){history.pushState(null,null,window.location.pathname);}document.getElementById('detailArea').style.display='none';document.getElementById('listArea').style.display='block';renderMasters();renderList(true);window.scrollTo({top:0,behavior:'smooth'});}window.addEventListener('popstate', (e)=>{if(e.state&&e.state.id){showDetail(e.state.id,false);}else{goHome(false);}});function init(){renderMasters();const urlParams=new URLSearchParams(window.location.search);const articleId=urlParams.get('id');if(articleId&&articlesData.some(a=>String(a.id)===String(articleId))){showDetail(articleId,false);}else{renderList();}}init();</script></body></html>
