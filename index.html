常有八萬四千那由他(一萬個億叫那由他)，俱胝就是一百個億叫俱胝，有這麼多的金剛藏王菩薩。\n　　什麼叫金剛藏王菩薩呢?因為這些菩薩都是手持金剛寶杵，還有他的種族，就是他同一類型的。在每一個金剛藏王菩薩當中，他們都有很多的金剛的菩薩眾而為眷屬，晝夜地來保護這個持咒之人。假設這個眾生，他乃至於散亂心，他不是在禅定當中哦，他是念持咒，但是偶爾打打妄想，但他內心當中對這咒語是充滿了信心，心中憶念、口中持咒，這時候金剛藏王菩薩就經常能夠隨從保護這個善男子。這個善男子指的是對楞嚴神咒有信心的持咒之人，但是他不能夠生起正念真如的理觀，得到金剛藏王的保護，而破除障礙。\n　　加持開發：\n　　何況決定菩提心者!此諸金剛菩薩藏王，精心陰速發彼神識，是人應時，心能記憶八萬四千恆河沙劫，周遍了知，得無疑惑。\n　　假設這個人對於菩提心生起決定的勝解，這個人他對大乘經典有深入的理解，對第一義谛有堅定的勝解，生起了菩提心跟大乘的空正見，能夠正念真如，在持咒當中又生起理觀，這時候金剛藏王菩薩精心陰速發彼神識。\n　　精心是指菩薩依止這一念的如來藏心;陰速就是暗中很快速的來啟發這個人的心識。菩薩能夠在真如的心性當中，來啟發持咒之人。這個人能夠有什麼好處呢?能夠記憶自己過去八萬四千恆河沙大劫當中所發生的種種善惡的事情，內心都能夠周遍了知，而沒任何的疑惑，就是產生了宿命通。\n　　其實這個地方就等於是開顯了菩薩的五種神通。蕅益大師說他這種神通不是自力開發的，是菩薩幫他開發的。菩薩怎麼能夠幫助我們開顯神通呢?蕅益大師講出四個字說：以心印心!\n　　金剛藏王菩薩安住如來藏妙真如性，持咒之人他在持咒過程當中，也是正念真如，也是一念不生，念念之間也是隨順如來藏妙真如性，所以他就能夠以金剛藏王那種不可思議的加持力來感應道交，加持持咒之人，使令他快速地成就神通，就是以心印心的道理。\n　　你看我們平常要得佛菩薩加持很困難，為什麼?因為佛菩薩安住在真如本性，我們安住在妄想，這二個磁場不一樣，不是說他不加持我們。\n　　諸佛菩薩對眾生都有發願要加持眾生，問題是我們的心沒辦法順從諸佛菩薩的心，他加持我們加持不進來，問題在這個地方。\n　　所以持咒之人念念之間能夠生起理觀，他就能夠得到金剛藏王菩薩精心陰速發彼神識——依止一念清淨心，冥冥當中來開顯我們的神通的善根。\n　　我們學習大乘佛法，我們發覺，我想我們一個大乘的修行者跟小乘人是不太一樣的。小乘人的心胸是狹隘的，他是觀自己的身心世界，對諸佛菩薩有什麼功德，他一概沒有興趣，也不想去了解;大乘佛法的心是緣十法界的，特別是佛法界的功德，大乘佛法要有一定的信仰。\n　　所以在《八十八佛》說深信諸佛皆充滿。你一個大乘修行者，你要相信諸佛菩薩永遠沒有滅度!佛菩薩因地的時候都發願眾生無邊誓願度，怎麼成就以後滅度了呢?我們在法界當中，佛菩薩有很多磁場在加持我們，阿彌陀佛、釋迦牟尼佛、觀世音菩薩、地藏王菩薩，他們的願力是遍整個法界當中，問題是我們自己要准備好!你只要把你的心調整在如來藏妙真如性，諸佛菩薩的加持自然就進來，就好像月亮它本身很想要照亮我們，但是你這個水要把它弄得平靜，是這個意思，這就是金剛藏王菩薩對我們的加持。\n　　一個受持楞嚴神咒的人，在他未來的生命當中，就不再墮落三惡道當中。\n　　標時至果：\n　　從第一劫，乃至後身。\n　　從第一劫，乃至後身。這個第一劫指的是什麼呢?這段經文是順從前面的發菩提心、受持楞嚴神咒，這段經文是從前面的經文而來的。\n　　這個人他已經產生了決定的菩提心，而且具足大乘的空正見，念念之間能夠正念真如，能夠順從本性而來受持楞嚴神咒。從他開始受持楞嚴神咒當下的色身開始，到他成佛之前的最後一生，這叫做從第一劫，乃至後身。\n　　不生神鬼：\n　　生生不生藥叉、羅剎、及富單那，迦吒富單那、鸠盤茶、毗捨遮等，並諸餓鬼，有形無形，有想無想，如是惡處。\n　　那麼這當中的過程，他生生世世當中，他只要能夠具足菩提心，而回光返照，正念真如，來受持楞嚴神咒，他不生藥叉。\n　　藥叉他是一種捷疾鬼，速度很快的一種鬼，飛行速度很快;羅剎也是速度很快，不過藥叉比較偏重在男眾的鬼，羅剎是女眾的鬼，這兩個都是鬼，這二個都是吃血肉的。\n　　富單那，是臭惡之鬼，身上特別的臭惡，他會引起一個人身上的熱病;迦咤富單那，迦咤就是特別，特別惡臭的鬼;鸠盤茶，厭魅鬼，晚上我們會做惡夢，有些時候是受了鸠盤茶鬼的干擾;毗捨遮，噉精氣鬼，吸人家的精氣;並諸餓鬼，這餓鬼就很多，像焰口鬼、咽針鬼、嘴巴吐火的、或者是喉嚨很小肚子很大的咽針鬼種種的餓鬼;乃至於有形無形，有形色、沒有形色的這種卑賤的眾生;或者有想無想，有想就是鬼神、精靈，無想就是那種精神化成精石、土木的這種;如是惡處，這種具足苦惱卑賤的眾生。我們都不會墮落到這樣的一種鬼神道去。\n　　不生貧賤：\n　　是善男子，若讀若誦，若書若寫，若帶若藏，諸色供養，劫劫不生貧窮下賤不可樂處。\n　　是善男子能夠讀或者是誦，讀就是對著文字來讀，誦就是背誦;或者書寫，書，用毛筆一筆一畫很正式的叫書，比較簡單叫做寫;書寫以後或者攜帶在身上，或者用器具把它儲藏起來，或者用種種的香華蔬果供養在佛堂當中，這個人在劫劫 (從第一劫至最後一劫)不生貧窮下賤不可樂處，就是說他不會生長在卑賤的果報。\n　　這地方值得我們注意的。它這段經文是隨順前面的決定發菩提心的人受持來說，才有這樣的不墮惡趣的效果。這個道理我們去查《大乘起信論》，它有一段開示，跟本經的經文是相隨順的。它說一個人，他經常能夠正念真如，會產生一種真如的內熏，真如本性在內部自然一種不思議熏習業用。\n　　一個人不斷地正念真如，不斷地持楞嚴咒，把心帶回家，這樣子會產生一種真如的一種不思議的業用。有什麼好處呢?\n　　它能夠使令眾生成就二種善根：\n　　第一個，能令眾生厭生死苦，欣求涅槃。你不斷地觀察五蘊身心，都是假名假相，你的心對這樣的一種因緣，安住不生滅心，而保持不迷、不取、不動，你慢慢慢慢對這種生死的果報——淡薄。蕅益大師說，一個人不斷地觀察真如，他的生命會變得比較淡薄，對生死的因緣不生好樂，反而喜歡涅槃寂靜，會使令一個人厭生死苦，欣求涅槃。\n　　第二個好處，他能夠自信己身有真如法，而發心修學。他相信他有真如本性，具足無量的功德，而發心修習六波羅蜜。\n　　也就是說，他能夠生起出離的善根跟菩提的善根。當然這二種善根生起的時候，他就不容易墮落到三惡道去了。因為在菩薩戒上說，一個人他成就菩薩的善根，他會有一種增上慚愧。這種人他有什麼特色呢?雖造惡業，速疾能悔，落墮惡道，終不久留。他造了惡業以後，他馬上能夠產生反省，即使墮落到惡道，也不會久留，因為他那種增上慚愧的心，力量太大了。\n　　我們在正念真如的過程當中，主要有二種的方法：第一個就是依教起觀。就是我們根據本經的語言文字的教法，來生起觀照。比方說佛陀告訴我們經常能夠回光返照：你從什麼地方來?從語言文字的引導當中，念念之間能夠返妄歸真，能夠遠離五蘊的假相，慢慢慢慢地回歸到真如的本性，這個是一種依教起觀;第二個就是你能夠持秘密神咒。我們至誠懇切、一念不生的去持楞嚴神咒，它也能夠達到這種潛移默化之功——密诠實相，秘密當中也能夠引導我們的攀緣心而回歸到不生滅心，也是有這種效果。\n　　這一段佛陀講了八科，來贊歎受持楞嚴神咒所產生滅惡生善的功德。\n　　卯四、同佛功德\n　　持楞嚴咒的人，能夠成就十方諸佛的功德，當然是得到他的少分功德了，不是圓滿的。\n　　常生佛前\n　　功德：\n　　此諸眾生，縱其自身不作福業，十方如來所有功德，悉與此人。\n　　這個地方是說明你受持楞嚴咒，你生生世世會出生在佛前。\n　　此諸眾生，指的是發菩提心、具足大乘空正見的末法時代的眾生。縱然這個人自身沒有因緣來造種種的福德，不能夠廣泛地布施、持戒乃至種種慈善的事業，但是他能夠很虔誠地受持四根本重戒、發起菩提心、正念真如，來受持楞嚴神咒，這樣十方如來所有的功德悉與此人。\n　　十方諸佛的功德有二種：一者福德，一者智慧。從福德的角度，諸佛對眾生是有施捨的力量，福德是約著親因緣來說，他直接施捨給我們;就著善根智慧這一部分，十方諸佛是扮演增上緣的角色，我們能夠得到諸佛的教導、啟發，而十方諸佛這時候扮演增上緣的效果，這是不同的地方。\n　　生處：\n　　由是得於恆河沙阿僧祇不可說不可說劫，常與諸佛同生一處。\n　　因為得到十方諸佛的加持，我們在未來的生命當中，在恆河沙的阿僧祇(無量數)不可說、不可說(十大數中最大的數)，總而言之，就是很多很多數不清的劫當中，能夠跟十方諸佛同時受生在一個處所，生生世世生於佛前，見佛聞法，能夠常隨佛學。\n　　熏修：\n　　無量功德，如惡叉聚，同處熏修，永無分散。\n　　因為得到十方諸佛攝受的緣故，無量無邊的功德就能夠慢慢慢慢熏修而具足。這時受持楞嚴神咒、發菩提心的菩薩——如惡叉聚，同處熏修，永無分散。\n　　惡叉聚是印度的果實，它一生的話畢竟是三顆。表示這個眾生跟十方諸佛經常的生在一處，得到諸佛的教導，永無分散，慢慢能夠成就無量功德。\n　　所以說，你受持楞嚴神咒，念念之間順從本性，就能夠常生佛前。\n　　眾行成就\n　　持戒：\n　　是故能令破戒之人，戒根清淨，未得戒者，令其得戒。\n　　這個人假設在過去的因緣當中，有一時的顛倒，犯了根本重戒，蕅益大師說，犯戒以後一定要如法忏悔，斷相續心，然後再來持咒，才能夠使令戒根清淨。這個過程當中除了持咒以外，一定要經過如法忏悔的過程。\n　　未得戒者，令其得戒。這個人在受戒過程當中，有些因緣不具足，未能具足得戒，因為如法地發菩提心，持楞嚴神咒，也因為持咒的關系而能夠得戒。\n　　得戒體的人當然就是防非止惡，有這樣的善根。我們念念之間能夠回歸到真如本性，就像蕅益大師說的，真如本性具足恆沙的功德，有什麼惡法不能消滅?有什麼善根不能生起呢?我們所有的功德都在我們家裡面，一個人能夠把心帶回家，你自然具足持戒的善根，乃至於精進智慧的善根。\n　　精進：\n　　未精進者，令得精進。\n　　這個人本來是很懈怠，對種種的波羅蜜也沒有太多的好樂，但是他開始持咒以後，內心產生精進，開始對善法產生好樂追求的心。\n　　智慧：\n　　無智慧者，令得智慧。\n　　這個人本來是很顛倒愚癡的，對世間的因緣是很執著的，他持咒以後慢慢慢慢就能夠隨順於我空、法空的智慧，慢慢慢慢就能夠隨順於這種出世間的智慧，來熄滅他的攀緣心。\n　　清淨：\n　　不清淨者，速得清淨。\n　　戒行不清淨的人，他能夠忏悔以後，因為持咒的關系他能夠速得清淨。\n　　齋戒：\n　　不持齋戒，自成齋戒。\n　　他因為色身的因緣，不能受持六齋、十齋日，也因為持楞嚴神咒的關系，自然成就齋戒。\n　　這樣波羅蜜的成就，我們從二方面來開顯：\n　　從自力的角度來說，我們因為受持楞嚴神咒，念念之間順從真如，就會產生一種大乘善根，從大乘善根當中產生增上慚愧，我們很快就能夠產生波羅蜜。\n　　諸位你看很多的修行者，你會發覺，一個人的善根非常重要!這個人沒有大乘善根，今生就很難很難修學，這個是勉強不來的。因為他看到善法，他不生好樂，就完了!你說這個人他有點過失、有點懈怠，但是他善根強，只要被啟動起來，他整個人就改變，這個人還有救。\n　　你看央掘摩羅，佛在世的時候，他殺了九百九十九個人，背負這麼大的殺業，他看到佛陀，照樣在今生成就阿羅漢果，因為他善根強嘛!你看看這個人他平常也不造惡業，但是他看到佛法也不生好樂，那就完了!佛都沒辦法。\n　　當然所有善根的根本就是真如本性，它是一切善法的根本。楞嚴神咒的特色就是，它能夠幫你把心帶回家——密诠中道實相。你不斷地用楞嚴神咒來熏習內心，就會從一種我法二執、無明的心，轉成二空真如的心，它有這樣的一種轉變，它加強你的大乘善根。\n　　第二個，從他力的角度，你能夠得到十方諸佛的感應道交。\n　　蕅益大師說，因為一切諸佛如來，他本來在因地當中，就是要把他無量的福德跟智慧的善根，回向於一切眾生，他本來就有這個願望。當我們能夠順從真如的時候，你很自然的就能夠接收到諸佛的加持，而生長在同一個地方，乃至於快速地成就波羅蜜。\n　　這個地方有自力的因緣跟他力的因緣，有你自己善根的啟發，有諸佛加持的二種力量，這叫做同佛功德。\n　　這個人他過去在沒有持咒之前，曾經犯戒乃至於破戒，而這破戒的業力已經產生遮障了，他能夠一心地持咒、如法忏悔，是可以把罪障滅除的。\n　　破戒罪滅\n　　犯戒：\n　　阿難!是善男子持此咒時，設犯禁戒於未受時，持咒之後，眾破戒罪，無問輕重，一時銷滅。\n　　這個地方是說明滅除破戒的過失。\n　　阿難，在末法時代，發了菩提心、又能夠一心正念真如，來受持楞嚴神咒的這個人，他過去曾經一時的愚癡顛倒，而違犯了佛陀的禁戒。什麼時候違犯呢?在他受持楞嚴神咒之前。違犯以後，他也如法的忏悔，而且斷了相續心，持咒以後他就永遠不再犯了，一心地正念真如、一心地持咒，這樣子眾破戒罪，不問輕罪重罪，這個眾罪就是小乘的四根本，大乘的十波羅夷，都能夠一時的消散滅除。它有這個滅罪的效果。\n　　破齋：\n　　縱經飲酒食噉五辛，種種不淨，一切諸佛菩薩、金剛天仙鬼神，不將為過。\n　　這個地方是說明滅除破齋的過失。\n　　縱然他過去曾經在受持楞嚴神咒之前，有飲酒的過失，或者食噉五辛(蔥、蒜、韭、薤、興渠，五辛熟食增YIN，生食增恚，吃熟的增長YIN欲心，你生吃增長瞋恚)的過失，乃至於你吃了種種不淨物(魚肉等葷食)。在經典上說，你吃五辛是不能馬上去誦經，你在誦經之前一定要涮洗干淨。假設你有食噉五辛、食噉葷食來受持佛法的過失，一切諸佛菩薩因為你持咒忏悔的關系，乃至金剛天神鬼神，就不再追究你過去的過錯，這種破齋的過錯。\n　　這地方講到持咒滅除犯戒跟破齋的過失，這以下說明違背修行儀式的過失。\n　　違式罪消\n　　不淨：\n　　設著不淨破弊衣服，一行一住，悉同清淨。\n　　我們前面講過，你在持咒的時候是要結壇行道，要結八角壇。在行道過程當中，你只要進入壇場，一定要穿清淨的新的衣服。這個人可能他比較貧窮，他也不能穿干淨的新的衣服，他是穿不干淨破舊的衣服，但是他因為很如理如法的來一心持咒，所以他整個行住坐臥當中——等同清淨。雖然他穿了不干淨的衣服，因為他內心安住真如的緣故，也可以說等同清淨。\n　　無壇：\n　　縱不作壇，不入道場，亦不行道，誦持此咒，還同入壇行道功德，無有異也。\n　　這個人他沒有經費來設立八角壇，他也沒辦法進入大眾的僧團當中，也不能夠如理如法的三七行道，但是他一心一意的來持四根本重戒，一心一意至誠懇切的持誦楞嚴神咒，還同入壇行道的功德，無有異也。\n　　前面的壇，諸位看到，三七行道，他是要忏悔、發願，才開始持咒的。\n　　極重罪除：\n　　若造五逆無間重罪，及諸比丘、比丘尼四棄八棄。誦此咒已，如是重業，猶如猛風吹散沙聚，悉皆滅除，更無毫發。\n　　假設這個人過去造了五逆重罪(殺父、殺母、殺阿羅漢、破和合僧、出佛身血)，或者這個比丘、比丘尼犯了比丘的四重、比丘尼八重，他犯了以後如法地忏悔以後，來誦持楞嚴神咒，這個五逆、四重、八重的罪，就好像是生起一道的猛風，吹散聚集的沙堆。沙堆比喻我們所累積的罪業，猛風指的是內心當中那種正念真如跟誦持神咒的力量，就像猛風把沙堆給吹散，一點也不剩下，連一點毫發都不剩下。\n　　這個地方蕅益大師他提出他的看法，他說，盡除業障，它的先決條件是先如法忏悔，如法忏悔以後開始持咒。這地方蕅益大師提出二種差別：\n　　假設這持咒之人他具足理觀，他忏悔以後再持咒，等同阿難;假設他不具足理觀，只是事修，齊同登伽，我們說明一下。\n　　說這個人他有過失，有過失以後他如法忏悔，下定決心永不再犯，開始受持四根本淨戒，開始一心地正念真如，受持楞嚴神咒，他具足理觀，這樣子他不但滅罪，他還可以大開圓解，甚至於能夠轉凡成聖，等同阿難，阿難尊者後來他成就了圓教的初住，所以他前面的發願文——妙湛總持不動尊，就是他發願。\n　　這是具足理觀，等同阿難;假設他理觀不具足，起碼能夠齊同摩登伽女，能夠把他貪愛的煩惱，這種造罪的過失，把它消滅掉。\n　　過去我們的教務主任慧天長老講了一個公案。他說過去在埔裡有一個中年的居士出家，出家做沙彌的時候，因為某種事情跟他師父發生了沖突，他的師父很嚴厲地呵責他。這個人的脾氣可能不是很好，一時的氣憤之下，就把他師父給他沙彌的幔衣，用火給燒掉。這個事很嚴重，把法衣給燒掉，這過失很重的。\n　　後來有人跟他講說，你糟糕了!你把幔衣給燒了，你這過失重了，你要好好地忏悔。他忏悔以後一直不得力。後來有人叫他要發心持楞嚴神咒。他持楞嚴神咒以後，不到三個月，突然有一天晚上做夢，就看到佛菩薩再送他一件新的幔衣。當然這是一種瑞相，滅罪之相，他就是一心地誦持楞嚴神咒。\n　　當然這地方我們前面講過，你一方面誦持楞嚴神咒，念念之間，你能夠回歸到真如本性。安住真如本性，哪有什麼過失不能消滅?哪有什麼功德不能生起?第二個你持咒的時候，得到十方諸佛菩薩的加持，具足了自力、他力二種力量的加持。\n　　所以說猶如猛風吹散沙聚，悉皆滅除，更無毫發，自力、他力的加持。\n　　前面能淨業障，是約著今生所造的破戒、犯齋的過失，這地方是指的你過去生當中，你根本不知道所造的罪業。\n　　積罪未忏：\n　　阿難!若有眾生從無量無數劫來，所有一切輕重罪障，從前世來，未及忏悔。\n　　阿難，若有眾生從過去無量無數劫以來，曾經造了輕罪跟四根本重罪，所以今生修行的時候，總覺得內心好像經常感到暗鈍之相，就是產生罪障、障道。今生修行以後，對這樣的罪障還沒辦法及時的忏悔，還沒有來不及忏悔。\n　　依咒盡滅：\n　　若能讀誦書寫此咒，身上帶持，若安住處莊宅園館，如是積業，猶湯銷雪。\n　　沒關系!你能夠好好地對著本子讀，或者最好是把它背誦起來，或者書寫放在身上攜帶，或者你把它安置在你住處、莊宅(村莊)、園館(你暫住的旅館)，把它供奉起來，那麼你能夠一心地讀誦跟至誠地供養，你過去生所累積的重大罪業，猶如熱湯銷溶冰雪一樣。\n　　速證無生：\n　　不久皆得悟無生忍。\n　　而且你不久皆得無生法忍。\n　　當然你要成就無生法忍，你要具足理觀，要正念真如才可以的。\n　　這個地方是說我們平常會積集很多的善根，比方說我們試著把我們的財物跟人家分享——布施的善根;我們去持戒，別人刺激我們的時候，我們不要發脾氣，有這個善根……但這樣子都是一種小善根，枝末的善根。但是本經所說的善根，是所有善根的根本，就是如來藏妙真如性!因為它是所有善根的根本，它具足無量無邊的珍寶，就像《大乘起信論》說的，如來藏具足無量性功德故。\n　　所以你不管是依教起觀，或者是持楞嚴神咒密诠真如，你就能夠滅除罪障，就能夠成就無生法忍，是這個意思。\n　　在《莊子》這一本書裡面講到一個公案：\n　　莊子有一個朋友是木匠，他種了很多的樹，有一天他找莊子，說我樹林當中有一棵樹很糟糕，長得彎彎曲曲的，又很多樹瘤，說它很大又不是很直，做棟梁也不行，樹瘤這麼多，做日常用品也不行，真的是大而無用。莊子就笑了笑說：你不能說它大而無用，這一棵樹就是因為它長得彎彎曲曲，所以它才留下來，你看那些大的樹都被砍掉了，長得又粗又直的樹都被砍斷了，它能夠生存下來，這是第一個它的作用;第二個，你要是工作累的時候，雙手擺在後面，在這樹下繞一繞、乘涼，诶，樹蔭能夠讓你感到清涼快樂，這就是很大的作用，怎麼說大而無用呢?\n　　這地方就描述了工匠跟莊子的心態是不一樣，工匠的心是安住在生活面，從生活的角度來看這一棵樹;莊子是從生命的角度來看這棵樹，人生的目的就是追求安樂，你在這樹下乘涼，這個就是最大的作用。\n　　那麼生活跟生命有什麼不同?當然生活是生滅的，一時的因緣，那是一種六根接觸六塵，產生的感受，但是生命就不同了，那是一種永恆的東西了。所以你會發覺本經，它對於枝末的修學不是很強調，這個開悟的《楞嚴》，就是你一定要把這個不生滅心找到，因為你找不到不生滅心，你所有的善根都不堅固、很容易破壞，因為你依止生滅心來修學，你整個善根就像沒有家的感覺一樣。\n　　所以，我們的生活一定要跟你的生命結合!生活是一時的，生命是永恆的。就是我們依止不生滅心，來修習種種的波羅蜜——稱性起修，全修在性，你必須把這如來藏妙真如性，跟你所有的善根做一個連結。\n　　持咒之人能夠滿足我們眾生心中所求的願望。\n　　現生願求\n　　求男女：\n　　復次阿難!若有女人，未生男女，欲求孕者，若能至心憶念斯咒，或能身上帶此悉怛多般怛啰者，便生福德智慧男女。\n　　滿足眾願當中分兩段：第一個滿足今生的願望;第二個滿足你來生的願望。先看今生的願望：\n　　復次阿難，假設一個女人結了婚以後，還沒有生出男女，在古代的社會母以子為貴，你要是沒有生子女，你在這家庭中就沒有地位，甚至於可能會被丈夫拋棄，所以她要趕快生出男女。那怎麼辦呢?求楞嚴神咒!她怎麼求呢?很至心地心憶口念，或者攜帶楞嚴神咒，她就能夠生出福德智慧的男女，能夠滿足你求男求女的願望。\n　　求長命：\n　　求長命者，即得長命。\n　　希望能夠長命百歲，他能夠一心地憶念或配戴在身上，就能夠長命。\n　　求果報：\n　　欲求果報速圓滿者，速得圓滿。\n　　他希望在一期的生命當中，果報圓滿是指的他整個資財豐足、衣食無缺。古德在這個地方解釋說，菩薩道啊，這個福德資糧具足，是有利於修行的，不管自利利他，都要具足福德。\n　　求身色：\n　　身命色力，亦復如是。\n　　身，指的是身體健康;命，壽命久遠;色，形色端正;力，筋骨強壯。你能夠求這四種事情，一心的持咒，或者發心能夠配戴在身上，也都能夠滿願。\n　　這以上指的是現生的願望，看來生的願望。\n　　命終往生：\n　　命終之後，隨願往生十方國土，必定不生邊地下賤，何況雜形。\n　　你命終以後，你希望能夠往生到十方諸佛的清淨國土，你都能夠滿願，決定不會生長在邊荒之地、貧賤之家，更何況是地獄、餓鬼、畜生種種的雜形。\n　　因為你誦持神咒，念念之間順從真如本性，念念之間得到十方諸佛的加持，所以就能夠滿足你的眾願。\n　　能夠保護一國的國土跟人民，消除種種的災難。\n　　國土消災：\n　　阿難!若諸國土，州縣聚落，饑荒疫疠，或復刀兵，賊難斗诤，兼余一切厄難之地，寫此神咒，安城四門，並諸支提，或脫阇上，令其國土所有眾生，奉迎斯咒，禮拜恭敬，一心供養，令其人民，各各身佩，或各各安所居宅地，一切災厄，悉皆銷滅。\n　　這個地方指的是國土，一個國家能夠發心的受持或恭敬供養，能夠消災免難。\n　　假設在一個國家的國土當中，或者是州縣聚落(州，指地方比較大的叫州;中等的叫縣;最小的就是聚落，就是村莊)，不管是州縣或者是聚落，饑荒疫疠。遇到了饑荒，就是干旱五谷欠收，糧食不足;或者是疫疠，就是氣候不正常，會產生流行病毒，有種種流行的疾病;或者是刀兵劫，國與國發生戰爭;或者是賊難，國家很多盜賊，治安很不好;斗诤，國家的政治不安定，人人之間很多的斗诤;兼余一切的惡難，包括風災、水災等等。\n　　如果這個國家的人民能夠書寫神咒，安在城的四個門，因為在古時候，城是一個人經常往來的處所，你放在四個門，每一個人都能夠瞻仰、恭敬瞻仰，而成就善根。或者把它放在支提(僧伽藍)——寺廟當中，或者把它繡在脫阇(幢幡)之上，使令這個國土的眾生都能夠很恭敬的心來迎接、禮拜、恭敬，一心供養神咒。\n　　有些女眾她平常不外出的，她也沒辦法看到城門的神咒，或者是寺廟裡面的神咒，怎麼辦呢?令其人民，各各身佩。沒外出的人就身上攜帶，或者在他自己所居住地方的佛堂當中一心地供養，那麼種種的天災人禍，悉皆消滅。\n　　這地方講國土消災，以下講人民的豐樂。前面是約著依報，這個地方講正報。\n　　人民豐樂：\n　　阿難!在在處處國土眾生，隨有此咒，天龍歡喜，風雨順時，五谷豐殷，兆庶安樂。\n　　佛陀招呼了一聲阿難尊者，凡是有楞嚴神咒所在之處，國土的眾生都能夠一心地讀誦、都能夠安置供養，這國土當中天龍八部會歡喜，所以風調雨順，五谷豐收。兆庶：兆就是十億，很大的國家;庶就是人民，都能夠安穩快樂。\n　　前面是約著國土來說，消災免難，這地方是人民都能夠身心安穩。\n　　離障安眠：\n　　亦復能鎮一切惡星隨方變怪，災障不起，人無橫夭，杻械枷鎖不著其身，晝夜安眠，常無惡夢。\n　　楞嚴神咒也能夠鎮伏一切邪惡的凶星。凶星是怎麼回事呢?隨方變怪。它隨著東西南北的方所，做種種的變化作怪。這個凶星的變怪不是普遍的，它是在某一個地方，比方東邊或者西邊，看到整個天上是變成紅色的，或者出現二個太陽等等。這樣的凶星就會產生災難了，我們能夠一心地讀誦楞嚴神咒，或者安置佩戴，這一切的災難、障礙就不會生起。人民沒有橫禍跟夭壽，約著大人是橫禍，約小孩子來說是夭壽。\n　　杻械枷鎖不著其身：這個杻械是扣在手上的刑具，枷放在頸部的刑具，鎖是腳上的刑具。因為誦持楞嚴神咒的關系，人人都能夠順從真如本性，所以就沒有犯罪的事情，也就沒有牢獄的災難;白天晚上睡覺，也特別的安穩，沒有不祥的惡夢，離開障礙就沒有種種的惡夢。\n　　惡星不現：\n　　阿難!是娑婆界，有八萬四千災變惡星，二十八大惡星而為上首，復有八大惡星以為其主，作種種形出現世時，能生眾生種種災異。有此咒地，悉皆銷滅，十二由旬，成結界地，諸惡災祥永不能入。\n　　佛陀告訴阿難說，在我們娑婆世界當中，到了末法時代的五濁惡世，有八萬四千災變惡星。八萬四千的意思就是說，因為我們眾生的心，有八萬四千個煩惱，所以招感八萬四千個隨方變怪邪惡的凶星。在八萬四千當中其中有二十八個(東西南北各七個)，大的惡星是上首，這二十八當中又有八大惡星，是主要災難的根本。這種種的惡星經常做種種變怪的形狀，有時天上出現種種怪異的形狀，帶給眾生種種的災難、怪異的現象。只要有人能夠一心地讀誦、安置神咒，在十二由旬之內，就結成一個結界之地，種種的邪惡之星，永遠不能侵入這十二由旬之內。\n　　我看宣化上人的開示，他說，到了末法時代，要是楞嚴咒已經沒有人受持了，沒有人配戴供養，那麼整個妖魔鬼怪就會出現。其實某種程度來說，楞嚴神咒的法力還是把很多災難給鎮住了。\n　　在修他力法門當中，我覺得念阿彌陀佛跟持楞嚴咒，這二個是很特別的。念阿彌陀佛叫順從本願，念念之間仰仗彌陀的四十八願，它所強調的是佛力不可思議;持楞嚴咒是法力不可思議!楞嚴咒的法是十方諸佛一念的如來藏妙真如性顯現出來的，它不是有為法，它是無為的心佛所顯現出來的，所以它有密诠真如實相的力量，念念之間就會讓你很自然而然的正念真如，很自然的把心帶回家，很自然地會讓你產生增上慚愧、產生廣大的菩提心的善根，你很自然就喜歡去修六波羅蜜。所以楞嚴神咒是從根本上來調整你的體質。當然阿彌陀佛是讓我們求生淨土，一個是正念真如，一個是順從本願，這二個各有特色。一個是佛力不可思議，一個是法力不可思議，這二個好好地運用，都有它不可思議的加持力。\n　　這個地方是講到能護國界。\n　　前面佛陀以八段來講到資糧位的菩薩，你能夠至心地讀誦、或者一心來供養，就有滅惡生善的效果。下堂課講到總結，當然最重要你要有信心，你要不生疑悔，對這樣的楞嚴神咒、對這個咒心，你要有很堅定的信心，然後整個身心世界通身靠倒，真的是把心跟咒，咒力順從真如，那個力量才會發揮出來。如果你產生妄想，那就是產生抗拒。其實你念佛也好、持咒也好，你一旦產生妄想，你就開始抗拒。就像善導大師說的，念佛的時候打妄想：诶，我可不可以往生?你就在抗拒本願嘛!你的心對阿彌陀佛本願開始抗拒的時候，他怎麼加持你?所以信心的意思就是順從的意思，你對這個咒的力量不要抗拒，它自然會引導你。\n　　你看《了凡四訓》說，那畫符的人，外道畫符，為什麼它有效果呢?他符在畫的時候，他要一氣呵成，一念不生。符在畫的過程當中，只要中間有中斷，或者打一個妄想，這個符就沒有效果，因為他的心要完全順從這個符，你把心空掉了，這個符咒才能產生引導的力量。當然這個符是外道的法，跟楞嚴咒差多了。\n　　我們道理是說，所有的咒語要對你產生力量，你對這個咒語要順從、完全順從!不要有自己的我知、我見!念佛也是這個道理。你念佛的時候打妄想，你就是在抗拒佛陀;你持楞嚴咒的時候打妄想，你在抗拒真如嘛。你抗拒真如他當然就沒辦法加持你，不是他不加持你，是你不想被加持。\n　　所以我們在修行過程當中，你內心順從，就像梵網經菩薩戒，一個菩薩修行最重要是孝順心，百孝不如一順，要順從三寶、順從真如、順從彌陀的本願，你的進步就很快。你要把順從這二個字掌握住了，你修行的力量就不同!念佛的時候順從彌陀本願，持楞嚴咒的時候順從真如本性，你的力量很大、非常大，十方諸佛絕對不妄語的。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188118","master":"惠空法师","title":"祖師禪-惠空法师","youtube":"","images":[],"tags":["禪"],"content":"https://u.pcloud.link/publink/show?code=XZXvro5ZTd10CeVQlypnVjgIMaQ34HnLPCg7\nPDF在這","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188117","master":"淨界法師","title":"靈峰宗論導讀-淨界法師","youtube":"","images":[],"tags":["菩提心"],"content":"蕅益大師寫的\n\n「不怕念起，只怕覺遲。」\n這句話， 一聽就知道是「性宗」的思想。「不怕念起」，這個「念」是指我們現前的「生滅心」，有 時候起善念、有時候起惡念。不過這地方偏重在惡念，跟煩惱相應的惡念。就是：我們修 行人，不怕煩惱生起，只怕我們覺照的正念來的太遲。\n\n「真如緣起」的思想，所強調的緣起，是約「現前一念」的迷、悟而安立的；所以是當下 的「一念相應一念佛，念念相應念念佛」\n\n\n『當處出生，隨處滅 盡。』剎那生起、剎那滅去…當然，它不是父母所生，是怎麼有的呢？也不是上帝創造的， 而是我們一念的「堅固妄想」所現的影像！一念強烈的「愛取」執著，而來受生的！『剎 那剎那念念不住，的確非父母所生。』蕅益大師這時所悟到的，是「大乘空性」之理。\n\n\n大乘的思想是：你現在有胞胎，但是你能夠 明白現前這一個胞胎，是「因緣所生法，我說即是空」，剎那剎那無常生滅，「有」等於 「沒有」。所以大乘的空性是當下的，他能覺照「色法」當下就是「空」。為什麼是「空」 呢？因為它不真實，如夢如幻。\n\n \n\n性宗：\n「性宗」的思想是講「一切法因緣生」，是 「真如受熏」的因緣。無差別的清淨本性\n相宗:\n阿賴耶識受熏，阿賴耶不清，無差成差受薰陶拜佛。「把心帶回家！」\n性就是本自清淨、相就是惡可薰\n\n天台宗智者大師，有大智慧的境界，就把性、相二宗 統一起來---現前一念心性具足染、淨的心識，有雜染性，也有清淨性。\n\n\n「性具」十法界，是「本來如是」，它不是「因緣所生法」。不是因緣所生法，你就不能 斷；因為你的本來面目，就具足染、淨二法。\n\n佛 為法王，於法自在\n「天台宗」給我們一分很大的信心，它告訴你「沒關係！」 雖然無量劫來造了很多的 煩惱、造了很多的罪業，但是你那清淨光明的本性，永遠不會受染汙。\n\n\n\n蕅益大師\n《楞嚴文句》：這部註解，可以代表蕅祖「開悟」的思想。《楞嚴經》所修的是 『首楞嚴大定』，依止一念清淨心，所以強調「正念真如」，而《楞嚴文句》是開顯真如本性最重要的經典。我們一念心性的本來面目是：「即空、即假、即中」。觀現前一念心 性--即空、即假、即中，剛出家的小沙彌，他也能夠這樣講，但是當你把《楞嚴經》十卷 經文看完之後，再來體會現前一念心性「即空、即假、即中」，那就有不同的感覺，因為 《楞嚴經》講得非常詳細--它講「即空」講得深入，講「即假」講得廣泛…六道眾生的種種差別，牠為什麼做一隻動物？這一類的動物，為什麼會有這樣的習慣？這些各式各樣的 差別，都有做精要的說明。\n\n\n名譽及利養，愚人所愛樂； 能損害善法，如劍斬人頭。\n誦帚師~\n\n佛教將生命體分成三類：\n一、「正定聚」：就是你那一念心對於佛法的道理--業果、空 性、真如的道理，已經如實的安住。遇到任何染汙的境界刺激你，你都能夠隨順於真理而活動，這是聖人的境界，屬於正定聚。\n二、「不定聚」：不定聚的眾生，心念是不決定的； 遇到染汙的境界，他就造罪業，遇到清淨的境界，他就創造功德，他的內心是不決定的。\n 三、「邪定聚」：他內心的煩惱跟邪見特別的堅固，遇到三寶的境界，乃至遇到大善知識的 境界，他還是一樣會生起惡念。\n\n\n這一切法，是由身口意造作的，但是我們的心念才是引導者，所以真正的造作者 是我們的心念。換句話說，「身業」跟「口業」只是一個工具，「意業」才是真正的先導者、主宰者、造作者。\n\n\n我們怎麼判斷我們的業行，是清淨的？是染污的？就是以我們那一念的「心念」---一切 法正，一切法邪！\n\n修學聖道最嚴謹的、最重要的關鍵，不在於外表的判斷，而是在「起心動念」的微細處做 判斷！\n\n\n\n只要你發心的根本是正確的，在過程當中，縱然遇到各種風風雨雨，這艘 船依然往目標接近，隨著時間的增長，煩惱會慢慢淡薄。如果你一開始就走錯了，那出家越久，煩惱反而越重，到最後誰也沒辦法。\n\n一部『楞嚴咒』誦下來，那也是一個加行，每天拜一部八 十八佛，都是一個加行。問題是：你這個「加行」，是加行在什麼地方？如果你一開始是 依止煩惱而修行，那剛好加行在煩惱上，以後就是一個魔王；如果你依止的是菩提心、空 正見，那就是成就佛道的資糧。\n\n\n法界圓融體，作我一念心，故我一念心，全體是法界。\n\n經云：「三界無安，猶如火宅；眾苦充滿，甚可怖畏。」 \n論云：「已作地獄業，云何安穩住。」\n\n在我們的內心當中，已經存在「地獄的罪業」，它雖然暫時還沒有發動出來，但是在未來 流轉當中，總有一天會發動出來！\n\n今生只是暫時的因緣，即使犧牲今生的安樂，可以換取來生究竟的安樂，還是值得！只要我們不離開生死，遲早又會墮到三惡道去！\n\n蕅益大師的金剛之眼指出：應該要以遠大的慧眼，曠觀無始輪迴──在思考生命的時 候，要從現前的身心世界超越出來，看到你過去在流轉當中所受的痛苦；同時也看到假設 你不離開輪迴，你未來所要面臨，無量無邊的三惡道痛苦，這時候『此生果從何來，死後當至何趣。』對於三界，就能生起真實的怖畏心、出離心。\n\n\n「菩提心」的相貌\n1.先觀察「自身的痛苦」\n2.「諸佛以苦為師！\n3.「菩提心」是建立在「出離心」的基礎之上！\n4.「研真窮妄」，成 事不必在我，隨喜一切功德！」有人做，就可以了。我看到別人做，我隨喜讚歎。因為你能夠調伏自我，所以你在修善業的時候，就能夠隨喜一切的功德，\n「十方一切諸眾生，二 乘有學及無學，一切如來與菩薩，所有功德皆隨喜。」\n \n神通很容易引生邪見。怎麼說呢？這個外道 他有八萬大劫的神通，往前觀察八萬大劫，往後觀察八萬大劫，八萬大劫以後的生命，他 完全看不到，只是一片的黑暗。\n\n《楞嚴經》上說：「因緣和合，虛妄有生，因緣別離， 虛妄名滅。\n\n「離陰計我」：這是說離開五陰身心，另外還有一個「我」住在五陰當中；「然離身心， 又喚何物作己？」那麼你說離開我的身心世界，有一個明了的、不生不滅的「我」，請你 說出那個「我」的相貌來？實際上講不出來。所以離開了五陰，也不是我。(「五陰身心」就是指我們的果報體。十法界的果報體，就是五陰：受色想行識。所謂 「空正見」)\n \n請你說出『我』的相貌是什麼？\n外道講不出來，因為你講出任何一個 法，都離不開「色、受、想、行、識」。佛陀說生命的本質只是五陰--色受想行識，但是 佛陀並沒有說「色受想行識」就是『我』，沒有說有一個『我』。外道講不出「離陰計我」 那個『我』的相貌出來，因為這個『我』是他自己捏造出來的。\n\n「觀一切法空」，但是反過來 「此見及緣，元是菩提妙淨明體。」\n\n\n寂靜當中先修「止」，\n先把內心的散亂調伏下來，在寂靜的心中觀察生命的真相。這時候就是「思惟」---思惟生命的緣起。\n\n你在修觀的時候，怎麼去揀別「外道的神我」跟「佛法的佛性」呢？ 《楞嚴經》告訴我們說：外道的神我，他有「自性執」，也就是有「能、所」，所以 「外道的神我」跟一切法是一分「常」，一分「無常」；我是「常」的，你是「無常」的， 是對立的。一分「常」，一分「無常」，這兩個有非常明確的界限。\n\n蕅益大師說：「你沒有高超的見地，就不可能有高超的品格。」\n\n不懂淨土法門的人，會說：「唉呀，你們修淨土的人真顛倒，你看彌勒淨土那 麼近，就在欲界；西方淨土『從是西方過十萬億佛土』那麼遠，你們為什麼要捨近求遠呢？」 如果我們的心是經常向外攀緣的，就會被這個觀念障礙住。是啊！唉呀！太遠了，坐飛機 要坐多久！但是，如果我們不向外攀緣，反觀現前一念心性---十萬億佛土，不離我現前一 念心性之外，因為「心性本無外故！」距離，哪是什麼障礙呢\n\n永明延壽大師的《宗鏡錄》，\n永明延壽大師解釋「宗鏡」，什麼是『宗』 呢？『立一心為宗』。「一心」即是「體性」，雖然有無量無邊的因緣差別，當我們把這 些差別相撥開之後，看到我們內在的本來面目--靈靈覺覺、清淨本然的本性，這就是「一 心」，這是發明體性。而它的作用是--『照萬法如鏡』，它能夠隨順染淨的因緣，變現十 法界不同的差別，就像鏡子一樣，顯露無遺。\n\n\n怎麼去觀察現前一念心性呢？有「空、假、中」三個觀法：\n一、「空觀」\n《中觀論》說：「諸法不自生，亦不從他生，不共不無因，是故知無生。」\n二、假觀\n只要我們動一個念頭！這一切法就出現了，「當體即假」。 也就是雖然說一切法空，因為我們在這當中，不斷不斷的起心動念-\n\n三、中觀\n心外無法，法外無心，於其中間無是非是，豈非即中。\n\n\n三觀修行次第：\n空假中。\n\n假觀的論述\n「唯識宗」觀這一念心「即假」，它的態度是否定的成分多。是說我們這一念心一活動， 就帶動「第七意識」的恆審思量---「恆審思量我相隨，有情日夜鎮昏迷。」因此「唯識學」 認為：每一個眾生這一念心都有煩惱罪業。\n\n「天台宗」的觀心偏重在肯定：「自知我是未成之佛，諸佛是已成之佛，其體無別。」 像：密宗、天台宗、淨土宗，也都是這種思想。「淨土宗」是用什麼心情去念佛呢？「阿 彌陀佛」是萬德莊嚴，不離開我一念心性，我一念心性雖業障深重，也是不離開阿彌陀佛 的心性。\n\n什麼是「圓頓止觀」呢？\n無不從此法界流，無不還歸此法界。\n\n我今此心，全真成妄，全妄即真\n我們這一念心的相貌，當「迷」的時候是--「全真 成妄」--全部的真心，全體是妄想；當「悟」的時候--「全妄即真」--全體的妄想變成全 部的真心；這就是大乘的「不二法門」\n\n你這一念打妄想的心，本性的全體大用，它的本性就是真如\n\n天台宗講「正念真如」，這個『念』有兩層意思\n1.\t「對治義」：當我們明白當下這一念心是「何期自性，本自清淨」時，我們仍然會 依過去的習氣，打很多如夢如幻的煩惱跟妄想，所以這時候的「正念真如」就是：「棄生 滅，守真常」，依止「空性」而不動此心，來調伏你的妄想。當然你的調伏方法，可能是 念佛、可能持咒--以如夢如幻的佛號，對治如夢如幻的妄想，所以「正念真如」剛開始是 對治義。\n2.\t「隨順義」：當煩惱妄想越來越淡薄時，你就漸漸能夠安住在真如境界當中。 因此，有時候它是一種「對治」，當煩惱活動的時候，正念真如是「對治義」；當煩 惱不活動時，這時候正念真如是「隨順」---念念隨順真如。所謂：保持這一念心清淨本然， 而佛號卻是歷歷分明；雖然佛號歷歷分明，而這一念心還是清淨本然。這時候的正念真如 就是隨順「即空、即假、即中」的境界，念念朝這個理念去做，即能念念趨向於無上菩提。\n\n什麼叫「稱性起修」？就是：「凡事盡心盡力，成敗交給業力！\n\n空觀正見：\n1.\t沒有一個「常一主宰」 的「我」，這就是「我空的真理」。\n2.\t這時候，可以觀察到整個造業的本質，就是一念流動 的「心識」在造業，這當中沒有一個「我」的存在，息滅了我們「有所得」的心，使令我 們的心跟平等法性相應，也讓我們看到了廣大的生命。\n3.\t以「空觀」來消滅我們的「自性執」， 這就是第二個「空觀的正見」。\n\n「真如」：\n在畢竟空當中，那個明了的分別心性，它是恆常存在的。這時候，我們看到了不生不滅的「佛性」，因此而觸發我們的大悲心，去上求佛道、下化眾生。\n\n蕅益大師說：\n我憶念末法時代，眾生的痛苦很多，最大的痛苦就是「破戒」的痛苦。 因為破戒能招感兩個果報：第一、現生的痛苦：破了戒之後，你的內心當中有罪業，使令 你經常感到恐懼不安--弟子心不安。第二、來生的痛苦：你會因為破戒的因緣，而墮落到 地獄去，去受刀山油鍋的痛苦。\n\n\n是報身佛--「盧舍那佛」。「盧舍那」翻成中文叫「淨滿」：諸惑消滅謂之「淨」，內 心當中無量無邊的煩惱和罪業，諸惑已消滅叫做「淨」，這是約破惡來說；什麼是「滿」 呢？「眾德具足曰滿」，無量無邊的三昧陀羅尼都具足了，這叫「滿」。\n\n\n「戒法」有兩個特色：\n1.\t有本期誓。斷惡\n2.\t偏該生境。持戒所緣境\n\n\n《在家備覽》中說：即使你今天不小心犯了一條戒，傷害到一個眾生，其實你毀 壞的，只是你其中的一個戒體而已，你對其他的眾生，都還是清淨的，因為你在因地所成 就的戒體是--「法界塵沙二諦等法」，是對無量無邊有情、無情的境界而發起：誓斷一切惡， 誓修一切善，誓度一切眾生。你的量是非常廣大的！所以，持戒的功德跟修善不一樣，修 善的境界，只是單一的所緣境。\n\n\n\n《靈峰宗論》，基本上分成五科，這五科就是發心、正見、持戒、止觀 跟淨土。\n\n「菩提心」和「正知見」，它就是根本法門，就像一棵樹的樹幹一樣。\n\n\n「偏、圓、權、實」的差別。\n「偏」：就是它不合乎中 道，凡夫著「有」，凡夫的心情是有所得的；\n但是二乘偏「空」，二乘歡喜空性，對於積 功累德、成熟眾生、莊嚴淨土不生好樂，這都是偏於一邊的；\n大乘菩薩他能夠觀察，即空、 即假、即中，真俗雙照，\n這是「圓」；當然也有「權」跟「實」，方便、或是究竟的功德。 或者我們說「偏、圓」是約著因地的功德，「權、實」是約著果地的功德；因地有偏、圓 的不同，果地功德就有權、實的差別。\n\n佛陀知道我們抗拒煩惱的困難，所以祂在我們的心中，先栽培一個無漏的種子。先把 這個種子種下去，然後這清淨種子，就慢慢的擴散、慢慢擴散…「如是展轉，能靜妄源」。 所以，如果我們沒有受過戒，對於抗拒煩惱就有困難，因為你沒有戒體的幫助。\n以有受過戒，跟沒有受過戒的人，那是不同的！冥冥當中多了一層保護的力量：「於 諸過境，能憶、能持、能防。」它就是有這種力量！\n\n\n海公長老，他講一個觀念\n「從究竟義來說，我 們寧可受戒、破戒而墮落，而不要不受戒，修善而生天。\n\n \n\n「一念心性」有兩個內涵：\n1.\t《唯識學》它是以「阿賴耶識」來解釋一念心性\n2.\t「真如佛性」它沒有所謂種子的觀念；「真如受熏」，你用雜染法熏真如---「真如全 體不變，全體隨緣。」全體變成了雜染法；你用清淨法熏真如，全體變成清淨法。「真如」 是不可以分割的，它的緣起論是全體性的，同一個真如，它也可能變現雜染法，它也可能 出現清淨法。所以真如的思考，是一種「絕待圓融」的思考，也是大乘佛法的一種不二法 門。\n\n「密詮實相」。\n這個『咒文』是不能翻譯 的，但是當你這一念心跟咒語接觸的時候，這個咒語有加持力，能夠引導你趨向諸法實相， 這叫「密詮實相」，就像『楞嚴咒』，秘密地含藏諸法實相。\n\n『楞嚴咒』的每一字、 每一句，全體就是「一真法界」，是真如的全體大用，那是『真如實觀』。如果觀察到「能持的心」如夢如幻，「所持的」音聲也如夢如幻，這當中無我、無我所，即為『惟心識觀』。 其實「密教」也是一種「他力門、果地教」的法門，跟「淨土宗」完全一樣。我們舉 個例子來解釋，就清楚多了。譬如我們念佛，對於『阿彌陀佛』可能有兩種理解： 如果我們認為：『阿彌陀佛』這一句名號，它不是阿彌陀佛的功德，只是一個如夢如 幻的聲音而已，但是它能夠慢慢的引導我們，趨向於阿彌陀佛的功德，這是「唯心識觀」 次第漸進的修學。\n\n愛著我們自己的色身，謂之「身見」。\n用種種的營養，來滋潤這個色身，用種種美好的衣服，來莊嚴色身，產生了「身見」；而且我們也愛 著別人的果報體，那就是男女的「婬欲心」。\n\n這都是由於我們對色身有錯誤的認知，認為 這個色身是清淨的，才會產生這種貪愛的煩惱。所以在對治義上，我們應該引導我們這一念心，去看透色身的真實相，以息滅我們的煩惱，是這個意思。\n\n\n一個人，不修「無我觀」，想要改變自己，非常困難！\n「有我罪即生」---一個菩薩是「我」、「法」都不可得，「誰」去做什麼事？這一反觀， 內心自然靜下來。這種自我調伏的功夫，也是很殊勝的！\n\n\n「一切法因緣生」，你對它有愛取，這件事情對你就有影響力！\n\n什麼是「生命的真實相」？\n簡單說就是：「萬法唯是一心」，生命就在你一念之間。\n一個是「迷」，一個 是「悟」。一念的迷惑，隨順妄想，那就是無量無邊的生死；一念的覺悟，隨順了真如，那 就是不生不滅的涅槃現前。\n\n\n這個很重要\n1.你的心改變了，這個「業」就會有變化，這就是：心能造業，心能轉業！\n2.「試思！平日起惑造業，畢竟是誰？今書經懺悔，又畢竟是誰？」\n3. 我不要了，就換一間新房子，但是住在裡面的人是一樣的。換句話說，果報體改變了，但是那個「我」是不 能改變。其實，這就是一個迷的境界，執著有一個「我」。\n4. 這個「我」是過去的、 還是現在的、還是未來的？提出一個「疑情」。\n5. 這個「我」最怕的就是你「迴光返照」。我們平常要是這一念心，老是在外境-- 色、聲、香、味、觸、法活動，不斷攀緣外境，一直覺得這個「我」是存在的，但是你一 迴光返照：『果覓之了不可得，則罪福無主名真懺悔，阿難所以頓獲法身，性比丘尼所以 成阿羅漢也。』\n\n\n蕅益大師\n一、『應念身世苦空，切莫隨流逐隊。\n二、『衣取蔽形，莫貪齊整，食取克餒，莫嗜美味；嘗省此世前生，作何功行， 可坐享檀施。』\n三、『十二時恒簡點身口意業，善多邪ㄧㄝ？惡多邪？無記多邪？堪消四事邪？不堪 邪？\n\n總結：『如此慚愧覺悟修省，自然習氣漸消，智光漸露，祖意佛意，顯於一念清 淨心中矣！』\n\n\n理可頓悟，事須漸修。\n依修學的次第，剛開始還不能去歷練，因為你內心 沒有法寶，逆境一刺激，你可能就會退失道心。所以我們對初學者應該要保護；因為他的 善根太薄弱，就像小幼苗，需要在溫室中保護。你一下子送他到外面去，經風雨吹打，他 就「我不修行了！」，退失道心就糟糕了。所以才說：剛開始要在靜中聽聞正法，如理思 惟，先明白生命的真相。之後，想要進一步的突破，那你一定就需要逆境，在人我、是非、 成敗、得失中去歷練。慢慢、慢慢的，你就會從逆境的刺激當中，用佛法來反省自己、檢討自己。\n\n「逆境」能夠把文字的佛法，轉成心中的智慧，這個逆境非常重要！ 不過，這個逆境的出現，應該是你「果達妙理」之後；是你明白道理之後的歷練，會 更好；否則你可能會生起瞋恨心，就結惡緣了。\n\n1.深明苦、空、無常、無我觀門。\n2.消盡塵寰妄想\n3.覷破此身虛幻\n4.願寬心耐意，安忍無厭，作隨緣消舊業想，轉重令輕受想，代眾生受苦想。\n\n眾生的苦，是從他自己的「妄想」生起的，佛菩薩不能深入到眾生的妄想當中，把他的苦 消滅，因為「既從心起，還從心滅」。\n\n，我們好不容易每天起來誦『楞嚴咒』、『拜八十八佛』，積集很多的功德。要得到這些功德也不容 易，減少飲食、減少睡眠，勉強自己，才積來的一個功德，但是煩惱火一活動，就把它給 破壞掉了，「奪功德法財故，名之為『怨賊』」。所以，我們一開始就先思惟煩惱的過患，然後呵責煩惱。其次「調停」，用對治的觀法：多貪眾生不淨觀，多瞋眾生慈悲觀，多癡眾 生因緣觀…以各式各樣的觀法來調停；「取令平復」，使令它漸漸地減少、消滅。\n\n\n「修行要倚眾靠眾！」他老人家講出一個譬喻說：我們洗這個馬鈴薯，你 一個一個洗馬鈴薯，要洗很久、很久。怎麼辦呢？你把很多馬鈴薯放在一起，互相的磨練， 你磨我、我磨你…欸！全部都洗乾淨了。\n\n我們剛開始學佛，就把精神、體力耗損在世間法，這是非常可惜的！\n虛妄的境界：好比是「渴鹿追求陽燄」---如口渴的鹿，在曠野中追求陽燄以為是水， 其實水是不存在的；「勞你會思量，終歸罔象」，當死亡一到來，無常大火，就會把你今 生所學的這些學問、名言全部破壞掉，下輩子再來的時候，還是搞不清楚狀況了。\n\n\n罪業是不能破壞善根\n\n佛法的關鍵就是「熏習」，你必須不斷的熏習；栽培一分，就有一分的功德；栽培十分，就有十分的功德，因為它稱合本性故！\n\n我們今天是選擇「佛力接引」，仰仗阿彌陀佛本願的攝受，以超脫三界，那就「事 易功頓」；「事易」就是他本身不用斷煩惱，可以帶業往生，重點在保持臨終的正念---臨 命終時，心不貪戀，意不顛倒，正念分明…這就容易多了。而且在功德上是「橫超三界， 圓證三不退」，這個功德也是頓超的。\n\n\n我們的信心不真實，願力也不深切，修行也是打妄想，終日悠悠泛泛，雖然佛陀 大慈悲把船都準備好了，但是我們不肯去登船，那佛也沒有辦法了\n\n「佛力」的法門還是有「自力」的成份，就是：你還得要登船才算！\n\n成佛之道，你有兩個選擇\n1.\t你願意在有漏的世界，生生世世轉世，在這個地方發菩提心、懺悔業障、積 集資糧，直到成佛為止。這樣的人也是精神可嘉，我以這個有漏的果報體：「不能念、要 他念；煩惱不能斷、要它斷」，抗拒你的煩惱障、業障、報障，一生一生的增上，直到成 佛為止，這也是一種選擇，佛陀也同意這樣的修行方法---發菩提心，修六波羅蜜，積功累 德，成就佛道。\n2.\t「為菩提道求生淨土」：我們思惟一個資糧位的菩薩，在止觀力薄弱的情況 之下，好不容易在汙泥當中、無量無邊的無明妄想當中，開了一朵小蓮華，菩提心。我們 為了保護菩提心的緣故，先往生到淨土去，那裡的身心世界沒有障礙。\n換言之，它的方法是先成就 聖道，然後再積功累德；先到淨土去成就「不退轉」的功德，然後再回入娑婆。這時候再 以法身菩薩的身分，住持正法，續佛慧命；以聖人的身分來住持正法，不要以凡夫的身分 來住持正法，那就比較莊嚴，那又不同情況了。\n\n\n先到淨土去成就聖道，必須具足「信願行」三資糧\n阿彌陀佛在我們的心中，會隨順我們心的因緣而變化；所以極樂世界是存在我們的心中！\n\n\n我們要出離三界的生死，有兩個主要法門\n1.\t自力的法門，一分的戒 定慧，成就一分的解脫；二分的戒定慧，成就兩分的解脫，它是經過一層一層的次第。\n2.\t「佛力的法門」，是說：我們在臨命終時，在一種寂靜明了的狀態當中，用我 們所修集的信願行三資糧，來跟阿彌陀佛的大悲心感應道交，而往生到阿彌陀佛之國土去。\n\n1.「念佛工夫，祇貴真實信心。」\n2. 要信我是未成之佛，彌陀是已成之佛，其體無二。\n3. 我們「念佛」是一種真實的功德--稱性的功德。我們過去造罪業，是依止「妄想心」，是 一種妄想的境界，妄想是敵不過真實的\n\n\n修學淨土法門，常見的信心障礙在那裡呢？主要有兩個\n1.\t信力不深\n2.\t又欲捨此別商。三心兩意---擔心只靠「阿彌陀佛」恐怕 是不夠，再兼念地藏王菩薩、觀世音菩薩…今日張三、明日李四，結果時間都給空過了。\n\n\n怎麼知道自己佛法的修習，是不是有進步呢？\n是不是得力呢？ \n蕅益大師講了一個判斷的標準，就是：『世情淡一分，佛法自有一分得力。』我們經 過佛法的熏習之後，會發覺世間的感情雖然還是有，但是比以前淡薄一點。這表示什麼呢？ 表示你不斷的熏習佛法，這個法義已經深入到你內心了，你跟法義開始相應了，這是一個 判斷標準。\n\n\n在生死流轉當中，我們遲早會遇到三惡道的 苦、刀山油鍋的苦，就算你升到天上去，也要嘗到無常敗壞之苦。\n經典上說：諸天的天人， 他臨命終之前，會知道自己將要死亡了，那時候的痛苦，比一般世間人還痛苦。如果一個 人，本來就沒有什麼快樂的感受，反正他痛苦習慣了，就沒什麼差別。但是如果一個天人， 長時間在諸天享受快樂，當他知道自己即將要墜落，那就像從高樓掉下來的感覺，因為他 有預知的神通，他的內心會恐怖不安、憂怖，這是非常痛苦的。所以諸天還有無常敗壞之 苦。總而言之，三界猶如一場惡夢，從本質上來說，是沒有價值的。\n\n問曰，當下即飽暖，何必喫飯穿衣？當下即富貴，何必貨殖科甲？當下是學問， 何必讀書？當下是帝京，何必北上？既世間法，毫不可廢，何獨於出世法而廢之？」 \n\n蕅益大師破斥這種思想，即反問說：你當下即飽暖，何必喫飯穿衣？你當下就具富貴， 你為什麼還要作種種買賣呢？你一念心本來就具足無量無邊的學問，你為什麼還要讀書 呢？當下就是北京了，你為什麼還要北上呢？那麼世間法都不可以廢除，對出世間法這種 清淨的功德莊嚴，怎麼能夠廢除呢？\n\n有一個叫「雜修」：\n雜修跟圓修有什麼差別呢？這種雜修是：\n他今天念『大 悲咒』，明天念『往生咒』，後天念『地藏王菩薩』…今日張三、明日李四，他的信願不 決定，他的心隨他的生滅心而轉。「圓修」者雖然廣修善法，但是他的目標始終是要求生 淨土，他是「以一門來圓攝百千法門」，以一個明確的目標，來攝持無量無邊的功德。所 以圓修跟雜修不一樣，我們要揀別出來。\n\n「念佛之法雖多，持名最為簡便。 蕅益大師\n\n「持名之法亦多，記數尤為穩當」 \n\n\n蕅益大師對念佛法門的讚歎。前面的經文，\n是我們修學『念佛三昧』主要的理論根 據。\n修『念佛三昧』，所要依止的理論就是：『是心作佛，是心是佛』。\n你內心當中，以 佛的名號來當所緣境，在佛的名號當中，思惟觀察、觀察思惟，這時候你的心就契入阿彌 陀佛的功德大海。\n但是你在修『念佛三昧』之前，必須先明白這個道理，\n你才有資格修『念 佛三昧』的法門。\n\n\n修行也是這個道理，雖然我們心中有很多很多邪惡的妄想，但是你不能斷滅它，因為 佛陀講得很清楚：「諸佛正徧知海，從心想生。」你一直保持無想，你以「無想」為因地， 不可能會生起「佛的正徧知海」，不可能！這樣頂多是一種「無想」的果報而已。\n\n\n心就像黃河的水一樣，你不能隨順，但是你也不能斷滅---隨順不得，也 斷滅不得！關鍵在於「轉」--轉識成智。妄想起來的時候，轉念念佛，觀念在這個「轉」字。 是你的思想要轉變，而不是把這些思想給消滅掉。\n\n\n你這一念心，生起什麼樣的思想，就會創造什麼果報，關鍵點在於：一切法是你的思想引 生的！\n\n殺父的，是他當初那一念邪惡的「妄想」，創造一個殺父的因 地，\n由此招感刀山油鍋的果報。\n但是，他最後的一念清淨心，證得了我空的真理，入第一 義諦，\n成就無漏的功德。是誰呢？「諸佛正徧知海，從心想生。」\n還是他這一念--觀想諸 法實相的那個「想」\n\n「是心作佛，是心是佛。」同樣一句佛號，在不同人的心中出現，就有 不同的功德。有些人他也念阿彌陀佛，但是他念佛只當作攝心的方便，沒有生起歸依的心， 這時候佛號在他心中，所發揮的力量就非常有限。有些人他念阿彌陀佛，具有真實的信心， 有了「信心」才能夠把阿彌陀佛的功德開展出來，當佛號一提起，便能業障消除，福慧增 長。這就是「心作心是」的道理。\n\n\n二乘人的智慧：二乘行者，他觀一切法空，認為「因緣所生法，我說即是空」，這些依 他起的有為法，都是沒有價值的，只有「空性」才是真正的歸依處。甚麼是修學最圓滿的 境界？就是安住在畢竟空的境界，才是最終的歸依處。當然這樣解脫於三界的生死，這也 是「深妙禪」。\n\n\n永明禪師云：「一念相應一念佛，一日相應一日佛。」 \n永明禪師說：當我們的內心跟佛號相應時，當下即契入佛的功德法界；把這個一念的 境界，再擴大相續…就是：一日相應一日佛。\n\n你念佛的心，那個「心」就是佛，你不必向外追求，你念佛的心就是佛！\n還問說：「我怎麼能夠成佛呢？」你現在就跟佛相應了。 \n\n「念佛心即是佛」，所以說：當你在憶佛、念佛的時候，你就跟佛的功德相應了，你還在 問說「念佛是誰？」你這樣是多此一舉。 最後，蕅益大師做出一個結論：「夫何疑哉？夫何疑哉？」\n\n\n在大乘經典的傳承當中，\n主要是有兩個傳承：一個是般若系的《般若經》，一個是《法華》、《華嚴經》。\n\n1.\t《般若經》的法門，它的關鍵點是以「空性」為歸依處\n2.\t《華嚴經》和《法華經》的態度就不同了，不僅讚歎緣起性空，同意也讚歎積功累德， 鼓勵菩薩要廣修六度萬行，所以《華嚴經》和《法華經》的思想，是以「妙有」為究竟。\n\n所以「空性」只是一個方便，生命的真正目的是追求「妙有」，應該是這樣的。\n我們修淨土的人，應該肯定說：「東去 西去，不如到萬德洪名處去！」畢竟空還不是真正的歸依處，東去西去，不如安住在萬德洪 名處去。\n\n\n你必須深信直下承當，不要三心兩意。什麼叫「不要三心兩意」呢？ \n「深信淨土可生，發願決定往生，以持名為正行，以六度等為助行。萬修萬人去， 斷斷可保任者。」 方法就是要：『驀直持去』，執持這句「阿彌陀佛」名號，心中好好的念阿彌陀佛； 深信這一句佛號一定能夠救拔你；並且發願，決定要往生到極樂世界。必須『以持名為正 行，以六度為助行。』就是以「阿彌陀佛」萬德洪名，為你的根本法寶，然後攝持無量無 邊的波羅蜜為助行，果能如此則：『萬修萬人去，斷斷可保任者。』\n\n\n所謂「禪淨雙修」，到底可不可以「雙修」呢？是可以雙修，但是它是以「信願」為 引導，以「般若波羅蜜」為助行。所以說「禪淨雙修」你的所緣境還是佛號，但是佛號在 心中操作的時候，你知道「心作心是」，阿彌陀佛的功德不是外來的。你為什麼能夠成就 極樂世界的功德，不是從心外得來的，是你在心中念佛的時候，念念成就「心作心是」--- 這就是「禪」；雖然你明白這個道理，但是你對佛號還是一心歸命---這就是「淨」。所以 說「禪淨雙修」的所緣境還是「佛號」，跟「參究」的修法不同。「參究」也念佛，但是 他的所緣境是：觀察一念心性，所以根本沒辦法跟阿彌陀佛感應道交，因為你不以名號為 歸依境，那完全是用自力修行的。\n\n\n如果你在修學佛法當中，根本不想出離生死。你為什麼拜『八十八佛』、為什麼誦『楞嚴經』、『楞嚴咒』呢？喔，你希望下輩子能做大國王。如果是這樣的話，雖然你有遠大 的志氣力量，也只能得世間果報，不能成為出世間的聖賢，因為你內心根本不想了生脫死， 沒有動力能夠使令你趨向於聖道。\n\n\n\n什麼叫「輕安少得」呢？蕅益大師把它開展出來有三種：\n一、「或墮光影門頭。」\n修專注力的過程當中，從散亂心，想要入未到地定，會出現很多的光影門頭。 就是你這個心本來是散散亂亂的，你開始專注之後，這個時候真妄交攻，會把你心中的煩 惱逼出來，有些人看到這個、有些人看到什麼什麼的…每個人的煩惱不同，看到的境界也 會不同。\n\n二、「或坐知見窠臼。」\n一個人要解脫知見的窠臼，你的學習態度要謙虛一點，對你有 極大的好處。\n\n二、「乃至或以味禪為功德，或以空寂為家鄉。\n\n第三個「廣大弘遠心」--正見。不過這裡值得我們注意的是，這三種功德的成就是：「親師 習正法」，這一點很重要！「親近善知識，聽聞正法。」這件事情很重要。\n\n在成佛之道的過程當中，「親師習正法」，是一個成敗的 關鍵。一個人為什麼能夠生起出離生死之心？為什麼能夠勇猛不退心？為什麼有這麼廣大 弘遠心呢？就是不斷的熏習佛法，這一點是關鍵\n\n\n「眾生的知見和佛的知見。」修行之前，不管你是憶佛、念佛，或者持大悲咒，或者是念 往生咒，都沒關係。但是你在修行之前，要先明白一個道理：你現在這個打妄想的心跟佛的 心是無差別的！\n\n\n就像水和冰的關係，他們兩個同屬「濕性」；一個是受雜染法的熏習， 而變成了冰；一個是受清淨法的熏習，變成了水。所以，你是假藉念佛的因緣、假借持大 悲咒的因緣、假借持往生咒的因緣，來改變你這個心，不要去心外求法，是向內開發自性 功德。這是你修學一切法門之前，所要具備的理論。\n\n\n開悟的人跟沒有開悟的人，還是有不同的地方，就是我們明白這一念心的本性 清淨本然，我們心跟境界接觸，就容易解脫心中的妄想---「不隨妄轉」，這一點容易做到。 一個人不站在「清淨心」的角度來修行，很容易跟著妄想轉，是有這個差別","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188116","master":"淨界法師","title":"懺悔法門-淨界法師","youtube":"","images":[],"tags":[],"content":"懺前理觀：\n\n1、拜懺前先告訴自己：我們本來沒有罪業；這個最重要。\n\n2、發願：過去的就過去了，以後不管遇到什麼樣的狀況，我都不會再造作同樣的罪業。這個也很重要 —— 斷相續心。\n\n3、同時可以觀想頭頂上有普賢菩薩或者諸佛菩薩放光照耀我們的身心世界，一切罪障化成黑煙黑水從腳排出等等，然後開始拜懺。\n\n解釋名義\n[懺悔]這兩個字，在原始的印度佛教中，它的本來名稱叫做[懺摩]，翻成中文的意思叫做[悔往]。[悔往]就是說：你過去已經造了殺盜淫妄的罪業，既然自己已經造作了，那麼現在你去回憶過去的罪業，你感到深深的後悔，這叫做「悔往」。\n（一）、[悔]是「恥心於往犯」：就是你開始回憶過去所造的殺盜淫妄這些罪業──你表示羞恥。\n（二）、[懺]是「止斷未來非」：前面的「悔」是「觀察過去」，這裡的「懺」是「發願未來」。\n因為我們在平等的心中，捏造一個「自我意識」，有這個自我意識，就跟所有的眾生產生對立；有「我相」，就有「人相」相互的對立，就產生一種保護自我的心態，叫做「私慾」。為了保護自我就開始造業，「我愛執」就產生了──當這個環境滿你的願，你就生起貪慾；當環境不滿你的願，你就生起瞋心；所有貪瞋的煩惱的生起，都是因為你捏造了一個自我意識才出現的，所以罪業的生起，基本上是由於我們「內心顛倒」而引生的。\n我們為什麼要懺悔？罪業最怕你數數現行、深生好樂。我們講過很多次了，最怕你無慚無愧。懺悔有兩個意思：第一個，恢復你的善根；第二個，消除外在\n的業力。唯識學說明這個道理：因為心力創造業力，業力它也含藏在心力裡面。業跑哪裡去了？諸位！你在造業的時侯，是心去攀緣外境造業，造完以後，身體的動作是無常的，諸行無常，造完以後業跑哪裡去了？當然跑到你的內心去了。跑到內心去的時侯，你有兩種情況：第一個，你同意它；第二個，你不同意它。同意就是隨喜，不同意就是訶責。\n\n懺悔的方法\n理論的思惟是說：今天當我們造了一個業，這個業就有招感果報的功能；假設它是一個善業，就會招感安樂的果報；如果是罪業，也一定會招感痛苦的果報。雖然這個業還沒有表現出來，但是我們應該要有這樣的認識─業有「招感性」。\n第二個，業果不失：這個業，除非你懺悔，否則你沒有辦法讓它消失掉，連佛陀都不可能讓你的業消失掉。\n第三個，增長廣大：它不但不會消失，還會在你糊里糊塗一天過一天當中，不斷的增長廣大。所以我們今天對於所造的罪業，我們應該要加以面對、消滅，這件事是非常的急迫。這就是我們在懺悔之前，應該要有的正確觀察。\n罪除之相\n當你出現這些徵兆，你必須趕快懺悔了！\n1.心神昏塞，轉頭即忘。你經常覺得心老是昏昏鈍鈍\n的，就表示你明了性的外面有一層罪業在遮住你了，因為這不正常。\n2. 「無事而常起煩惱」。這更嚴重了。不但是昏鈍，你經常莫名其妙躁動不安，這個業力就比之前那個更嚴重了。它不但是遮蔽你，已經有一種活動力開始活動了，因為罪業是躁動性的，善業是寂靜性的。\n3. 第三個，你見到有德行的君子，應該要隨喜讚歎，結果你反而心虛，這個就是你罪業的第三種狀態。\n4. 第四個，「或聞正法而不歡喜」。聽到正法，你應該要歡喜讚歎，結果你反而排斥，表示你已經是無慚無愧了，你的善根已經失掉了。\n5. 「或施惠而人反怨」。你幫助別人應該得到讚美，結果人家反而傷害你。你在弘法或者在做義工，本來是在造善事，結果反而產生很多的問題，表示你過去一定有罪業。\n6. 第六個，是最嚴重的，「夜夢顛倒，妄言失志」。這個人已經顛三倒四了，根本談不上善根了，已經沒辦法判定什麼是對，什麼是錯，什麼是功德相，什麼是過失相了，內心的觀照善根完全喪失了。\n\n\n唯識學上說，一個修行的內心有三種功德。修行人，有修戒定慧。第一個，明了性很強。你的心平常是明了的；第二個，它是寂靜的。明了，就是不暗鈍，是寂靜，它絕對不能躁動。你平常沒有事在那個地方，你的心是寂靜的，安穩的；第三個是法喜，帶有一種淡淡的歡喜。但那個法喜不是外境的刺激，是你內心有一個法，念佛持咒，自然會產生一種法的力量的歡喜，由內心生出來，它不是靠外境的刺激。\n\n懺法的儀軌\n一、請聖明證。二、說己罪名。三、立定誓願。四、讀誦禮拜。五、\n如教明證。\n\n1.\t要請懺悔主。請一個聖人當懺悔主。(找神明也可以)\n2.\t在懺悔主面前，發露自己的罪業。\n有兩種情況：第一個你自己知道你造了什麼罪業，在修懺之前，至\n少第一次，就要告白：我要做三個月的加行，我每天拜一部八十八佛。為\n什麼呢？因為我在某一個時間、某一個空間做了什麼事，我向懺悔主普賢\n菩薩發露，我從今以後寧捨身命絕不再做，要發露罪業。這是你已經知道\n的罪相。我不知道我今生有沒有做，但是我過去做了，就是「往昔所造諸惡\n業，皆由無始貪瞋癡；從身語意之所生，一切我今皆懺悔。」就總相懺悔\n也可以，總相的發露。\n\n3. 第三個，懺悔。不但要發露，還要立定誓願：從今以後，寧捨身命絕\n不再犯。懺悔是針對過去做的，發願是針對未來的時間，我不再造作了。\n4.第四個，要有方便，要讀誦、禮拜。這在懺法裡都有規定，照著做就好。\n5. 第五個，如教明證。就是要見好相。\n\n\n你有前面的六種情況，身心暗鈍，躁動不安或者是顛顛倒倒的，經常自己會莫名其妙起煩惱，合理地推論，你有罪業，我們的\n建議是這樣子：\n古人是以一百天為一個加行，而且只能夠選擇一個固定的法門，你修一百天，每天拜一部八十八佛，或者拜一部大悲懺，你衡量你的時間，那麼你衝一百天，見到好相，那就 OK 了。我們的標準當然是取法乎上，最好是以見好相為標準。但是見不到好相，你拜三個加行，起碼讓罪業的勢力變成不增長業，也可以，不障礙你臨終，這也可以。\n\n怎麼知道我的罪業已經如法地懺悔乾淨了？\n怎麼知道我已經如法地懺悔乾淨了？這有判斷方法。\n\n或覺心神恬曠；或覺智慧頓開；或處冗沓而觸念皆通；或遇怨仇而回\n瞋作喜；或夢吐黑物；或夢往聖先賢，提攜接引；或夢飛步太虛；或夢幢\n幡寶蓋，種種勝事，皆過消罪滅之象也。\n\n1. 第一個，「或覺心神恬曠」。心神恬曠表示說，這個罪業不再障礙\n你了，你覺得很愉快、很開闊，這個是第一個判斷。\n2.你覺得「智慧頓開」。表示你的心識比較靈巧了，不像之前那麼暗鈍。\n3. 遇到很繁瑣的事情，你也不起煩惱，你的心非常寂靜、安穩，不會因為外在的因緣經常干擾你，而動不動發脾氣了，你心的寂靜力增長。\n4. 第四個，「或遇怨仇而回瞋作喜」。這個人本來對你不歡喜，你懺悔以後這個業消了，他對你沒有對立心了。\n5.第五個，「夢吐黑物」。在夢中，夢到你吐出髒東西，夢到你洗澡，夢\n到你排出大小便等等，這都是業障消除，罪業從你的內心裡已經脫落了，\n見好相就是業已經消了。\n六七八就不容易了，是善根的問題。\n6.第六個，「或夢往聖先賢，提攜接引」。你夢到祖師大德來跟你開示，\n這是感應道交的問題。\n7. 第七個，「或夢飛步太虛」。你覺得你的身心世界，很輕飄，不粗重。\n在《楞嚴經》上說，你的心經常很輕鬆愉快，夢中看到你在飛，這個人一\n定有菩提心，有願力。\n8. 第八個是最好的，「夢到幢幡寶蓋」。這是佛的智慧光明，幢幡寶蓋表\n示佛的智慧，表示你的心——心與佛合，心與道合。\n\n你想臨終時沒有障礙，我們的建議是：你最好一生當中至少要修一次懺，一百天的懺，先把心中比較重大的垃圾除掉。差不多八十八佛一天四十五分鐘，大悲懺我是沒拜過，我們的傳承都拜八十八佛，放蒙山的。你修過一次懺以後，諸位，你再來念佛，你的心跟佛號，你會覺得中間那個隔層的障礙消失了，你佛號念得很清楚，除非你後面再造作。如果你剛懺完，心中提佛號時，會發覺你的心跟佛號幾乎沒有距離，會覺得你跟阿彌陀佛距離非常接近。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188115","master":"淨界法師","title":"唯識學概要-淨界法師","youtube":"","images":[],"tags":[],"content":"唯識學概論 淨界法師\n\n名詞\n「正看著前面桌子的心識」是眼識，\n眼睛必須睜開，前面也必須有桌子才行。\n事後「回憶此桌子的心識」是第六意識\n\n小乘佛法它的思想是業感緣起，\n它認為所有的輪迴是由業力創造出來的，所以你看小乘佛法的目的，他所有的持戒修定修無常無我的觀慧啊，都是在斷有漏的業力，就斷這個輪迴。\n\n業感緣起它有缺點，因為它從業力來解釋人生，它會陷入一種對立，因為善業它就不是罪業，因為有漏業它就不是無漏業，所以業感緣起所創造的人生觀是一個對立的。所以當小乘的佛法把輪迴消失了以後呢，它也不可能創造真實了，他進入了偏空涅槃，所以小乘佛法它只能夠破除虛妄，不能夠開顯真實，這個是它不足的地方，所以佛陀講完小乘以後接著講大乘。\n\n大乘佛法它不用業力來解釋人生，它從內心，從心，一切唯心造！\n因為心態它不是對立的，因為它也可以起善念，也可以起惡念，所以它是\n一個平衡中道的思想。去從空出假，去修六波羅蜜，去莊嚴你一念心性的。\n\n唯識課程的重點\n1.\t法脈源流\n2.\t主要教義\n-凡夫的內心來開顯緣起，那麼它談到這個輪迴\n的問題，輪迴是怎麼生起的，它是怎麼相續的，它是應該怎麼去改變它，\n我們把整個唯識的教義做一個綱要的解釋。\n\n3.\t唯識的修行方法\nA.\t唯識學跟淨土宗的一個結合，如何發菩提心修六波羅蜜\nB.\t唯識的相宗怎麼樣跟圓頓的性宗做一個結合\n\n唯識學是很務實的讓我們面對自己：\n你現在是怎麼回事？\n為什麼你會輪迴？\n為什麼輪迴會相續？\n\n空性與缘起——大乘佛法的兩個重點\n\n大乘佛法只有兩塊而已。一個談空性，一個談緣起。\n談空性的是什麼呢？比方說最有代表性的《金剛經》，佛陀從頭到尾全部在「破」，要求離一切相。\n\n緣起的話，你相信打妄想的心中，有一個清淨心存在。如果你不相信，你《法\n華經》白學了，因為它是一個非常重要的基本。就是說，你不承認有真如，\n就沒有真如緣起了。簡單地講，你要讀《法華經》、《華嚴經》，有八個字\n很重要：「達妄本空，知真本有」。\n\n天親菩薩給它一個「異熟」呢？因為它最主要的功能，最能代表它的、最多分的就是異熟。異熟簡單講就是因果，就是果報的意思。你一出生時，內心世界就會有一種自我的概念。那個自我概念是誰呢？就是思量、我愛執，你很自然會有一種自我概念——「我」可以去造業，最後也是有個「我」來得果報。這種自我概念就是思量——恆審思量。它能夠對這個生命體，進行很深入很相續的觀察，而產生一種自我的概念。了境。這個了境依止自我，去瞭解、受用一切的外境。那麼去瞭解外境的是誰呢？就是前六識，當然主要是第六意識。第六意識夾帶前五識，廣泛地去攀緣所接觸的一切人事物。\n分成三個：一個是負責變現果報；一個是在果報裡產生自我概念；第三個是去瞭解外境。這三種即：異熟、思量、了境。\n \n我們的本性是沒有相狀的，你一定要追求相狀，最終的結果就是跟本性抵觸了。因為你本性是寂靜的，無所得，你只有放下，才能夠合乎本性，而不是去追求。所以它的本性第一個特點——寂靜，無所得。\n\n\n第八識能夠收藏我們無量劫來所造善惡業力的種子。我們每一期生命都是生滅變化的，比方說你昨天已經消失了，但是你昨天做的所有事情都沒有消失，你所走過的痕跡第八識全部記錄下來，行為消失了，但是你的功能，你昨天所做的任何事情，你所講的任何話，全部被記錄下來了，一個都跑不掉，第八識就有這個本事。阿賴耶識有兩個功能：第一個保存種子；第二個把種子成熟\n變成果報。它主要是這兩個。這兩個功能你一定要記住；一個「含藏」；一\n個「異熟」。\n\n前六識。這個很粗淺，叫「了別」——明了跟分別。\n明了是指前五識，它是一種直覺性的感受，像你眼睛看到一個歡喜的東西，\n你產生一種樂受；你耳朵聽到不歡喜的聲音，產生痛苦的感受。對不對？前\n五識的感受完全受業力的主導。如果你前生善業強，你今生從小到大得到的\n感受，是快樂的感受多一點，痛苦的感受少一點。\n\n有志於往生，你要注意第七意識，雖然第六意識管善惡，但第六意識有個問題，它是生滅的。第六意識如果沒有跟第七意識的執著在一起，第六意識做不出很大的善惡，做不出來。\n\n你看我們一天打很多妄想，諸位，我們百分之九十的妄想都沒有付諸行動。對不對？我們也曾經想要去做壞事，但是你去做壞事了嗎？沒有，因為你沒有那個膽量。那個膽量是誰？就是第七意識。真正障礙往生的，都是帶有執著性的妄想，這個要注意，第七意識很可怕！諸位！第七意識它夾在第八跟前六中間，它向內主導第八識，主導你的業力（第八識管業力）；向外主導你的思考模式，主導你的第六意識。\n\n你對佛法有堅持，其實就是第七意識。我們完全靠第七意識恆審思量\n\n你一天所打妄想中的百分之八九十，對你往生都不產生障礙，因為它打完就忘，它沒有根，只是一時的惡念。但是你讓惡念產生根，你就要注意了！就是當第六意識跟第七意識兩個結合在一起，跟你的執著——我一定要怎麼樣時，這個惡念是有根的惡念，一定障礙往生。\n\n很多人修行根本找不到重點，還在對治妄想。其實妄想不障礙你往生，\n真正障礙往生的是帶有執著性的妄想。它有兩個特點：數數現行，都無慚\n愧；見是功德，深生好樂。第一個經常性的思想，你這個念頭經常打，而且\n打這個妄想時，是深生好樂，內心堅固，不可動搖。這個念頭一定會影響你\n來生的生命。所以真正在影響我們的，是第七意識的思量。\n\n\n第七意識有一個缺點，它沒有自我調整的能力，它必須要靠第六意識來調整它。所以我們修行是從第六意識下手，但是我們的目標是改變第七識。我再講一次！我們修行的因地靠第六意識的思惟、觀照，但是我們的目標是改變第七意識的執著，把它對不好的執著改成對好的執著，叫做發願。\n\n你說我好像什麼病都沒有，請你讀讀唯識，就知道自己很多毛病。\n調伏我們現在的業力，就必須先瞭解它\n\n阿賴耶識，就是第八識。第八識它有兩種功能，一個叫做「異熟」(釋放一種果\n報，或者說變現一個果報。)，一個叫「含藏」。(如來藏)\n\n只有業力沒有妄想不會輪迴，只有妄想沒有業力也不會輪迴。但是當妄想跟業力結合的時候，你來生一定要得果報。輪迴的相續，就是因為業力跟你的顛倒妄想結合在一起。\n\n唯識學的下手是第六意識，成敗的關鍵看第七識!\n用第六意識(眼識、耳識、鼻識、舌識、身識及意識六者的合稱)\n改變第七意識(末那識)。\n用第六意識去學習經論，如理思惟，用道理跟第七意識溝通，用道理來化解第七意識的執取。\n\n唯識學的「宗」，就是第六意識的止觀，它的「趣」，就是破壞第七意識的執取。\n\n比方說你喜歡喝咖啡，你喜歡喝咖啡這件事情亂不了，不障礙往生，因為它只是第六意識的反應。因為第六意識它是一時的，第六意識它沒辦法相續。但是你一定要喝咖啡，喔，障礙往生。因為你已經提升到第七意識的恆審思量——執取，那麼你一定要喝咖啡，你去觀察，一定有一個自我一定要喝咖啡，一定有一\n個自我意識在裏面活動。\n\n\n一個人要有原則，但是不能夠太有原則。因為你這原則抓住的時候，\n你就不能夠看因緣辦事。有些因緣，在不同因緣當中，它會做一些善巧。\n所以法，應該有一點堅持，但是不能夠執著。所以法執就影響到你的格局\n大小，障礙你的所知的這個境界了，障礙你的功德的圓滿\n\n你可以每一天做一個清潔的功夫，就是你每天打坐都觀想，色畢竟空，無我無我所；受畢竟空，無我無我所；想畢竟空，無我無我所；行蘊畢竟空，無我無我所；識蘊畢竟空，無我無我所。你的生命其實你都是在跟著業力去創造感受，生起想像，然後帶動執取如此而已。你把五蘊裏面的執著，每天把它清乾淨，不要讓它打結，你的生死業力，它就不容易累積。\n\n你只是一種心理的作用，你不能主宰任何東西，我們只要把生命的主宰權放棄了，輪迴就拿你沒辦法。我們人最大的麻煩就是強做主宰，就弄得自己很被動。就是說你明明不能主導這個世界，但是你一定要主導這個世界，就是這個本來是生滅變化的這個五蘊的元素當中，捏造一個自我意識，然後去主宰五蘊，結果觸動了生死輪迴，這輪迴就是這樣來的。你把自我放進去以後，這個業力就活動起來了，就變成輪迴了。\n\n\n如何把彌陀的功德轉化成你的功德呢？\n按照善導大師的說法，第一個提起佛號，第二個順從本願\n\n從淨土宗的角度，佛號多多益善，因為那個佛號，它是一個無量光無\n量壽的功德莊嚴。所以佛號進入到我們心中，的確會產生一種熏習的力\n量，不思議心、不思議變，清珠投於濁水，濁水不得不清，佛號投於亂心，\n亂心不得不佛。\n\n順從娑婆式的心態，調整為順從彌陀的功德。但是我們從一種雜染的緣起，要轉換成清淨的緣起，這個中間一個很重要的過渡是什麼。空性的智慧，你的心理素質不提升，所有的佛號就不可能提升，因為它是你的心創造出來的，不是佛號有問題，是你的心有問題。\n\n輪迴有一個很重要的根本就是阿賴耶識。阿賴耶識有兩個功能，第一個是怎麼樣？變現果報。這個果報又刺激你的內心，你又造業，造業以後呢，它又要儲存業力。我們的阿賴耶識有沒有真如？當然有嘛！它有不生滅性；佛陀有沒有真如？當然有嘛！那麼我們怎麼區分我心中的真如跟佛陀的真如差在哪裏呢？智者大師講得好，他說啊，我們的真如叫在纏真如，就是一念的清淨心當中呢，被兩個東西纏繞了：一個生死業力，一個顛倒妄想。但是呢，真如的本質沒變，它還是清淨本然，周徧法界，具足無量的性功德。只是我們呢，不想迴光返照，去把這個功德開顯出來而已，我們選擇向外攀緣。所以我們凡夫的真如叫做在纏真如，佛陀的真如叫出纏真如\n\n性宗強調不生滅心，那麼相宗是強調一種調伏對治，它從因緣上調伏對治，它強調生滅的因緣。\n理觀用性宗，事修用唯識，它是這樣子，佛陀是教我們這樣設計的。\n理觀的時候，你把自己想成佛陀；你拜懺的時候，把自己想成凡夫。這樣\n你們能夠理解嗎？\n\n拜懺的時候，你就要觀想我真的是業障凡夫了，我需要乖乖的拜八十八佛，我需要佛力的加持。所以我希望大家這個理觀跟事修，你要達到一個平衡點。你入理觀的時候，你的心是本來清淨，本來具足，你的心有無量的圓滿的功德，只要你願意迴光返照，只要你願意重新開始，你就可以跟佛陀完全一樣。但是你從理觀出來的時候，該念佛念佛，該持戒持戒，該拜懺拜懺，這個就叫性相圓融。\n\n理觀我們採取《楞嚴經》、《法華經》的理觀，但是事修我們好好的用第六意識的修觀來懺悔業障，向外懺悔業障，靠第六意識的修觀，向內調整第七意識，\n事修根據唯識，這個是一個性相圓融的一個方法。\n\n第八識其實它的正常的功能，它有三種功能：兩種是正常，一個是不正常。它的正常功能，一個是因相，一個是果相，我們解釋因相。因相，就是第八識，它有含藏一切種子的功能。當我們一次的生命結束以後，我們的生命消失了，但是有些東西沒有消失，就是你所做的一切的行為，你創造出的任何的思想，都被記錄下來了\n\n第八識本身不造業，那它為什麼有業力呢？因為它老是跟第六、第七在一起嘛，第六、第七老是造業嘛。第八識，沒有感覺，沒有好壞的第八識，然後第八識一離開，佛法就定義這個人死亡了。所以第八識是最後離開，它最早來到人世間，最晚離開。修我空觀法空觀，把阿賴耶識破壞掉，把它轉成真如，這徹底。因果裏面有一個我，我去造業，我去得果報，那個我的概念是第七意識給它的。所以第七意識一轉，第八識就跟著轉，所以六七因中轉嘛，對不對？五八果中圓。在因地裏面要改變的只有第六、第七，六七嘛，五八是配合的，你六七轉，五八就跟著轉，感受也跟著轉，第八識也跟著轉。\n\n我們淨土宗的人，我們今生不可能破壞第八識，這是一個現實，但是你最好把第八識的勢力，降到最低，你必須把你的清淨心，所攝受的信願的力量加強，你臨終不能讓第八識來主導你，你要第八識來主導你，你就完了，你就隨業你就流轉了。第八識的勢力不是你可以控制的，所以淨土宗是要在第八識還沒有活動之前先下手，你趕快提起正念跟彌陀感應道交，靠第六意識隨念到淨土去。\n\n\n當我們的生命從一個生命體結束以後轉換成另外一個生命的時候呢，阿賴耶識扮演一個成功的橋梁，就是生命的相續，完全靠阿賴耶識來做一個溝通的橋樑。\n\n你會投生在什麼家庭，你會跟誰結婚，那麼誰會做你的小孩，你今生有多大的成就等等，這一部分都是萬般皆是業，半點不由人，就是過去的業成熟了變現出來的，這個就是所謂的外因緣。你把生命全部投入到外因緣，你追求今生的成就。那麼你追求今生的成就，你肯定是內心空虛的，因為你沒有時間照顧你的心地法門。\n\n第二種人呢，就是把今生隨緣認命，把它放下，他專心的去經營內心的思想，他把重點放在開創未來。其實你今生的結果，你能夠改變的很有限，非常有限。當然可以做微調，但是非常有限，就是你的努力跟你的結果不成比例，你花費很大的精神改變很少，但是死亡到來的時候全部破壞了，白忙一場。\n\n從淨土宗的角度，最重要的就是第六意識了，因為你必須要做好臨終正念\n的準備，臨終正念是要準備的。第六意識是內憂外患，所以你必須要做兩個工作：外調感受，內治執著，你才有辦法把正念栽培起來的。所以其實你的內心世界，你有很多事情要做的。在你達到臨終正念之前，你根本沒有太多精神體力，去攀緣外境。說實在的，如果你好好的看你內心的世界，你有很多問題要處理的，你有很多功課還沒有準備好。\n\n「因」就是第八識的業力，在釋放能量的時候，它的善業起現行的時候，會讓你快樂，當它的罪業起現行的時候，會讓你痛苦。但是它在釋放業果的時候呢，它是刹那刹那生滅的，叫頓生頓滅。我們感覺到我們現在好像是相續的，其實你的果報是怎麼樣呢？是突然間有，突然間沒有，突然間全部有，又突\n然間全部沒有，就像這個燈光一樣，刹那生，刹那滅，刹那生，刹那滅。第八識它沒有觀察能力，它不能夠對一件事物做很深入的觀察，第八識像水流一樣嘛，它是空心的。\n\n它果報會變化，因滅果生，非常一故。因地也變化。比方說你剛剛去念了一百聲佛號，當然你的身口意的造作，是生滅生滅的，所以你現在這個佛號已經怎麼樣？消失了，但是你的生命產生變化了，因為你阿賴耶識已經熏習了一百聲佛號的功能，現在的你跟昨天的你不一樣了。因為你今生又增加很多的善惡的功能。所以，昨天的你跟今天的你也不一樣了，受熏、持種。\n\n你的生命永遠不會停止，除非你能夠往生淨土；第二個「轉」，表示它是變化的，因為你不斷的在起心動念，不斷的在創造一個因地，就像水流一樣，它相續而變化，變化而相續。因果的法則是本來如此，並不是誰創造出來的。\n\n人生沒有一個不變的東西，沒有一個常一不變的實體，這個東西是不存在的。但是在變化當中，它又不斷的相續，因果絲毫不爽，它又念念念念的累積一種善惡的能量，等到適當的因緣把它變現出來。用無常觀來破妄，用相續常住觀來生善。反正無常跟相續，這兩個都是生命的兩種相貌。\n\n\n第七意識(末那識)有恆審思量的功能，它是非常專一的，它一路走來始終如一，它的所緣境都不變的，它專心鎖定第八識的果報。第七意識只對現在的你有興趣，這就是我們為什麼會把今生看得很重，因為深受第七意識的影響，它不緣過去，也不緣未來，它非常務實的只執著你今生的生命體。就是我癡、我見、我愛、我慢。\n\n當第七意識的我執沒有破壞之前，它是染汙位，前六識全部是染汙，當第七意識清淨了，轉成空性的時候，前六識全部是清淨。你不一定變成波羅蜜到彼岸，得第七意識說了算。所以當然，如果你跟了生死沒有關係，你如果今生只是求增上生，來生活得更好就好，那你可以暫時不管第七意識。\n\n\n第七意識的轉變有幾個過程：\n第一個極喜，極喜就是這個初地，初歡喜地。就是這個菩薩，經過十住、十行、十迴向三賢位的時候，他不斷的懺悔業障，積集資糧，在事修裏面把罪業降到最低，在理觀方面呢，修我空觀法空觀，突然間一念的相應，啪，心中的光明出現了，他的空性的智慧現前，這個時候初心入了歡喜地，這個時候心生大歡喜啊！因為他長久以來被自我意識，被這個魔王掌控啊，現在終於擺脫它了，所以他終於能夠自由自在了。\n\n第二個八地，無功用行我恆摧，我們解釋一下。我法二執有分別的跟俱生的，分別的我法二執，就是第六意識要分別，它才會產生一個自我概念，所以第六意識它要是不分別，它就沒有。我執一定要注意，因為它滋潤三界的生死，它會錯誤的引導你所有的佛號，到三界得果報，尤其是分別我執。\n\n\n只有修空觀，面對盲點只有一個方法，就是把生命歸零。因為你在枝末上，你根本沒辦法跟它對治的。就是說那你先把生命、把心帶回家，你迴光返照，看看你從什麼地方來，看看你生命的原點。一個人只有迴光返照，去對治執著，其他通通沒有辦法。所以只有第六意識，成功的把第七意識帶回家，第七意識的自我執著才可以破壞掉。所以當我們所有的佛號，你要保證你每一句佛號都是通往淨土，那你就要注意你的執著了，因為它的力量太大了，你用第六意識去壓它，第七意識是不吃你這一套的。\n\n你只有一個選擇，就是面對你的執著，把它空掉，然後再重新發願，重新引導它，給你的生命一個新的引導者，就是用願力來引導你，不能用自我意識來引導你。蕅益大師的開示，你要往生，你必須把心先送到淨土去，是心作淨土，然後你每一念心所創造的佛號，是心是淨土。如果你的心根本到不了淨土，你的佛號就到不了淨土了。\n\n改變第七意識，還得靠第六意識的修觀。因為第七意識它沒有自我調整的力量。只有人的第六意識，因為它的思考能力強，它會產生一種學習的力量，從學習當中呢產生觀照來自我調整，其他道都不可以，它只能夠活在人身的生命的慣性。所以人身的第六意識是一個我們最大的機會。這個講到有漏位，它能夠造善造惡。\n\n\n第六意識只有兩個方向，向外跟向內兩個方向而已。它向內觀照的時候，第七意識就沒有力量了。所以第六意識它管著禍福。禍福，就是說造罪是它，但是開始發菩提心，修六波羅蜜也是它。這個第六意識，諸位，唯識學啊，它叫做斷相續心。我們不可能去培養第一念的正念，不可能。你所有佛堂的用功，你聽經聞法培養的正念，我們只能夠把握第二念。就是第一念錯的時候趕快修正，你要培養自我修正的能力。不是不起煩惱、不起顛倒，不可能。就是你煩惱活動的時候，你要自覺、自省、自調，馬上覺悟、馬上調整。\n\n隨念往生，他必須把握第六意識在的時候。因為你感應道交是靠第六意識跟阿彌陀佛感應道交，不可能到第八識。第八識它也不能造善也不能造惡，它也沒有思考能力。你想改變你的生命，一定要先瞭解自己，這個是非常關鍵的。到底你哪裏出了差錯，你才不會讓歷史一再的重演。\n\n\n佛陀告訴你，你現在對於所變現的萬法，應該要隨緣放下。因為它已經是一個成熟的業力所變現出來的，你要注意能變現的心識，因為它才是輪迴的根本，它才是一個輪迴的開關。(影像反射不要管他，都假的)。\n\n是心識去創造萬法，不是萬法去創造心識。今天臨終的正念，你最大的優勢就是第六意識，第六意識是一個最可以透過學習去改造而產生重大變化的一個心識。\n\n唯識的思想有三個重點：\n第一個如果你有志於臨終的正念，你最好把今生的人事因緣慢慢的放下。\n第二個你要好好利用你的第六意識，好好的做如理的思惟，厭離娑婆，欣求極樂\n第三個你要修習空正見跟願力，觀照力跟誓願力，好好的調伏引導第七意識。\n\n\n一心真如跟萬法唯識，這個八識的活動到底應該怎麼融通呢？\n\n一心真如:\n性宗它的緣起論，是建立在一心真如，講到真如受熏，這個清淨本然、周徧\n法界的一念心性。但是唯識學它是從八識，特別是第八識的異熟(因果)，充滿業\n力的、充滿妄想的這個第八識來做一個出發。\n\n\n佛陀慈悲，你老是知道一心真如，你就含糊籠統。對你自己的盲點就搞不清楚了。\n\n萬法唯識\n為什麼要開出八識呢？因為我們從八識的差別作用當中，來觀察緣生性空，悟入一心實相。所有的外境，都是你自己變現，自己去攀緣它的\n第八識的業力變現一個東西出來，然後你第六意識再去攀緣它，這自變自緣。(鏡子反射影像，我們再去迷戀鏡子的影像) 每一個人去看花的時候，根據你過去的善惡的業力，你得到你自己的影像。萬法唯識的意思就是說，其實沒有真實的外境，當你跟人事接觸的時候，你自己的內心自己出現一個影像。我們每一個人都是攀緣自己的內心的這個小範圍，你不能超越你的內心世界去攀緣心外的東西，你做不到。緣生性空就是說，所有的外境都是你的內心變現出來的，沒有例外。我們一直在攀緣萬法。所以讓業力產生一種相續的力量，這是我們最大的錯誤。\n\n我空法空的道理，就是這個人生沒有一個真實的東西。那麼沒有真實的東西，你慢慢慢慢你的心靜下來，你就能夠慢慢的把心帶回家，回歸到你的最初的本來面目了，叫做一心真如。\n\n它是從先講假相然後再悟入真實，它不像性宗直接切入真實，所以這兩個是不一樣的。一個是從作用當中，慢慢讓你去體會這些都是假的，所以我應該要回家，它先發明生命的假相，然後讓你知道假以後，你自己會慢慢的放下，所以叫從相用去觀空而回到真實。唯識學就一直告訴你，你的寶藏在哪裏？你的地雷在哪裏？有些地雷，我們是可以到極樂世界再處理的，但是請你不要去碰觸它，你必須瞭解它，你才能夠慢慢的閃過它，讓它帶業，讓它沉澱下來，到了極樂世界，你有很好的因緣來處理這個地雷。\n\n\n佛教的人生觀，主要是空性跟緣起兩塊。那麼站在唯識的角度，它是怎麼發明緣起，它是怎麼建立空性的。\n\n唯識的緣起觀呢，有三個重點：\n第一個業果的形成；\n你一定有身口意的活動，叫現行。這個活動是怎麼來呢？是由內在的因緣，前七轉識跟彼相應的善惡的心所，當然主要是第六意識\n第二個業果的相續；\n內在的妄想跟外在的業力結合的時候就造業了。一碰撞叫做現行\n如果你放縱下去，它最後的結果，就會招感有漏的果報：\n第三個業果的轉變；\n善業招感天、人、阿修羅果報，\n罪業招感畜生、餓鬼、地獄的果報。\n如果你造的是無漏業，你來聽經、誦經、念佛、修止觀等等，那麼就成就了四聖的聲聞、緣覺、菩薩、佛的法界。\n\n唯識學把業分成三塊，業的成就、業的圓滿、第三個業的相續，而業的相續是最重要的，我們淨土宗的人要臨終正念，最關鍵就是斷除業力的相續，你不可能斷除它的種子。\n\n唯識學的因緣觀，它是偏重在雜染這一塊，偏重在有漏這一塊，\n它是從輪迴的角度來解釋因緣，不像真如緣起，是從一種清淨莊嚴的角度\n來開展緣起，它偏重在輪迴的角度，從有漏的因緣來開展緣起。\n事(事情是什麼)、意樂(心裡面)、煩惱(貪、瞋、癡)、加行(自己做)、究竟(你把它拿，從那地方移開了，拿到別地方)，這五個具足了，這個業就造圓滿了，就是一個結構完整的業力。\n\n阿賴耶識如果我們把它比喻做大海，這個水分子是什麼呢？就是種子。先講體用。「體」當然是阿賴耶識了，它是你生命的因果的依止處，它是一個本體；「用」呢，就是水分子跟波浪。因跟果，我們先講因果，再來講體用。\n你為什麼有今生的你呢？因為你有種子，你過去生有很多很多無量無邊的種子，其中有幾部分的種子成熟了，變現你現在的身心世界。所以你過去的業種子是一個水分子，水分子是不能受用的，你說，我要受用我昨天布施了一百塊給淨宗學會，我今天應該受用受用，不可以！它在種子位你不能受用，對不起，它必須要怎麼樣呢？變現出來你才可以受用。\n\n一個事情有生滅那表示什麼？它可以改變！你聽到「刹那滅」啊，當然它充滿了希望，但是它也充滿了危險，因為你也可能讓它更厲害，對不對？你要是不斷的執著它，你本來造了業，你看佛法裏面很多呀，他造的業不嚴重，但是他後來起邪見，執著，得果報的時候就很嚴重。當我們造一個業以後，我們會有一個強烈的等流性。比方說布施，布施是一個現行，是一個身口意的活動，當然你布施完的時候，這個行為結束了，你就形成一個種子，這個種子它會產生一個現行的果法，就是它會讓你更想布施，所有的事情你做完第一次，你會莫名其妙想要做第二次、第三次、第四次……就是你本來是在造業，但是會產生一種習慣性的一種業力要推動你，你會想要相續的做下去，除非你用思想去調整它改變它，否則它有一種等流的力量，造惡業亦復如是。你造了一個罪業，你就很想造第二次，為什麼呢？因為它有「果俱有」的功能，它現行熏種子，它種子又會起現行，它會牽動你第二個功能。所以它會跟現行的這種果法，它會兩個合作。\n\n在唯識的定義只有兩種情況，你要嘛消滅它，你要嘛就增長它。唯識學的意思沒有人保持原狀，保持原狀這句話不適合凡夫，只有聖人。\n\n你曾經偷過人家一百塊，然後你說我拿一百塊去布施算了，我把一百塊拿去布施慈善機構，這樣可不可以抵消？不能抵消！除非你懺悔。\n\n他去滑雪結果把腿摔斷了，你說你這個人就是因為滑雪才把腿摔斷的，可以這樣講嗎？不可以嘛！滑雪的人多的去了，不是每一個人都摔斷腿嘛，是吧？他是他過去生有這種殺業，你就是喜歡滑雪，你就是把這個業給逼出來了，是這樣子的。所以這個業力要得果報，它必須有心念的刺激。\n\n六種的條件，它是刹那滅、果俱有、恆隨轉、性決定(隨你的善惡的因力產生的善惡的功能是決定的，是不能改變的。)、待眾緣(果報之前要等待因緣)、引自果\n\n空觀成就的人他還有沒有第七識？\n小乘佛法是用極度的手段，把前六識給滅了，所以叫錯損\n菩提。你把第六識滅了，你的菩提心也沒了。(事後「回憶此桌子的心識」是第六意識)\n\n大乘佛法的態度，它是轉變而不是斷滅，你必須引導它，教育它，跟自己溝通。\n\n發願\n發願它本身它是用第六意識的願力來抗拒第七意識的執著，它是用第六意識，因為第六意識為什麼要發願？第六意識它雖然造業力強，但第六識有很大的弱點，就是它沒有定性，性界受三恆轉易，根隨信等總相連。\n\n為什麼要受戒嗎？說好話、做好事就好了，\n因為你沒有戒體，沒有願力，所以第六意識它雖然造業力強，但是它有一個很大的問題，它的缺點就是它沒定性，它很容易受外境影響，它遇到好的環境，\n它就正念分明，它回到家的時候就開始放逸，所以這第六意識就是這樣子。\n\n怎麼去強化第六意識\n第一個聖道門的菩提心跟空正見，用願力跟空性來引導第七意識\n第二個透過淨土門的憶佛念佛，來引導第七意識，兩個地方。\n\n你必須靠這兩個，觀照力、誓願力。你才能夠補強第六意識，把第六意識的弱項，它的不確定性，因為第六意識是它很容易受外境刺激，尤其是感受，這個苦樂的感受一刺激第六意識，第六意識就變。\n\n你的修行的訴求提升到誓願力的時候，那這個是超越感受了。\n\n安住真如，給我們一種不退轉的力量，\n因為我們的心永遠是如此的清淨，永遠的具足如此的功德。\n真如緣起有它不足的地方，因為它有兩個特點是它不足的地方\n1. 第一個，它只論相應，不論相續。\n2. 第二個，它只論迷悟，不論業力。一念迷生死浩然，一念悟輪迴頓息。\n但事實上我們覺悟以後，我們還是要面對業力的，這是一種現實。比方說\n你知道了極樂世界的功德莊嚴，你現在想去極樂世界可以嗎？當然不可\n以。雖然你現在信願具足，你的資糧都具足，但是，你有生死的業力未了。\n所以你覺悟是一回事，你必須要面對你的無始的生死業力，你必須把今生\n的業力給償還結束了，所以往生淨土是臨命終時。\n比方說我現在在佛堂打坐非常好，我信心具足、願力具足、佛號具足，三\n資糧具足，阿彌陀佛你趕緊來接我吧！不可以！只有覺悟是不能往生的，\n你要考慮業力的現實，因為你是個業報身！\n\n所以如實的面對過去，這個是唯識學非常重要的特點，把你帶回過去，瞭\n解自己。唯識學把種子分成兩種相貌、四種功用！\n兩種相貌\n第一個，它的相貌是「刹那滅」。\n第二個，它是「相續的」，種子沒有有效期限。\n\n四種功能\n第一個，「果俱有」。\n這個是我們最容易忽略而最可怕的功能，就是當\n你把這個種子種下去以後，它會有一種等流的力量，它自己會蔓延。\n你沒懺悔。你沒懺悔，它自己會蔓延。\n第二個，「性決定」。它的體性是不會改變的。\n第三個，「待眾緣」。如果你臨終的時候有任何的惡念，執著，去\n刺激到這個惡業的地雷，它就是要爆炸了，要得果報了。\n最後一個，「引自果」。\n\n當然，我們今生有某種程度的主導權，我們可以把過去不好的種子破壞掉，把好的種子珍藏起來，這個就是我們要做的工作。\n\n種子它是怎麼來的\n我們每一個人一出生，就有兩類的種子：一個是本來就有的，一個是後天熏習而有的。\n阿賴耶識，首先，我們在面對我們過去的種子先把它切開來分成兩類，一個是「本有」的，一個是「始有」。\n它不是那麼堅固，它是可以變化的，可以改造的，這個就是「始有」。另一個就是不好改變。我們每一個人一出生的確不平等，有些個性是不容易改變。所以在唯識學，它把我們每一個人——學佛人，分成五種種性\n第一個定性聲聞(特別歡喜修習無常苦諦)\n第二種人是定性的緣覺。那麼緣覺乘，他就比聲聞乘好一點，他也有\n出離心，但是他不從苦諦生起，他是觀因緣的生滅\n第三種是定性菩薩，他一旦接觸佛法以後，他把他的菩薩種性\n的善根一啟動的時候，他立馬懺悔，就他那種反轉的力量特別強。\n第四種是最多的，就不定種性。遇到大乘佛法的老師，你就變成菩薩種性，你運氣差一點，遇到了邪師外道，你就變成外道種性。因為你過去生沒有產生\n一個堅固的善根\n第五種是最糟糕的，無性種性。他完全沒有出世的善根，只喜歡修習\n人天福報。\n我們一般人都是不定種性，那麼我們可以透過我們的學習，我們的教育，把我們的因地發心，把它弄得跟成佛的菩薩種性是一條線的，這是第一個。\n\n什麼是有漏的種子\n「漏」有兩層意思，第一個是過失，第二個\n是障礙。那麼也就是說，這個「有漏」就是以自我為中心，所造的善業跟\n惡業通通是有漏。\n\n什麼是無漏的種子\n第一個我們看「生空無漏種子」，由無常生滅的心去修一個無常生滅的境，所以這個當中是無我、無我所的，沒有一個主宰者。\n\n第二個「法空無漏種子」，站在一種本來清淨的角度來面對人生嘛，這\n個就是完全沒有對立心，這個叫做俱空，它從根本上觀空，這種理觀是可\n以的，但是唯識學不採取這個觀法。(根本的空觀) \n\n第三個「俱空無漏種子」，「俱空」的意思就是說它從根本上觀察無生，所以這個空觀你不需要對治，因為它本來就沒有，本來就沒有生死，本來就沒有業力，因為它直觀真如嘛，它正念真如。叫做無分別智。(對治的空觀)\n\n我們修無分別智就是要把妄想停下來。你不能講話，因為你一講話就打妄想\n這個是根本上，那枝末上也得懺悔業障，這兩個雙管齊下，一方面懺悔業障，一方面修無分別智，那麼這個就是，一個是對治的空觀，一個是根本的空觀\n\n\n我空的人，他經常修我空觀的人，這種人你跟他接觸，\n你會發現，這個人內心調柔寂靜，不喜歡多事，因為他「無我」，他的心\n是調柔的，調柔善順的，他不會想要去主導什麼東西，他認為一切都是因\n緣所生法，這個人我們可以判斷這個人的阿賴耶識他的內心世界，他「我\n空」的功能很強，他散發出來的身口意是調柔寂靜的。要多一個廣大圓融，他要多一個「法空」的思想，心量廣大，做事情善巧圓融。你看懺公師父常說：\n我們做事情怎麼樣做好，我們就怎麼做，看因緣辦事\n\n前提是你先瞭解自己，就是說你現在形成這樣的思考模式，是你要的嗎？是跟你的目標相應的嗎？你要先想一想\n你這個水流是很容易起煩惱，很容易去傷害別人，這是一種三途種性\n的水流，它走到了三惡道的跑道，\n\n它還是一種自我為是，自我為中心的一種善業，走上人天的跑道？\n還是一種出離心為主導的二乘的跑道？\n還是一種大乘的圓融平衡的菩薩道的跑道？\n你最好先冷靜的看看你的過去，你才知道你今生要做什麼事。\n\n他好不容易在三惡道裏面打滾出來，得到人道，他很可能遇到\n佛法改變他的生命水流，在生命當中產生重大突破的，結果你把他這個唯\n一的機會給消滅掉了，所以殺人是犯重。\n\n大身的傍生，這個傍生就是畜生，比方說你殺一頭大象，比殺\n一匹馬重，因為大象的身體比較大。你殺一匹馬比殺一條狗的業要重，就\n是身體越大的，它越有靈性，所以你殺它呢就比較重，這個是從外境來安\n立。\n所謂的聖道門，對於來生的果報的看法是不太一樣的。我們是不想要有果報了，我們是希望到淨土去，所以我們必須想辦法讓業力到今生 stop，我們追求的是無生，所以我們的要求比較高了\n\n你必須在死亡到來之前，好好的把你阿賴耶識當中強大勢力的業力，透過懺悔、透過空觀把它沉澱下來，讓它是可以帶業的而往生，淨土宗的標準是臨終的正念，它必須把所有的果報到今生截止了，做一個了斷了，所以這個水流不能再流下去了，截斷生死之流，淨土宗是這個思考了。\n\n\n我們一個人叫做「自變自緣」，我們永遠活在自己的水泡，你走不出這個水泡的，我們自己變現一個影像，讓自己來受用。我們一般人，沒有修空觀的人，\n你永遠活在你的妄想，永遠！就是你的業力變一次，你的我執又變一次，\n你的妄想又變一次，然後你把你心中看到的東西都當真的，這個就是「識\n變」。你得到的影像，完全是你自己的過去的業力跟今生的妄想捏造出\n來的，你感到痛苦是你自己的影像讓你痛苦，跟別人沒有關係，你感到快\n樂也是你自己的善業跟你一個美好的思想的結合讓你快樂的，跟別人也沒\n關係。\n「本質相分」，就是第八識的相分，這「本質相分」是眾生的共業，就是眾生的阿賴耶識所生的實種之法，實種就是它完全是種子變現出來，沒有經過你的分別執著的，包括你的正報的根身、依報的環境，所以「本質相分」我們沒有一個人看得到，因為它是眾生的共業\n往生到西方以後我們八識的種子在什麼地方處理? \n第七意識它跟第八識是分不開的，因為它們倆是在一起的，因為\n第七意識執著第八識為「我」，所以只要有第八識在，就一定有第七意識\n的影子在裏面，第七意識向內執著第八，向外干擾第六。\n這個調伏是透過懺悔，就讓它睡眠，它在睡覺，就種子就睡眠狀態。你可別\n把它喚醒，讓它繼續睡下去。\n\n唯識學不講真如，對不對？它生命的第一個開始就是阿賴耶識嘛！那麼你一個大海，你不能裏面什麼都沒有，一定得有個水分子，\n阿賴耶識一定有一個本來的種子。其實我們本來是清淨嘛！但是從唯識的\n教理它要合乎邏輯，它必須要安立「本性住種」，要不然就不合邏輯了，\n是吧？它要自圓其說嘛，但是它的意思就是說，我們真的有些種子是很堅\n固，不可破壞。我們取其義就好了，抓它的義理。因為唯識學它提供一個\n非常清楚的業果相續的概念，雖然它不像真如那麼圓滿，但是它會讓我們\n看清楚業果的流動、業果的變化。\n\n拜八十八佛，重點還不是說你能夠懺悔多少，其實你的業是懺不完的，但是非常可貴就是你透過拜懺當中借相修心，你培養一種慚愧的心，這個對你非常關鍵，非常可貴。第八識在釋放果報的時候，你是不得自在的，你能夠做的只有一件事情，就是認命隨緣。當然人生也不是如此的悲觀，你還有第六意識，\n你在面臨生命的果報的時候，你是有選擇的，你可以選擇造善，你也可以選擇造惡。\n\n唯識學的人生觀是建立一種無量的生命觀。當然生命的相續必須由業果相續來支撐，誰能夠做因果的橋梁呢？那就是「種子」了。你必須要面對你自己的種子，你不能夠完全忽略它的存在。所以你既然遲早面對它，從佛法的角度你早\n一點瞭解它，早一點調伏引導它，對我們是最好的\n\n佛性的確是平等的，但是我們把佛性轉成人性的時候，它又是不平等的。人性的善根是有差別的，比方說有些人他一學佛法，看到佛法講苦諦、講到無常，他生大歡喜，發心學佛，這個就是你的寶藏，你的善根點就在苦空無常無我；比方說有些人聽到空性的道理，真如本性，本來清淨，本來具足，生大歡喜，這個就是你的寶藏；有些人講到大悲心，願代眾生受無量苦，令諸眾生畢竟大樂，他生大歡喜，這個就是你的寶藏。\n\n什麼叫做「重大的業力」？有三個條件，你最好自我反省一下：\n第一個你造這個業的時候，深生好樂。你曾經在你的生命當中，造某\n一個殺盜淫妄業的時候，你內心是非常大的意樂，誰勸你都不聽的，你的\n心就像石頭一樣的堅固，非做不可。\n\n第二個數數現行。\n你經常的去造作，起碼你有一段時間是經常造作的，數數現行在古人的開示，三次以上就叫數數現行，達到第四次就叫數數現行，次數在四次以上。\n第三個無慚無愧。\n你事後根本沒有懺悔，就把它放著，這種業你是不能帶走的\n\n\n果報受用的差別因緣變跟分別變\n因緣變就是當你的明瞭心跟外境接觸的第一念，你的心還沒有起\n分別的時候，這個就是『因緣變』。你的思想還沒活動之前，第一刹那，\n我們一般的因緣變只有一秒鐘的時間。\n\n那第二念以後就不一樣了，因為仁者心動，這個時候一念方動烏雲遮，那人生就變化了。所以第二念以後，就落入了分別變\n\n『亦無所托的本質叫獨影境』。這個就是你完全在打坐的時候，在打妄想。『獨影境』這個『獨』就是第六意識，它完全沒有靠前五識的幫忙，它自己在心中捏造一個妄想出來。按照佛法的角度，我們後面講「無分別智」，就是說你剛開始學佛，你要把人生恢復到本來面目。按照佛法的角度就是說你現在對人世的認知完全是錯誤的，你看佛法的意思，先否定再肯定，按照唯識的角度，你對\n你的認知要全盤的否定，要把人的生命先歸零，否則你這一輩子，都沒有看到人生的真相。\n\n果報受用的差別共變跟不共變。「共變」就是有「共業」，這個因緣你可以\n受用，我也可以受用；或者是「不共變」，有些因緣是個人個人受用。\n\n名言種子\n名言習氣、名言薰習、等流習氣\n業種子\n有一種業，你必須要早點處理，就是強大的業力。\n\n輪迴的狀況\n我們的生命本來是個點狀的生命就形成一個無量無邊的恒轉如暴流的水流了，一種相續的一條直線的生命，就使令『前異熟既盡，復生餘異熟。』就是你今生結束以後來生會馬上得果報，你一定要得果報的，因為你兩個因緣都具足，第一個，你的業力還沒消；第二個你的執著還在。所以這兩個是輪迴的因啊。\n淨土宗的人不把生死業力當一回事，我勸你不要高估了自己。當你臨終重大業障現前的時候，你是提不起正念而且你幾乎沒有時間讓你提起正念。淨土宗是為來生而活的，你今生要完全放棄。如果你今生要達到臨終的正念，你必須把今生的希望完全放棄。因為你今生有所求，你一定會在輪迴當中繼續得果報。你對娑婆世界不能有任何的希望，即便來生讓你變成一個大修行者，弘揚佛法廣度眾生這個希望都不可以有，因為執取也是輪迴的因緣。\n\n業力你不可能懺乾淨的，我們只能夠抓重大的業力來懺悔懺除，因為它帶業往生嘛!你不能把所有的時間都用來拜懺，不可以，它不是正行。但是你要拜懺，因為它有些重大的業還真的要拜，但是它不是主軸，關鍵在於愛取呀，執著這一塊是比較嚴重的。你面對問題的時候，臨終的時候，你是怎麼想的，你對未來是怎麼想的，你是繼續執著娑婆世界，還是把所有的希望求生淨土，這個影響到你所有的佛號的去向。其實整個我們淨土宗的所有的功課都在對治第七意識，你要把重兵壓在第七意識，因為你精神體力有限，把一部分的精神用在懺悔，把所有的精神用來對治你對娑婆世界所有的愛取，因為它是成敗的關鍵。\n\n\n智者大師把第六意識分成四種情況\n第一個根鈍遮輕。\n有些人沒什麼善根，但是他也沒什麼煩惱罪業，他善業強。\n第二種人是根利遮重。\n善根強煩惱也重，這種人末法時代很多。他來\n到三寶的地方，他的善根就表現出來，回去的時候繼續放逸。\n第三種人是最好的根利遮輕，\n好像活得很快樂，也沒有人說一定要怎麼樣，怎麼怎麼的吃多少痛苦，完\n全沒有，輕輕鬆鬆的成就聖道，因為他根利遮輕。\n第四種人是最糟糕的，根鈍遮重。善根也沒有煩惱也很重，那麼這種\n人在輪迴當中，他大部分是處在三惡道的下階的生命中過活。\n\n\n業果轉變—增長業不增長業\n什麼叫「增長業」呢？就是我們前生或者今生在造業的時候，會創造一種強大的勢力，使令這個業產生相續的增長，就是讓這個業力啟動起來\n\n八十八佛扮演重要的角色。「取相懺」。它的好處，它是空間上通懺身口意十罪業，在時間上它通懺過去、現在，不是今生，前生的業都可以懺。所以取相懺是我們很重要的法門，就是在調伏重大業力的時候。我們最好一生當中在你往生之前，要有一百天很誠懇的拜懺。我們相信我們無量劫來到現在，你的阿賴耶識，合理的推論你一定有增長業存在。八十八佛你可以完全得到栽培，因為它的結構就是包括懺悔、皈依、發願，它整個結構就是這樣訓練你。八十八佛就八十八尊了，是吧？佛共用一個法身，他的法身是一尊，但是他有應化身，他過去生發的願不同，他從空出假了、從本垂跡了，他來到人世間各有各的緣，他過去跟誰結的緣他就來到哪個地方。所以佛也有共也有別，共是同一法身；別，他有他的自受用報身跟他的應化身這是不一樣的。八十八佛，它是有一個儀軌，有一個文字，它會引導你，產生懺悔、產生皈依、產生發願，對不對？那你就很輕鬆，你只要照著文，你就把這個儀軌走一遍，它自然生起三種善根，就是說它這個就幫你設計好了，是吧？當然如果說你八十八佛拜了一段時間，這三種善根我很熟悉了，我在拜的時候，我一句佛號拜下去，具足懺\n悔、皈依、發願，你一句佛號就夠了，就可以了。\n\n對治業力\n1.\t第一個你起慚愧心\n2.\t臨終的正念你最好能夠產生一種業力反轉的善根。臨終的時候就看電影一樣，你過去生所發生的事情，會讓你看到，或者別人的一句幾句話，或者你看到什麼景象，也可能會觸景生情，這個時候你的無分別智，就扮演重要的角色，趕快踩刹車，這條路不能走下去了，情執一牽動你就前功盡棄了。\n3.\t第三個憶佛念佛淨土的往生心。\n\n\n研究唯識學，基本上祖師是把它分成兩塊：一個是唯識相，一個是唯識性。就是心識它的一個活動的相狀跟心識的本體。那麼當我們在看唯識的一個活動的狀態的時候，我們的結論就是說：萬法唯識。我們人生當中只有兩件事情：第一個叫自變，第二個叫自緣，人生只做兩件事。自變就是阿賴耶識把我們過去的善惡的業力，在我們的心中變現出來，所以我們只能夠受用我們心中的影像，這就是為什麼佛陀在《楞嚴經》上說，我們只能夠活在我們自己的小水泡。這個水泡就是業力，我們只能夠在自己的業力的影像裏面活動，你超越不\n了你的業力。\n\n從變現的角度當然第八識是主角，從攀緣的角度第六意識是主角。所以我們人生就構成了業力跟心力的交互作用，看是業力強還是你的心力強？你如果是業力強，那麼你就是心隨境轉，就是萬般皆是業，半點不由人；如果你心力強，那麼就是應觀法界性，一切唯心造，人定勝天\n\n一個成功的人他一定要擅用第六意識的思考。從唯識的角度，一個人不喜歡思考，你就很難進步了，因為你要改變業力，唯一的就靠第六意識的思考，如理思惟。你什麼都不想，你就是保持原狀了，你就活在生命的等流性當中。\n\n從變現的角度當然第八識是主角，從攀緣的角度第六意識是主角。所以我們人生就構成了業力跟心力的交互作用，用第六意識來調伏第八識業力的時候，你覺得無奈的時候，你必須把第六意識找到家，因為第六意識以第八識為家是不好的，所以在《楞嚴經》裏面提出。一個很重要的新的概念叫正念真如，我們必須把第六意識跟真如做一個連結：何期自性本自清淨，何期自性本自具足。\n\n你第六意識要先想一件事情：你本來沒有業力的，這件事情對你非常重要，生死的業力如此的強大，因為它無始劫熏習而來。第六意識的思考能力必須跟真如本性的不生滅性做一個結合，那這樣子就圓滿\n\n你沒有靠第六意識強大的思惟能力，你老是正念真如，你不能做出因緣的改變。雖然我們面對了一個廣大的阿賴耶識的業力，但是你不要怕，它\n們是虛妄的，只要你堅持真實的，虛妄就會慢慢的消失掉。\n\n業力的種子，它有兩個相貌：它生滅，但是它又相續。其實它的相續，\n是受到第八識的影響，因為第八識，它有一個很強大的功能叫受熏持種。\n熏習的過程是刹那刹那生滅，但是熏成種子以後，它變成第八識的一分子了，第八識是恒常相續，恒轉如暴流。\n\n造業的時候，第八識同時在受熏，這個時候是怎麼樣呢？是生滅的！就是第八識在醞釀這個種子的時候，是生滅的，但是在受熏的過程，當它受熏完變成種子的時候，它變成第八識的一分子了，第八識是相續的，所以它也變成相續了。\n\n業力它本來是一個分散的嘛，你看你昨天造了一個很輕的業，不一定有關係吧？你前生造的業，跟今生的業也沒有關係吧？所以業力它本來是沒有一個整合性的東西。第七意識把它成功的整合，這最糟糕了，因為第七意識跟第\n八識在一起的時候，它捏造一個自我的概念，使令這個生死的業力，變成\n有得果報的力量了，本來它是一個分散的一種能量。所以生死的問題，你\n不能消除業力，因為業力太多了，你只要把它整合的力量——第七意識把\n它調伏了，你就可以帶業往生了。\n\n\n第六意識是所有八識裏面它最自由的，它有完全獨立自由的意志，對不對？那麼第六意識修無分別智，它不是無記業。無分別智是一種智慧，跟你什麼都不想不一樣的，什麼都不想叫做愚癡。它是透過思惟以後把妄想停下來，這一塊我們後面再說明。無分別智是先觀後止，它是先觀了以後再把妄想停下來，它\n對妄想是有調伏力的。(你必須站在本來沒有妄想的角度來對治妄想。)帶業往生就是說，你不要讓業力變成一種招感的，不能把它變成一種異熟的力量，你不能讓它有一種異熟的力量。你的田地有很多種子，你只要讓它枯萎就好，你不一定要把種子鏟掉。\n\n\n大乘佛法認為所有的業都可以懺悔，即便你造了五逆十惡都可以懺悔，因為業是不決定的，業本身就可以改變。因為我們講過業力兩個相貌：一個刹那滅，一個相續，它那個刹那滅給你一個很大的信心，它生滅的，生滅就表示它會變化\n我們懺悔業障，從事相上我們的後悔，會讓你當體的這個業，你所懺悔這個業的勢力薄弱，因為它斷相續心，我們知道業力它最需要的是一種相續，因為它本身是生滅的，它必須要靠你不斷的造作給它能量。\n\n如果你今天只是懺悔，你沒有養成一種思考，一種道理的理解，那這個叫做「善念」。但是你在懺悔當中，你悟到一個道理：喔，原來造罪業我們是要付出代價的，是得不償失的。因為你造業的時間太短，你得的果報太久，這是划不來，那麼你在懺悔當中你能夠跟佛法的道理結合產生一種勝解力，產生一種內心的觀照，這就是「善根」。\n\n懺悔是你做錯了事才懺悔，你這個事前的防範，就是屬於「觀照」了。\n\n\n你每次吃肉的時候都很慚愧，除非了，這是你唯一的希望。就這樣，如果\n你一定要吃肉的話，你就，哎呀，對不起，我實在不想吃你，但我也沒辦\n法。你向佛菩薩懺悔，然後再去吃它這樣子，每一次都要做，每一次喔！\n否則你就是數數現行，增長廣大。說你經常吃肉的人，它會斷你的菩提的善根，你這個人大悲心不容易生起來。你經常吃肉，這個肉吃久了以後，你看到眾生有痛苦你沒感覺，你自己就沒感覺。\n\n我們生生世世都是同一個阿賴耶識嗎\n1. 你不可能每一生的阿賴耶識都是固定的，不可能。它不斷的\n接受資訊\n2. 為什麼我們出生以後，都不能記得以前的事情。你今生只是你阿賴耶識很多很多種子其中的一小塊種子起現行。佛陀用水泡做比喻，你想想看，大海的海水這麼多，它只是其中一個水泡。不要太相信今生那！它是你很多很多生命的其中一小塊而已。\n\n\n第七意識是很專心的，它隨所生所繫，得什麼果報，所以第七意識緣什麼像什麼，當你是螞蟻的時候，它就變成一個螞蟻的自我；當你變成一個國王的時候，第七意識就變成以國王為自我，所以它的這整個因緣，全部都在變化當中，所以佛法講無我，它沒有一個常一不變的東西\n\n第六意識的執著是選擇性的，第七意識的執著是平等性的，這第一個；第二個，第七意識的執著只緣現在，它不緣過去也不緣未來。第六意識就不一樣，第六意識是想到什麼就執著什麼。它可以執著過去，雖然這件事已經發生很久了，但是它第六意識還是揮之不去，它還是把它抓住不放，那個影像還是不想把它放掉，這個就是一種分別的執著。因為你不斷的分別它，你就加強你的執著力量。\n\n\n你第七意識的執著先可以不管它，因為它不招感分斷生死，但是分別起的執著，這個地方要注意。所以我們一般來說修無分別智，它主要是中斷第六意識的執著，就是帶有感情性的執著，這種一定要分別要打妄想，它才會生起執著。但是第七意識，真正第七意識的俱生的執著，你不打妄想，它也會在執著，那麼這一塊就不是我們能夠管控的，這個就太深了。修無分別智，就是把這個路給切斷。因為你越分別，它就越執著了，這有關係的。所以你分別心越\n重的人，就越容易執著了，這個是有關係的。無分別智的意思就是說不要把結果看得太重要，因為這一塊你沒辦法改變了，它是一個成熟的業力。\n\n\n\n憶念佛陀、憶念淨土，若眾生心，憶佛念佛，現前當來必定見佛，你要不斷的憶念他。第六意識它除了造業力強，諸位要知道，它也很會去激發業力，它不是造業而已，它還會去潤生。你沒有是心作淨土，它怎麼會是心是淨土呢？\n它怎麼會有結果出來。所有的因緣都要創造，沒有一件事情是自然產生的，你就算感應道交，你也要做一些準備，是吧？你對娑婆世界的攀緣減少了，執著減少了，它的生死業力自然就沉澱下來。\n\n你在娑婆世界一活動的時候，那就把所有的生死業力給刺激了，因為你一分別就帶動執著，一執著讓生死業力變得更有力量，它是互相有關係的。所以你不想刺激生死業力，你就必須把心投到淨土去，因為你必須轉移目標，你不可能無住，我們不可能說，我心完全無住，那是聖人的境界，你要讓心有一個住處，既然今生不能住，你就把心提早住到淨土去，這對你是非常有幫助的。\n如果佛號會引導你，那每一個人念佛都應該往生，而且這樣子也違背佛教\n的因果思想，一切唯心造就徹底被推翻了。我們要強調，阿彌陀佛的聖號\n是無量光無量壽，但是它沒有方向性，是你的心是心作佛，是心是佛，是\n你的心來引導佛號，不是佛號來引導你，這個是他生的思想，這個諸位要\n很清楚。\n\n\n第六意識的調伏跟引導，每一個宗派不一樣。如果是聖道門，當然它往空性引導，往菩提心引導，往出離心引導，但是淨土宗的引導它當然引導厭離娑婆欣求極樂了。第六意識如果你不教育它，它會闖禍，第六意識，你好好教育它，它會創造無量的功德，看你，而且你的希望也就全部寄託在第六意識了。你一是放縱第六意識，跟著感覺走，你想幹啥就幹啥，完全感覺，你想做什麼，你現在的感覺想幹什麼就順它，那第六意識就壞了。那麼第二種你就是必須教育它了，你先設定一個目標，讓第六意識跟著你的目標走，就是你聽我的，我的目標是什麼，我必須達到這個厭離娑婆，欣求極樂的目標，那你必須要不斷的訓練它。佛陀說了很多的法，其實就是讓你用來教育第六意識的，就這個目的而已了。教育你的第六意識，叫它聽你的，照你的規劃走，這個就是修行。佛陀要你訓練第六意識，他可沒有叫你把第六意識停下來。你把第六意識停下來，你就是一灘死水了嘛，死水不藏龍嘛，你怎麼改變呢\n\n淨土宗要培養臨終的正念是什麼意思\n臨終第二念的正念！正念，第一念的正念不容易做到。當第一念起顛倒的時候，你平常就能夠提起第二念的正念。第一念很多都是我們過去的等流習氣，你要第六意識第一念就聽你的，我覺得有點強人所難，因為這個第六意識它有等流性嘛！它前生是什麼習氣，它今生還什麼習氣，所以你現在只能夠要求第六意識第二念聽你的，就不錯了。為什麼不怕你打妄想，只要你肯覺悟就好，為什麼？對了，因為真能破妄，就這句話而已！\n\n你提起佛號，你還得引導佛號，你要做兩件事情，提起佛號是一種專注力，一種止，引導佛號是一種觀照力。\n\n你願我臨終無障礙，你跟阿彌陀佛就是發願說我希望，這個願力不可思議，真的你發願，你所有的功德就往那個方向走，讓我能夠要麼我好好活著要麼就早點走。我跟大家講，拖下去是對你非常不利啊。\n\n感應道交\n有兩種差別，一種叫做平時的感應道交，一種叫做臨終的感應道交，這兩個內涵是不一樣的。平時的感應道交，是發生在第六意識，你那一種很堅定的信仰，去跟彌陀的本願功德感應了。輪迴的本質，並沒有改變。所以淨土宗所有修行者最終的目的，是追求臨終的感應道交，因為它牽涉到生死問題了。\n往生的人只有一種情況，就是當你臨終的時候，把佛號提起來的時候，你阿賴耶識現前，它不能障礙你。就是阿賴耶識裏面所有的種子，都是跟彌陀的功德是隨順的。\n\n阿賴耶識要處理兩個問題了：一個是業力的問題；一個是思想的問題。所以我們要在臨終之前，做好兩件事情：第一個讓你所有的業力順從本願；第二個讓你所有的思想順從本願。\n\n懺悔法門-業力\n處理你的業力，你要勤修懺悔，對於我們過去生所造的殺盜淫妄，對於今生所造的殺盜淫妄，我們要在佛前至誠的修懺，發露自己的過失。你也可以拜八十八佛，你也可以專拜阿彌陀佛，關鍵是要以慚愧心，用慚愧心來面對業力，這是第一個：懺悔法門\n\n訓練佛號力量-皈依\n佛號在你的身口意當中，要有一定的相續，要淨念相繼，直到阿彌陀佛現前之前，你這個佛號，心中要能夠一段時間的運轉。心于佛號專一安住，心於佛號相續安住。所以你平常要訓練這種跟佛號的一種皈依的力量。\n\n避免身口意的過失-發願\n好好的遵守佛陀的戒法，避免身口意的過失。\n\n我們一個正常人，沒有經過佛教的訓練教育之前，我們臨終一定起\n顛倒。因為你平常是起顛倒的，所以臨終，只好起顛倒，因為它是等流性。\n不起顛倒，它不是自然，你要加以教育、溝通來引導它。透過懺悔、皈依、發願，慢慢把罪業調伏了以後，現在要做的就是開始去引導我們的思想，讓它順從本願，不要再順從娑婆世界了。\n思想的教育、思想的改正，一個就是「空性的教育」；第二個「菩提的教育」；第三個「淨土的教育」。就是三種的觀照，透過觀照空性、觀照菩提、觀照淨土，我們必須把思想讓它跟淨土的功德是相隨順的。\n\n心識所變現的這些各式各樣差別的影像，有這個富貴的影像、有貧窮的影\n像、有莊嚴的影像、醜陋的影像，各式各樣的影像，那麼這個都是阿賴耶\n識的業力變現的。那麼這些影像是怎麼來呢？是透過因緣的力量，這個因\n緣當然指的是善惡的業力所變現的色心諸法，這種差別的果報相，那麼這\n種叫「依他起性」。(鏡子) 「唯識相」它是可以去感受的\n\n我們一般人都是用六根，我們一般人的特點就是活在直覺。我們一般的生命現象，就是把生命完全跟著我們的感覺來引導我們，就是六根接觸六塵，產生的感受。唯識的實性指的是真實圓滿的摩尼寶珠。\n\n真實圓滿的摩尼寶珠?\n1. 只要隨因緣變化的都不真實\n我們今生所有的快樂都是借來的，你的壽命是借來的，你的長相也是\n借來的，你的財富也是借來的，你的眷屬也是借來的，你失掉了因緣的對\n你的支持，你就什麼都沒有了。所以諸位，凡是借來的東西你就必須要還，\n這個佛法說是不真實的，夢幻泡影。\n\n2. 它的存在不受因緣的干擾\n\n你想主宰你的生命你來生就不可能往生\n\n你要怎麼去操控業力，你有兩個選擇：用自我來主導它，我們習慣性面對生命的時候，想要去主宰它，這就失去了真如的這個摩尼寶珠了。\n你想主宰它，你就必須放棄你的自在，你就不得自在；你想要自在，你就必須放棄對人生的主宰，你只有兩種選擇。我們必須放棄自我主導權，真如才會顯現。\n\n你不放下，你的人生就充滿了業力，你的人生充滿了業力，從你心中創造的佛號，也充滿了業力，這個佛號不是往淨土去的，是往娑婆世界去的。\n\n現在你要做一個很重要的工作，就是破壞第七意識的執我，不能讓這種片段的業力，把它串成一種輪迴的力量，這是我們要做的很重要關鍵。那麼要阻止第七意識的活動，就必須放棄主宰。因為第七意識的根本就是想要主宰，它一直想要主宰第八識的業力，就是我空、法空的真如。\n\n真如你得到以後，你就非常的有安全感，它永遠不變化。\n\n真如有兩種概念：\n一種是理性的真如，一種是功德上的、修德上的真如。\n唯識學強調的真如是修德，就是你要去修，你要去破壞這種自我的主宰，然後真如才會顯現出來，你修行以後才有的真如，這第一個，從修德；\n第二個是本具的，就是你不管修不修，你只要知道有這件事情，何期自性本自清淨就可以了。\n\n二乘人，他在找真如的過程當中，用極度的相狀的毀滅，使令他偏空了。就是他的人生只能夠從假入空，他不能從空出假，錯損菩提了。\n\n你想走大乘的路線，你一定要記住雙向思考\n你厭離娑婆只是暫時的厭離，你不能產生永久的厭離的感覺，要不然你以後就很難走了。厭離娑婆是需要的，但是你用什麼態度來厭離，那很重要，你最好不能夠對未來產生後遺症。你不能把所有的假相、因果，三界的因果全部否定，因為你以後還要回入娑婆嘛！你還記得嗎？你當初發的願，是吧？你把第八識的因果都否定了，那你以後回來怎麼辦呢？你這個心態就有障礙了。(本質上不存在，但目前也不能否定)\n\n我們希望臨終能夠創造一個很祥和的相狀，來幫助我們提起正念，這個是有需要的。\n我們把相狀剝開來，看到我們生命兩個本體：一個是自我，一個是真如。\n佛陀在開顯真如的時候，就是告訴我們，放棄輪迴的主宰，放棄生命的主宰。\n\n假設你毀滅了自我，那你就違背了因果道理了，因為有一個我，才能夠合理的建立一個因果的道理，因為我自作自受嘛！我們第六意識會產生一個錯覺：欸，這個是誰做的？是誰想要來傷害我？其實這個地方沒有一個造作者，因緣力故。《楞嚴經》講得更徹底，叫「循業發現」，就是你業力成熟了。所有你今生的遭遇，只有一種情況叫做「因緣力故」，或者叫「循業發現」，所以它沒有我嘛！就是你一個明瞭的心，接受因緣的力量的主導，因緣讓你快樂，也是因緣讓你痛苦，這當中是無我、無我所的，是畢竟空、無我無我所的，完全是你過去生的因緣成熟了，所以它引導你快樂、引導你痛苦，所以不是由我讓你快樂，也不是由我讓你痛苦。你的快樂痛苦，不是你主宰出來的，是你的因緣成熟，是因緣讓你快樂，也是因緣讓你痛苦，這是第一點，這是我們應該認知的\n第六意識可以做主，你認為第六意識隨時都聽你的嗎？你控制不了它的，說實在的，是吧？你起煩惱的時候，你控制得了它嗎？它有主宰性嗎？沒有嘛！它也是一種因緣，它在熏習的時候，它在造業的時候，它有它的過去的種子在支持第六意識，你有辦法主宰第六意識才怪。\n\n沒有一個常一主宰的我生命怎麼連貫下來呢\n沒有一個我，那誰來記憶這件事情呢？我怎麼會回憶到過去，\n我跟這個人熟悉，對這件事情熟悉呢？\n因為有第八識嘛！第八識是永遠保持相續，而且它能夠保存你過去生所栽培的種子，跟第六意識的思想的現行，互相為因緣，種子起現行，現行熏種子。，沒有一個我。你的第六意識明瞭性，去拜懺、去念佛、去修止觀。\n\n由妄熏習似我相現，愚者於中，妄執為我\n生命其實它是一個相續的水流，這個水流不是你說了算，不是你主導的，\n是因緣的力量跟熏習的力量來主導這個水流的。這種因緣力跟熏習力兩\n種交互作用，它產生一種很緊密的相續，就讓你有一個自我的感覺出來，\n由第七意識產生種錯覺。第七意識產生種錯覺。那麼於中呢，就把這種相續的因緣，執著有一個我來主導人生，其實是錯誤的。\n\n生命是不能主宰的，我們只能夠熏習，你只能夠在因地去熏習它，你不能在果地上去改造它，不可以，這個就是無我的真理。\n\n家庭、國家佛法說法\n你熏習的能量到一段時間的時候，果報就因緣力故，就變現一個\n果報出來，它也是有相狀。作依、作正，它那個心識變現你依報的國土，\n變現你正報的根身，也變現你自己的業力，也變現成他人的業力。所以我\n們凡夫的業跟眾生的業是互相的交雜，尤其是同一個家庭，這個業力更密\n切，有共業、別業，這個業力互相牽扯。在生命的假相當中，它有空性的存在，在空性當中也不妨礙生命的因緣假相，刹那刹那的生，相續變化，這個就是中道，這是緣起性空，性空緣起。\n\n\n流轉\n三界中，到底是誰在流轉？你說我在流轉，不對啊！因為前生的你跟今生\n的你，兩個相狀不一樣。你前生可能是一個男人，今生變成一個女人，所\n以沒有一個我啊！一念的心在流轉。心識的熏習力、因緣力，它如果熏習好的，這個心識就往上走，它才能變現好的果報讓你的心來受用；如果它產生錯誤的熏習，它就往下走，往下墮落，這個心也變現一個痛苦的果報，讓你的心來受用。\n\n我執法執越重的人越容易讓相狀相續\n你對生命越執取的人，你很難從你的生命產生很大的反轉。所以諸位，你不斷的修空觀，即便你臨終的時候，遇到一個不好的因緣先出現，你很容易從因緣裏面產生反彈，叫「斷相續」。\n\n你要讓生命的相狀在溫和的相狀，這第一個，創造一個溫和的相狀；第二個臨\n終的時候，對娑婆世界不能有貪念，不能有執著，你要放棄主宰，你不能\n有想要主宰來生，你不能夠不受後有，過去不談了，你在臨終的時候，你\n還想要主宰以後，你就完了。你必須放棄主宰權，你才可能往生淨土。\n\n修行是在差別中找到無差別。所以差即無差，凡夫是無差成差，從\n無差別中去用妄想去創造差別。\n\n你做為一個母親，你該講的，該教他的，還得教他嘛，但是他未來會\n變怎麼樣子，你不能主宰。因為他不是你的東西，他有他背後的業力，他\n有他背後的因緣。過程要盡力，結果要放下，凡事盡心盡力，結果交給業力。\n我們人生的相狀有很多種，但是結果只有一個，那就是沒有結果。我們沒有一個人是有結果的，因為我們的生命本體是空的，因為它本質就是空性。人\n生是沒有結果的，你最好在死亡到來之前，早一點知道這件事情，不管你\n接不接受，它是一個事實。我們一次一次的輪迴都沒有結果，它只是一個\n業力的釋放，也是一個因緣的顯現如此而已。相狀是可以受用，但是本體是畢竟空。所以從這個概念裏面，蕅益大師就把這個唯識的整個人生觀，把它會歸到現前一念心性——即空即假即中\n\n\n人生無所得，人生只有過程，你好好把握當下的因緣，去積功累德。你今生所有的因緣，都是你的心識變現出來的，心識舉體而作因、作果、作依、作正、作自、作他，全部是你的心識自己變現出來，讓你自己去攀緣它的，自變自緣。\n\n你跟外界接觸的時候，是你自己的業力變現一個影像，然後再引導你的第六意識，去攀緣這個影像，人生是這麼回事。\n\n其實我們一生的身口意的活動，都活在自己的內心世界，我們不能超越你的內心世界去攀緣心以外的東西，不可能！違背萬法唯識的道理。所以我們從這個理論當中，我們知道，改造我們的生命必須調整我們的心態，因為它是我們生命的全部。\n\n我們開始修行的人，第一個一定要開始面對自己了。面對自己的時候，我們從一個最初的資糧位，到最後成佛的究竟位，我們主要的是修「無分別智」。那麼這個無分別智，當然主要是從第六意識的一個觀照。我們知道，無分別智它的理論基礎，來自於生命是無所得，從無所得裏面，建立無分別智。\n\n無分別智，在修行當中，它是先把我們內心世界分成三塊，這三性很重要\n1. 依他起性(依他起自性)\n這個一切法，它自己不能生起來，它要假借自己以外的很多因緣。\n2. 遍計所執性\n就是當我們的業力變成果報的時候，本來這個果報，已經變成果報了，它已經對你不能構成威脅了。我們一般人太重視果報，就把今生的果報，執著是真實的，就心隨境轉，就把心住在這個果報當中，就產生了生命的盲點——我法二執了。這個是我們要注意的，這個是對往生最大的障礙，那個執著的，執著那個假相的心態。第六意識一旦安立名言以後，這個相狀就產生變化了，但這\n個問題還沒有在這裏喔。那麼一般人把相狀加以分別以後，大部分的相狀\n就過去了，但是有少數的相狀被保留下來，就是它給你一個特殊的感受，\n特別是給你快樂的感受，或者特別痛苦的感受。帶有執著的妄想，這個就是遍計所執性，你最好在臨終之前，把這些心中的地雷都清乾淨。\n\n3. 圓成實性\n也是依他起而生的，遍計所執性的顛倒。正確的了知走上圓成實。錯誤的理解產生遍計執；第二個是正確的了知走上圓成實。\n\n當我們遇到依他起的時候，你不生起執著，你知道它的本體是無所得\n的，你能夠保持不迷、不取、不動，那麼你就累積了一個圓成實性。那麼\n圓成實性，它是解脫輪迴的力量。我們生命會累積兩種力量：一個遍\n計執的力量，你的執著的力量，這種力量會引導你輪迴生死；第二種力量\n是圓成實的力量，它會讓你從生死裏面解脫出來。所以我們現在是兩種力\n量都有。障礙我們往生的不是業力，是你曾經的人生經驗裏面有些影\n像，你抓著不放，揮之不去的影像，你心中認為這件事情是有結果的，你\n對這個影像有所期待，這個是你生死的根本。\n\n輪迴的根本，與其說業力，你不如說執著更為直接。沒有執著，這個業力不能串成果報的。\n\n無分別智到底所要破的是什麼\n果報都是刹那刹那生滅的，但是身為第六意識，它有個問題，它會產生一個錯覺，它認為這些果報是真實的，也就是說它認為這個果報是有結果的，是有所得的。\n第六意識的錯覺，給第七意識讓它執著帶來很大的空間。\n你對這個影像有一種相續的期待，可能你想要去要報酬，你可能想要去貪愛它，這種相續的攀緣心。攀緣以後也就罷了，你開始安立名言，把它分別產生一種人世間的對立，我相、人相的對立。\n\n無分別智怎麼修\n1.\t聞所成慧-你要聽聞佛陀的教法\n2.\t你開始去如理思惟了，那麼這個時候的勝解它會產生調伏力跟引導力了。\n3.\t修所成慧。正念跟正定，引申到正定了，有禪定了，它就能夠在定中斷惑證真，轉凡成聖了。\n你小時候會留下一些影像，讓你在心中數數的現行。讓你揮之不去的影像，這個影像你就得小心了，因為你抓住不放一定有道理，就是你的心已經住在上面。諸位，影像是沒有力量的，所以在《楞嚴經》一再強調，妄想，顛倒妄想為什麼有力量？因為你給它力量。本來是沒有輪迴，是你自己要去招感輪迴。\n\n無分別智的意思就是說：你不需要把這些影像把它破壞掉，你把它放掉，它自己會消失掉，因為它本來就是生滅相。佛法意思先離相清淨，再借相修心。\n\n釋放者是第八識，接受者第六意識，全部都是內心的世界。首先你要知道人生是自變自緣，斷除你的向外攀緣的心。離開了心就沒有一切法的存在，這是你學唯識學的第一個概念。外境本身它只是一個業力的釋放，它沒有太多分別，所有的分別，是我們自己捏造出來。\n\n無分別智要義\n1.\t培訓自己內觀，知道這一切的影像，都是你的內心變現出來的，自己去攀緣。\n2.\t斷除你心中的分別，一切法的對立，是我們自己第六意識捏造出來的，離\n開了第六意識的對立，一切法就沒有差別。\n\n我們在今生走過以後，你不能在心中留下塵埃，每一個塵埃都是生死的業力。\n如果你發覺有一種分別，你經常會出現，數數現行，深生好樂，這個念頭一起來的時候，會深深的觸動你的念頭，讓你喜歡它，讓你深惡的討厭它，這個道路你要切斷，這個分別你要切斷，你不能再觸動它，這個一定是一個輪迴的力量。你先斷那些已經形成執著的，就是言語道斷嘛！你只要把第六意識的分別切斷了，第七意識就沒辦法執著了——言語道斷，心行處滅。\n\n圓教的思想：天臺、楞嚴，比較高端法華、華嚴的思想，它是先修內空，再修外空，我們解釋一下，我們最好是先達到內空，觀察正念真如，我們知道何期自性本來清淨。人生本來就沒有輪迴這件事情，先內空然後再觀察外空，那麼再破除，在沒有輪迴當中，你不要去執著如夢如幻的影像。內空叫做「正念真如」，它就觀察真如；外空，是觀因緣的「緣起性空」、「因緣性空」。\n(真如就是禪宗講的自性)\n\n本來清淨你只要知道有這件事情，只要你憶念它不迷惑就好了。《楞嚴經》的真如是正念、是內空、是本來清淨。唯識的真如是你要去修，你要斷分別，才會去開顯這個清淨，要離相，你要把第六意識的分別心停下來，它那個清淨的圓成實才會顯出來，它是修來的。\n顛倒妄想的形成是有三個次第\n1.\t取相\n2.\t分別。(安立名言)\n3.\t顛倒。\n我們生起顛倒妄想的過程，取相、分別跟執著，最佳對治的時機在「分別」，斷你的分別，叫「無分別智」，你只要不生分別，第七意識就沒有活動的空間。\n\n我們必須要重新建立一個引導我們業力的一個力量出來，第一個就是菩提心，重新引導我們的阿賴耶識的業力，不能受自我意識引導。\n菩提心有四種因緣\n1.\t聞法歡喜生菩提心\n2.\t見佛的功德生菩提心\n3.\t悲眾生苦生菩提心\n4.\t哀聖教衰生菩提心\n\n在修無分別智，這個空性智慧的時候是離一切相的。當我們把相狀離開的時候，所有因緣也就離開了，所以你回到空性的時候，你是風平浪靜的，一念不生的，沒有好也沒有壞，沒有快樂也沒有痛苦，就是那一念的寂靜的法喜而已。但是當你修菩提心的時候，一旦你接觸眾生，那就是接觸你的因緣。你應該安忍不動，你要修忍辱波羅蜜。(有對立)。忍辱波羅蜜，它也不是強忍，同理心態，其實我們也沒有比他好多少，只是個人的角色定位不同而已。\n\n一個人發了菩提心，你不可以讓你自己整天處在一種非常散亂攀緣的階段，就是說你什麼功課都不做，這對你的菩提心就非常不吉祥。\n\n自受用菩提心它有什麼功德呢\n前面的四波羅蜜多，就是佈施、持戒、忍辱、精進，它慢慢的會讓我們的心安定下來。如果不發菩提心，你修六度的時候你很容易帶有攀緣心。攀緣心的時候，你一旦有因緣刺激你，你就容易起煩惱。菩薩只是利用六度，來成就自己的菩提心。那麼這個地方的菩提心，他開始利他了。菩薩道是有三個大忌呀，第一個瞋心、第二個高慢心、第三個嫉妒心。這三個會直接傷害菩提心的根本，會破壞菩提心。\n\n蕅益大師的這個開導說，菩薩在從一個自受用的菩提心，到利他的菩提心的時候，這個菩薩成就三種功德力\n1.\t福德力\n2.\t慈悲力\n3.\t方便力\n「自我意識」引導我們進入了生死大海，但是我們今天以菩提心為依止，引導我們趣向於菩提涅槃，這是一個不同的依止、不同的引導。\n1.\t由所依最勝，謂菩提心為所依止故。\n(菩提心為依止，引導我們趣向於菩提涅槃，這是一個不同的依止、不同的引導。)\n2.\t由事最勝，謂具足現行故\n(六度的行動；從六度當中懺悔業障，積集資糧，這個是一個成辦他的事業的殊勝。)\n3.\t由處最勝，謂一切有情利益安樂事為依處故\n(一個目標很清楚，他為了使令一切有情得到現世的利益，這個利益指的是來生的解脫跟今生的安樂。)\n4.\t由方便善巧最勝，謂無分別智所攝受故\n(修無分別智。就是該幹什麼你幹什麼，不要太多的妄想，就是：凡事盡心盡力，成敗交給業力！所以菩提心的好處，它不再論成敗、得失。)\n5. 由回向最勝故，謂回向無上正等菩提故\n(資糧回向到無上的菩提，不求人天福報。)\n\n\n我們現在只有兩種選擇，把自我意識放下，跟著我們的願力走；第二個我們繼續以自我意識為中心，來斷惡修善。這兩個最大的差別就是你以自我為中心，我不要這個我，我以空性來破壞自我，然後我重新發願，我以上求佛道，下化眾生，來當作我們生命的一個推動力，那麼這個時侯你生命就反轉了。我們的因地是很重要。那麼一個牽涉到清淨跟無漏，所以它菩提心的根本它是無所求，因為它沒有自我概念它就不需要求嘛，向內無所求，向外看需求！\n\n無著菩薩他提出了一些方法\n（一）、六種意樂 。一、廣大意樂；二、長時意樂；三、歡喜意樂；\n四、荷恩意樂；五、大志意樂；六、純善意樂。\n(二)、三種作意：一、愛重作意；二、隨喜作意；三、欣樂作意。\n\n第一個：『愛重作意』。這個地方就是對你所做的每一件事情，都感到\n珍重愛惜。\n第二個：『隨喜作意』。那麼我們今生的能力有限，我們有些事情可以\n做，有些能力沒辦法做，別人做了怎麼辦呢？隨喜讚歎\n第三個：『欣樂作意』。就是自圓滿他也圓滿，就自他不二的圓滿。\n\n第一個廣大意樂，就是說要把我們的志向廣大。\n第二個長時意樂，你必須讓你的願力是無窮的\n第三的歡喜意樂，保持歡喜心\n第四的荷恩意樂，說菩薩要心存感恩，那麼這個地方的感恩心，主要\n是什麼目的呢？就對治高慢。\n第五『大志意樂』，我們所念的每一句佛號釋放出來 ，跟一切有情分享。\n第六『純善意樂』，轉變你的心態的一個因緣。當然你的因地轉變了，你的生命的跑道也跟著改變了。\n\n你一旦修菩提心、空正見，你要走上成佛之道的時候，你要逆向操作——「差即無差」。你看啊，先求自身的圓滿，再求他人的圓滿，你會發覺你的修行，越來越整合、越來越整合，把以前的差別相，慢慢的整合成一真法界。如果你的修行，你越修行，覺得人生眾生的問題越多，差別越大，那你可能錯了，因為你在放縱你的顛倒妄想；如果你的修行，你會覺得人跟人之間的差別，越來越少、越來越少，自他的平等越來越大，那這方向就對了。\n\n\n剛開始在播種的時候，這金剛種子它這個真實，它有什麼特點？\n就是它你這個種種下去以後，它永遠不會破壞。你今生在人間，它跟你到\n人間，假設你沒到淨土去 ，你萬一弄得不好到三惡道去，它的金剛種子\n也到三惡道去。所以有些人他為什麼在痛苦當中 ，他很快從痛苦裏面彈\n出來？因為他有佛種，佛種它不允許一個人在障礙裏面待太久。但是你如\n果沒有佛種，你沒有栽下一個佛的覺悟的種子，你到了障礙的地方，你就\n缺乏反彈的能力。\n\n金剛不壞的種子。煩惱不能破壞它、業障不能破壞它、老病死不能破壞它，所以它只要一念的，你只要一念的相應那就不得了，何況你去讓這個佛種不斷的增長廣大。\n\n人生你沒有選擇權，但是你有解讀權，怎麼解讀你說了算，因為第六意識是自由自在的，你如果能夠正確的解讀人生，你今生可以把很多的障礙閃過去。就看你的第六意識在安立名言的時候，你是用什麼方式來安立它。\n\n菩提心一定是要放下自我，菩薩有三種：求福德、求菩提、求往生。但是這三個求，是建立在無所求的基礎之下。\n\n阿賴耶識，如果說把它比喻作一個機器的話，它有兩種開關：第一種開關，是打開來是通往生死的力量；另外一個開關，是通往涅槃的力量。\n\n假設你的心態是把人生的因緣放下而開始內觀，你遇到事情的\n時候，你是用道理來解釋這件事情，你開始起觀照了，而不是動感情了，\n那麼這個時候你是把第八識產生一種涅槃的力量。如果你對今生看得很重要，你對娑婆世界的攀緣很重，你阿賴耶識的力量，一定是一個強大的生死業力，你臨終你很難反轉的；如果你現在對娑婆世界的心態是完全放下，你遇到事情是用內觀的，用理智來觀照因緣法，那麼這個時候，阿賴耶識，你現在儲存的力量是往淨土的力量。佛教不重視你的過去，但是它非常重視你的未來，它也不再重視現在，因為現在是一時的。\n\n在唯識的角度，先否定自己，你不能馬上肯定自己說：哎，我要發菩\n提心，這不對的，你要先放下，你才有資格談提起。\n所以唯識它的態度，當你的心跟外境接觸的時候，先否定自己，先告訴你自己這一切都不是真的。所以它空觀有三種觀法，大小乘有三種觀法\n1.\t無常切入。你觀察它是一時的、無常的\n2.\t因緣來修空觀。觀察這一切法都是緣生緣滅，都是自變自緣(無分別智)\n3.\t真如，本來清淨。是你本來什麼都沒有嘛，\n你也沒有失去什麼，人生本來就不增不減嘛， \n\n\n人生的概念，都是你自己編出來的，人生本來就沒有意義的，人生的\n成敗得失，它只是因果的顯現，成敗得失這四個字，是你自己捏造出來的，\n這種概念是你捏造出來。\n\n唯識學的空觀，它不破壞相狀。諸位，它不壞相，就是相狀還是存在，但是你的心不迷、不取、不動，它是破壞你的名言，你不要去亂解釋人生，因為你一解釋，你就想要去執著，你就想要去主宰，你就把生死業力給帶動起來了。所以人生只能夠輕輕地走過去，你不能夠動任何名言的，你要把所有的精神體力放在來生，唯識的意思就是這樣，用在實踐你的理想。\n\n這個唯識學厲害，它不壞外在的相狀，它把你的分別心停下來，這個是唯識的空觀，比無常觀更高明，而且力道也不差，這是從因緣切入空性。\n\n空觀並不是破一切名言，而是只是針對娑婆世界的名言\n\n我們不可能一念不生，但是至少你有本事斷相續心，就是念頭起來的時候，你馬上覺察，斷相續。你不可能連第一念的分別都不起，不可能，\n但是就算你不是先知先覺，至少後知後覺吧，是吧？至少你覺照的功夫要\n生起來，然後你什麼時候生起，把相續心給斷了，這個就有辦法了，就是\n第六意識在調伏狀態，你開始在調伏它了。我們人太聰明了，就是自作聰\n明，安立很多名言，創造很多的對立，就產生愛憎取捨，然後就啟動了生\n死業力了。\n\n\n你要先修無分別智，再提佛號，為什麼？\n你的執著是用佛號把它壓下去的，凡是壓下去的東西它一定會反彈，總有一天你壓不住它的。\n\n你疼痛難忍應該把腳放下來了\n疼痛的感覺是一個因緣所生法，不是你分不分別，你不分別它也是會痛，是吧？所以你無分別智不要隨便操作，它是對治你心中的執取，不對治外境的。\n\n你的心來引導這個佛號的方向。如果我們心態不提升，這本來是一個萬德洪名，進入到你的攀緣心，變成糖果、變成人天福報，多可惜啊\n\n自我意識被無分別智破壞以後，誰來取代它呢？就是菩提心、往生的心！你必須要創造一個新的力量，來引導你的水流。\n我們是創造兩個力量：一個「成佛的力量」、一個是「往生的力量」，這兩個要結合起來。\n\n也就是說以前我們是用攀緣娑婆世界的心，來引導這個水流，你攀緣它，\n如果你好因緣善業現前，就到天上去；你攀緣它，如果你罪業起現行，就\n到三惡道去。不管怎麼樣都是攀緣，本質就是有漏。如果淨土是無漏的，你的心是有漏的，這兩個不可能相應\n\n菩提心簡單的說就是「你的願力」，你要發願。當然 最好的選擇就是成佛了，發一個成佛的願力。\n\n以菩提心就是一種上求佛道、下化眾生的願力，這個就是「菩 提心」。\n\n菩提心發了以後，有兩種情況：第一 個初心菩薩的菩提心，叫「自受用菩提心」，要以內觀為主，所以自受用 的菩提心又叫做「願菩提心」，它只論心不論境，你可能今生什麼事都沒 有做，也無所謂，你只要把所有的修行，都會歸到菩提心就可以了，所有 的修行都跟你的理想抱負有關。願菩提心是屬於自受用這一塊。那麼 可能你要經過五年的時間，或者十年的時間，你的菩提心站穩了，你的因 緣也具足了，就有資格談到行菩提心，你可以做一點實事了。這菩提心有兩種修法：你如果是在自利的角度，那就是以願菩提 心為主，先守住你的本願就好了；如果你是後半段了，你覺得你除了你自 己的願力以外，你可以多少做一點事情了，你可以轉成行菩提心。\n\n佛教是先有目標才有過程，要「以願導行」。你 要設定一個目標你才有資格談修行，你沒有目標，你根本連修行的資格都沒有\n\n你要用止觀來灌溉菩提心，讓它至少生根，就是它不容易退 轉。五年是少不了了。，你要憶念它，對對對，你要憶念你的願力：我為了要成佛， 所以我必須要去拜八十八佛；我為了要成佛，所以我要去念佛、去持咒、 去持戒。所以你所有的功德，是往這個菩提心上面去整合起來，否則你沒有菩提心的話，你就流到人天福報去了，就是憶念這兩個字。\n\n\n淨土宗要第六意識來引導第八識，隨念往生。所以你就要訓練第六 意識聽你的，你要給它一個願望，那麼在過程當中隨時檢查一下，你菩提 心在不在、你是不是為了菩提心做這件事情、你菩提心是不是不斷的在進 步當中？你把心放在哪裡，第六意識就會跟著你走，是這樣子的，這叫「作 意」。我們為什麼對娑婆世界攀緣這麼重？因為以前都把心放在那裏。\n\n\n你現在能夠往生，唯一的希望就 靠第六意識的明了、分別、想像、如理的思惟。因為第八識它就是一個強 大的業力，它何去何從它自己也不知道。\n往生，即便你沒有堅固的菩提心，起碼你的心是隨順於菩提心，這是最低標準。\n最好的思考：為了成佛而到淨土去！把成佛跟往生，這兩個目標結合在一起，為菩提道求生淨土，這種思考模式是最好的，互相幫助。你已經開始聽話了，那麼阿彌陀佛就有辦法攝受你了。關鍵在順從這兩個字，關鍵不在於你做 了多少事情。\n\n我們人生只是在受用一種生滅的影像，你不可能從今生帶走任何東西的，所以我們不需要太多的去分別， 該是你的它就是你的，不該是你的你打妄想也沒用。所以你透過這種無分別智的時候呢，你就放棄了攀緣，你會把心專心的放到來生去了。\n\n\n修行人的成功很重要就是：你必須把今生放棄！因為你的精神體力， 剛好值得你做一件事情而已。\n\n\n麼我們今天發了一種成佛的願力，那麼這種願力發了以後，去修習 六波羅蜜，那麼這樣子對我們來生，有六種的利益\n1.\t富貴攝故。就是菩薩透過佈施，會使令我們未來的因緣資財豐富\n2.\t大生攝故。那麼這透過持戒，使令我們成就尊貴的種姓\n3.\t大朋大屬。這個「朋」，就是很多的朋友、很多的親屬\n4.\t廣大事業加行成就之所攝故。菩薩的因地的精進，他在未來的生涯當中，能夠成就廣大的佛法的事業\n5.\t無諸惱害、性薄塵垢之所攝故。由菩提心 來攝持禪定的緣故，他來生的因緣，他的煩惱輕薄\n6.\t善知一切工論明處之所攝故。的因明的邏輯，這種善巧方便，他也是有他的一定的攝持\n\n你在研究唯識的業果這一塊，記得一個原則：凡是善業一定要 讓它生根；凡是罪業絕對不能讓它生根，不能有生根，變成惡根，就糟了， 就是相續的關係。業力只有一個原則：相續跟不相續。\n\n淨土門，首先我們要建立一種真實的信心！\n這信心當中有兩科： 第一個感應道交；第二個是轉他成自。\n\n1. 感應道交\n作為佛陀，他是用平等心來憫念一切眾生，但是作為眾生呢，假設這 個眾生他離家出走，他根本就把這個佛陀的功德給忘了，那麼這個人就很 難跟佛陀感應了，因為他的心是憶念凡夫的世界，他從來沒有憶念過佛陀。加持力不是單方面的，不能強迫的。\n\n\n所有的外因緣，都是從內因緣創造出來的，都跟你的心態有 關係。佛教的因緣觀永遠是由內向外解釋的，跟外道不一樣。你跟阿彌陀佛的互動的關係，的確有差別。所以我們現在就是 說，我們要在臨終的時候，除了我們自身的準備，我們對娑婆世界的調伏， 我們怎麼樣能夠跟阿彌陀佛建立一個非常強烈的感應力量，讓彌陀早一點 出現，讓彌陀對我們的加持力達到最高。那到底應該怎麼做呢？\n1. 「眾生無邊誓願度」，你要去投入的去憶念佛陀\n2. 蕅益大師提出三力不可思議：佛力不可思議、法力不可思議、心力不可思議。\n我把我的心力憶念佛陀，我隨 時可以跟阿彌陀佛感應道交，因為心能造業、心能轉業。所以淨土法門很重要的一個觀念：忘掉你的過去。諸法無自性\n3. 我們跟佛陀是一家人，從一個同體真如法性的加持力來說，我們得到 彌陀的關懷攝受是正常的。\n4. 你就專心的念佛，不管你五分鐘也 好、十分鐘也好，養成一個習慣，佛號一現前，就把心收起來，你臨終的 時候，你自然會養成習慣。\n5. 你必須對阿彌陀佛的憶念，是最重要的憶念，最主流的憶念。也就是 說它是你對所有因緣憶念當中它是最大的憶念，當它出現的時候，所有的 都可以放下，你只要養成這種心態，你就成功了。\n6. 「轉他成自」。所以阿彌陀佛的功德的轉變的過程，只有一個方法：「憶佛念佛」\n\n\n就是觀想七寶池、八功德水，那麼蓮花在這個八功德水上，那邊漂過來漂過去、漂過來漂過去，這是第一個靜態；第二個就是觀想蓮花跟你的關係，動態的蓮花，作蓮花開合想。你觀想你，欸，坐在 蓮花裏面，然後蓮花是關起來，然後一刹那間，你發願以後，欸，蓮花到 了極樂世界的七寶池、八功德水，蓮花打開，花開見佛，阿彌陀佛光明攝 受加持你。這個是蓮花開合，先在娑婆世界\n。，他只是成功的把彌陀的功德轉成自己 的，他找到了轉換的方法。\n\n\n淨土法門它有專修跟圓修。那麼從圓修的角度，我們也可 以念佛、也可以持咒、也可以拜懺，但是呢，你必須要有一個正行，就是 主修跟兼修的差別。也就是說：你不能對所有的法門用平等心，淨土法門 沒有平等心，它就是一心歸命。也就是說我們一生可能會接觸很多的法， 有可能，你可能會持咒、你可能會拜懺、你也可能會持戒、你也可能會念佛，但是你要永遠記住，佛號在你的心中是不可取代\n\n\n\n大乘佛教的修學，我們主要分成兩大塊：一個是聖道門；一個是 淨土門。聖道門它是靠自己心靈的力量，當然它主要的心力，來自於一種 菩提心。那麼聖道門是以菩提心來做一個出發點，來攝持六度的法門，從 這個菩提心開展出六度，去創造它的一個功德莊嚴，所以它這個是一種單向的力量。\n\n淨土門它的修學，它是雙向的力量，它是心力跟佛力的一種交互作 用。也就是說當我們提起佛號的時候，我們生命是同時出現兩種力量：一 個是來自於你內在的心靈的皈依的力量；一個是來自於外在的彌陀的本願 功德的攝受。所以它兩種力量是心心相印，產生感應道交。淨土宗的修學，它主要是做一件事情，就是轉他成自。你如果你的心跟 佛陀接觸的時候，你要能夠把佛的功德轉成你的功德，我們自己也要做一些準備，我們才可以成功的把佛陀的功德，轉 化成我們的功德。\n\n極樂世界的六種功德\n一、不墮惡道；二、色身堅固；三、衣食自然；四、國土莊嚴；五、 具足五通；六、壽命長遠。\n\n當我們長大了離開蓮花以後，我們住的是一種宮殿樓閣——七寶所莊嚴的宮殿樓閣。當然極樂世 界的宮殿樓閣有兩種：一種是在地上的；一個是在樹上的，兩種。那麼結構式的莊嚴是生處跟住處。\n\n極樂世界的最重要的關鍵在：見佛聞法！尤其是親近十方諸佛，見佛這一塊更為要緊。佛陀是所有善知識裏面，最高明的善知識， 因為他有殊勝廣大的方便力。我們生活在末法時代，有一個很大的問題， 就是：有法無人。\n佛法的修學全部是個人化的，沒有兩個人是相同的，沒有兩個人他在成佛過程當中，他所需要的法是完全一樣的，不可能！因為你的病 跟他的病不一樣。\n\n\n我們今生只有一句話可以形容，叫做：業障深重，求出無期。彌陀大願，必定救拔。佛力不可思議這一塊，我們就不用費心了，你只要相 信就夠了，就是佛陀他有足夠的能力救拔我們。我們必須把前面的願望，所有的願景，把它寄 託在一句佛號。你把你所有的希望、你所有的願景，都會歸到這句佛號，提升為無量功德的 萬德洪名，就是你的生命已經跟佛號不可切割了，它是你未來生命的所有 的功德，都靠這句佛號了。\n提起佛號的時候是三種憶念：厭離娑婆、欣求極樂，然後對佛號一心歸命\n\n\n淨㈯㊪不考慮業力，因為業力這㆒塊，佛陀都準備好了。\n淨㈯㊪重心力，因為它是臨終只要正念力，因為淨㈯㊪的業力這㆒塊，佛\n陀都幫你承擔了。\n\n我們臨終的那㆒念，必須㈲㆔種憶念\n1. 第㆒個你對娑婆世界要如實的憶念，你要告訴你㉂己，娑婆世界絕對 不能再受生了\n2. 第㆓個你要能夠欣求極樂，你要㈲㆒種往生的願望。\n3. 第㆔個你要告訴你㉂己：你唯㆒的希望就是佛號\n㆔種憶念：憶念娑婆、憶念淨㈯、憶念㈴號，你提起 ㆒句佛號，那叫做「即眾生心，投大覺海」，順從本願，感應道交，這個 就是為什麼說「憶佛念佛，現前當來，必定見佛。」\n\n我們不能主導生命的相狀，但是你㈲辦法解讀，就是你的㈴言分 別很重要。就是說這個相狀出現了，那麼它對你㈹表是㆒個什麼樣的意向， 它對你㈹表是㆒個什麼概念，這個你是可以決定的。\n\n你認為它是來幫助你的，它就是在幫助你。我們㈲解讀㆟生的權力，因為你㈲主觀的第㈥意 識的力量。你可以主導這個相狀，讓它往道㆖會、往淨㈯法門會。也就是 說逆境本來是要傷害你的，但是你如果好好的去思考，它會變成菩提道的 助緣，這叫做「順逆皆方便」。\n\n凡夫把娑婆世界講得太美好，想像太美好，錯覺； ㆓乘㆟對㆟生是全盤否定，悲觀主義者，也不對。其實㆟生沒㈲好、也沒㈲壞。\n\n流轉門㈲㆔個次第：\n1.第㆒個唯識所現；\n2.第㆓個唯識所變；\n3.第㆔個 唯識所住；\n唯識所現」沒㈲錯，因為第㈧識把相狀變出來這沒㈲錯，但是你在 你的心㆗不斷輾轉的分別，它相狀不斷的變，它本來只是㆒個相狀，㈦弄 ㈧弄，變成你㉂己認為它是傷害你的，你把它變成㆒個冤家，那麼這個時 候「唯識所變」、最後「唯識所住」，你對它產生執著，結果你就被它拖㆘ 去了。\n\n不是相狀把你拖㆘去，是你㉂己的妄想把你拖㆘去。我們今㆝我們不放棄第㈥意識的主導性，我們境隨心轉。我們 用第㈥意識的如理思惟，去帶動相狀，這種正智跟真如，落入圓成實性， 就如理思惟，最後會歸到㆓空真如的法性，變成圓成實性，變成㆒種涅槃 的功德，那麼今生對你來說是「還滅門」。\n\n\n無分別智怎麼修？\n1.\t離相的意思不是說叫你把相狀拿掉，而是你先不要 馬㆖去執著那個相狀，你要先觀想這個相狀是本來沒㈲的，它只是㆒個如 夢如幻的影像而已。\n2.\t你千萬不要跟外境站在對立面。 大乘佛法永遠是轉識成智，你跟外境站在對立面，你遲早變成阿羅漢\n3.\t「如理作意」的時候，它就喚醒這個 清淨的第㈥意識的種子起來活動，作㆒種如理的思考；如果它今㆝起的是 ㆒種不如理作意，那麼它就喚醒邪惡的種子起來作思考。\n\n\n修行是靠第㈥意識的正念，但是第㈥意識在培養正念之 前，我們第㈥意識已經累積了很多非正念，就是不如理作意了。就是從小 到大，你的環境給你㆒些錯誤的思考，或者來㉂於㆒些不好的媒體的渲染 等等，反正我們現在㈲很多錯誤的作意了，但是沒關係，你再培養第㆓個 作意，叫「如理作意」做你的備用。慢慢慢慢這個如理作意強了，這個時候在煩惱當㆗，再把 你心㆗的作意提起來，來反轉你的煩惱，它是這樣子的。\n\n\n「轉他成㉂」，這句話是蕅益大師說的。當然你方法很重要， 如果你操作的失當，你把這個佛號，來生在娑婆世界得果報了，那你就不 是轉他成㉂了，你是可惜了！你買㆒台機器，這㆒台機器，本來是可以創造很大的作用，結果你操作失當，這個機器的功能變得縮小了，那是你操作失當。\n\n\n淨㈯法門跟聖道門，㈲些法門是相通的，但是它最大的不同， 就是它的目標是不同的。聖道門的角度，他是在穢㈯、在娑婆世界來完成他 的了生脫死；那麼淨㈯㊪的修㈻者，他是到淨㈯去了生脫死。\n\n\n唯識㈻，它基本㆖㈲㆔個重點\n1.第㆒個：懺悔罪障(聖道門的懺悔罪障，是為了要保住㆟身。因為他生生世世在娑婆世界增㆖，；淨 ㈯㊪的懺悔業障，是針對於「願我臨終無障礙。」)\n2. 第㆓個：就是依觀發願。沒㈲㆒個㆟往生，是臨終才想到要去那裏的。：我㆒定要往生！你別無選擇。\n3. 第㆔個是最關鍵的：會歸佛號。㈲這句佛號，我㆒定可以往生！我們在發願的階段，是我㆒ 定要往生；當你會歸佛號的時候，你從我㆒定要往生，提升到我㆒定可以 往生！\n\n你在觀佛像的時候，你要先離相，然後再觀相，就是你不能太執著。㆒定是要「借相修心」，修你的往生的心。就是說這個相狀本 身只是讓你借來用的，它沒㈲太大意義，「借相」修願力、「借相」修你的 信心，所以你要往心㆗去會，而不是㊟意它的相狀㈲什麼變化。\n\n我們最好是觀想㉂己是業障生死凡夫，這樣會比較 符合實際㆒點。從往生的角度，觀照力比專㊟力更重要。就是你的信願，它是決 定往生，佛號念得是不是能夠專㊟、能夠得到㆒心，這個決定你的品位。\n\n你的佛號方向不確定，你所念的佛號全部帶業——帶生死業。\n你準備得越好，佛號給你越多的東西。不是每一個人都可以把無量光無量壽的功 德，全部啟動起來，不是每一個人，你準備得不夠，佛號只能夠給你糖果。\n\n實你可以把佛號的力量創造得更大嘛！你只要把兩個 東西放進去，除了你自身的解脫以外，你把佛道的因素放進去：我為了成佛而往生、我為了度眾生而往生，你把這兩個概念放進去就夠了，這個佛 號不可思議，不可思議！它會不斷的陪著你，上求佛道的時候，你在修無 量三昧的時候，你會來自於彌陀本願的加持，你迴入娑婆的時候，除了你 自己的菩提心以外，你還有彌陀本願的攝受，佛號會一直陪你到成佛為止。\n\n所有的聲音……只要不是你自己的創造聲音，就是攀緣。\n\n我們跟外境接觸的時候， 第一念都是不可相信的，第一念都要先否定。我們現在的功力只能夠培養 後知後覺，我們沒辦法先知先覺。你的如理作意往往是在第二念、第三念 才會啟動。所以先否定自己，再肯定自己\n\n你的心態就是為了離苦得樂，因為你求生淨土，就很可能沒有把聖道的因素放 進去；而極樂世界，是安樂道跟解脫道的結合，所以你不發菩提心的人要 注意喔，你很可能是為了要追求快樂到淨土去，你這種心態是很容易跟天感應的，很容易的！因為你的心跟佛號接觸的時候，你要的就是離苦得 樂而已嘛，你的動機就是用這種動機來引導佛號了，你缺乏解脫道、缺乏 菩提道的作意呀。\n\n有一件事情佛陀是不能做的——他沒辦法進入到你的內心世界，去改造你的內心，要注意這個觀念。所以當你沒有準備好的時候，對不起，佛陀不能給你很多的東西。佛陀不能夠改變你的內心世界\n\n唯識㈻的成功，就是告訴你：你的問題出在哪裡？為什麼我們㆒ 個㆟做了錯事，會㆒錯再錯，因為你想要掌控這㆒切的㆟生，㆒種㉂我主 宰的概念，這個概念害了你\n\n唯識㊪的角度，來談果位差別。這個㆞方分成㈤科\n㆒、㈾糧位；㆓、加行位；㆔、通達位；㆕、修習位；㈤、究竟位。\n\n1.\t他為了不斷的進步增㆖，他㈲殊勝的㈾糧。這個㈾糧㈵ 別指的是福德㈾糧，他廣大的修福，修習佈施、持戒、忍辱的善業，所以 叫做「㈾糧位」。\n2.\t到了加行位，他㈲兩個㈵點，㆒定㈲兩個㈵點：第㆒個息 諸緣務；第㆓個他加修止觀。加行位的菩薩，他知道㆒個很重要的觀念就 是：他㆟生的成敗關鍵到來了！所㈲加行位的菩薩，他絕對不會住在㆟群， 不可能！他㆒定住在深山\n3.\t通達真如：你的心要進入真如，對不起，你第六意識只要夾帶任何相狀，你就進不去空性。進入空性只有一個密碼：叫做「離一切相」，不管 這個相是雜染相、不管這個相是清淨相，都要放下，否則你第六意識就進 不去。所以加行位的菩薩只能夠叫「順從」真如。他不像小乘的聖人就永遠休息，他可能只是暫時的休息，因為他的大悲心會把他推出來，所以菩薩安住空性時間不會太久。\n4.\t修習位，修習位的菩薩做兩件事：第一個上求佛道。沒有「退轉」這兩個字了\n\n\n你菩提心失掉了，你就已經不是一個菩薩了。所以我們在剛開始的時候，一定是要有發願：你如果是智增上的菩薩，你緣佛的功德而發心；你如果是悲增上的菩薩，你緣眾生的 痛苦而發心，都可以。總之當我們修學菩薩道，先不要管你做了多少，先 看你是不是有這樣的目標，初心菩薩是「論心不論境」\n\n一定先發一個菩提心：緣佛道而發起上求佛道，緣 眾生的苦而發起下化眾生。當然你發了菩提心，你有這個願景，你就是菩 薩了。\n\n菩提心由它智慧的淺深分成三塊\n1.\t第一個：是一種「住相」修行的菩提心。這個就是資糧位\n2.\t第二個「離相」的菩提心，這就好一點 了。到了加行、通達二位的時候，這個菩薩，他的心慢慢的離相了\n3.\t「借相修心」的菩提心，就是修習位。前面的離相，當他脫離相狀以後，從假入空以後，他是一個過渡，因為他曾 經發願要上求下化，所以當他慢慢的菩提心堅固以後，到初地以上的菩薩，他一定會走出山林面對人群。\n\n用第六意識來信解唯識妙理，不斷的加強自己的智慧的學習；發起了 堅固的菩提誓願。\n\n佛陀的應化身——千百億化身，所謂的「千 江有水千江月」。雖然佛陀的應化身，可能會在某一個地方，但是他也可 能會在另外一個地方出現。「眾生無邊誓願度」，加上他的功德莊嚴的願 力，加在那個地方，那誰能夠憶念他，誰就能夠得到他的加持，這個就是 佛陀的應化身。\n\n涅槃就是一種不生不滅的一種寂靜的 狀態\n\n涅槃，在唯識提出有四種差別，\n1. 本來自性清淨涅槃。，它不是修來的，只是說我們以前沒有 跟它相應，它顯現不出來而已。\n2. 有餘依涅槃。小乘的佛法的修學所成就的涅槃，\n3. 無餘依涅槃。大乘佛法的菩薩的修學所成就的 涅槃\n4. 「無住處涅槃」。，無住處，就是不住生死、不住涅槃。\n\n小乘的涅槃，套一句天台宗的說法：是有點偏空的，因為他空性當中， 他沒有發願！諸位，如果你現在所修的法門，不管你念佛也好、持咒也好、 拜懺也好，你都沒有把眾生放進來，也就是說你只是考慮到你自己，那麼 這樣子會有什麼後果呢？就是這個法門，等到它成熟得果報的時候，你只 能自受用，你不能跟人家分享，所以這個船隻夠你自己坐。\n\n如果你是追求一種人天福報，來修佈施、持戒、 忍辱，那麼這個善法，就會帶動你到人天的安樂果報；如果你今天是一種出離心，來修六波羅蜜，那麼這個善法，就變成一種偏空的涅槃。\n當你生命結束的時候，你只能夠孤單的離去，你只有去，但是你不能夠來，所以你的生命只有單向，你不能像佛陀可以自在的去、又能夠 自在的來，你不可以。因為你因地的時候，沒有發廣大的願力來攝持這個法門，所以這個法門所有的資糧，只能夠帶你到偏空的涅槃。如果你的因地是圓滿的，上求佛道下化眾生，那麼這個時候所有的資糧，會帶你到無 住處大涅槃。所以你的心理素質，永遠是在主導你所修的一切法門，叫「因 地發心」。\n\n諸位你要修大乘佛法，你一定要對第六意 識—對你自己的心，雙向思考：該呵責的、該對治的對治；該鼓勵的、該引導的要引導，你對你的內心一定是兩套方法，否則你的結果是不妙的。\n\n四智菩提：它是轉第八識 成「大圓鏡智」；轉第七意識成「平等性智」；轉第六意識成「妙觀察智」； 轉前五識成「成所作智」，這轉八識成四智菩提了。\n\n妙觀察智負責判斷，該怎麼做，成所作智是付諸行動。\n\n\n二乘人是一花一果——這棵樹它只結一朵花，也剛好結一個果，剛好 是剛剛夠一個人，他一個人用功，剛好。他發了出離心，修行最後大涅槃 了，他自己離開了—一花一果，自受用。\n\n性相圓融這個觀念是非常重要的\n\n所以當你是安住的時候，第六意識要收起來——離言說相，這個時候回歸到真如，你本來清淨，二話不說；當你要開始調整的時候，你必須從空出假——用第六意識做調伏，要如理思惟。\n\n安住—理想化；調伏—務實化。好好的看清自己的盲點，怎麼從哪裡去如理作意。所以我認為唯識跟性宗，都不能 取代誰，兩部經典各有各的優點。\n\n\n業力到你的心中時候你會安立很多的妄想名言，就變成遍計執了。\n所以人生是由不堅固的業力，跟顛倒妄想的結合，就是業力跟妄想的結合。所以我們今天要做什麼呢？「已解見」： 第一個瞭解空性；第二個證入空性。幹什麼呢？破壞心中的想念，諸位，不是破壞業力喔！是破遍計執，不能破壞依他起，你破壞依他起到時候你 就偏空了，就落入小乘的學者了。\n\n唯識的操作的第一個作意：就是少打妄想。\n「言語道斷」，要把它關掉，這第一個 作意。所以你要第一個警覺性：有些妄想在你平常一發覺的時候，就是要 把這個想念斷掉。這第一個：這個空性的作意。\n\n第二個：會歸到淨土。\n你厭離娑婆、欣求極樂，最後一定要會歸到一句 佛號，因為有佛號。所以聖道門的作意，它是會歸到空性；淨土門的作意， 會歸到一句佛號，它是有相行。\n以唯識學它就是善用第六意識了。當然如果你把性宗的不生滅心：站在本來沒有生死的角度，來了生死，那就更好了，站在本來沒 有娑婆世界的角度，來厭離娑婆，就更好了。所以不生滅心跟生滅心，是 可以交互作用的。\n\n\n你今生活得很快樂，其實跟你的今生沒有太大關係，你也不要太得意，不是 你今生的努力促成的，是前生的你做了善事，你要感謝前生的你；我們今 天吃到的稻米，可能是去年栽種下去的，你只是摘果實而已。所以你今生 的快樂，跟你今生沒有直接的關係，那是你有一個美好的過去。\n\n佛陀只是告訴我們：業力這一塊—認 命、隨緣，因為它總會過去的。你今天跟業力計較，你只有越陷越深，處理業力最好的方法就是：不處理！不要去動它——「隨緣消舊業，更莫造新殃。\n\n阿賴耶識，這個業力，輕輕的走過去就好——不 迷、不取、不動，這是最好的處理。如果你夠聰明的話，不要去碰業力這 一塊，不要去計較業力。因為你去碰業力，業力就像蜘蛛網一樣，「此生 卷三十三故彼生，此有故彼有」——你會帶動另外一個業力，這個阿賴耶識，你越攪動它，它就越沒完沒了。\n\n我們一般人，很少很平靜的去看外在的世界，很少。也就是說你 從小到大，可能是你前生累積很多的影像，這個影像會給你一些概念的， 所以我們就是心隨妄轉，我們寧可相信我們心中的影像，這種片段的、不 全面的影像，給我們很大的誤導。\n\n娑婆世界，它所有的快樂，都來自於一種不安穩，娑婆世界沒有 一個人有安全感的，說實在的，因為你知道這個快樂是不堅固的。\n\n阿彌陀佛的功德，它本來是一個全面性的功德；但是因為你心量太小了，所以你只 開啟它某一部分的功德，非常的可惜啊！所以我們一再的鼓勵淨土宗的同 修們，你既然花同樣的精神體力在念佛，其實你可以把佛號的功德開得更圓滿，就是擴大你的心量。你把「眾生無邊誓願度」的願景，放到這句佛 號去，這個佛號以後的力量會發揮得更大，就這個車子的力量更大，它不但帶你到淨土；它還會不斷的陪著你、加持你，直到成佛為止。\n\n佛號是沒有方向的，它是一個萬德洪名。但是這個佛號，到底是投入 了娑婆世界的輪迴，變成人天果報；還是到了淨土；還是這個佛號能夠永 遠帶到你成佛，是你的思想決定的，叫「心力引導佛力」。所以做好你思 想的準備，變成很重要了，因為它決定了這個佛號會給你什麼東西，這就 是為什麼我們要結合唯識學的道理。因為整個第六意識的思想改造，講得 最清楚的、最有條理的就是唯識學。\n業力不是你該管的這一塊；既然它不歸你管，你就不要把心思放這一塊了，你想想你能夠控制的。就是說人生有一半是無奈，有一半是 充滿了希望，你不要把心思老放在無奈的地方，你的痛苦是你自找的\n\n\n你一定要有對立的思考，你才會輪迴的；就是說本來這個 世界是沒有對立的，它只是一個因果顯現，它哪有什麼對立呢？它那樣就 是那樣！我們把所有的分別心都停掉的時候，我們還給這個世界本來面 目，你不要去加油添醋，這個世界它只是一個因緣假相；是我們自己多事， 把這個世界弄得很複雜——安立名言，那問題就很複雜了。然後大家就開 始各自的追求了，就造業了。\n\n無分別智的操作：\n都是對自己無分別，對外開始分別，這個錯了！你要知道：對外無分別，對內有分別，你要不斷的 反省你的思想對不對，這是要分別的；對外它已經是成熟的果報，隨它去了，因為你管不了這麼多了。你是個凡夫，你先到淨土去；等到你是法身大士，你開始從空出假，來到娑婆世界，你做普門示現的時候，你再去做 各式各樣的分別，該怎麼度化眾生，現在你不能管這，你這個外面的業力 你管不了，你就不能分別。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188114","master":"淨界法師","title":"阿彌陀經導讀-淨界法師","youtube":"","images":[],"tags":[],"content":"阿彌陀經-淨界法師\n\n我們透過無常、無我的智慧觀察，知道生命的本質是剎那剎那生 滅的，在整個生滅變化當中沒有一個不變化的東西，沒有的。這個時候，我 們觀察到我空的真理，內心開始產生一種寂靜的力量，這個時候就慢慢趨向 於涅槃的境界。這是我們應該瞭解的第二層真理，就是空性的真理。\n\n觀察到整個生命，在我們內心當中是觀察現前一念心性即空即假即中，你看到你整個生命的流動，每一個點都是即空即假即 中。\n\n\n極樂世界的特色在於不退轉，這對我們資糧位修行者非常重要\n1.你到天上去，你把天福享盡的時 候你是掉下來。你到極樂世界去，你享受安樂的時候你是往上升的，這是一 個不同的力量。\n\n2.淨土在你 生命當中所代表的意義是不退轉。它給你一個很長的壽命，你不用因為死亡 的因素而中斷了你整個修行。\n\n\n要判斷這個人是不是有資格往生，主要的因素就是看他的信願是 不是具足 得生與否，全由信願之有無； 品位高下，全由持名之淺深。\n\n諸位要知道，信願是根本，它決定你是不是往生；持名是枝末， 它是決定你品位而已\n\n信願是根本，它決定你是不是往生；持 名是枝末，它是決定你品位而已。\n\n整個淨土的成敗關鍵，就在這個發願\n「眾生聞者，應當發願，生彼國土」，勸我們三次。我們看佛陀在經典 上講一件事情，大部分都講一次的，你要聽就聽，不聽也沒辦法。很嚴重很 嚴重，再重複一次，講兩次。要講三次那是最嚴重了，事不過三。但是，釋 迦牟尼佛勸我們眾生發願求生淨土，在本經短短的經文裡面勸了三次，這個 地方值得我們思惟。\n\n修習淨土的願力，要避免兩個毛病\n1.\t第一種人，他執著在有相的因緣。\n對安樂的果報產生執著。這 種人，你要他厭離娑婆是很困難的\n2.\t第二種人，是偏重在無相的空性。\n我們一個人修空觀以後，就忽略這個生死業力的可怕，所以我們應該要 好好地去思惟：雖然一切法空，但是在空中有它的即假。「即空即假」，這個 假，它有它的因緣的靈動。\n\n\n執持名號\n第一個，念，「念從心起」。\n第二個，誦。「聲從口出」，創造一個音相。你自己不創造聲音，你這個心要去安 住在什麼地方？沒有地方安住。\n第三個，聽。你自己創造的聲音，自己把它聽回去。你這樣子構成一個 專注力。\n\n一心不亂\n1.十句成片三三四。 我們可以把十句佛號當一片\n2.使令這個點狀的力量變成一個片狀的力量。\n\n怎麼判斷自己是不是信願具足？\n1.\t事情的成敗得失這 個結果你還是很重視，那你的信願還沒有具足。\n2.\t你的心跟人事的因緣接觸的時候，你不在乎結果，你在乎過程，重點是我用什麼心態來面對。你開 始在迴光返照你的起心動念，而不是去看外境的成敗，那表示你信願具足。\n\n\n你一個人顛顛倒倒、貪戀娑婆，說實在的，佛是救不了你的，這個佛 號只是人天福報。這句佛號只有在覺悟的心中才能夠產生大的感應的力量， 所以我們一再強調，「託彼名號，顯我自性」。你自性顛倒的時候，佛號對你 沒有用。\n\n\n同一句佛號，為什麼在不同的心態所表現出來的功德是不同的？\n1.\t第一種就是信願不具足。有些人念佛只是追求一種離苦得樂的心情。\n2.\t念佛的心情是對來生有所期望的，他是為了要成就往生、成就 佛道而念佛。這個時候，這樣的信願具足的心情跟佛號接觸的時候，就啟動 了彌陀的加持力，不但能夠現生業障消除，更重要的是能夠往生不退。他能 夠去刺激彌陀的那種本願的攝受，產生一種救拔的力量。這樣子的念佛就變 成一種出世間的功德。\n\n阿羅漢\n他的生命只有一個目的，等待涅槃 的到來，那當然這個地方就不能說是「眾所知識」了。\n\n\n智者大師講佛弟子差別\n1.\t第一個叫做戒急乘緩，生持戒很莊嚴，但是你對佛法的聽聞完全 沒有興趣。你成就人天的尊貴身，但是你聽 法的時候就不現前，你以後就沒有聽聞佛法的因緣，就沒有得度的因緣。這 叫做戒急乘緩。\n2.\t戒緩乘急。就是說，你在佛法當中好樂佛法、栽培善根，但是 你持戒太鬆散了。你在佛法當中栽培善根，佛陀說法的時候你還是可以蒞臨。戒緩乘急，用卑 賤身來聽法。\n3.\t第三個是戒乘俱急。你因地持戒莊嚴，好樂佛法，等到佛陀說法的時候， 你用人天的尊貴身來聽法，是最好的。\n4.\t戒乘俱緩。你墮落到三惡道去，也沒有聽聞佛法的因 緣。\n\n\n快樂的感受本身是苦。為什麼？\n因為它有無常敗壞的危機。你得到這個 安樂的果報，你心中有一種不安全感在裡面。它有一種不安穩性，所以這個就是苦。這個 諸位要參透。\n\n以《大智度論》上說， 佛陀的法身，他的福報可以給眾生受用，智慧善根是不能共享。所以娑婆世界是業報身，極樂世界叫做意生身。\n\n\n極樂國土介紹\n極樂國土有七寶池，七寶所成的池，這個池裡面有八種 功德的水。這八功德水我們就不解釋了，沒有太多時間。這個八種功德的水 充滿其中，數量很多，而且這個水的底部不是汙泥，而是由金色的細沙組成 的，陽光照射，閃閃發光。這個七寶池四邊的階道是由金、銀、琉璃、玻璃 四寶所成。這個地方是先介紹池水的莊嚴。在我們生活當中，水當然最重要 了。一天當中，沒有電你還可以生活，沒有水你就沒辦法生存。所以，介紹 極樂世界有必要先介紹水，八功德水。\n樓閣。「上有樓閣，亦以金、銀、琉璃、玻璃、硨磲、赤珠、 瑪瑙而嚴飾之。」前面的樓閣是介紹樹上的樓閣，這個地方是講地上的樓閣。 地上樓閣，蕅益大師說，這個地方是包括了住處，居住的處所，也包括彌陀 說法的處所。這個是講樓閣莊嚴。\n\n池中蓮花。這個地方講蓮花莊嚴。極樂世界的蓮 花是「大如車輪」，這個地方的車輪指的是轉輪聖王的輪寶，四十由旬。\n蓮花跟我們每一個人心靈的互動，很有互動的力量，這個蓮花的開合表示我們的資糧力。所以在這個地方蓮池大師說，蓮花 這個地方的一個特色：因果的招感，因果的同時！你在娑婆世界栽培因地的 時候，你這個果地的蓮花已經在那個地方變化。所以你不要以為你往生的時 候蓮花才來，其實這個蓮花，你平常在佛堂栽培的時候，它就在那個地方準 備好了，這個叫做因果同時。\n\n\n如何修淨土法門\n1.\t首先要在八功德水栽培一朵屬於你自己的蓮花。這個蓮花，當然，你去買是沒有用的，因為極樂世界的蓮花是不能買的，就是你要先發願。\n2.\t想辦法把蓮花變成光芒、茂盛，那就是持名的功夫。一句佛號提起來的時候，止觀雙運的時候，沒有在思惟事情。大乘佛法所追求的不是空性，而是萬德莊嚴\n\n\n大乘佛法的修學跟小乘最大的差別， 諸位知道是什麼？小乘的修學是對立的，生滅四諦，以空來破有。大乘佛法 的修學永遠是走中道路線。\n\n\n無我相、無人相、無眾生相、無壽者相，該如何作觀？\n1.\t無我相跟無人相是修我空觀\n2.\t無眾生相、無壽者相 是修法空觀的。\n\n這個眾生相就是因緣所生法，是一個空間；壽者相是時間。 時空和合就是一個法。\n\n法空觀=「應觀法界性，一切唯心造」。\n，所謂的生死、涅槃，雜染法、清淨法，就 一念心所變現的。所以你要把法會歸到你的一念心，你就很容易知道一切法 是無自性的。\n\n\n\n莊嚴是怎麼來的呢？\n是由功德所成就。功德是整個淨土的因地。這個功德指的是三種的功德力。也就是說，你雖然現在只是在佛堂當中 很虔誠地念一句阿彌陀佛，但你在心中念南無阿彌陀佛的時候，卻已經創造 了三種功德：\n第一個，佛的功德；\n第二個，法的功德；\n第三個，心力的功德。\n佛力不可思議，法力不可思議，心力不可思議！你每一句佛號所創造的這三 種的加持力，就把你未來生命的住處莊嚴跟生處莊嚴念念地創造出來。\n\n我們的心跟佛號接觸的時候，你就念念地成就，轉成我們自己凡夫的這一部分的功德\n\n淨土法門是一個現成的功德，是已經成就的功德， 它等待你來感應道交，所以這個叫做他力門、果地教。是阿彌陀佛已經成就 了，然後阿彌陀佛發了四十八願，每一個願都加持在這句佛號當中，只要你 跟這個佛號一接觸，你就能夠得到這個佛號的引導，而念念成就如是的功德 莊嚴。\n\n要瞭解淨土法門，你要用《華嚴經》的思考，一為無量，無量為 一。當它一為無量的時候，那是極樂國土成就廣大的依正莊嚴；但是它無量 為一的時候，是攝受在這句佛號當中。\n\n如果你不能夠深信心佛眾生三無差別，你不可能相信感 應道交，你這個感應道交的道理沒辦法建立。\n\n\n修行人什麼事情千萬不要輕舉妄動，因為你內心的善根還會釋放 一個聲音出來。 也就是說，我們平常生活當中，就是善根跟妄想不斷地對峙。但是這個 地方大家要知道，不要去奢望妄想不來干擾你，這不可能。你唯一能夠做的 就是加強你的善根，就這樣！這個房間很多黑暗，你不可能要黑暗不出現， 你唯一能做的就是加強光明，而這個光明的出現就是靠佛寶的力量。\n\n你花了一個小時用功，然後你從佛堂出來的時候，遇到一個不如意的人 事，發一個脾氣，善根全部消失掉！娑婆世界就是這樣，因為你活在一個虛 妄的環境。諸位要知道，你不是生長在一個當體就是彌陀的三身四德的世界，不是的。我們現在生長的環境是一個虛妄的環境。\n\n\n阿彌陀佛的國土叫做本質，每一個眾生去接觸這個國土的時候，得到自己的影像。這就好像說，在一個房子當中有很多的燈泡，這些燈泡從總相來說是似一，你很難分清楚照在我手上的光明是哪一個燈泡所照的，這個光明互含互攝。但是「各徧」，它們的光明又各有各的獨立的體相。極樂世界的人民亦復如是，雖然大家都是在受用八功德水、七寶池，但是他有他的差別相。\n每一個功德的淺深跟你的持名有關係，跟你的資糧有關係。光是往生的品位，就有些人花開的時間早，有人花開時間晚，所以極樂世界的因緣還是很多差異的。\n\n佛陀勸我們往生的第一個理由是說，舍利弗，你要知道，「眾生生者，\n皆是阿鞞跋致」。這個阿鞞跋致翻成中文叫不退轉。蓮池大師說，什麼叫不\n退轉呢？就是他的功德堅固，特別的堅固。那麼是哪些人功德特別堅固呢？\n這個地方值得我們注意，是「眾生生者，皆是」。「皆是」這兩個字很重要！\n\n1.\t位不退(無漏的聖位)\n2.\t行不退(不再墮入到二乘)\n3.\t念不退(每一個念頭都跟即空即假即中，中道的真理相應)\n\n\n你說你為什麼一定要依止僧團，你為什麼不到西門町去修行？你去西門町修\n行，你整天拜佛，那個功力跟外境給你的影響剛好抵消掉\n\n\n省庵大師說，一個人不發願，「縱經塵劫，依然還在輪迴；縱有修行，總是徒勞辛苦」。就是說，你對阿彌陀佛功德很有信心，每天念很多佛號，也做了很多的加行，但是你的生命沒有一個明確的目標，所以你的功德完全都分散掉了。\n\n\n你心中有一個自我意識，「我」在布施，「我」在持戒。好了，這個地方就有問題了，你不能夠以我空法空的真如——那個平等的心性來修善，你以自我來修善，你這個善法就有空間跟時間的障礙：第一個，你不可能經常地持戒；第二個，你持戒的對象不能普遍到所有的法界。所以，我們在布施、持戒的時候，時空是有限量的。\n\n\n善導大師講得好，說你一個人不念佛，與佛本願不相應\n嘛。這不是阿彌陀佛要不要救你，一切法因緣生，你的因緣跟那個因緣是不對的。\n\n唯以信願，執持名號，則一一聲悉具多善根、福德。散心稱名，福善亦不可 量，況一心不亂哉！\n。這段經文的意思就是說，你當然可以布施， 你當然可以持戒，你也可以持大悲咒，都沒有障礙，但是你不要忘了你的根本法 門是什麼，你要清楚。淨土法門是能夠萬善莊嚴淨土，這句話是對的，但是你臨終的時候能夠招感阿彌陀佛與諸聖眾現在其前，唯一的因素就是執持名號。\n\n1.\t你的佛號要從你的內心生起，不能從嘴巴生起。(念得清楚、聽得清楚，每一句佛號都強而有力。)\n2.\t你要靠嘴巴的振動創造一點聲音出來，當作你的所緣境。(念得清楚、聽得清楚，每一句佛號都強而有力。)\n3.\t聽的功德。你把自己創造的聲音再聽回去。\n\n\n一個老修行者，你看他做什麼事，他不會 想到什麼就做什麼，他不動。有人說是即知即行，其實這句話也有問題——知道 了馬上去做。修行人知道什麼事不能馬上做的，要等一等。因為你的心跟所緣境 接觸的時候，你第一個概念往往是妄想，是習慣性的想法，你要等待你的下一個 真心出現。所以你會發覺，修行人修久了以後，他的心好像比較遲鈍。不是遲鈍， 他開始跟妄想脫離。\n\n\n什麼是自力法門、他力法門、自他不二法門？\n1.\t自力的法門\n消滅的是我們心中的妄想，發明的是我們內心清淨的本性。 因為整個修學的過程都是向內觀照、莫向外求，所以我們叫做自力的法門。\n\n2.\t他力法門\n他整個修行可以說是祈求，向外去祈求佛菩薩的救拔。這個我們叫他力法門。\n\n3.\t自他不二的法門。\nA.\t諸位祖師所強調的禪淨雙修、自他不二的法門。\nB.\t有理觀跟事修的\n\n理觀的話，緣起性空， 每一個法都一樣；要講事修，那每一個法的因緣是完全不一樣。\n\n開始發大悲心的時候，我們可以肯定，他的阿賴耶識已經有一個清淨國土的力量在出現，所以佛陀才會授記的。佛陀不 會作任何的臆測，佛陀的話全部是現量，沒有比量。那你說這是不是因果同時？ 舍利弗尊者現在發願，他的國土就成就了。\n\n\n你現在真實地發願：我來生不要在三界流轉，即使我有善業，我 也放棄在三界來受用，我把所有的善業全部回歸到淨土去。\n\n這個「我一定要往生」很重要！\n(修行人把這一生，把這個世界看作是旅館，我在這住幾天，一切隨緣，什麼都好，歡歡喜喜，快快樂樂，幾天就離開了。要把極樂世界看作是老家，念念要回老家，念念要親近阿彌陀佛，我們得到圓滿的成就。--淨空老和尚)\n\n\n印光大師在《文鈔》中曾經對這個「一心歸命， 通身靠倒」\n念佛法門絕對不排斥其他法門，但念佛是本命元辰\n\n\n1.你妄想當中建立一個佛號的力量，這是一個 止修止靜的力量。\n2.慢慢地，這個止靜的力量成熟以後，開始去動中歷練。\n3.遇境逢緣，妄想生起，那麼我們開始修觀照，達妄本空，知真本有\n4.再跟佛號配合，轉念念佛，妄想消滅，佛號獨存。\n5.這樣子就開始修「不亂」了。\n淨土法門的修行，先生善再破惡。先成就佛號，然後再用佛號來調伏煩惱。\n\n\n佛法講一切法因緣生，就是一切法有它的一個活動的軌則。你掌握這個軌則，你就能夠得到這個果報；你沒有掌握這個軌則，這個果報 就不能出現，就是這樣子。所以選擇一個適當的方法也非常重要。\n\n\n淨土法門的思考就完全不一樣。\n淨土法門，你今天的往生不是對治你的妄想，是你要跟阿彌陀佛感應道交，\n不是你說了算。那麼你跟阿彌陀佛感應道交， \n這有他的軌則，你才能夠觸動彌陀的本願。\n\n\n淨土 法門不怕你有煩惱，也不怕你有罪業，它最怕的是什麼？知不知道？淨土法門最 怕你起顛倒。煩惱起來的時候，你認為它是真實的，你認為這是你的一個真實的 相貌，你一定要隨順它，那就完了，你起顛倒了。","updatedAt":"2026-08-10T13:57:39.086Z"},{"id":"1785295188113","master":"淨界法師","title":"阿彌陀佛48願導讀-淨界法師","youtube":"","images":[],"tags":[],"content":"蕅益大師說：真正的念佛人，應該是「自他不二」的\n\n\n「善逝」：\n這是介紹佛陀死亡的相貌。就是我們凡夫的死亡，是進入一種夢 覺，安住在一種顛倒的昏昧當中，在這個當中，由我們業力的引導去三界投胎， 所以我們是在顛倒妄想當中，進入死亡。\n\n佛教跟外道的差別：外道的教主是獨一無二的，你不能說有一天你 要變成上帝，不可能的；那麼佛教它的一個根本的思想，是建立在一種所謂的「 心、佛、眾生三無差別」一種平等性，而這樣一種清淨平等的法身，它不但是平等 ，而且具足廣大的力量！\n\n一個人的成就，跟他的志向是有關係的──「心量大，功德大！」\n一個人的性格，決定一個人的結果！\n\n\n阿彌陀佛的本願\n1.\t功德的力量(令我作佛，國土第一)\n2.\t法門的成就「我當愍哀，度脫一切\n\n慧遠大師說：「阿彌陀佛」的聖號，有二種殊勝力量\n1.\t下手易\n2.\t成就高\n\n\n易行道\n仰賴佛力，一心執持名號，得佛願力加持，此身得至阿惟越致地(阿鞞跋致)，疾速圓成菩提，是為易行道。\n\n\n智者大師把止觀分成了三種方法：\n1.\t「出離道」，對於現在的果報產生厭離。當這個厭離的思想 生起的時候，我們三界果報的力量，慢慢、慢慢就消失掉了，我們就不再來三界 投胎了\n2.\t「心法所觀境」，即空、即假、即中。”因緣所生、當體即空”\n3.\t、直觀「佛」的法界，觀察「佛的依正莊嚴，生起欣求好樂的心。\n\n淨土宗的一個止觀的修法。當然我們在觀察極樂世界的功德莊嚴，你一定是「依教起觀」，你要先了解它有什麼功德，你才能夠觀察。\n\n\n我們讀《阿彌佛經》有二句話，是非常重要的核心思想\n1.\t其國眾生無有眾苦，但受諸樂，是名極樂。\n2.\t眾生生者，皆是阿鞞跋致。\n\n「不退轉」當然對於一個「入聖位的菩提」影響不大，但對「凡位的菩提」是一個非常重要的關鍵。極樂眾生沒有「分段生死」的障礙。我們一個人換了一個果報，就換了一個 想法。這個「分段生死」，對於修行的障礙很嚴重\n\n當我們在念「阿彌陀佛」的時候，即使你沒有看到光明，其實你身心當中，已經出 現光明，這是真的！\n\n善導大師說：\n憶念阿彌陀佛的聖號，現生消除罪障，臨終往生不退！\n\n設我得佛，十方眾生，至心信樂，欲生我國，乃至十念，若不生者， 不取正覺，唯除五逆，誹謗正法。\n\n祖師大德說：阿彌陀佛的四十八願以五願為核心，這五願當 中，又以這個願當「願王」。因為有這個願，使令淨土法門「三根普被、利鈍全收 」才能夠成立；使令一切生死凡夫，才能夠出離三界火宅。\n\n「順從本願」善導大師說：往生的成敗就這四個字，不要對本願有所抗拒！\n\n\n對於「順從本願」，善導大師說有二個標準：所信之事決定、能信之心決定 。「所信之事」有三件事情要相信：\n1.\t、相信你是「罪惡生死凡夫」\n2.\t曠劫已來常沒常流轉，來很多次了\n3.\t無有出離的因緣」： 相信你根本沒有力量能夠離開三界\n\n是你要相信的三件事，你才能夠真實的順從阿彌陀佛本願\n你還要生起三種的決定心\n1.\t你「對你自己要有信心」，無疑無慮--你不能有任何的懷疑、不能有任何 的憂慮。\n2.\t你要相信，阿彌陀佛的四十八願，是真實存在的\n3.\t「乘彼佛力，決定得生。」你相信阿彌陀佛一定有足夠的力量救拔你，阿 彌陀佛要救你，足足有餘。\n\n當我心中順從本願以後，我只有一個希望 ：願生彼西方安樂國！ 那麼以這種順從本願的力量，在臨終「具足十念」，在古德的註解當中，大部分的古德都說，這個「十念」就是「臨終的十句佛號」\n\n曇鸞大師解釋比較合理，\n他說「不一定要說是十念」。他在《往生論註》上說：「臨命終時，相續 稱念，業事成辦，不局數目。」臨命終的時候，你就是「相續稱念」就好了，直到你 的淨業成就，不要去管是十念、二十念。\n\n\n淨土宗的「菩提心」是怎麼樣呢？曇鸞大師他的思考是這樣：\n發菩提心=願作佛心；\n願作佛心=願求生淨土之心；\n願求生淨土之心=就是願度眾生之心。\n.\n至心信樂\n反正你要我怎麼做，我就怎麼做，我完全相信你，反正我就是「通身靠倒」，\n\n\n至心發願\n把「成佛的願」跟「往生的願」巧妙的連結在一起，「我為了要成佛，所以我必須到淨土去」，這二個不衝突的，所以他的關鍵叫「至心發願」，跟前面的「至心 信樂」不同。\n\n你內心當中，只要做一件事情：你把你的過去忘掉，想你的未來就好！」就是 「順從本願、欲生我國」\n\n\n我們「淨土宗」的思考方式，跟修「禪宗、天台宗」的差別在哪裡？諸位知道嗎？\n淨土宗不問你的過去，你過去造善也好、造惡 也罷，它的重點是「你將往哪裡而去？」它不問：「你從什麼地方來的？」問：「 你以後要怎麼樣？你將往哪裡而去？」「你是不是真實的歸依阿彌陀佛、真實的 願求生淨土？」這個是成敗的關鍵。\n\n窺基大師說：極樂世界跟彌勒淨土有十種差別，而其中一個差別呢，就是在 這個「莊嚴」的差別\n他說彌勒淨土的莊嚴是「有時空限制」，「有時空限制」的莊嚴叫「低劣的 莊嚴」。你看彌勒淨土，你到那個地方去，時間有限度、空間有限度。為什麼？ 因為它是「業感的緣起」。你為什麼到彌勒淨土去？因為你造了善業、因為你持 戒、你布施。\n\n\n你如果四十八願聽完以後，你的心中還是「無住」，那就完了！這四十八願 就是告訴你：你怎麼去規劃你來生的願景，而且這每一個願你都可以做到，每一 個願都會兌現，佛陀絕對不妄語，所以你一定要告訴自己「這每一個願跟你關 係密切」，有的是跟你今生有關係，有的是跟你來生有關係，只要你憶念它的存 在，它就會存在，是這樣子的。\n\n\n師父啊，做一隻鳥很不錯啊！自由自在。\n我說：「你是不知道鳥的心情。做為一隻動物，牠的心情就是恐懼不安， 非常恐懼不安，而且是一輩子都是恐懼不安，因為牠的果報就是一種血途之報。也就是說，在這樣的三惡道當中，阿彌陀佛到了極樂世界，他保證你：你到 了極樂世界，你沒有這種「三惡道」的果報。\n\n\n犯罪必須有「思想 的引導」，他有一種故意的思想，「思心所」的引導\n\n\n在極樂世界沒有「我喜歡」 這三個字，只有「我應該怎麼樣」。所以在極樂世界，沒有這種不合乎大乘中道 的名言，絕對找不到，所以你的思想在運轉的時候，你終是會往「中道」的方向 去運轉，這個是阿彌陀佛的大智慧，從根本上解決我們的邪見。\n\n淨土宗修學的一個基本思想，就是所謂的「心想事成」。在我們未來的生命 當中，你只要不斷的去觀想極樂世界的莊嚴，這件事情就會成就。\n\n《楞嚴經》認為生命就像一條被打結的繩子，一個人的繩子，他是怎麼打結的？你要把他的結打開來，你要先知道它是怎麼形成的，你不是硬拉就可以把它解開。\n\n你看極樂世界，沒有三惡道、身相莊嚴、衣食自然、五種神通，你還 不一定要待在極樂世界，你經常能夠遨遊十方世界，它提供你這麼好的果報體， 當然我們很在乎這個「果報體」。我們說「借假修真」，到底這個果報體能夠用 多久？「下至百千億億劫」，你有足夠的時間，讓你修學聖道。\n古人用一句話來形容：「
