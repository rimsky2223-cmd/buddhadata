<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>佛法知識庫</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#fcfbf9;color:#2c2c2c;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;line-height:1.7}.header{position:sticky;top:0;z-index:20;background:rgba(252,251,249,.92);backdrop-filter:blur(10px);border-bottom:1px solid #e7e3dc;padding:14px 16px}.layout{max-width:1024px;margin:0 auto;padding:22px 16px;display:flex;gap:20px}.sidebar{width:260px;flex-shrink:0;position:sticky;top:74px;height:fit-content}.main{flex:1;min-width:0}.master-card{background:#fff;border:1px solid #e7e3dc;border-radius:16px;padding:16px;margin-bottom:16px}.master-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer}.master-item:hover{background:#fdfbf9}.master-item.active{background:#2d4a3e;color:#fff}.count-badge{min-width:30px;height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;border-radius:8px;font-size:11px;font-weight:800;background:#f4f0e8;border:1px solid #e7e3dc}.master-item.active .count-badge{background:rgba(255,255,255,.18);color:#fff}.article-item{padding:14px 12px;border-bottom:1px solid #f0ece5;cursor:pointer;border-radius:10px;margin-bottom:2px}.article-item:hover{background:#fdfbf9}.tag-btn{background:#f4f0e8;border:1px solid #e7e3dc;padding:3px 9px;border-radius:999px;font-size:.72rem;margin:2px}.detail-title{font-size:1.5rem;font-weight:850;margin:10px 0}.detail-content{white-space:pre-wrap;line-height:1.95;margin-top:18px}.yt-card{margin:16px 0}.yt-container{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:14px}.yt-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}@media(max-width:780px){.layout{flex-direction:column}.sidebar{width:100%;position:static}}</style></head><body><header class="header"><div style="max-width:1024px;margin:0 auto;display:flex;justify-content:space-between;"><strong>佛法知識庫</strong><span>共 <span id="totalCount"></span> 篇</span></div></header><div class="layout"><div class="sidebar" id="sidebarArea"></div><div class="main"><div style="display:flex;gap:8px;margin-bottom:16px;"><input id="searchInput" placeholder="搜尋..." style="flex:1;padding:10px 14px;border-radius:10px;border:1px solid #e0dad1;"><button id="clearBtn" style="display:none;">✕</button></div><div id="listArea"></div><div id="detailArea" style="display:none;"></div></div></div><div id="imgModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;align-items:center;justify-content:center;" onclick="this.style.display='none'"><img id="modalImg" style="max-width:90%;max-height:90%;border-radius:12px;"></div><script>const articlesData=${t};const allMasters=${r};let selectedMaster="全部";let currentQuery="";const listArea=document.getElementById("listArea");const detailArea=document.getElementById("detailArea");const sidebarArea=document.getElementById("sidebarArea");const searchInput=document.getElementById("searchInput");const clearBtn=document.getElementById("clearBtn");function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}function linkify(t){return escapeHtml(t).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" style="color:#b7794c;">$1</a>');}function renderSidebar(){let counts={};articlesData.forEach(a=>counts[a.master]=(counts[a.master]||0)+1);document.getElementById('totalCount').textContent=articlesData.length;let all=['全部',...allMasters];sidebarArea.innerHTML='<div class="master-card"><div style="display:flex;justify-content:space-between;margin-bottom:14px"><div style="font-weight:800">📚 分類</div><div style="font-size:11px;color:#8a8075;background:#fcfbf9;border:1px solid #f0ece5;padding:2px 8px;border-radius:999px">'+articlesData.length+' 篇</div></div><div style="display:flex;flex-direction:column;gap:2px">'+all.map(m=>{let cnt=m==='全部'?articlesData.length:(counts[m]||0);let active=selectedMaster===m?'active':'';return '<div class="master-item '+active+'" onclick="selectMaster(\''+m.replace(/'/g,"\\'")+'\')"><span>'+escapeHtml(m)+'</span><span class="count-badge">'+cnt+'</span></div>';}).join('')+'</div></div>';}function renderList(s){let q=currentQuery.toLowerCase().trim();let f=articlesData.filter(a=>{let mm=selectedMaster==='全部'||a.master===selectedMaster;let qq=!q||a.title.toLowerCase().includes(q)||a.master.toLowerCase().includes(q)||a.content.toLowerCase().includes(q)||(a.tags&&a.tags.some(t=>t.toLowerCase().includes(q)));return mm&&qq;});if(f.length===0){listArea.innerHTML='<div style="text-align:center;padding:30px;color:#8a8075">找不到</div>';return;}let groups={};f.forEach(a=>{if(!groups[a.master]) groups[a.master]=[];groups[a.master].push(a);});let html="";Object.entries(groups).forEach(([master,arts])=>{html+='<div class="master-card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><strong>\uD83D\uDC64 '+master+'</strong><span>'+arts.length+' 篇</span></div><div>'+arts.map(a=>{return '<div class="article-item" onclick="showDetail(event,\''+a.id+'\')"><div style="font-weight:600">'+escapeHtml(a.title)+'</div><div style="font-size:.8rem;color:#8a8075">'+escapeHtml((a.content||'').slice(0,60))+'...</div><div>'+(a.tags||[]).map(t=>'<span class="tag-btn">#'+escapeHtml(t)+'</span>').join('')+'</div></div>';}).join('')+'</div></div>';});listArea.innerHTML=html;detailArea.style.display='none';listArea.style.display='block';if(s) window.scrollTo({top:0,behavior:'smooth'});}function showDetail(e,id){if(e) e.stopPropagation();let a=articlesData.find(x=>String(x.id)===String(id));if(!a) return;listArea.style.display='none';detailArea.style.display='block';detailArea.innerHTML='<button onclick="renderList(true)">← 返回</button><h2 class="detail-title">'+escapeHtml(a.title)+'</h2><div>'+(a.tags||[]).map(t=>'<span class="tag-btn">#'+escapeHtml(t)+'</span>').join('')+'</div><div class="detail-content">'+linkify(a.content||'')+'</div>';}function selectMaster(m){selectedMaster=m;renderSidebar();renderList(true);}function setQuery(q){searchInput.value=q;currentQuery=q;clearBtn.style.display=q?'block':'none';renderList(true);}searchInput.addEventListener('input',e=>{currentQuery=e.target.value;clearBtn.style.display=currentQuery?'block':'none';renderList();});clearBtn.addEventListener('click',()=>setQuery(''));function init(){renderSidebar();renderList();}init();</script></body></html>
